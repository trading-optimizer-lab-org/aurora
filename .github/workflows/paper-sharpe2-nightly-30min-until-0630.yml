name: Paper Sharpe2 Nightly 30min Until 0630

on:
  workflow_dispatch:
    inputs:
      round_index:
        description: "Nightly round index, 0-14"
        required: true
        default: "0"
      data_run_id:
        description: "Run id that owns the prepared data artifact. Empty means prepare data in this run."
        required: false
        default: ""
      max_parallel_requested:
        description: "Requested concurrent jobs"
        required: true
        default: "360"
      time_budget_minutes:
        description: "Internal search budget per stage. The job timeout is 30 minutes."
        required: true
        default: "24"
      top_per_stage:
        description: "Rows kept per stage"
        required: true
        default: "90"
      stop_new_round_hour:
        description: "Madrid hour after which no new round starts"
        required: true
        default: "6"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_sharpe2_nightly_30min_until_0630
  WORKFLOW_FILE: paper-sharpe2-nightly-30min-until-0630.yml
  RUN_BRANCH: codex/universal-robustness

permissions:
  contents: read
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      first_half: ${{ steps.matrix.outputs.first_half }}
      second_half: ${{ steps.matrix.outputs.second_half }}
      next_round: ${{ steps.matrix.outputs.next_round }}
    steps:
      - id: matrix
        name: Build 360 matrix split into 2 x 180
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          round_index = int("${{ inputs.round_index }}")
          if round_index < 0 or round_index > 14:
              raise SystemExit("round_index must be between 0 and 14")
          print("first_half=" + json.dumps(list(range(180))))
          print("second_half=" + json.dumps(list(range(180, 360))))
          print(f"next_round={round_index + 1}")
          PY

  time_guard:
    runs-on: ubuntu-latest
    needs: plan
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Decide whether this round may start
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          round_index = int("${{ inputs.round_index }}")
          stop_hour = int("${{ inputs.stop_new_round_hour }}")
          names = [
              "operable_paper_ensemble",
              "spy_weekly_paper_rules",
              "spy_weekly_regime_simple",
              "spy_weekly_regime_rich",
              "cboe_put_call_sentiment",
              "vix_term_structure",
              "cboe_option_benchmark_timing",
              "trend_following_crisis_alpha",
              "defensive_etf_risk_parity_proxy",
              "yield_curve_stress",
              "credit_stress",
              "gold_commodity_safe_haven",
              "dollar_fx_safe_haven",
              "macro_recession_liquidity",
              "train_only_paper_selector",
          ]
          now = datetime.now(ZoneInfo("Europe/Madrid"))
          should_run = now.hour < stop_hour
          guard_dir = Path("${{ env.OUTPUT_DIR }}") / "guards"
          guard_dir.mkdir(parents=True, exist_ok=True)
          payload = {
              "round_index": round_index,
              "round_name": names[round_index] if 0 <= round_index < len(names) else "unknown",
              "checked_at_madrid": now.isoformat(),
              "stop_new_round_hour": stop_hour,
              "should_run": bool(should_run),
          }
          (guard_dir / f"round_{round_index:02d}_guard.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(f"should_run={'true' if should_run else 'false'}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-guard-${{ inputs.round_index }}
          path: ${{ env.OUTPUT_DIR }}/guards

  prepare_data:
    runs-on: ubuntu-latest
    needs: [plan, time_guard]
    if: ${{ needs.time_guard.outputs.should_run == 'true' && !inputs.data_run_id }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Prepare shared paper data once
        run: |
          python scripts/run_paper_sharpe2_nightly_round.py \
            --mode prepare-data \
            --output-dir "$OUTPUT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-prepared-data
          path: ${{ env.OUTPUT_DIR }}/data/**
          if-no-files-found: error

  search_a:
    runs-on: ubuntu-latest
    needs: [plan, time_guard, prepare_data]
    if: ${{ always() && needs.time_guard.outputs.should_run == 'true' }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.first_half) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download prepared data from current run
        if: ${{ !inputs.data_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: nightly-prepared-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Download prepared data from initial run
        if: ${{ inputs.data_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.data_run_id }}" \
            --repo "${{ github.repository }}" \
            --name nightly-prepared-data \
            --dir "$OUTPUT_DIR"
      - name: Run nightly round stage
        run: |
          python scripts/run_paper_sharpe2_nightly_round.py \
            --mode round-shard \
            --output-dir "$OUTPUT_DIR" \
            --round-index "${{ inputs.round_index }}" \
            --stage "${{ matrix.stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --top-per-stage "${{ inputs.top_per_stage }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-r${{ inputs.round_index }}-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/rounds/round_*/shards/stage_*
          if-no-files-found: warn

  search_b:
    runs-on: ubuntu-latest
    needs: [plan, time_guard, prepare_data]
    if: ${{ always() && needs.time_guard.outputs.should_run == 'true' }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.second_half) }}
    steps: *search_steps

  merge_round:
    runs-on: ubuntu-latest
    needs: [plan, time_guard, prepare_data, search_a, search_b]
    if: always()
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download current round stage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nightly-r${{ inputs.round_index }}-stage-*
          path: ${{ env.OUTPUT_DIR }}/rounds
          merge-multiple: true
      - name: Merge current round
        run: |
          python scripts/run_paper_sharpe2_nightly_round.py \
            --mode round-merge \
            --output-dir "$OUTPUT_DIR" \
            --round-index "${{ inputs.round_index }}"
      - name: Download previous round finals for global merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT_DIR/round_final_downloads"
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "$WORKFLOW_FILE" \
            --branch "$RUN_BRANCH" \
            --limit 30 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status=="completed") | .databaseId' > "$OUTPUT_DIR/previous_run_ids.txt"
          for RUN_ID in $(cat "$OUTPUT_DIR/previous_run_ids.txt"); do
            for R in $(seq 0 14); do
              gh run download "$RUN_ID" \
                --repo "${{ github.repository }}" \
                --name "nightly-round-final-$R" \
                --dir "$OUTPUT_DIR/round_final_downloads/run_${RUN_ID}_round_${R}" || true
            done
          done
      - name: Build global final summary
        run: |
          python scripts/run_paper_sharpe2_nightly_round.py \
            --mode final-merge \
            --output-dir "$OUTPUT_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-round-final-${{ inputs.round_index }}
          path: ${{ env.OUTPUT_DIR }}/rounds/**/final/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-sharpe2-nightly-30min-until-0630-results
          path: ${{ env.OUTPUT_DIR }}/final/**
          if-no-files-found: warn

  dispatch_next:
    runs-on: ubuntu-latest
    needs: [plan, time_guard, merge_round]
    if: ${{ always() && needs.time_guard.outputs.should_run == 'true' }}
    timeout-minutes: 5
    steps:
      - name: Dispatch next 30-minute round if still before stop hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > next_env.sh
          from datetime import datetime
          from zoneinfo import ZoneInfo
          round_index = int("${{ inputs.round_index }}")
          next_round = round_index + 1
          stop_hour = int("${{ inputs.stop_new_round_hour }}")
          now = datetime.now(ZoneInfo("Europe/Madrid"))
          should_dispatch = next_round < 15 and now.hour < stop_hour
          data_run_id = "${{ inputs.data_run_id }}" or "${{ github.run_id }}"
          print(f"SHOULD_DISPATCH={'true' if should_dispatch else 'false'}")
          print(f"NEXT_ROUND={next_round}")
          print(f"DATA_RUN_ID={data_run_id}")
          print(f"NOW_MADRID={now.isoformat()}")
          PY
          cat next_env.sh
          source next_env.sh
          if [ "$SHOULD_DISPATCH" = "true" ]; then
            gh workflow run "$WORKFLOW_FILE" \
              --repo "${{ github.repository }}" \
              --ref "$RUN_BRANCH" \
              -f round_index="$NEXT_ROUND" \
              -f data_run_id="$DATA_RUN_ID" \
              -f max_parallel_requested="${{ inputs.max_parallel_requested }}" \
              -f time_budget_minutes="${{ inputs.time_budget_minutes }}" \
              -f top_per_stage="${{ inputs.top_per_stage }}" \
              -f stop_new_round_hour="${{ inputs.stop_new_round_hour }}"
          else
            echo "No next round dispatched."
          fi
