name: SP500 Continuous DEHB Supervisor v2

on:
  workflow_dispatch:
    inputs:
      commit_sha: {required: true}
      campaign_id: {required: true}
      pool_generation: {required: true}

permissions: {actions: write, contents: read}
concurrency:
  group: sp500-continuous-supervisor-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - name: Install supervisor runtime
        run: |
          python -m pip install "psycopg[binary,pool]>=3.2,<4"
          python -m pip install --no-deps -e .
      - name: Decide exact replacement action
        run: >-
          python scripts/audit_sp500_dehb_continuous_campaign.py
          --campaign-id "${{ inputs.campaign_id }}"
          --pool-generation "${{ inputs.pool_generation }}"
          --output outputs/supervisor/decision.json
      - name: Upload health decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: sp500-dehb-continuous-supervisor, path: outputs/supervisor, if-no-files-found: error, retention-days: 30}

