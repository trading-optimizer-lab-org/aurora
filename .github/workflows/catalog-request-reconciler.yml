name: AURORA catalog request reconciler

on:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/..
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      has_candidates: ${{ steps.queue.outputs.has_candidates }}
      plan_sha256: ${{ steps.queue.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install only the locked controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - id: queue
        name: Discover only due already-existing request issues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_catalog_request_reconciliation_candidates.py \
            --repo-root . \
            --output "$RUNNER_TEMP/catalog-request-reconciliation-plan.json" \
            --github-output "$GITHUB_OUTPUT"

  call_controller:
    needs: discover
    if: ${{ needs.discover.outputs.has_candidates == 'true' }}
    strategy:
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/catalog-run-controller.yml
    with:
      issue_number: ${{ matrix.issue_number }}
    permissions:
      actions: read
      contents: read
      issues: write
