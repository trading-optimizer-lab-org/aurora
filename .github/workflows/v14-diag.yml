name: v14 diagnostic of the short families (after the run, not pre-registered)

# scripts/run_v14_diag.py on the inputs of run 39399894228; only aggregates are uploaded.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_v14_diag.py
      - .github/workflows/v14-diag.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/inputs
          key: v14-inputs-39399894228-1
          fail-on-cache-miss: true
      - run: python scripts/run_v14_diag.py --inputs outputs/v14/inputs --summary docs/research/data/v14_summary.json --out outputs/v14/diag
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v14-diag
          path: outputs/v14/diag/diag.json
          retention-days: 90
