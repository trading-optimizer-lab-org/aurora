name: Minervini SEPA USA Europe 50M Daily Screener

on:
  workflow_dispatch:
    inputs:
      min_market_cap:
        description: "Market cap minimo"
        required: true
        default: "50000000"
      period:
        description: "Historico diario"
        required: true
        default: "3y"
      batch_size:
        description: "Batch size yfinance"
        required: true
        default: "80"

jobs:
  screen_region:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        region: [us, gb, de, fr, es, it, nl, se, ch, no, dk, fi, be, at, ie, pt, pl]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance

      - name: Run region screener
        run: |
          python scripts/screen_minervini_sepa_marketcap2b.py \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --universe yahoo_regions \
            --regions "${{ matrix.region }}" \
            --period "${{ inputs.period }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --output-dir "outputs/minervini_sepa_50m_${{ matrix.region }}"

      - name: Upload region results
        uses: actions/upload-artifact@v4
        with:
          name: minervini-sepa-50m-${{ matrix.region }}
          path: outputs/minervini_sepa_50m_${{ matrix.region }}/
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: screen_region
    if: always()
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install merge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: region_artifacts

      - name: Merge results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          root = Path("region_artifacts")
          out = Path("outputs/minervini_sepa_usa_europe_50m_daily_screener")
          out.mkdir(parents=True, exist_ok=True)

          all_results = []
          fresh_results = []
          universes = []
          failures = []
          summaries = []
          for d in root.iterdir():
              if not d.is_dir():
                  continue
              for name, bucket in [
                  ("minervini_sepa_marketcap2b_all_results.csv", all_results),
                  ("minervini_sepa_marketcap2b_fresh_buys.csv", fresh_results),
                  ("universe_marketcap_filtered.csv", universes),
                  ("minervini_sepa_marketcap2b_failures.csv", failures),
              ]:
                  p = d / name
                  if p.exists() and p.stat().st_size > 0:
                      try:
                          df = pd.read_csv(p)
                      except EmptyDataError:
                          continue
                      df["artifact"] = d.name
                      bucket.append(df)
              s = d / "minervini_sepa_marketcap2b_summary.json"
              if s.exists():
                  summaries.append(json.loads(s.read_text()))

          def concat(frames):
              return pd.concat(frames, ignore_index=True, sort=False) if frames else pd.DataFrame()

          all_df = concat(all_results).drop_duplicates("symbol")
          fresh_df = concat(fresh_results).drop_duplicates("symbol")
          universe_df = concat(universes).drop_duplicates("symbol")
          failures_df = concat(failures)

          if not all_df.empty:
              all_df = all_df.sort_values(["fresh_buy", "score", "market_cap"], ascending=[False, False, False])
          if not fresh_df.empty:
              fresh_df = fresh_df.sort_values(["score", "market_cap"], ascending=[False, False])
          if not universe_df.empty:
              universe_df = universe_df.sort_values("market_cap", ascending=False)

          all_df.to_csv(out / "minervini_sepa_usa_europe_50m_all_results.csv", index=False)
          fresh_df.to_csv(out / "minervini_sepa_usa_europe_50m_fresh_buys.csv", index=False)
          universe_df.to_csv(out / "minervini_sepa_usa_europe_50m_universe.csv", index=False)
          failures_df.to_csv(out / "minervini_sepa_usa_europe_50m_failures.csv", index=False)

          summary = {
              "regions_requested": [s.get("regions", [""])[0] for s in summaries],
              "regions_completed": len(summaries),
              "universe_count": int(len(universe_df)),
              "evaluated_count": int(len(all_df)),
              "fresh_buy_count": int(len(fresh_df)),
              "failure_count": int(len(failures_df)),
              "summaries": summaries,
          }
          (out / "minervini_sepa_usa_europe_50m_summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: minervini-sepa-usa-europe-50m-daily-screener-results
          path: outputs/minervini_sepa_usa_europe_50m_daily_screener/
          if-no-files-found: error
