    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v51w/sel
          key: v51-sel-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v51-picks
          path: outputs/v51w/picks
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v51-picks2
          path: outputs/v51w/picks
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v51-fac-*
          path: outputs/v51w/facrep
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v51-conf-*
          path: outputs/v51w/runs/confirm
          merge-multiple: true
      - run: |
          python scripts/run_v51.py final --factory outputs/v51w/facrep --sel outputs/v51w/sel --picks outputs/v51w/picks --runs outputs/v51w/runs/confirm --out outputs/v51w/final
          cat outputs/v51w/final/V51_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v51-report
          path: outputs/v51w/final
          retention-days: 90
