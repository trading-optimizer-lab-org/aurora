name: "v51: every small-cap setup on one-minute bars, the grid, the account and the books"

# scripts/gen_v51_wf.py writes this file (V51_PREREGISTRATION.md section 4). Trades and prices pass between jobs only
# in caches keyed by this run; artifacts hold aggregate statistics only.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v51.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v51
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  factory:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [RUNUP-short, RUNUP-long, STRONG-short, STRONG-long, FADE-short, FADE-long, CRASH-short, CRASH-long, GAPUP-short, GAPUP-long, GAPDN-short, GAPDN-long, RUN40-short, RUN40-long, RUN60-short, RUN60-long, RUN100-short, RUN100-long, RUN200-short, RUN200-long]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-39825946914-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v51
          key: v51-min-41206767350-1
          fail-on-cache-miss: true
      - run: python scripts/run_v51.py factory --group ${{ matrix.shard }} --procs 4 --out outputs/v51w/fac/${{ matrix.shard }}
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v51w/fac/${{ matrix.shard }}
          key: v51-fac-${{ github.run_id }}-${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v51-fac-${{ matrix.shard }}
          path: outputs/v51w/fac/${{ matrix.shard }}/report.json
          retention-days: 90

