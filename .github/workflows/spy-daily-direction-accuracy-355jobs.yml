name: SPY Daily Direction Accuracy 355 Jobs

on:
  workflow_dispatch:
    inputs:
      configs_per_stage:
        description: "Configs tested per stage"
        required: true
        default: "30000"
      time_budget_minutes:
        description: "Clean internal stage runtime before upload"
        required: true
        default: "45"
      target_accuracy:
        description: "Train and validation accuracy required for accepted candidates"
        required: true
        default: "0.60"
      search_plan:
        description: "Search plan: random or funnel"
        required: true
        default: "random"
      job_timeout_minutes:
        description: "Hard timeout per search job"
        required: true
        default: "65"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/spy_daily_direction_accuracy_355jobs

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download no-locked daily SPY direction data
        run: python scripts/run_spy_daily_direction_accuracy.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-accuracy-data
          path: ${{ env.OUTPUT_DIR }}/data

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    steps:
      - name: Build 355-stage balanced matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          full = [{"stage": stage} for stage in range(355)]
          print("matrix_a=" + json.dumps(full[:178]))
          print("matrix_b=" + json.dumps(full[178:]))
          PY

  search_a:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: spy-daily-direction-accuracy-data
          path: ${{ env.OUTPUT_DIR }}/data
      - name: Run SPY daily direction stage
        run: |
          python scripts/run_spy_daily_direction_accuracy.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --target-accuracy "${{ inputs.target_accuracy }}" \
            --search-plan "${{ inputs.search_plan }}"
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-accuracy-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*

  search_b:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps

  merge:
    runs-on: ubuntu-latest
    needs: [data, search_a, search_b]
    if: always()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: spy-daily-direction-accuracy-data
          path: ${{ env.OUTPUT_DIR }}/data
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: spy-daily-direction-accuracy-stage-*
          path: ${{ env.OUTPUT_DIR }}/shards
      - name: Merge stages
        run: |
          python scripts/run_spy_daily_direction_accuracy.py \
            --mode merge \
            --output-dir "$OUTPUT_DIR" \
            --target-accuracy "${{ inputs.target_accuracy }}"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-accuracy-355jobs-results
          path: ${{ env.OUTPUT_DIR }}
