name: v27 A v26's one-account book with each trade's own quotes (pre-registered)

# docs/research/V27_PREREGISTRATION.md, section A. Waits for the latest v26 resume run (its report and final report);
# then the trades of v26's $100k book A, Alpaca SIP quotes in each leg's minute, and the book rebuilt with the
# measured half-spreads. The trade list stays on the runner; the artifact holds the report and the book's returns.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v27-quotes.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v27-quotes
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    outputs:
      run: ${{ steps.w.outputs.run }}
    steps:
      - id: w
        name: Wait for the latest v26 resume run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 350); do
            line=$(gh run list --repo "${{ github.repository }}" --workflow v26-resume.yml --branch research/stock-catalog --limit 1 --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"' || echo "")
            echo "$(date -u +%H:%M) v26 resume: $line"
            set -- $line
            if [ "$2" = "completed" ]; then
              names=$(gh api "repos/${{ github.repository }}/actions/runs/$1/artifacts?per_page=100" -q '.artifacts[].name')
              echo "$names" | grep -qx v26-report || { echo "v26 left no report"; exit 1; }
              echo "run=$1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 60
          done
          exit 1

  quotes:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v26-report
          path: outputs/v26w/report
          run-id: ${{ needs.wait.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: v26-final
          path: outputs/v26w/final
          run-id: ${{ needs.wait.outputs.run }}
          github-token: ${{ github.token }}
      - run: python scripts/run_v27_quotes.py legs
      - run: python scripts/run_v27_quotes.py quotes --budget-min 270
      - run: python scripts/run_v27_quotes.py costs
      - if: always()
        run: if [ -f outputs/v27w/quotes/QUOTES.md ]; then cat outputs/v27w/quotes/QUOTES.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v27-quotes-report
          path: |
            outputs/v27w/quotes/QUOTES.md
            outputs/v27w/quotes/quotes_summary.json
            outputs/v27w/quotes/quote_streams.parquet
          retention-days: 90
