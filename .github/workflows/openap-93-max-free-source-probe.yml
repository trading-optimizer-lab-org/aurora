name: OpenAP 93 Maximum Free Source Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openap-93-max-free-source-probe
  cancel-in-progress: false

jobs:
  test_and_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile new modules
        run: |
          python -m py_compile research/openap_93/registry.py
          python -m py_compile research/openap_93/sources.py
          python -m py_compile research/openap_93/external.py
          python -m py_compile research/openap_93/market.py
          python -m py_compile research/openap_93/market_pipeline.py
          python -m py_compile scripts/run_openap_93_max_free.py
      - name: Run focused tests
        run: python -m pytest tests/test_openap_93_max_free.py -q
      - name: Probe real public sources
        run: |
          python scripts/run_openap_93_max_free.py \
            --signals-config config/openap_93/signals_93.yaml \
            probe-sources \
            --output-dir outputs/openap_93_source_probe
      - name: Download and normalize public formula inputs
        run: |
          python scripts/run_openap_93_max_free.py \
            --signals-config config/openap_93/signals_93.yaml \
            fetch-public-inputs \
            --output-dir outputs/openap_93_public_inputs
      - name: Validate evidence contract
        run: |
          test -s outputs/openap_93_source_probe/source_probe_results.csv
          test -s outputs/openap_93_source_probe/source_symbol_probe_results.csv
          test -s outputs/openap_93_source_probe/source_coverage_matrix.csv
          test -s outputs/openap_93_source_probe/source_ablation.csv
          test -s outputs/openap_93_source_probe/selected_sources.json
          test -s outputs/openap_93_source_probe/sources.lock.json
          test "$(find outputs/openap_93_source_probe/evidence/source_tests -name '*.json' | wc -l)" -eq 11
          test -s outputs/openap_93_public_inputs/public_inputs_manifest.json
          test "$(find outputs/openap_93_public_inputs/normalized -name '*.parquet' | wc -l)" -eq 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-93-max-free-source-probe
          path: outputs/openap_93_source_probe/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-93-public-inputs
          path: outputs/openap_93_public_inputs/
          if-no-files-found: error
          retention-days: 90
