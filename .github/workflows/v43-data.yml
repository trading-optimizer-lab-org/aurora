name: "v43 data: the base book's trades and their one-minute bars"

# scripts/run_v43_data.py: every trade of v39's best book and Alpaca SIP one-minute bars of the symbol-days they
# are open, kept only in the Actions cache (no market data is published); the coverage counts go to the summary.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v43-data.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v43-data
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v28-report
          path: outputs/v28w/report
          run-id: 39915126980
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v33-choice
          path: outputs/v33w/choice
          run-id: 40192951586
          github-token: ${{ github.token }}
      - run: python scripts/run_v43_data.py trades --choice outputs/v33w/choice --out outputs/v43
      - run: python scripts/run_v43_data.py minutes --out outputs/v43
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - if: always()
        run: if [ -f outputs/v43/coverage.json ]; then cat outputs/v43/coverage.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v43
          key: v43-data-${{ github.run_id }}-${{ github.run_attempt }}
