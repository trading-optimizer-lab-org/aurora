name: OpenAP 149 SEC Spinoff Current

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      sec_artifact_run_id:
        description: Successful run containing the 48 SEC submissions shards
        required: true
        default: "31270341796"
        type: string
      market_source_run_id:
        description: Run containing the verified current SEC security master
        required: true
        default: "31270341796"
        type: string
      formula_evidence_run_id:
        description: Run containing the pinned OpenAP formula inventory
        required: true
        default: "31331835149"
        type: string
      formation_at:
        description: Causal current formation timestamp
        required: true
        default: "2026-08-09T23:59:59Z"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-sec-spinoff
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify SEC Spinoff contracts
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m py_compile \
            research/openap_181/sec_spinoff.py \
            research/openap_181/sec_spinoff_access.py \
            scripts/run_openap_149_sec_spinoff.py
          python -m pytest \
            tests/test_openap_181_sec_spinoff.py \
            -q --tb=short

  acquire:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FORMATION_AT: ${{ inputs.formation_at }}
      SEC_USER_AGENT: "Aurora Research gomez5757@users.noreply.github.com"
      GITHUB_ACTIONS: "true"
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download verified SEC submissions shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/sec
          run-id: ${{ inputs.sec_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Selectively recover verified current SEC identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/recover_openap_market_security_master.py \
            --repository trading-optimizer-lab-org/aurora \
            --source-run-id "${{ inputs.market_source_run_id }}" \
            --source-artifact-name openap-yfinance-sec-current-score-results \
            --maximum-compressed-bytes 67108864 \
            --output-dir openap_market_identity
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Acquire official filings and calculate non-strict Spinoff
        run: |
          python scripts/run_openap_149_sec_spinoff.py \
            --sec-root inputs/sec \
            --security-master outputs/openap_market_identity/security_master.parquet \
            --source-manifest outputs/openap_market_identity/source_manifest.csv \
            --source-recovery-manifest outputs/openap_market_identity/openap_market_security_master_recovery_manifest.json \
            --formula-root inputs/formulas \
            --sec-source-run-id "${{ inputs.sec_artifact_run_id }}" \
            --formula-source-run-id "${{ inputs.formula_evidence_run_id }}" \
            --implementation-sha "$SOURCE_SHA" \
            --formation-at "$FORMATION_AT" \
            --user-agent "$SEC_USER_AGENT" \
            --output-dir openap_149_sec_spinoff
      - name: Verify Spinoff output remains fail-closed and non-strict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/openap_149_sec_spinoff")
          values = pd.read_csv(root / "openap_149_sec_spinoff_current.csv")
          access = pd.read_csv(
              root / "sec_spinoff_access_manifest.csv", keep_default_na=False
          )
          manifest = json.loads(
              (root / "openap_149_sec_spinoff_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert values["signal"].eq("Spinoff").all()
          assert values["formula_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert not values["strict_score_eligible"].any()
          finite = values.loc[values["current_usable"].eq(True)]
          assert finite["value"].isin([0.0, 1.0]).all()
          if not finite.empty:
              assert pd.to_datetime(finite["available_at"], utc=True).le(
                  pd.to_datetime(finite["formation_at"], utc=True)
              ).all()
          assert not access["source_url"].astype(str).str.contains(
              "api_key|token", case=False, regex=True
          ).any()
          assert manifest["raw_filing_documents_retained"] is False
          assert manifest["classification"] == "reconstructed_not_strict"
          assert manifest["strict_score_eligible"] is False
          assert manifest["locked_opened"] is False
          assert manifest["forward_opened"] is False
          PY
      - name: Upload derived SEC Spinoff evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-spinoff-current
          path: outputs/openap_149_sec_spinoff/
          if-no-files-found: error
          retention-days: 90
