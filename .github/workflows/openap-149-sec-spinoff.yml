name: OpenAP 149 SEC Spinoff Current

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      sec_artifact_run_id:
        description: Successful run containing the 48 SEC submissions shards
        required: true
        default: "31270341796"
        type: string
      formula_evidence_run_id:
        description: Run containing the pinned OpenAP formula inventory
        required: true
        default: "31331835149"
        type: string
      formation_at:
        description: Causal current formation timestamp
        required: true
        default: "2026-08-10T23:59:59Z"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-sec-spinoff
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify SEC Spinoff contracts
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m py_compile \
            research/openap_181/sec_spinoff.py \
            research/openap_181/sec_spinoff_access.py \
            scripts/run_openap_149_sec_spinoff.py
          python -m pytest \
            tests/test_openap_181_sec_spinoff.py \
            -q --tb=short

  acquire:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FORMATION_AT: ${{ inputs.formation_at }}
      SEC_USER_AGENT: "Aurora Research gomez5757@users.noreply.github.com"
      SEC_IDENTITY_SOURCE_URL: https://www.sec.gov/files/company_tickers_exchange.json
      SEC_IDENTITY_READTHROUGH_URL: https://r.jina.ai/http://www.sec.gov/files/company_tickers_exchange.json
      GITHUB_ACTIONS: "true"
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download verified SEC submissions shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/sec
          run-id: ${{ inputs.sec_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Acquire audited official SEC current identity
        run: |
          mkdir -p inputs/sec_current
          transport=inputs/sec_current/transport_response.txt
          set +e
          curl --fail --location --retry 2 --retry-all-errors \
            --max-filesize 16777216 \
            --header "User-Agent: $SEC_USER_AGENT" \
            "$SEC_IDENTITY_SOURCE_URL" \
            --output "$transport"
          direct_status=$?
          set -e
          if [ "$direct_status" -eq 0 ]; then
            access_method=sec_official_direct
            access_url="$SEC_IDENTITY_SOURCE_URL"
          else
            rm -f "$transport"
            curl --fail --location --retry 4 --retry-all-errors \
              --max-filesize 16777216 \
              --header "Accept: text/plain" \
              --header "X-No-Cache: true" \
              "$SEC_IDENTITY_READTHROUGH_URL" \
              --output "$transport"
            access_method=sec_via_jina_readthrough
            access_url="$SEC_IDENTITY_READTHROUGH_URL"
          fi
          identity_retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export IDENTITY_ACCESS_METHOD="$access_method"
          export IDENTITY_ACCESS_URL="$access_url"
          export IDENTITY_RETRIEVED_AT="$identity_retrieved_at"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from aurora.research.openap_181.sec_listing_identity import (
              parse_current_sec_identity_response,
          )

          root = Path("inputs/sec_current")
          transport = root / "transport_response.txt"
          content = transport.read_bytes()
          payload = parse_current_sec_identity_response(
              content,
              access_method=os.environ["IDENTITY_ACCESS_METHOD"],
          )
          canonical = json.dumps(
              payload,
              ensure_ascii=True,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          destination = root / "company_tickers_exchange.json"
          destination.write_bytes(canonical)
          manifest = {
              "source_url": os.environ["SEC_IDENTITY_SOURCE_URL"],
              "access_url": os.environ["IDENTITY_ACCESS_URL"],
              "access_method": os.environ["IDENTITY_ACCESS_METHOD"],
              "retrieved_at": os.environ["IDENTITY_RETRIEVED_AT"],
              "transport_sha256": hashlib.sha256(content).hexdigest(),
              "canonical_sha256": hashlib.sha256(canonical).hexdigest(),
          }
          (root / "identity_transport_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "IDENTITY_RETRIEVED_AT=$identity_retrieved_at" >> "$GITHUB_ENV"
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Acquire official filings and calculate non-strict Spinoff
        run: |
          python scripts/run_openap_149_sec_spinoff.py \
            --sec-root inputs/sec \
            --current-sec-identity-json inputs/sec_current/company_tickers_exchange.json \
            --current-sec-identity-source-url "$SEC_IDENTITY_SOURCE_URL" \
            --identity-retrieved-at "$IDENTITY_RETRIEVED_AT" \
            --identity-transport-manifest inputs/sec_current/identity_transport_manifest.json \
            --formula-root inputs/formulas \
            --sec-source-run-id "${{ inputs.sec_artifact_run_id }}" \
            --formula-source-run-id "${{ inputs.formula_evidence_run_id }}" \
            --implementation-sha "$SOURCE_SHA" \
            --formation-at "$FORMATION_AT" \
            --user-agent "$SEC_USER_AGENT" \
            --output-dir openap_149_sec_spinoff
      - name: Verify Spinoff output remains fail-closed and non-strict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/openap_149_sec_spinoff")
          values = pd.read_csv(root / "openap_149_sec_spinoff_current.csv")
          access = pd.read_csv(
              root / "sec_spinoff_access_manifest.csv", keep_default_na=False
          )
          manifest = json.loads(
              (root / "openap_149_sec_spinoff_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert values["signal"].eq("Spinoff").all()
          assert values["formula_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert not values["strict_score_eligible"].any()
          finite = values.loc[values["current_usable"].eq(True)]
          assert finite["value"].isin([0.0, 1.0]).all()
          if not finite.empty:
              assert pd.to_datetime(finite["available_at"], utc=True).le(
                  pd.to_datetime(finite["formation_at"], utc=True)
              ).all()
          assert not access["source_url"].astype(str).str.contains(
              "api_key|token", case=False, regex=True
          ).any()
          assert manifest["raw_filing_documents_retained"] is False
          assert manifest["classification"] == "reconstructed_not_strict"
          assert manifest["identity_source_url"] == (
              "https://www.sec.gov/files/company_tickers_exchange.json"
          )
          assert manifest["identity_access_method"] in {
              "sec_official_direct",
              "sec_via_jina_readthrough",
          }
          assert manifest["current_universe_rows"] > 1000
          assert manifest["strict_score_eligible"] is False
          assert manifest["locked_opened"] is False
          assert manifest["forward_opened"] is False
          PY
      - name: Upload derived SEC Spinoff evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-spinoff-current
          path: outputs/openap_149_sec_spinoff/
          if-no-files-found: error
          retention-days: 90
      - name: Upload SEC identity access evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-spinoff-source-evidence
          path: inputs/sec_current/identity_transport_manifest.json
          if-no-files-found: error
          retention-days: 90
