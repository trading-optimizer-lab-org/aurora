name: OpenAP Repair SEC Shards And Merge

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed OpenAP run whose successful artifacts will be reused
        required: true
        default: "30736374334"
      sec_user_agent:
        description: SEC-compliant User-Agent with contact email
        required: true
        default: "Aurora Research gomez5757@users.noreply.github.com"
      remerge_only:
        description: Reuse every successful shard without redownloading SEC data
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-sec-shard-repair
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  OPENAP_CONFIG: config/openap_yfinance_sec_current.yaml
  SEC_CHUNKS: "48"

jobs:
  framework_contract:
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: openap-sec-shard-repair-framework-contract
      retention_days: 1
      forced_job_count: 1

  repair_sec:
    needs: framework_contract
    if: ${{ !inputs.remerge_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: [7, 23]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e . requests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-prepare
          path: inputs/prepare
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair SEC shard
        env:
          AU_SEC_EDGAR_USER_AGENT: ${{ inputs.sec_user_agent }}
        run: |
          python scripts/run_openap_yfinance_sec_current.py \
            --config "$OPENAP_CONFIG" sec-chunk \
            --security-master inputs/prepare/sec_cik_universe.parquet \
            --sec-user-agent "$AU_SEC_EDGAR_USER_AGENT" \
            --chunk-index "${{ matrix.chunk }}" \
            --total-chunks "$SEC_CHUNKS" \
            --output-dir "outputs/sec_${{ matrix.chunk }}"
      - name: Validate repaired shard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          chunk = int("${{ matrix.chunk }}")
          summary = json.loads(Path(f"outputs/sec_{chunk}/sec_summary_{chunk:03d}.json").read_text())
          assert summary["companyfacts_ciks_ok"] > 0
          assert summary["submissions_ciks_ok"] > 0
          assert summary["companyfacts_rows"] > 0
          assert summary["submissions_rows"] > 0
          assert summary["all_facts_have_available_at"] is True
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-sec-repair-lake-${{ matrix.chunk }}
          path: |
            outputs/sec_${{ matrix.chunk }}/lake/
            outputs/sec_${{ matrix.chunk }}/sec_status_*.csv
            outputs/sec_${{ matrix.chunk }}/sec_summary_*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-sec-repair-raw-${{ matrix.chunk }}
          path: outputs/sec_${{ matrix.chunk }}/raw/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge:
    needs: [framework_contract, repair_sec]
    if: ${{ always() && needs.framework_contract.result == 'success' && (needs.repair_sec.result == 'success' || needs.repair_sec.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e . duckdb requests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-prepare
          path: inputs/prepare
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-yfinance-*
          path: inputs/yfinance
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-lake-*
          path: inputs/sec
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !inputs.remerge_only }}
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/repair
      - name: Replace empty source shards with repaired shards
        if: ${{ !inputs.remerge_only }}
        run: |
          for chunk in 007 023; do
            find inputs/sec -type f \( \
              -name "sec_companyfacts_${chunk}.parquet" -o \
              -name "sec_submissions_${chunk}.parquet" -o \
              -name "sec_status_${chunk}.csv" -o \
              -name "sec_summary_${chunk}.json" \
            \) -delete
            find inputs/repair -type f \( \
              -name "sec_companyfacts_${chunk}.parquet" -o \
              -name "sec_submissions_${chunk}.parquet" -o \
              -name "sec_status_${chunk}.csv" -o \
              -name "sec_summary_${chunk}.json" \
            \) -exec cp {} inputs/sec/ \;
          done
          test "$(find inputs/sec -name 'sec_companyfacts_*.parquet' | wc -l)" -eq 48
          test "$(find inputs/sec -name 'sec_submissions_*.parquet' | wc -l)" -eq 48
          test "$(find inputs/sec -name 'sec_summary_*.json' | wc -l)" -eq 48
      - name: Merge repaired lake and calculate current scores
        run: |
          python scripts/run_openap_yfinance_sec_current.py \
            --config "$OPENAP_CONFIG" merge \
            --input-root inputs/yfinance \
            --prepare-dir inputs/prepare \
            --sec-dir inputs/sec \
            --output-dir outputs/final
      - name: Validate final acceptance contract
        run: |
          test -s outputs/final/openap_current.duckdb
          test -s outputs/final/openap_features_current.parquet
          test -s outputs/final/openap_scores_current.parquet
          test -s outputs/final/openap_scores_aggregate_current.parquet
          test -s outputs/final/sec_concept_inputs_current.parquet
          test -s outputs/final/coverage_185.csv
          test -s outputs/final/execution_summary.json
          test -s outputs/final/source_manifest.csv
          test -s outputs/final/yfinance_source_manifest.csv
          test -s outputs/final/sec_source_manifest.csv
          test -s outputs/final/security_universe_exclusions.csv
          test -s outputs/final/output_manifest.csv
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("outputs/final/execution_summary.json").read_text())
          assert summary["input_predictors"] == 185
          assert summary["coverage_rows"] == 185
          assert summary["eligible_symbols"] > 1000
          assert summary["price_rows"] > 1_000_000
          assert summary["sec_companyfacts_rows"] > 100_000
          assert summary["all_facts_have_available_at"] is True
          assert summary["duplicate_price_rows"] == 0
          assert summary["future_price_rows"] == 0
          assert summary["facts_without_available_at"] == 0
          assert summary["sec_concept_input_rows"] > 100_000
          assert summary["concept_inputs_without_available_at"] == 0
          assert summary["future_concept_inputs"] == 0
          assert summary["invalid_concept_units"] == 0
          assert summary["duplicate_companyfacts"] == 0
          assert summary["duplicate_submissions"] == 0
          assert summary["inconsistent_feature_status"] == 0
          assert summary["ineligible_leaderboard_rows"] == 0
          assert summary["score_horizons"] == [1, 3, 6, 12, 36]
          assert summary["aggregate_scores_rows"] == summary["eligible_symbols"]
          assert summary["source_manifest_rows"] == 3
          assert summary["yfinance_source_manifest_rows"] == 48
          assert summary["sec_source_manifest_rows"] == 48
          assert summary["security_master_rows"] > summary["eligible_symbols"]
          assert summary["security_exclusion_rows"] > 0
          assert len(summary["pipeline_git_sha"]) == 40
          assert len(summary["config_sha256"]) == 64
          import pandas as pd
          output_manifest = pd.read_csv("outputs/final/output_manifest.csv")
          assert len(output_manifest) >= 15
          assert output_manifest["sha256"].astype(str).str.fullmatch(r"[0-9a-f]{64}").all()
          yahoo_manifest = pd.read_csv("outputs/final/yfinance_source_manifest.csv")
          sec_manifest = pd.read_csv("outputs/final/sec_source_manifest.csv")
          assert yahoo_manifest.filter(like="sha256").notna().all().all()
          assert sec_manifest.filter(like="sha256").notna().all().all()
          score_columns = set(pd.read_parquet("outputs/final/openap_scores_current.parquet").columns)
          assert {
              "last_price_date",
              "last_sec_available_at",
              "computed_features",
              "exact_features",
              "proxy_features",
              "missing_features",
          }.issubset(score_columns)
          assert summary["locked_opened"] is False
          assert summary["backtest_enabled"] is False
          assert summary["partial"] is False
          import duckdb
          con = duckdb.connect("outputs/final/openap_current.duckdb", read_only=True)
          tables = {row[0] for row in con.execute("SHOW TABLES").fetchall()}
          assert {
              "selected_predictors", "redundancy_groups", "redundancy_correlation_audit",
              "coverage_185", "data_quality_current", "proxy_audit",
              "unavailable_predictors", "security_universe_exclusions",
          }.issubset(tables)
          con.close()
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-yfinance-sec-current-score-results
          path: outputs/final/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
