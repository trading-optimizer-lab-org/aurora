name: Multi-asset baselines

# Downloads free ETF / proxy / T-bill / CBOE history and evaluates the
# published multi-asset strategies in research/multiasset_baselines.py.
# Data from 2021-01-01 onward (the locked period) is dropped on download.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiasset-baselines
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download data and evaluate
        env:
          AU_DATA_DIR: ${{ runner.temp }}/aurora_data
        run: python scripts/run_multiasset_baselines.py --output-dir outputs/multiasset_baselines

      - name: Robustness checks for All Weather + VAA-G4
        run: python scripts/run_multiasset_robustness.py --output-dir outputs/multiasset_baselines

      - name: Publish summary
        if: always()
        run: |
          for f in REPORT.md ROBUSTNESS.md; do
            if [ -f "outputs/multiasset_baselines/$f" ]; then
              cat "outputs/multiasset_baselines/$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: multiasset-baselines
          path: outputs/multiasset_baselines
          if-no-files-found: warn
          retention-days: 90
