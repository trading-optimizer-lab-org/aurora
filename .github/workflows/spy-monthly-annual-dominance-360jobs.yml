name: SPY monthly annual dominance 360 jobs

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: spy-monthly-annual-dominance-360jobs
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Prepare monthly SPY-only data
        env:
          QF_DATA_DIR: ${{ runner.temp }}/aurora-data
          QF_CACHE_DIR: ${{ runner.temp }}/aurora-data/cache
        run: |
          OUT="outputs/spy_only_monthly_lsc_nightly_funnel_20260610"
          python scripts/run_spy_only_monthly_lsc_nightly_funnel.py --mode prepare-data --output-dir "$OUT"
          mkdir -p artifact-data
          cp "$OUT/monthly_returns.csv" artifact-data/
          cp "$OUT/paper_monthly_feature_frame.csv" artifact-data/
          cp "$OUT/feature_family_audit_source.csv" artifact-data/
          cp "$OUT/policy_audit.json" artifact-data/

      - name: Build 360-worker matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("matrix=" + json.dumps({"worker": list(range(360))}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: spy-monthly-scan-data
          path: artifact-data/*
          if-no-files-found: error
          retention-days: 7

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 360
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: spy-monthly-scan-data
          path: outputs/spy_only_monthly_lsc_nightly_funnel_20260610

      - name: Scan worker ${{ matrix.worker }}
        env:
          QF_DATA_DIR: ${{ runner.temp }}/aurora-data
          QF_CACHE_DIR: ${{ runner.temp }}/aurora-data/cache
        run: |
          python scripts/scan_spy_only_monthly_github_annual_dominance_worker.py \
            --output-dir outputs/spy_only_monthly_lsc_nightly_funnel_20260610 \
            --stage-summary-csv config/spy_only_monthly_lsc_annual_dominance_stage_counts_20260612.csv \
            --scan-name github360_annual_dominance \
            --worker-index "${{ matrix.worker }}" \
            --worker-count 360

      - uses: actions/upload-artifact@v4
        with:
          name: github360-worker-${{ matrix.worker }}
          path: |
            outputs/spy_only_monthly_lsc_nightly_funnel_20260610/annual_dominance_scan/github360_annual_dominance_worker_*_matches.csv
            outputs/spy_only_monthly_lsc_nightly_funnel_20260610/annual_dominance_scan/github360_annual_dominance_worker_*_summary.json
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.scan.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: github360-worker-*
          merge-multiple: true
          path: outputs/spy_only_monthly_lsc_nightly_funnel_20260610/annual_dominance_scan

      - name: Combine worker results
        run: |
          python scripts/scan_spy_only_monthly_github_annual_dominance_worker.py \
            --output-dir outputs/spy_only_monthly_lsc_nightly_funnel_20260610 \
            --stage-summary-csv config/spy_only_monthly_lsc_annual_dominance_stage_counts_20260612.csv \
            --scan-name github360_annual_dominance \
            --worker-count 360 \
            --combine-only

      - uses: actions/upload-artifact@v4
        with:
          name: github360-annual-dominance-final
          path: |
            outputs/spy_only_monthly_lsc_nightly_funnel_20260610/final/github360_annual_dominance_matches.csv
            outputs/spy_only_monthly_lsc_nightly_funnel_20260610/final/github360_annual_dominance_summary.json
          if-no-files-found: error
          retention-days: 14
