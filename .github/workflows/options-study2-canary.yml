name: "Options study 2 canary (4 months, 12 names, counts only)"

# docs/research/OPTIONS_STUDY2_PREREGISTRATION.md: the whole pipeline on a short window; prints counts, no returns.
# run: 1
on:
  push:
    branches: [research/options-study-2]
    paths:
      - .github/workflows/options-study2-canary.yml

permissions:
  contents: read

env:
  APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - run: python scripts/run_options_study2.py data --cache outputs/os2_canary --start 2025-01-02 --end 2025-04-30 --symbols AAPL,MSFT,NVDA,AMZN,META,TSLA,JPM,XOM,AMD,NFLX,GOOGL,AVGO --x-top 12
      - run: python scripts/run_options_study2.py eval --cache outputs/os2_canary --out outputs/os2_canary_out --counts-only
