name: v26 data (after-hours and premarket minute bars of the nights after small-cap events)

# scripts/run_v26_data.py: Alpaca SIP minute bars from 16:00 ET to the next 09:29 ET for the small caps held over
# a night by any event of the six sessions before, plus 3,000 quoted-spread minutes in those sessions. The night
# store and the measured spreads stay in the Actions cache (no market data is published).
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v26-data.yml

permissions:
  contents: read

concurrency:
  group: v26-data
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - run: python scripts/run_v26_data.py nights --budget-min 130
      - run: python scripts/run_v26_data.py store
      - run: python scripts/run_v26_data.py quotes
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-${{ github.run_id }}-${{ github.run_attempt }}
