name: AURORA catalog authority watchdog

on:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: catalog-authority-watchdog-v1
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}/..
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      matrix_count: ${{ steps.select.outputs.matrix_count }}
    steps:
      - name: Check out the protected default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false

      - name: Use the controller Python family
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Install only the locked controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock

      - name: Fetch two complete read-only governance snapshots
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_megarun.catalog_watchdog snapshot

      - name: Select only existing, fully evidenced resumable authorities
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_megarun.catalog_watchdog select

  call_controller:
    needs: discover
    if: ${{ needs.discover.outputs.matrix_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/catalog-fast-controller.yml
    with:
      issue_number: ${{ matrix.issue_number }}
