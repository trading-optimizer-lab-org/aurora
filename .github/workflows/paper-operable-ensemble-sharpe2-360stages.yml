name: Paper Operable Ensemble Sharpe2 360 Stages

on:
  workflow_dispatch:
    inputs:
      max_parallel_requested:
        description: "Requested concurrent jobs. 180 jobs x 2 stages covers 360 stages."
        required: true
        default: "180"
      configs_per_stage:
        description: "Base configs per stage before one volatility-managed variant is added."
        required: true
        default: "2500"
      stage_offset:
        description: "Stage offset for non-repeated random ensemble seeds"
        required: true
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_operable_ensemble_sharpe2_360stages

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Build operable paper strategy return panel
        run: python scripts/run_paper_operable_ensemble_sharpe2.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: paper-operable-ensemble-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}/*

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build paired 360-stage matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          matrix = [{"stage_a": stage, "stage_b": stage + 180} for stage in range(180)]
          print("matrix=" + json.dumps(matrix))
          PY

  search:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-operable-ensemble-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Run paired operable paper ensemble stages
        run: |
          for STAGE in "${{ matrix.stage_a }}" "${{ matrix.stage_b }}"; do
            OFFSET_STAGE=$(( STAGE + ${{ inputs.stage_offset }} ))
            python scripts/run_paper_operable_ensemble_sharpe2.py \
              --mode shard \
              --output-dir "$OUTPUT_DIR" \
              --stage "$OFFSET_STAGE" \
              --total-stages 360 \
              --configs-per-stage "${{ inputs.configs_per_stage }}"
          done
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-operable-ensemble-sharpe2-stage-pair-${{ matrix.stage_a }}-${{ matrix.stage_b }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*

  merge:
    runs-on: ubuntu-latest
    needs: [data, search]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-operable-ensemble-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper-operable-ensemble-sharpe2-stage-pair-*
          path: ${{ env.OUTPUT_DIR }}/shards
          merge-multiple: true
      - name: Merge stages
        run: python scripts/run_paper_operable_ensemble_sharpe2.py --mode merge --output-dir "$OUTPUT_DIR" --total-stages 360
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-operable-ensemble-sharpe2-360stages-results
          path: ${{ env.OUTPUT_DIR }}
