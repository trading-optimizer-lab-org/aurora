name: OpenAP 181 Options Source Probe

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to probe
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openap-181-options-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: "true"
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPENAP_COMMIT: 8db892442c2c3a3779b0f1eac4370d3655be15a1
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify options source contracts
        run: |
          python -m py_compile research/openap_181/options_batch.py scripts/run_openap_181_options_source_probe.py
          python -m pytest tests/test_openap_181_options_batch.py -q --tb=short
      - name: Probe pinned formulas and official source documents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_openap_181_options_source_probe.py \
            --output-dir outputs/openap_181_options \
            --evidence-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --evidence-artifact openap-181-options-source-probe-results \
            --implementation-commit "$SOURCE_SHA"
      - name: Verify fail-closed documentary decision
        run: |
          python - <<'PY'
          import json
          import pathlib
          import pandas as pd
          root = pathlib.Path("outputs/openap_181_options")
          summary = json.load(open(root / "options_source_probe.json", encoding="utf-8"))
          evidence = pd.read_csv(root / "options_batch_evidence.csv")
          formulas = pd.read_csv(root / "options_formula_requirements.csv")
          sources = pd.read_csv(root / "options_source_assessment.csv")
          assert summary["formula_sources_verified"] is True
          assert summary["official_documents_verified"] is True
          assert summary["optionmetrics_commercial_benchmark_verified"] is True
          assert summary["exact_free_authorized_source_found"] is False
          assert summary["raw_market_data_downloaded"] is False
          assert summary["raw_files_in_artifact"] is False
          assert summary["strict_approved"] == 0
          assert summary["locked_opened"] is False
          assert summary["validation_used_for_selection"] is False
          assert len(evidence) == evidence["signal"].nunique() == 9
          assert len(formulas) == formulas["signal"].nunique() == 9
          assert sources["exact_for_openap"].astype(str).str.lower().eq("true").sum() == 1
          assert evidence["strict_gate_result"].eq("blocked").all()
          assert evidence["blocking_reason"].str.startswith("options_source_blocked:").all()
          PY
      - name: Upload options source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-181-options-source-probe-results
          path: outputs/openap_181_options/
          if-no-files-found: error
          retention-days: 90
