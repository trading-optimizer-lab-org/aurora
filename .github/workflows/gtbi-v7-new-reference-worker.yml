name: GTBI V7 New Reference Worker

on:
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
      data_artifact_name:
        required: true
        type: string
      plan_artifact_name:
        required: true
        type: string
      runner_padded:
        required: true
        type: string
      worker_ids:
        required: true
        type: string
      processes:
        required: true
        type: number
      effective_cpu_count:
        required: true
        type: number

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/..
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  run:
    name: Logical workers ${{ inputs.worker_ids }}
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    steps:
      - name: Checkout exact campaign code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /__init__.py
            /pyproject.toml
            /requirements/gtbi-fast-strict.lock
            /core/**
            /infra/gtbi_v7_new_reference/**
            /infra/gtbi_v7_readiness/**
            /scripts/*.py
            /docs/readiness/gtbi-v7-new-reference/campaign_authorization.json
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned runtime
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Download prepared historical data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.data_artifact_name }}
          path: prepared
          github-token: ${{ github.token }}
      - name: Download immutable campaign plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.plan_artifact_name }}
          path: plan
          github-token: ${{ github.token }}
      - name: Verify runner capacity and run exact logical workers
        env:
          EXPECTED_CPUS: ${{ inputs.effective_cpu_count }}
          PROCESSES: ${{ inputs.processes }}
          WORKER_IDS: ${{ inputs.worker_ids }}
        run: |
          ACTUAL_CPUS=$(python -c "from infra.gtbi_v7_new_reference.runner import effective_cpu_count; print(effective_cpu_count())")
          test "$ACTUAL_CPUS" -eq "$EXPECTED_CPUS"
          python -m scripts.run_gtbi_v7_new_reference_worker \
            --campaign-manifest plan/campaign_manifest.json \
            --data-manifest prepared/data_manifest.json \
            --plan-root plan \
            --data-pack-root prepared/data-pack \
            --authorization docs/readiness/gtbi-v7-new-reference/campaign_authorization.json \
            --batch-worker-ids "$WORKER_IDS" \
            --processes-per-runner "$PROCESSES" \
            --output-dir runner-output
      - name: Upload exact runner result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gtbi-v7-runner-${{ inputs.runner_padded }}-${{ github.run_id }}
          path: runner-output
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
