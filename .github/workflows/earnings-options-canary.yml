name: "Earnings options canary (12 names, counts only)"

# docs/research/EARNINGS_OPTIONS_PREREGISTRATION.md: the whole pipeline on 12 names; prints counts, no returns.
# run: 1
on:
  push:
    branches: [research/earnings-options]
    paths:
      - .github/workflows/earnings-options-canary.yml

permissions:
  contents: read
  actions: read

env:
  APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - run: python scripts/run_earnings_options.py data --cache outputs/eo_canary --end 2026-10-23 --symbols AAPL,MSFT,JPM,NFLX,TSLA,AMD,PG,WMT,NVDA,META,DAL,SNOW
      - run: python scripts/run_earnings_options.py eval --cache outputs/eo_canary --out outputs/eo_canary_out --counts-only
