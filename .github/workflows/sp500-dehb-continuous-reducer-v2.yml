name: SP500 Continuous DEHB Reducer v2

on:
  workflow_dispatch:
    inputs:
      commit_sha: {required: true}
      campaign_id: {required: true}
      cutoff_sequence: {required: true, default: "latest"}

permissions: {contents: read}
concurrency:
  group: sp500-continuous-reducer-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GITHUB_ACTIONS: "true"
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - name: Install reducer runtime
        run: |
          python -m pip install "psycopg[binary,pool]>=3.2,<4"
          python -m pip install --no-deps -e .
      - name: Reduce immutable train-only cutoff
        run: >-
          python scripts/reduce_sp500_dehb_continuous_snapshot.py
          --campaign-id "${{ inputs.campaign_id }}"
          --cutoff-sequence "${{ inputs.cutoff_sequence }}"
          --output outputs/reducer/snapshot.json
      - name: Upload reducer decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: sp500-dehb-continuous-reducer, path: outputs/reducer, if-no-files-found: error, retention-days: 90}

