name: SP500 Continuous DEHB Reducer v2

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      campaign_id: {required: true, type: string}
      cutoff_sequence: {required: true, type: string, default: "latest"}
      runtime_input_run_id: {required: true, type: string}
      bootstrap_run_id: {required: true, type: string}
      delay_minutes: {required: true, type: string, default: "5"}
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: {required: true}
  workflow_dispatch:
    inputs:
      commit_sha: {required: true}
      campaign_id: {required: true}
      cutoff_sequence: {required: true, default: "latest"}
      runtime_input_run_id: {required: true}
      bootstrap_run_id: {required: true}
      delay_minutes: {required: true, default: "5"}

permissions: {actions: read, contents: read}
concurrency:
  group: sp500-continuous-reducer-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "NEHALEM"
      NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
    steps:
      - name: Check out current infrastructure revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Verify frozen scientific revision
        run: >-
          python scripts/verify_sp500_dehb_scientific_revision.py
          --scientific-commit "${{ inputs.commit_sha }}"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - name: Install reducer runtime
        run: |
          python -m pip install --require-hashes -r requirements/dehb-official.lock
          python -m pip install "psycopg[binary,pool]>=3.2,<4"
          python -m pip install --no-deps -e .
      - name: Download immutable train-only runtime pack
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/dehb_runtime_inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Download exact launch contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-dehb-continuous-bootstrap
          path: ${{ runner.temp }}/dehb_bootstrap
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.bootstrap_run_id }}
      - name: Download exact technical evidence named by launch contract
        shell: bash
        run: |
          set -euo pipefail
          technical_run_id="$(jq -r '.technical_evidence.workflow_run_id' "$RUNNER_TEMP/dehb_bootstrap/launch_contract.json")"
          technical_artifact_name="$(jq -r '.technical_evidence.artifact_name' "$RUNNER_TEMP/dehb_bootstrap/launch_contract.json")"
          [[ "$technical_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$technical_artifact_name" && "$technical_artifact_name" != "null" ]]
          gh run download "$technical_run_id" \
            --name "$technical_artifact_name" \
            --dir "$RUNNER_TEMP/dehb_technical"
      - name: Reduce immutable train-only cutoff continuously
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/reducer
          for ordinal in $(seq 0 59); do
            output="outputs/reducer/snapshot-$ordinal.json"
            python scripts/reduce_sp500_dehb_continuous_snapshot.py \
              --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
              --data-contract config/sp500_megarun_free_data_240.json \
              --feature-contract config/sp500_megarun_feature_contract_240.json \
              --runtime-input-pack "$RUNNER_TEMP/dehb_runtime_inputs" \
              --launch-contract "$RUNNER_TEMP/dehb_bootstrap/launch_contract.json" \
              --technical-evidence "$RUNNER_TEMP/dehb_technical/technical_evidence.json" \
              --campaign-id "${{ inputs.campaign_id }}" \
              --cutoff-sequence "${{ inputs.cutoff_sequence }}" \
              --delay-minutes "${{ inputs.delay_minutes }}" \
              --output "$output"
            jq -c '{marker:"SP500_DEHB_REDUCER_SNAPSHOT",snapshot:.snapshot,decision:.decision}' \
              "$output"
            if [[ "$(jq -r '.decision.action' "$output")" != "searching" ]]; then
              break
            fi
          done
      - name: Upload reducer decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-continuous-reducer-${{ github.run_id }}
          path: outputs/reducer
          if-no-files-found: error
          retention-days: 90
