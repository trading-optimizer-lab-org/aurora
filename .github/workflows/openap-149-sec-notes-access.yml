name: OpenAP 149 SEC Notes access

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      notes_period:
        description: Exact SEC Notes period (YYYYqN or YYYY_MM)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openap-149-sec-notes-access
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SEC_USER_AGENT: "Aurora Research gomez5757@users.noreply.github.com"
      SEC_NOTES_PERIOD: ${{ inputs.notes_period }}
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused test runtime
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify immutable and bounded acquisition contract
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$SEC_NOTES_PERIOD" =~ ^20[0-9]{2}(q[1-4]|_(0[1-9]|1[0-2]))$ ]]
          [[ "$SEC_USER_AGENT" == *"@"* ]]
          python -m pytest \
            tests/test_openap_181_sec_fsd_access.py \
            tests/test_openap_181_sec_notes_listing_inputs.py \
            -q --tb=short
      - name: Acquire one official SEC Notes archive
        run: >-
          python scripts/run_openap_149_sec_notes_access.py
          --period "$SEC_NOTES_PERIOD"
          --user-agent "$SEC_USER_AGENT"
      - name: Verify evidence without score claims
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path("outputs/openap_149_sec_notes_access")
          manifest = pd.read_csv(
              root / "sec_notes_source_manifest.csv", keep_default_na=False
          )
          summary = json.loads(
              (root / "sec_notes_access_summary.json").read_text(encoding="utf-8")
          )
          assert len(manifest) == 1
          period = os.environ["SEC_NOTES_PERIOD"]
          assert manifest.loc[0, "source_id"] == f"sec_notes_{period}"
          assert manifest.loc[0, "access_method"] == (
              "sec_official_notes_direct_fair_access"
          )
          assert manifest.loc[0, "period"] == period
          assert summary["period"] == period
          assert summary["periods_requested"] == 1
          assert summary["downloaded"] + summary["failed"] == 1
          assert not (root / "zips" / f"{period}_notes.zip.part").exists()
          if summary["downloaded"] == 1:
              archive = root / "zips" / f"{period}_notes.zip"
              assert archive.stat().st_size == int(manifest.loc[0, "size_bytes"])
              assert len(str(manifest.loc[0, "sha256"])) == 64
          else:
              assert manifest.loc[0, "failure_reason"]
          PY
      - name: Upload bounded official evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-notes-${{ inputs.notes_period }}
          path: outputs/openap_149_sec_notes_access/
          if-no-files-found: error
          retention-days: 30
