name: Stock Protocol Scientific Full Suite

"on":
  workflow_dispatch:
  push:
    branches:
      - codex/stock-protocol-scientific-validity
    paths:
      - .github/workflows/stock-protocol-scientific-full-suite.yml

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  full-suite:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install complete development environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"
      - name: Run complete non-slow, non-integration suite
        shell: bash
        env:
          QF_DATA_DIR: ${{ runner.temp }}/aurora_data
          AU_DATA_DIR: ${{ runner.temp }}/aurora_data
        run: |
          pytest tests/ -m "not slow and not integration" \
            --ignore=tests/test_config.py \
            --ignore=tests/test_property.py \
            --tb=short
