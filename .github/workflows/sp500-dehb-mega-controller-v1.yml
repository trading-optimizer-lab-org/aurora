name: SP500 Official DEHB Mega Controller v1

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Frozen campaign revision used by every wave
        required: true
      wave:
        description: Current scientific wave
        required: true
        default: "0"
      restart_ordinal:
        description: Default restart ordinal for a new wave
        required: true
        default: "0"
      runtime_input_run_id:
        description: Exact immutable train-only runtime-input artifact run
        required: true
      technical_evidence_run_id:
        description: Exact immutable official-DEHB technical evidence run
        required: true
      prior_decision_run_id:
        description: Immediate prior controller run, or zero for first wave
        required: true
        default: "0"
      evidence_run_ids:
        description: Comma-separated earlier retry runs in this same wave
        required: false
        default: ""
      checkpoint_run_ids:
        description: Comma-separated runs holding prior-wave island checkpoints
        required: false
        default: ""
      auto_continue:
        description: Dispatch retry or next wave automatically
        required: true
        default: true
        type: boolean
      launch_only:
        description: Verify and publish the launch contract without starting workers
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: sp500-official-dehb-mega-controller-v1
  cancel-in-progress: false

jobs:
  framework_contract:
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-dehb-mega-framework-contract
      retention_days: 1
      execution_mode: optimized
      forced_job_count: 1

  preflight:
    needs: framework_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      launch_contract_sha256: ${{ steps.launch.outputs.launch_contract_sha256 }}
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
      RUNTIME_ARTIFACT: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
      TECHNICAL_ARTIFACT: sp500-megarun-official-dehb-smoke-${{ inputs.technical_evidence_run_id }}
    steps:
      - name: Check out frozen campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install package without research dependencies
        run: python -m pip install --no-deps -e .
      - name: Download immutable train-only runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RUNTIME_ARTIFACT }}
          path: ${{ runner.temp }}/dehb_runtime_inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Download immutable technical evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.TECHNICAL_ARTIFACT }}
          path: ${{ runner.temp }}/dehb_technical_evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.technical_evidence_run_id }}
      - name: Build hash-bound launch contract
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          runtime_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.runtime_input_run_id }}/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$RUNTIME_ARTIFACT\" and .expired == false) | .digest" | head -n 1)"
          technical_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.technical_evidence_run_id }}/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$TECHNICAL_ARTIFACT\" and .expired == false) | .digest" | head -n 1)"
          test -n "$runtime_digest"
          test -n "$technical_digest"
          python scripts/build_sp500_megarun_dehb_launch_contract.py \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --code-commit-sha "${{ inputs.commit_sha }}" \
            --repository "$GITHUB_REPOSITORY" \
            --runtime-input-pack "$RUNNER_TEMP/dehb_runtime_inputs" \
            --runtime-input-run-id "${{ inputs.runtime_input_run_id }}" \
            --runtime-input-artifact-name "$RUNTIME_ARTIFACT" \
            --runtime-input-artifact-digest "$runtime_digest" \
            --technical-evidence "$RUNNER_TEMP/dehb_technical_evidence/technical_evidence.json" \
            --technical-evidence-run-id "${{ inputs.technical_evidence_run_id }}" \
            --technical-evidence-artifact-name "$TECHNICAL_ARTIFACT" \
            --technical-evidence-artifact-digest "$technical_digest" \
            --output outputs/launch/launch_contract.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload immutable launch contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-launch-contract
          path: outputs/launch
          if-no-files-found: error
          retention-days: 90

  plan:
    needs: preflight
    if: ${{ !inputs.launch_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      matrix_c: ${{ steps.plan.outputs.matrix_c }}
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out frozen campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install package without research dependencies
        run: python -m pip install --no-deps -e .
      - name: Download exact launch contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-dehb-launch-contract
          path: ${{ runner.temp }}/dehb_launch
      - name: Download immediate prior controller decision
        if: inputs.prior_decision_run_id != '0'
        run: |
          set -euo pipefail
          [[ "${{ inputs.prior_decision_run_id }}" =~ ^[0-9]+$ ]]
          gh run download "${{ inputs.prior_decision_run_id }}" \
            --name sp500-dehb-controller-decision \
            --dir "$RUNNER_TEMP/prior_decision"
      - name: Build first, retry, or resumed-wave matrices
        id: plan
        run: |
          set -euo pipefail
          args=(
            --output-dir outputs/wave_plan
            --launch-contract "$RUNNER_TEMP/dehb_launch/launch_contract.json"
            --expected-code-commit-sha "${{ inputs.commit_sha }}"
            --wave "${{ inputs.wave }}"
            --restart-ordinal "${{ inputs.restart_ordinal }}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${{ inputs.prior_decision_run_id }}" != "0" ]]; then
            args+=(
              --prior-decision
              "$RUNNER_TEMP/prior_decision/controller_decision.json"
            )
          fi
          python scripts/plan_sp500_megarun_dehb_campaign.py "${args[@]}"
      - name: Upload immutable wave plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-wave-plan
          path: outputs/wave_plan
          if-no-files-found: error
          retention-days: 90

  shard_a:
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    continue-on-error: true
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out exact campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Run exact two-island worker
        if: ${{ !startsWith(matrix.job_id, 'SKIP-') }}
        uses: ./.github/actions/sp500-dehb-mega-worker
        with:
          commit-sha: ${{ inputs.commit_sha }}
          job-id: ${{ matrix.job_id }}
          job-payload: ${{ toJSON(matrix) }}
          runtime-input-run-id: ${{ inputs.runtime_input_run_id }}
          launch-contract-run-id: ${{ github.run_id }}
          checkpoint-run-ids: ${{ inputs.checkpoint_run_ids }}
          github-token: ${{ github.token }}


  shard_b:
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    continue-on-error: true
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out exact campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Run exact two-island worker
        if: ${{ !startsWith(matrix.job_id, 'SKIP-') }}
        uses: ./.github/actions/sp500-dehb-mega-worker
        with:
          commit-sha: ${{ inputs.commit_sha }}
          job-id: ${{ matrix.job_id }}
          job-payload: ${{ toJSON(matrix) }}
          runtime-input-run-id: ${{ inputs.runtime_input_run_id }}
          launch-contract-run-id: ${{ github.run_id }}
          checkpoint-run-ids: ${{ inputs.checkpoint_run_ids }}
          github-token: ${{ github.token }}


  shard_c:
    needs: [preflight, plan]
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_c) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    continue-on-error: true
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check out exact campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Run exact two-island worker
        if: ${{ !startsWith(matrix.job_id, 'SKIP-') }}
        uses: ./.github/actions/sp500-dehb-mega-worker
        with:
          commit-sha: ${{ inputs.commit_sha }}
          job-id: ${{ matrix.job_id }}
          job-payload: ${{ toJSON(matrix) }}
          runtime-input-run-id: ${{ inputs.runtime_input_run_id }}
          launch-contract-run-id: ${{ github.run_id }}
          checkpoint-run-ids: ${{ inputs.checkpoint_run_ids }}
          github-token: ${{ github.token }}



  reduce:
    needs: [plan, shard_a, shard_b, shard_c]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      action: ${{ steps.controller.outputs.action }}
      next_wave: ${{ steps.controller.outputs.next_wave }}
      next_restart_ordinal: ${{ steps.controller.outputs.next_restart_ordinal }}
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      PRIOR_EVIDENCE_RUN_IDS: ${{ inputs.evidence_run_ids }}
    steps:
      - name: Check out frozen campaign revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install frozen official DEHB reducer runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/dehb-official.lock
          python -m pip install --no-deps -e .
      - name: Download exact launch contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-dehb-launch-contract
          path: ${{ runner.temp }}/dehb_launch
      - name: Download complete worker artifacts across retries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence_sources"
          IFS=',' read -ra prior_ids <<< "$PRIOR_EVIDENCE_RUN_IDS"
          source_args=()
          order=0
          for run_id in "${prior_ids[@]}" "${{ github.run_id }}"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            target="$RUNNER_TEMP/evidence_sources/$order-$run_id"
            mkdir -p "$target"
            gh run download "$run_id" \
              --pattern 'sp500-dehb-worker-*' \
              --dir "$target" || true
            source_args+=(--source-dir "$target")
            order=$((order + 1))
          done
          python scripts/assemble_sp500_megarun_dehb_evidence.py \
            "${source_args[@]}" \
            --output-dir outputs/combined_workers
      - name: Count complete worker jobs
        id: evidence
        run: |
          python -c "import json,os,pathlib; r=json.loads(pathlib.Path('outputs/combined_workers/assembly_receipt.json').read_text()); pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8').write('complete_workers='+str(r['complete_worker_count'])+'\n')"
      - name: Download immutable runtime pack for complete global reduction
        if: steps.evidence.outputs.complete_workers == '360'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/dehb_runtime_inputs
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Download immutable technical evidence for complete global reduction
        if: steps.evidence.outputs.complete_workers == '360'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-official-dehb-smoke-${{ inputs.technical_evidence_run_id }}
          path: ${{ runner.temp }}/dehb_technical_evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.technical_evidence_run_id }}
      - name: Run global multiplicity and 60-gate reconciliation
        id: global
        if: steps.evidence.outputs.complete_workers == '360'
        run: |
          python scripts/reduce_sp500_megarun_dehb_global.py \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --launch-contract "$RUNNER_TEMP/dehb_launch/launch_contract.json" \
            --expected-code-commit-sha "${{ inputs.commit_sha }}" \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --worker-root outputs/combined_workers \
            --runtime-input-pack "$RUNNER_TEMP/dehb_runtime_inputs" \
            --technical-evidence "$RUNNER_TEMP/dehb_technical_evidence/technical_evidence.json" \
            --output-dir outputs/global_reduce
      - name: Reduce complete wave with global gates
        id: controller_complete
        if: steps.evidence.outputs.complete_workers == '360' && steps.global.outcome == 'success'
        run: |
          python scripts/reduce_sp500_megarun_dehb_campaign.py \
            --results-root outputs/combined_workers \
            --launch-contract "$RUNNER_TEMP/dehb_launch/launch_contract.json" \
            --expected-code-commit-sha "${{ inputs.commit_sha }}" \
            --wave "${{ inputs.wave }}" \
            --global-robustness outputs/global_reduce/global_robustness.json \
            --output outputs/controller/controller_decision.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Reduce incomplete wave to exact retry jobs
        id: controller_retry
        if: steps.evidence.outputs.complete_workers != '360'
        run: |
          python scripts/reduce_sp500_megarun_dehb_campaign.py \
            --results-root outputs/combined_workers \
            --launch-contract "$RUNNER_TEMP/dehb_launch/launch_contract.json" \
            --expected-code-commit-sha "${{ inputs.commit_sha }}" \
            --wave "${{ inputs.wave }}" \
            --output outputs/controller/controller_decision.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Fail closed if global reduction failed with complete evidence
        if: steps.evidence.outputs.complete_workers == '360' && steps.global.outcome != 'success'
        run: exit 1
      - name: Normalize controller outputs
        id: controller
        env:
          ACTION_COMPLETE: ${{ steps.controller_complete.outputs.action }}
          ACTION_RETRY: ${{ steps.controller_retry.outputs.action }}
          WAVE_COMPLETE: ${{ steps.controller_complete.outputs.next_wave }}
          WAVE_RETRY: ${{ steps.controller_retry.outputs.next_wave }}
          RESTART_COMPLETE: ${{ steps.controller_complete.outputs.next_restart_ordinal }}
          RESTART_RETRY: ${{ steps.controller_retry.outputs.next_restart_ordinal }}
        run: |
          printf 'action=%s\n' "${ACTION_COMPLETE:-$ACTION_RETRY}" >> "$GITHUB_OUTPUT"
          printf 'next_wave=%s\n' "${WAVE_COMPLETE:-$WAVE_RETRY}" >> "$GITHUB_OUTPUT"
          printf 'next_restart_ordinal=%s\n' "${RESTART_COMPLETE:-$RESTART_RETRY}" >> "$GITHUB_OUTPUT"
      - name: Upload controller decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-controller-decision
          path: outputs/controller
          if-no-files-found: error
          retention-days: 90
      - name: Upload global robustness evidence
        if: steps.global.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-global-robustness
          path: outputs/global_reduce
          if-no-files-found: error
          retention-days: 90

  continue:
    needs: reduce
    if: always() && inputs.auto_continue && needs.reduce.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read controller decision artifact
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          decision_dir="$RUNNER_TEMP/controller_decision"
          mkdir -p "$decision_dir"
          gh run download "${{ github.run_id }}" \
            --name sp500-dehb-controller-decision \
            --dir "$decision_dir"
          action="$(python - "$decision_dir/controller_decision.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["action"])
          PY
          )"
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
      - name: Dispatch exact retry or next scientific wave
        if: steps.decision.outputs.action == 'retry_jobs' || steps.decision.outputs.action == 'dispatch_next_wave'
        shell: bash
        run: |
          set -euo pipefail
          action="${{ steps.decision.outputs.action }}"
          evidence_ids="${{ inputs.evidence_run_ids }}"
          checkpoint_ids="${{ inputs.checkpoint_run_ids }}"
          if [[ "$action" == "retry_jobs" ]]; then
            next_wave="${{ inputs.wave }}"
            next_restart="${{ inputs.restart_ordinal }}"
            evidence_ids="${evidence_ids:+$evidence_ids,}${{ github.run_id }}"
          else
            next_wave="${{ needs.reduce.outputs.next_wave }}"
            next_restart="${{ needs.reduce.outputs.next_restart_ordinal }}"
            checkpoint_ids="${evidence_ids:+$evidence_ids,}${{ github.run_id }}"
            evidence_ids=""
          fi
          gh workflow run sp500-dehb-mega-controller-v1.yml \
            --ref "${{ github.ref_name }}" \
            -f commit_sha="${{ inputs.commit_sha }}" \
            -f wave="$next_wave" \
            -f restart_ordinal="$next_restart" \
            -f runtime_input_run_id="${{ inputs.runtime_input_run_id }}" \
            -f technical_evidence_run_id="${{ inputs.technical_evidence_run_id }}" \
            -f prior_decision_run_id="${{ github.run_id }}" \
            -f evidence_run_ids="$evidence_ids" \
            -f checkpoint_run_ids="$checkpoint_ids" \
            -f auto_continue=true \
            -f launch_only=false
