name: v19 realistic costs (measured spreads)

# scripts/run_v19_costs.py on the v17 quote study (cache of run 39419245445); reads quotes only.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_v19_costs.py
      - .github/workflows/v19-costs.yml

permissions:
  contents: read

jobs:
  costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install pandas pyarrow
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v17/quotes
          key: v17-quotes-39419245445-1
          fail-on-cache-miss: true
      - run: python scripts/run_v19_costs.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v19-costs
          path: outputs/v19/costs
          retention-days: 90
