name: OpenAP 149 FINRA Short Interest Current

on:
  push:
    branches:
      - codex/openap-proxy44-validation
    paths:
      - .github/workflows/openap-149-finra-short-interest.yml
      - research/openap_181/short_interest_batch.py
      - scripts/run_openap_149_finra_short_interest.py
      - tests/test_openap_181_short_interest_batch.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      sec_artifact_run_id:
        description: Successful run containing the 48 official SEC lake shards
        required: true
        default: "31270341796"
        type: string
      formula_evidence_run_id:
        description: Successful run containing the pinned formula inventory
        required: true
        default: "31331835149"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-finra-short-interest
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify FINRA short-interest contracts
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pytest tests/test_openap_181_short_interest_batch.py -q --tb=short

  acquire:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      GITHUB_ACTIONS: "true"
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download all verified SEC lake shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/sec
          run-id: ${{ inputs.sec_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Calculate current official FINRA ShortInterest proxy
        run: |
          python scripts/run_openap_149_finra_short_interest.py \
            --sec-root inputs/sec \
            --formula-root inputs/formulas \
            --formation-at 2026-08-09T23:59:59Z \
            --source-run-id "${{ inputs.sec_artifact_run_id }}" \
            --output-dir openap_149_finra_short_interest
      - name: Verify bounded causal derived output
        run: |
          python - <<'PY'
          import json
          import pathlib
          import pandas as pd
          root = pathlib.Path("outputs/openap_149_finra_short_interest")
          values = pd.read_csv(root / "openap_149_finra_short_interest_current.csv")
          manifest = json.load(open(
              root / "openap_149_finra_short_interest_manifest.json",
              encoding="utf-8",
          ))
          assert set(values["signal"]) == {"ShortInterest"}
          assert values["value"].notna().all() and values["value"].ge(0).all()
          assert values["source_id"].eq(
              "finra_equity_short_interest|sec_edgar"
          ).all()
          assert pd.to_datetime(values["available_at"], utc=True).le(
              pd.to_datetime(values["formation_at"], utc=True)
          ).all()
          assert values["formula_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert manifest["raw_files_in_artifact"] is False
          assert manifest["strict_score_eligible"] is False
          assert not any("shrt2026" in path.name.lower() for path in root.rglob("*"))
          PY
      - name: Upload FINRA ShortInterest derived evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-finra-short-interest-current
          path: outputs/openap_149_finra_short_interest/
          if-no-files-found: error
          retention-days: 90
