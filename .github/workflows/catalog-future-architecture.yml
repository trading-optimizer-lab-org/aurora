name: Catalog Future Architecture Qualification

on:
  workflow_dispatch:

permissions: {contents: read}

jobs:
  qualify:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements/catalog-recipe-worker.lock"
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-recipe-worker.lock
          python -m pip install --no-deps -e .
      - name: Verify multi-asset and point-in-time contracts
        run: >-
          python -m pytest
          tests/test_sp500_catalog_runtime_scaling.py
          -k "multi_asset or cross_sectional"
          -q
      - name: Benchmark 10/100 assets and 1000-asset PIT universe
        run: >-
          python -m scripts.benchmark_catalog_future_architecture
          --output outputs/catalog_future_architecture.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-future-architecture-qualification
          path: outputs/catalog_future_architecture.json
          if-no-files-found: error
          retention-days: 90
