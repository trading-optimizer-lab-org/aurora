name: urda-crash-render-v3

on:
  push:
    branches: [render/urda-crash-v3]
    paths:
      - .github/workflows/urda-crash-render-v3.yml
      - render/urda/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: urda-crash-render-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: render/urda
          persist-credentials: false
      - name: Add swap
        run: |
          sudo fallocate -l 16G /mnt/urda.swap && sudo chmod 600 /mnt/urda.swap && sudo mkswap /mnt/urda.swap && sudo swapon /mnt/urda.swap || true
          free -g
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 libx11-6 >/dev/null
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Real terrain and assets (IGN PNOA + MDT05, Poly Haven CC0)
        run: |
          pip install -q numpy pillow
          python render/urda/tools/fetch_assets.py data
          python render/urda/tools/prep.py data
      - name: Download Blender 4.5.10
        run: |
          mkdir -p bl
          curl -sSL --retry 5 -o bl/blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.10-linux-x64.tar.xz
          tar xJf bl/blender.tar.xz -C bl
      - name: Build scene
        run: bl/blender-4.5.10-linux-x64/blender -b --python render/urda/build.py -- data scene/urda.blend final 2>&1 | grep -E "^.....[0-9.]+s. |Error|rror:|Traceback|File " ; test -f scene/urda.blend && ls -la scene
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blender-bin
          path: bl/blender.tar.xz
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urda-blend
          path: scene/urda.blend
          retention-days: 3
          compression-level: 1

  bake:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: render/urda
          persist-credentials: false
      - name: Add swap
        run: |
          sudo fallocate -l 16G /mnt/urda.swap && sudo chmod 600 /mnt/urda.swap && sudo mkswap /mnt/urda.swap && sudo swapon /mnt/urda.swap || true
          free -g
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 libx11-6 >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: blender-bin
          path: bl
      - name: Unpack Blender
        run: tar xJf bl/blender.tar.xz -C bl && echo "BLENDER=$PWD/bl/blender-4.5.10-linux-x64/blender" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: urda-blend
          path: scene
      - name: Bake Mantaflow dust
        run: |
          "$BLENDER" -b scene/urda.blend --python render/urda/bake.py -- 320 2>&1 | grep -E "BAKED|Error|rror:|Traceback" || true
          du -sh scene/dust_cache && find scene/dust_cache -type f | wc -l
          test -n "$(find scene/dust_cache -name '*.vdb')"
      - name: Split cache per shard group
        run: python3 render/urda/split_cache.py scene/dust_cache chunks && du -sh chunks/* | head -30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urda-blend-late
          path: scene/urda.blend
          retention-days: 3
          compression-level: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
