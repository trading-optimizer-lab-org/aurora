          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 libx11-6 >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: blender-bin
          path: bl
      - name: Unpack Blender
        run: tar xJf bl/blender.tar.xz -C bl && echo "BLENDER=$PWD/bl/blender-4.5.10-linux-x64/blender" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: urda-blend-late
          path: scene
      - name: Cache chunk
        id: c
        run: echo "chunk=$(( ${{ matrix.shard }} / 10 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dust-c${{ steps.c.outputs.chunk }}
          path: scene
      - name: Render shard
        env:
          URDA_TIME_LIMIT: "1200"
        run: |
          nproc; free -g
          nice -n 10 "$BLENDER" -b scene/urda.blend --python render/urda/render_shard.py -- late ${{ matrix.shard }} out 2>&1 | grep -E "FRAME|Error|rror:|Traceback|Fra:1 .*Sample 1/" || true
          ls -R out | head -20
          test -n "$(find out -name '*.png')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frames-late-${{ matrix.shard }}
          path: out
          retention-days: 7
          compression-level: 0

  assemble:
    needs: [render-early, render-late, stills]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: render/urda
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: frames-*
          merge-multiple: true
          path: frames
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stills-*
          merge-multiple: true
          path: stills
      - name: Assemble documentary
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q pillow pyproj
          for j in J1 J2 J3 J4 J5; do echo "$j $(ls frames/$j | wc -l)"; done
          ls stills
          python render/urda/assemble.py frames stills work urda_reconstruccion_v3_1080p.mp4
          ls -la urda_reconstruccion_v3_1080p.mp4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urda-video-v3
          path: urda_reconstruccion_v3_1080p.mp4
          retention-days: 14
          compression-level: 0
