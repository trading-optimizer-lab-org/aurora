          free -g
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 libx11-6 >/dev/null
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: blender-bin
          path: bl
      - name: Unpack Blender
        run: tar xJf bl/blender.tar.xz -C bl && echo "BLENDER=$PWD/bl/blender-4.5.10-linux-x64/blender" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: urda-blend
          path: scene
      - name: Render shard
        env:
          URDA_TIME_LIMIT: "1200"
        run: |
          nproc; free -g
          nice -n 10 "$BLENDER" -b scene/urda.blend --python render/urda/render_shard.py -- early ${{ matrix.shard }} out 2>&1 | grep -E "FRAME|Error|rror:|Traceback|Fra:1 .*Sample 1/" || true
          ls -R out | head -20
          test -n "$(find out -name '*.png')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frames-early-${{ matrix.shard }}
          path: out
          retention-days: 7
          compression-level: 0

