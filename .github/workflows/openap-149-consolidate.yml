name: OpenAP 149 Current Evidence Consolidation

on:
  push:
    branches:
      - codex/openap-proxy44-validation
    paths:
      - .github/workflows/openap-149-consolidate.yml
      - research/openap_current_score.py
      - research/openap_181/acquisition_149.py
      - research/openap_181/sec_companyfacts_149.py
      - research/openap_181/short_interest_batch.py
      - research/openap_181/realestate_rendered_batch.py
      - research/openap_181/sec_rendered_reports.py
      - scripts/run_openap_149_consolidate.py
      - scripts/run_openap_149_realestate_rendered_batch.py
      - tests/test_openap_149_acquisition.py
      - tests/test_openap_149_sec_companyfacts.py
      - tests/test_openap_149_realestate_rendered_batch.py
      - tests/test_openap_181_short_interest_batch.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      current_93_run_id:
        description: Run containing verified bounded OpenAP 93 current values
        required: true
        type: string
      current_93_artifact_name:
        description: Exact OpenAP 93 current-values artifact name
        required: true
        default: openap-93-current-recovered-results
        type: string
      sec_current_run_id:
        description: Successful OpenAP 149 SEC CompanyFacts run
        required: true
        type: string
      finra_current_run_id:
        description: Successful OpenAP 149 FINRA ShortInterest run
        required: true
        type: string
      realestate_current_run_id:
        description: Successful OpenAP 149 rendered realestate current run
        required: true
        type: string
      formula_evidence_run_id:
        description: Successful run containing the pinned formula inventory
        required: true
        default: "31331835149"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-current-consolidation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify consolidation contract
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pytest \
            tests/test_openap_149_acquisition.py \
            tests/test_openap_149_sec_companyfacts.py \
            tests/test_openap_149_realestate_rendered_batch.py \
            tests/test_openap_181_short_interest_batch.py \
            -q --tb=short

  consolidate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      AU_DATA_DIR: ${{ github.workspace }}/outputs
      OUTPUT_ARTIFACT: openap-149-current-consolidated-results
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download fresh OpenAP 93 current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.current_93_artifact_name }}
          path: inputs/current_93
          run-id: ${{ inputs.current_93_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download expanded SEC current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-sec-companyfacts-current
          path: inputs/sec_current
          run-id: ${{ inputs.sec_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download official FINRA ShortInterest values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-finra-short-interest-current
          path: inputs/finra_current
          run-id: ${{ inputs.finra_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download rendered realestate current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-realestate-rendered-current
          path: inputs/realestate_current
          run-id: ${{ inputs.realestate_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Consolidate latest current evidence
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/run_openap_149_consolidate.py \
            --route-matrix docs/OPENAP_181_CURRENT_FREE_SOURCE_REAUDIT_2026-08-09.csv \
            --current-93-root inputs/current_93 \
            --sec-current-root inputs/sec_current \
            --finra-current-root inputs/finra_current \
            --realestate-current-root inputs/realestate_current \
            --formula-root inputs/formulas \
            --current-93-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.current_93_run_id }}" \
            --sec-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.sec_current_run_id }}" \
            --finra-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.finra_current_run_id }}" \
            --realestate-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.realestate_current_run_id }}" \
            --evidence-run-url "$run_url" \
            --evidence-artifact "$OUTPUT_ARTIFACT" \
            --output-dir openap_149_current_consolidated
      - name: Verify consolidated result
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          root = "outputs/openap_149_current_consolidated"
          matrix = pd.read_csv(f"{root}/OPENAP_149_ACQUISITION_MATRIX.csv")
          values = pd.read_csv(f"{root}/openap_149_current_values.csv")
          summary = json.load(open(f"{root}/openap_149_acquisition_summary.json"))
          assert len(matrix) == matrix["signal"].nunique() == 149
          assert summary["latest_formation_at"] == "2026-08-09T23:59:59+00:00"
          assert summary["data_acquired"] == 57
          assert summary["current_values_calculated"] == 51
          assert summary["reconstructed_not_strict"] == 19
          assert summary["blocked"] == summary["pending"] == 98
          assert summary["value_rows"] == 97914
          assert summary["strict_score_eligible"] == 0
          assert not matrix["strict_score_eligible"].astype(str).str.lower().eq("true").any()
          firm_age = matrix.set_index("signal").loc["FirmAge"]
          assert bool(firm_age["data_acquired"])
          assert bool(firm_age["current_value_calculated"])
          assert firm_age["current_value_count"] == 4434
          assert firm_age["fidelity"] == "unvalidated_proxy"
          assert firm_age["source_used"] == "sec_edgar"
          assert not bool(firm_age["strict_score_eligible"])
          firm_age_values = values.loc[values["signal"].eq("FirmAge")]
          assert len(firm_age_values) == 4434
          assert firm_age_values["source_id"].eq("sec_edgar").all()
          assert firm_age_values["formula_id"].eq(
              "openap_firmage_sec_first_filing_months_proxy"
          ).all()
          assert pd.to_datetime(firm_age_values["period_end"]).eq(
              pd.to_datetime(firm_age_values["available_at"])
          ).all()
          for signal in ("CBOperProf", "DelNetFin", "EarningsConsistency"):
              quarantined = matrix.set_index("signal").loc[signal]
              assert not bool(quarantined["data_acquired"])
              assert not bool(quarantined["current_value_calculated"])
              assert quarantined["status"] == "blocked_fidelity"
              assert "declared_current_unusable" in quarantined["remaining_blocker"]
          oscore = matrix.set_index("signal").loc["OScore"]
          assert bool(oscore["data_acquired"])
          assert bool(oscore["current_value_calculated"])
          assert oscore["current_value_count"] == 1100
          assert oscore["fidelity"] == "reconstructed"
          assert oscore["source_used"] == "fred|sec_edgar"
          assert not bool(oscore["strict_score_eligible"])
          oscore_values = values.loc[values["signal"].eq("OScore")]
          assert len(oscore_values) == 1100
          assert oscore_values["source_id"].eq("sec_edgar|fred_public_csv").all()
          assert oscore_values["formula_id"].eq(
              "openap_ohlson_oscore_decile_sec_gnpdefl"
          ).all()
          realestate = matrix.set_index("signal").loc["realestate"]
          assert bool(realestate["data_acquired"])
          assert bool(realestate["current_value_calculated"])
          assert realestate["current_value_count"] == 7
          assert realestate["fidelity"] == "reconstructed"
          assert realestate["source_used"] == "sec_edgar"
          assert not bool(realestate["strict_score_eligible"])
          realestate_values = values.loc[values["signal"].eq("realestate")]
          assert len(realestate_values) == 7
          assert realestate_values["source_id"].eq("sec_edgar").all()
          assert realestate_values["formula_id"].eq("realestate").all()
          assert realestate_values["observation_count"].eq(7).all()
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload consolidated current evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-current-consolidated-results
          path: outputs/openap_149_current_consolidated/
          if-no-files-found: error
          retention-days: 90
