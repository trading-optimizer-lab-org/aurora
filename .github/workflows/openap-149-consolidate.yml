name: OpenAP 149 Current Evidence Consolidation

on:
  push:
    branches:
      - codex/openap-proxy44-validation
    paths:
      - .github/workflows/openap-149-consolidate.yml
      - research/openap_current_score.py
      - research/openap_181/acquisition_149.py
      - research/openap_181/sec_companyfacts_149.py
      - research/openap_181/short_interest_batch.py
      - research/openap_181/realestate_rendered_batch.py
      - research/openap_181/sec_rendered_reports.py
      - research/openap_181/sec_listing_identity.py
      - research/openap_181/field_ritter_ipo.py
      - research/openap_181/sec_spinoff.py
      - research/openap_181/recovered_current_features.py
      - research/openap_181/recovered_openap93_proxies.py
      - research/openap_181/recovered_yfinance_extended_signals.py
      - research/openap_181/twelve_data_factor_signals.py
      - research/openap_181/twelve_data_market_batch.py
      - research/openap_181/twelve_data_market_signals.py
      - scripts/run_openap_149_consolidate.py
      - scripts/run_openap_149_field_ritter_ipo.py
      - scripts/run_openap_149_realestate_rendered_batch.py
      - scripts/run_openap_149_sec_listing_identity.py
      - scripts/run_openap_149_sec_spinoff.py
      - scripts/run_openap_149_recovered_current_features.py
      - scripts/run_openap_149_recovered_yfinance_market.py
      - scripts/run_openap_149_twelve_data_market.py
      - tests/test_openap_149_acquisition.py
      - tests/test_openap_149_sec_companyfacts.py
      - tests/test_openap_149_realestate_rendered_batch.py
      - tests/test_openap_181_short_interest_batch.py
      - tests/test_openap_181_field_ritter_ipo.py
      - tests/test_openap_181_sec_listing_identity.py
      - tests/test_openap_181_sec_spinoff.py
      - tests/test_openap_149_recovered_current_features.py
      - tests/test_openap_149_recovered_openap93_proxies.py
      - tests/test_openap_149_recovered_yfinance_market.py
      - tests/test_openap_181_twelve_data_factor_signals.py
      - tests/test_openap_181_twelve_data_market_batch.py
      - tests/test_openap_181_twelve_data_market_signals.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      current_93_run_id:
        description: Run containing verified bounded OpenAP 93 current values
        required: true
        default: "31341580689"
        type: string
      current_93_artifact_name:
        description: Exact OpenAP 93 current-values artifact name
        required: true
        default: openap-93-current-recovered-results
        type: string
      sec_current_run_id:
        description: Successful OpenAP 149 SEC CompanyFacts run
        required: true
        default: "31392473937"
        type: string
      finra_current_run_id:
        description: Successful OpenAP 149 FINRA ShortInterest run
        required: true
        default: "31384007094"
        type: string
      realestate_current_run_id:
        description: Successful OpenAP 149 rendered realestate current run
        required: true
        default: "31384049772"
        type: string
      exchange_switch_current_run_id:
        description: Successful OpenAP 149 SEC exchange-switch current run
        required: true
        default: "31389285731"
        type: string
      field_ritter_current_run_id:
        description: Successful OpenAP 149 Field-Ritter IPO current run
        required: true
        default: "31395454942"
        type: string
      spinoff_current_run_id:
        description: Successful OpenAP 149 SEC Spinoff current run
        required: true
        default: "31393646423"
        type: string
      recovered_current_run_id:
        description: Run containing both hash-bound recovered current batches
        required: true
        type: string
      formula_evidence_run_id:
        description: Successful run containing the pinned formula inventory
        required: true
        default: "31396163422"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-current-consolidation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify consolidation contract
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pytest \
            tests/test_openap_149_acquisition.py \
            tests/test_openap_149_sec_companyfacts.py \
            tests/test_openap_149_realestate_rendered_batch.py \
            tests/test_openap_181_short_interest_batch.py \
            tests/test_openap_181_field_ritter_ipo.py \
            tests/test_openap_181_sec_listing_identity.py \
            tests/test_openap_181_sec_spinoff.py \
            tests/test_openap_181_twelve_data_market_batch.py \
            tests/test_openap_181_twelve_data_market_signals.py \
            tests/test_openap_181_twelve_data_factor_signals.py \
            tests/test_openap_149_recovered_yfinance_market.py \
            tests/test_openap_149_recovered_current_features.py \
            tests/test_openap_149_recovered_openap93_proxies.py \
            -q --tb=short

  consolidate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      AU_DATA_DIR: ${{ github.workspace }}/outputs
      OUTPUT_ARTIFACT: openap-149-current-consolidated-results
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download fresh OpenAP 93 current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.current_93_artifact_name }}
          path: inputs/current_93
          run-id: ${{ inputs.current_93_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download expanded SEC current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-sec-companyfacts-current
          path: inputs/sec_current
          run-id: ${{ inputs.sec_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download official FINRA ShortInterest values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-finra-short-interest-current
          path: inputs/finra_current
          run-id: ${{ inputs.finra_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download rendered realestate current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-realestate-rendered-current
          path: inputs/realestate_current
          run-id: ${{ inputs.realestate_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download SEC exchange-switch current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-sec-exchange-switch-current
          path: inputs/exchange_switch_current
          run-id: ${{ inputs.exchange_switch_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download Field-Ritter IPO current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-field-ritter-ipo-current
          path: inputs/field_ritter_current
          run-id: ${{ inputs.field_ritter_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download SEC Spinoff current values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-sec-spinoff-current
          path: inputs/spinoff_current
          run-id: ${{ inputs.spinoff_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download recovered YFinance market values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-recovered-yfinance-market-results
          path: inputs/recovered_market
          run-id: ${{ inputs.recovered_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download recovered accounting feature values
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-149-recovered-current-feature-results
          path: inputs/recovered_current_features
          run-id: ${{ inputs.recovered_current_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Consolidate latest current evidence
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python scripts/run_openap_149_consolidate.py \
            --route-matrix docs/OPENAP_181_CURRENT_FREE_SOURCE_REAUDIT_2026-08-09.csv \
            --current-93-root inputs/current_93 \
            --sec-current-root inputs/sec_current \
            --finra-current-root inputs/finra_current \
            --realestate-current-root inputs/realestate_current \
            --exchange-switch-current-root inputs/exchange_switch_current \
            --field-ritter-current-root inputs/field_ritter_current \
            --spinoff-current-root inputs/spinoff_current \
            --recovered-market-root inputs/recovered_market \
            --recovered-current-features-root inputs/recovered_current_features \
            --formula-root inputs/formulas \
            --expected-source-sha "$SOURCE_SHA" \
            --current-93-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.current_93_run_id }}" \
            --sec-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.sec_current_run_id }}" \
            --finra-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.finra_current_run_id }}" \
            --realestate-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.realestate_current_run_id }}" \
            --exchange-switch-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.exchange_switch_current_run_id }}" \
            --field-ritter-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.field_ritter_current_run_id }}" \
            --spinoff-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.spinoff_current_run_id }}" \
            --recovered-current-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.recovered_current_run_id }}" \
            --evidence-run-url "$run_url" \
            --evidence-artifact "$OUTPUT_ARTIFACT" \
            --output-dir openap_149_current_consolidated
      - name: Verify consolidated result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          def read_exactly_one(root, filename):
              paths = list(Path(root).rglob(filename))
              assert len(paths) == 1
              return pd.read_csv(paths[0], low_memory=False)

          root = "outputs/openap_149_current_consolidated"
          matrix = pd.read_csv(f"{root}/OPENAP_149_ACQUISITION_MATRIX.csv")
          values = pd.read_csv(f"{root}/openap_149_current_values.csv")
          summary = json.load(open(f"{root}/openap_149_acquisition_summary.json"))
          consolidation = json.load(
              open(f"{root}/openap_149_consolidation_manifest.json")
          )
          current_93 = read_exactly_one(
              "inputs/current_93", "signals_93_current.csv"
          )
          recovered_market = read_exactly_one(
              "inputs/recovered_market", "recovered_yfinance_market_current.csv"
          )
          recovered_features = read_exactly_one(
              "inputs/recovered_current_features",
              "recovered_current_features_current.csv",
          )
          assert len(matrix) == matrix["signal"].nunique() == 149
          data_acquired = matrix["data_acquired"].astype(str).str.lower().eq("true")
          current_calculated = (
              matrix["current_value_calculated"].astype(str).str.lower().eq("true")
          )
          reconstructed = matrix["fidelity"].eq("reconstructed")
          strict_eligible = (
              matrix["strict_score_eligible"].astype(str).str.lower().eq("true")
          )
          assert summary["target_signals"] == 149
          assert summary["latest_formation_at"] == "2026-08-09T23:59:59+00:00"
          assert summary["data_acquired"] == int(data_acquired.sum())
          assert summary["current_values_calculated"] == int(current_calculated.sum())
          assert summary["reconstructed_not_strict"] == int((current_calculated & reconstructed).sum())
          assert summary["blocked"] == summary["pending"] == int((~current_calculated).sum())
          assert summary["value_rows"] == len(values)
          assert summary["strict_score_eligible"] == int(strict_eligible.sum()) == 0
          assert not strict_eligible.any()
          openap93_expected = {
              "CompEquIss": (
                  1585,
                  "recovered_openap93_compequiss",
                  "openap_compequiss_60m_sec_shares_yahoo_return",
                  "historical_crsp_identity_verified",
              ),
              "EquityDuration": (
                  37,
                  "recovered_openap93_equityduration",
                  "openap_equity_duration_dss2004_sec_yahoo",
                  "historical_compustat_crsp_identity_verified",
              ),
          }
          openap93_batch = consolidation["verified_openap93_proxy_batch"]
          assert openap93_batch["strict_score_increment"] == 0
          for signal, (count, source_id, formula_id, identity_gate) in openap93_expected.items():
              expected = current_93.loc[
                  current_93["signal"].eq(signal)
                  & current_93["current_usable"].astype(str).str.lower().eq("true")
                  & pd.to_numeric(current_93["value"], errors="coerce").notna()
              ]
              evidence = matrix.set_index("signal").loc[signal]
              actual = values.loc[values["signal"].eq(signal)]
              assert len(actual) == len(expected) == count
              assert bool(evidence["data_acquired"])
              assert bool(evidence["current_value_calculated"])
              assert int(evidence["current_value_count"]) == count
              assert evidence["fidelity"] == "reconstructed"
              assert not bool(evidence["strict_score_eligible"])
              assert actual["source_id"].eq(source_id).all()
              assert actual["formula_id"].eq(formula_id).all()
              assert openap93_batch["signals"][signal][identity_gate] is False
          firm_age = matrix.set_index("signal").loc["FirmAge"]
          assert bool(firm_age["data_acquired"])
          assert bool(firm_age["current_value_calculated"])
          assert firm_age["current_value_count"] == 4434
          assert firm_age["fidelity"] == "unvalidated_proxy"
          assert firm_age["source_used"] == "sec_edgar"
          assert not bool(firm_age["strict_score_eligible"])
          firm_age_values = values.loc[values["signal"].eq("FirmAge")]
          assert len(firm_age_values) == 4434
          assert firm_age_values["source_id"].eq("sec_edgar").all()
          assert firm_age_values["formula_id"].eq(
              "openap_firmage_sec_first_filing_months_proxy"
          ).all()
          assert pd.to_datetime(firm_age_values["period_end"]).eq(
              pd.to_datetime(firm_age_values["available_at"])
          ).all()
          companyfacts_expected = {
              "ChInvIA": (3124, "reconstructed", "openap_chinvia_capex_growth_sic2d_mean_sec"),
              "ConvDebt": (265, "reconstructed", "openap_convdebt_positive_only_sec_companyfacts_reconstruction"),
              "DelDRC": (1949, "unvalidated_proxy", "change_deferred_revenue_over_average_assets"),
              "DelNetFin": (36, "reconstructed", "openap_delnetfin_sec_aggregate_components_6m_lag"),
              "DivOmit": (14, "reconstructed", "openap_divomit_positive_sec_6q_regular_then_zero_2m"),
              "DivSeason": (3, "reconstructed", "openap_divseason_positive_sec_direct_month_frequency"),
              "EarningsConsistency": (1441, "reconstructed", "openap_earnings_consistency_sec_basic_eps_6m_lag"),
              "EarningsSurprise": (2132, "reconstructed", "openap_eps_yoy_drift_standardized_8q_sec_21q"),
              "RevenueSurprise": (1828, "reconstructed", "openap_revenue_per_share_yoy_standardized_8q_sec_21q"),
              "sinAlgo": (22, "reconstructed", "openap_sinalgo_positive_current_sec_sic"),
          }
          matrix_by_signal = matrix.set_index("signal")
          recovered_run_url = "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.recovered_current_run_id }}"
          recovered_market_counts = recovered_market.groupby("signal").size()
          recovered_feature_counts = recovered_features.groupby("signal").size()
          comparison_columns = [
              "security_id", "signal", "formation_at", "available_at", "value",
              "formula_id",
          ]
          for recovered, counts in (
              (recovered_market, recovered_market_counts),
              (recovered_features, recovered_feature_counts),
          ):
              source_strict = (
                  recovered["strict_score_eligible"]
                  .astype(str).str.lower().eq("true")
              )
              assert not source_strict.any()
              for signal, expected_count in counts.items():
                  evidence = matrix_by_signal.loc[signal]
                  assert bool(evidence["data_acquired"])
                  assert bool(evidence["current_value_calculated"])
                  assert int(evidence["current_value_count"]) == int(expected_count)
                  assert evidence["source_evidence_run"] == recovered_run_url
                  assert not bool(evidence["strict_score_eligible"])
                  expected = recovered.loc[
                      recovered["signal"].eq(signal), comparison_columns
                  ].sort_values(comparison_columns[:3]).reset_index(drop=True)
                  actual = values.loc[
                      values["signal"].eq(signal), comparison_columns
                  ].sort_values(comparison_columns[:3]).reset_index(drop=True)
                  for compared in (actual, expected):
                      compared["formation_at"] = pd.to_datetime(
                          compared["formation_at"], utc=True
                      )
                      compared["available_at"] = pd.to_datetime(
                          compared["available_at"], utc=True
                      )
                  pd.testing.assert_frame_equal(
                      actual, expected, check_dtype=False, check_like=False
                  )
          for signal, (expected_count, expected_fidelity, expected_formula) in companyfacts_expected.items():
              companyfacts = matrix_by_signal.loc[signal]
              assert bool(companyfacts["data_acquired"])
              assert bool(companyfacts["current_value_calculated"])
              assert companyfacts["current_value_count"] == expected_count
              assert companyfacts["fidelity"] == expected_fidelity
              assert companyfacts["source_used"] == "sec_edgar"
              assert not bool(companyfacts["strict_score_eligible"])
              companyfacts_values = values.loc[values["signal"].eq(signal)]
              assert len(companyfacts_values) == expected_count
              assert companyfacts_values["source_id"].eq("sec_edgar").all()
              assert companyfacts_values["formula_id"].eq(expected_formula).all()
          quarantined = matrix_by_signal.loc["CBOperProf"]
          assert not bool(quarantined["data_acquired"])
          assert not bool(quarantined["current_value_calculated"])
          assert quarantined["status"] == "blocked_fidelity"
          assert "declared_current_unusable" in quarantined["remaining_blocker"]
          hire = matrix_by_signal.loc["hire"]
          assert bool(hire["data_acquired"])
          assert bool(hire["current_value_calculated"])
          assert hire["current_value_count"] == 40
          assert hire["fidelity"] == "reconstructed"
          assert hire["source_used"] == "sec_edgar"
          assert not bool(hire["strict_score_eligible"])
          hire_values = values.loc[values["signal"].eq("hire")]
          assert len(hire_values) == 40
          assert hire_values["source_id"].eq("sec_edgar").all()
          assert hire_values["fidelity_class"].eq("reconstructed").all()
          assert hire_values["formula_id"].eq("openap_employee_growth_sec").all()
          short_interest = matrix_by_signal.loc["ShortInterest"]
          assert bool(short_interest["data_acquired"])
          assert bool(short_interest["current_value_calculated"])
          assert short_interest["current_value_count"] == 2988
          assert short_interest["fidelity"] == "unvalidated_proxy"
          assert short_interest["source_used"] == "finra_equity_short_interest|sec_edgar"
          assert not bool(short_interest["strict_score_eligible"])
          short_interest_values = values.loc[values["signal"].eq("ShortInterest")]
          assert len(short_interest_values) == 2988
          assert short_interest_values["source_id"].eq(
              "finra_equity_short_interest|sec_edgar"
          ).all()
          assert short_interest_values["formula_id"].eq(
              "openap_shortinterest_finra_sec_current_proxy"
          ).all()
          io_short_interest = matrix_by_signal.loc["IO_ShortInterest"]
          assert bool(io_short_interest["data_acquired"])
          assert bool(io_short_interest["current_value_calculated"])
          assert io_short_interest["current_value_count"] == 1
          assert io_short_interest["fidelity"] == "reconstructed"
          assert io_short_interest["source_used"] == "finra_equity_short_interest|openfigi|sec_13f|sec_edgar"
          assert not bool(io_short_interest["strict_score_eligible"])
          io_short_interest_values = values.loc[
              values["signal"].eq("IO_ShortInterest")
          ]
          assert len(io_short_interest_values) == 1
          assert io_short_interest_values["source_id"].eq(
              "finra_equity_short_interest|sec_edgar|sec_13f|openfigi_public"
          ).all()
          assert io_short_interest_values["formula_id"].eq(
              "openap_io_shortinterest_finra_sec13f_current_reconstruction"
          ).all()
          oscore = matrix.set_index("signal").loc["OScore"]
          assert bool(oscore["data_acquired"])
          assert bool(oscore["current_value_calculated"])
          assert oscore["current_value_count"] == 1100
          assert oscore["fidelity"] == "reconstructed"
          assert oscore["source_used"] == "fred|sec_edgar"
          assert not bool(oscore["strict_score_eligible"])
          oscore_values = values.loc[values["signal"].eq("OScore")]
          assert len(oscore_values) == 1100
          assert oscore_values["source_id"].eq("sec_edgar|fred_public_csv").all()
          assert oscore_values["formula_id"].eq(
              "openap_ohlson_oscore_decile_sec_gnpdefl"
          ).all()
          realestate = matrix.set_index("signal").loc["realestate"]
          assert bool(realestate["data_acquired"])
          assert bool(realestate["current_value_calculated"])
          assert realestate["current_value_count"] == 7
          assert realestate["fidelity"] == "reconstructed"
          assert realestate["source_used"] == "sec_edgar"
          assert not bool(realestate["strict_score_eligible"])
          realestate_values = values.loc[values["signal"].eq("realestate")]
