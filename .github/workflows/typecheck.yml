name: typecheck
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Full-project mypy debt is frozen from run 30484372251. The gate rejects any
# new path/code/message fingerprint while allowing old errors to be reduced.
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"
      - name: Run mypy
        run: >-
          python scripts/check_mypy_baseline.py
          --baseline config/mypy_error_baseline.json
          --report mypy_report.txt

      - name: Upload full mypy debt report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-debt-report
          path: mypy_report.txt
          if-no-files-found: error
          retention-days: 30
