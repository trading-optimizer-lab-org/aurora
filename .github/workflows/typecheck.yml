name: typecheck
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# R63. mypy is in the [dev] extra but never ran in CI. Local verification
# is clean across 410 source files; the same command runs here as a
# blocking gate.
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"
      - name: Run mypy
        # No `aurora/` package subdir in this layout (Layout B); mypy
        # walks the configured packages from `pyproject.toml`.
        run: python -m mypy .
