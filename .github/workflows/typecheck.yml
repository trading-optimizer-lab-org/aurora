name: typecheck
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ga]" "mypy==2.3.0" "numpy<2.5"
      - name: Resolve exact base SHA
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$base_sha" =~ ^0{40}$ ]]; then
            echo "Invalid or absent base SHA" >&2
            exit 2
          fi
          if ! git cat-file -e "${base_sha}^{commit}"; then
            echo "Base SHA is not available in the checkout: $base_sha" >&2
            exit 2
          fi
          echo "sha=${base_sha,,}" >> "$GITHUB_OUTPUT"
      - name: Run differential mypy gate
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: >-
          python scripts/check_mypy_baseline.py
          --base-sha "$BASE_SHA"
          --repo-root "$GITHUB_WORKSPACE"
          --base-report mypy_base_report.txt
          --report mypy_head_report.txt

      - name: Require both mypy reports
        if: always()
        shell: bash
        run: |
          if [[ ! -f mypy_base_report.txt ]]; then
            echo "Missing base mypy report" >&2
            exit 2
          fi
          if [[ ! -f mypy_head_report.txt ]]; then
            echo "Missing HEAD mypy report" >&2
            exit 2
          fi

      - name: Upload differential mypy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-differential-reports
          path: |
            mypy_base_report.txt
            mypy_head_report.txt
          if-no-files-found: error
          retention-days: 30
