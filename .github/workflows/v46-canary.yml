name: "v46 canary: every stage on a small grid"

# docs/research/V46_PREREGISTRATION.md with V29_QUICK: stage 1 on the base and the first and last value of each
# dimension, the selection, stage 2 on three combinations (the base, the next, the last) and the final, on the real
# cached data.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v46-canary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v46-canary
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  V29_QUICK: "1"

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e . && python -m pip install scikit-learn
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v43
          key: v43-data-none
          restore-keys: v43-data-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v44
            !outputs/v44/filing/minutes
            !outputs/v44/index_days
            !outputs/v44/tick_days
          key: v44-data-40551641084-none
          restore-keys: v44-data-40551641084-
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v28-report
          path: outputs/v28w/report
          run-id: 39915126980
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v33-choice
          path: outputs/v33w/choice
          run-id: 40192951586
          github-token: ${{ github.token }}
      - run: python scripts/run_v46.py stage1 --shard 0 --shards 1 --procs 4 --choice outputs/v33w/choice --out outputs/v46w/s1
      - run: python scripts/run_v46.py select --runs outputs/v46w/s1 --procs 4 --choice outputs/v33w/choice --out outputs/v46w/sel
      - run: python scripts/run_v46.py stage2 --shard 0 --shards 1 --sel outputs/v46w/sel --procs 4 --choice outputs/v33w/choice --out outputs/v46w/s2
      - run: python scripts/run_v46.py final --s1 outputs/v46w/s1 --s2 outputs/v46w/s2 --sel outputs/v46w/sel --procs 4 --choice outputs/v33w/choice --out outputs/v46w/report
      - if: always()
        run: if [ -f outputs/v46w/report/V46_REPORT.md ]; then cat outputs/v46w/report/V46_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v46-canary
          path: outputs/v46w
          retention-days: 14
