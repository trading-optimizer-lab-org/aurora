name: Catalog controller policy

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  catalog-controller-policy:
    name: catalog-controller-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact policy commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Install the independently locked policy test runtime
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          -r requirements/catalog-controller-test-linux-py311.lock

      - name: Verify policy contracts and workflow structure
        run: |
          python -m pytest -q \
            tests/test_catalog_run_prompt_policy.py \
            tests/test_catalog_run_request.py \
            tests/test_catalog_campaign_definition.py \
            tests/test_catalog_campaign_registry.py \
            tests/test_catalog_authority_ledger.py \
            tests/test_catalog_controller.py \
            tests/test_catalog_controller_cli.py \
            tests/test_catalog_controller_reporting.py \
            tests/test_catalog_github_controls.py \
            tests/test_catalog_controller_qualification.py \
            tests/test_catalog_mirror_delivery.py \
            tests/test_reconcile_catalog_mirror_delivery.py \
            tests/test_prepare_catalog_terminal_request_receipt.py \
            tests/test_github_performance_preflight.py \
            tests/test_github_performance_workflows.py \
            tests/test_catalog_controller_workflows.py
