name: tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
        shard: [0, 1]
        exclude:
          - os: ubuntu-latest
            shard: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"

      - name: Run tests
        env:
          AU_DATA_DIR: ${{ runner.temp }}/aurora_data
        run: >-
          python scripts/run_ci_test_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count ${{ matrix.os == 'windows-latest' && 2 || 1 }}
