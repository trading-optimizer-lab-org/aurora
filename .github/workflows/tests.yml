name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"

      - name: Run tests
        env:
          QF_DATA_DIR: ${{ runner.temp }}/qf_data
          # Property tests run under the reproducible CI profile
          # (max_examples=25, derandomize=True). Registered in
          # tests/conftest.py.
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/ -m "not slow and not integration" \
            --tb=short
