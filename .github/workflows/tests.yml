name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # R29: 3.14 added once GitHub-hosted runners ship a stable image.
        # `allow-prereleases: true` means a missing 3.14 still resolves
        # to the latest available pre-release rather than failing.
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"

      - name: Run tests with coverage gate (R64)
        env:
          QF_DATA_DIR: ${{ runner.temp }}/qf_data
          # Property tests run under the reproducible CI profile
          # (max_examples=25, derandomize=True). Registered in
          # tests/conftest.py.
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/ -m "not slow and not integration" \
            --tb=short \
            --cov=quantforge \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-config=.coveragerc

      # R65: upload coverage XML as a workflow artefact so operators
      # see uncovered lines without re-running locally.
      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
