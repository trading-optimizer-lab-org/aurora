name: tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pull requests run the required Linux / Python 3.12 suite in six parallel
    # shards so the merge gate stays under ten minutes. The full Python x OS
    # matrix still runs on every push to main.
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12", "3.13"]') }}
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
        shard: ${{ github.event_name == 'pull_request' && fromJSON('[0, 1, 2, 3, 4, 5]') || fromJSON('[0, 1]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ga]"

      - name: Run tests
        env:
          AU_DATA_DIR: ${{ runner.temp }}/aurora_data
        run: >-
          python scripts/run_ci_test_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count ${{ github.event_name == 'pull_request' && 6 || 2 }}
