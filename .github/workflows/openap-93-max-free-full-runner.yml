name: OpenAP 93 Maximum Free Full Runner

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision containing the OpenAP 93 implementation
        required: true
        default: 897900212b2b506f8891f08796fe913036c199e1
        type: string
      base_run_id:
        description: Run containing openap-yfinance-sec-current-score-results
        required: true
        default: "30837929185"
        type: string
      formation_date:
        description: Current formation date or today
        required: true
        default: today
        type: string
      public_inputs_run_id:
        description: Optional successful OpenAP source-probe run to reuse without redownloading
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-93-max-free-full-runner
  cancel-in-progress: false

jobs:
  framework_contract:
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: openap-93-full-framework-contract
      retention_days: 1
      forced_job_count: 1

  full_pipeline:
    needs: framework_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused test dependency
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile OpenAP current modules
        run: |
          python -m py_compile research/openap_93/registry.py
          python -m py_compile research/openap_93/http.py
          python -m py_compile research/openap_93/sources.py
          python -m py_compile research/openap_93/external.py
          python -m py_compile research/openap_93/market.py
          python -m py_compile research/openap_93/market_pipeline.py
          python -m py_compile research/openap_93/accounting_pipeline.py
          python -m py_compile research/openap_93/advanced_accounting_pipeline.py
          python -m py_compile research/openap_93/analyst_pipeline.py
          python -m py_compile research/openap_93/short_interest_pipeline.py
          python -m py_compile research/openap_93/event_pipeline.py
          python -m py_compile research/openap_93/institutional_pipeline.py
          python -m py_compile research/openap_93/quarterly_pipeline.py
          python -m py_compile research/openap_93/current_pipeline.py
          python -m py_compile scripts/run_openap_93_max_free.py
          python -m py_compile scripts/verify_openap_93_outputs.py
      - name: Run focused tests
        run: python -m pytest tests/test_openap_93_max_free.py -q --tb=short
      - name: Download audited 185-signal base database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-yfinance-sec-current-score-results
          path: inputs/openap_base
          run-id: ${{ inputs.base_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Reuse audited source-probe evidence
        if: ${{ inputs.public_inputs_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-93-max-free-source-probe
          path: outputs/openap_93_current/source_probe
          run-id: ${{ inputs.public_inputs_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Reuse audited normalized public inputs
        if: ${{ inputs.public_inputs_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-93-public-inputs
          path: outputs/openap_93_current/public_inputs
          run-id: ${{ inputs.public_inputs_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Run complete pipeline from audited cached inputs
        if: ${{ inputs.public_inputs_run_id != '' }}
        run: |
          python scripts/run_openap_93_max_free.py \
            --signals-config config/openap_93/signals_93.yaml \
            run \
            --base-db inputs/openap_base \
            --output-dir outputs/openap_93_current \
            --formation-date "${{ inputs.formation_date }}" \
            --offline
      - name: Run complete pipeline from scratch
        if: ${{ inputs.public_inputs_run_id == '' }}
        run: |
          python scripts/run_openap_93_max_free.py \
            --signals-config config/openap_93/signals_93.yaml \
            run \
            --base-db inputs/openap_base \
            --output-dir outputs/openap_93_current \
            --formation-date "${{ inputs.formation_date }}" \
            --refresh
      - name: Verify mandatory deliverables and contracts
        run: |
          for file in \
            signals_93_current.parquet signals_93_current.csv \
            score_185_current.parquet score_185_current.csv \
            coverage_93.csv source_coverage_matrix.csv source_ablation.csv \
            validation_per_signal.csv selected_sources.json run_manifest.json \
            data_lineage.json failures.json openap_reference_metadata.json \
            institutional_input_audit.csv FINAL_REPORT.md; do
            test -s "outputs/openap_93_current/$file"
          done
          python - <<'PY'
          import json
          import pandas as pd
          root = "outputs/openap_93_current"
          signals = pd.read_parquet(f"{root}/signals_93_current.parquet")
          scores = pd.read_parquet(f"{root}/score_185_current.parquet")
          coverage = pd.read_csv(f"{root}/coverage_93.csv")
          manifest = json.load(open(f"{root}/run_manifest.json", encoding="utf-8"))
          assert signals["signal"].nunique() == 93
          assert len(signals) > 0
          assert coverage["signal"].nunique() == 93 and len(coverage) == 93
          assert coverage["status"].notna().all()
          assert signals["security_id"].notna().all()
          assert len(scores) > 0
          assert scores["security_id"].notna().all()
          assert not scores["security_id"].duplicated().any()
          assert pd.to_datetime(signals["available_at"]).dropna().le(
              pd.Timestamp(manifest["formation_at"])
          ).all()
          required_scores = {
              "score_strict_current", "score_max_current", "score_research_all"
          }
          assert required_scores <= set(scores.columns)
          assert manifest["locked_opened"] is False
          assert manifest["validation_used_for_selection"] is False
          assert manifest["cost_eur"] == 0
          assert manifest["api_keys_required"] is False
          assert manifest["manual_actions_required"] is False
          assert manifest["input_signals"] == 93
          assert sum(manifest["fidelity_counts"].values()) == 93
          reference = json.load(
              open(f"{root}/openap_reference_metadata.json", encoding="utf-8")
          )
          assert reference["reference_only"] is True
          assert reference["current_signal_source"] is False
          assert reference["identifier_columns"] == ["permno", "yyyymm"]
          PY
      - name: Independently reopen and verify the complete artifact
        run: |
          python scripts/verify_openap_93_outputs.py \
            --output-dir outputs/openap_93_current
      - name: Preserve failed output for diagnosis
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-93-max-free-failed-output-${{ github.run_id }}
          path: outputs/openap_93_current/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-93-max-free-full-results
          path: outputs/openap_93_current/
          if-no-files-found: error
          retention-days: 90
