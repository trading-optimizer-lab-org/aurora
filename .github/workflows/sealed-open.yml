name: sealed test, step 2 - open the window once

# docs/research/SEALED_TEST_PROTOCOL.md. Starts when the frozen selection is committed. The unlock below is the
# owner's request of 2026-10-20 ("si" to opening the sealed window).
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - docs/research/data/sealed_frozen.json

permissions:
  contents: read

concurrency:
  group: sealed-open
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      V14_UNLOCK_SEALED: yes-the-owner-asked
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 58 ? 48 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/alpaca
          key: v14-alpaca-none
          restore-keys: v14-alpaca-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/sec
          key: v14-sec-none
          restore-keys: v14-sec-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/crypto
          key: v14-crypto-none
          restore-keys: v14-crypto-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/macro
          key: v14-macro-none
          restore-keys: v14-macro-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/finra
          key: v14-finra-none
          restore-keys: v14-finra-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/ah_cache
          key: v15-ah-none
          restore-keys: v15-ah-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/inputs
          key: v15-inputs-39414563648-1
          fail-on-cache-miss: true
      - name: Rebuild the v14 inputs through 2026-10-16
        run: python scripts/run_v14_prepare.py --data outputs/v14 --out outputs/sealed/v14
      - name: Rebuild the v15 inputs (the v15 availability table is kept unchanged)
        run: |
          python scripts/run_v15_prepare.py --v14-inputs outputs/sealed/v14 --data outputs/v14 --v15 outputs/v15 --out outputs/sealed/v15
          cp outputs/v15/inputs/avail.pkl outputs/sealed/v15/avail.pkl
      - name: Rebuild the v16 inputs
        run: python scripts/run_v16_prepare.py --v14-inputs outputs/sealed/v14 --data outputs/v14 --out outputs/sealed/v16
      - name: Run the frozen finalists
        run: python scripts/run_sealed.py open --frozen docs/research/data/sealed_frozen.json --v14-inputs outputs/sealed/v14 --v15-inputs outputs/sealed/v15 --v16-inputs outputs/sealed/v16 --out outputs/sealed/report
      - if: always()
        run: if [ -f outputs/sealed/report/REPORT.md ]; then cat outputs/sealed/report/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-report
          path: |
            outputs/sealed/report/REPORT.md
            outputs/sealed/report/sealed.json
            outputs/sealed/report/streams.parquet
          retention-days: 90
