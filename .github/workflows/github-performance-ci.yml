name: GitHub Performance CI

on:
  pull_request:
    paths:
      - ".github/actions/aurora-runtime-setup/**"
      - ".github/workflows/_aurora-future-run-v3.yml"
      - ".github/workflows/github-performance-*.yml"
      - "config/github_*"
      - "config/official_actions_lock.json"
      - "config/schemas/**"
      - "config/templates/**"
      - "core/execution_policy.py"
      - "infra/github_performance/**"
      - "scripts/aurora_github_*"
      - "scripts/collect_github_run_timeline.py"
      - "scripts/compare_github_performance_runs.py"
      - "scripts/validate_github_workflow_policy.py"
      - "tests/github_performance_helpers.py"
      - "tests/test_execution_policy.py"
      - "tests/test_github_performance_*.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: GitHub performance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Aurora test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify GitHub performance contracts
        run: >-
          python -m pytest
          tests/test_execution_policy.py
          tests/test_github_performance_*.py
          --confcutdir=tests
          --tb=short -q
