name: "v53c: v53's walk-forward books, size chosen out of sample"

# scripts/gen_v53c_wf.py writes this file (V53C_PREREGISTRATION.md). Inputs are aggregate artifacts only.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v53c.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v53c
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v53-choose
          path: outputs/v53cw/choose
          run-id: 41226223974
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v53b-oos-*
          path: outputs/v53cw/oos
          run-id: 41231859502
          github-token: ${{ github.token }}
      - run: |
          python scripts/run_v53c.py final --choose outputs/v53cw/choose --oos outputs/v53cw/oos --out outputs/v53cw/final
          cat outputs/v53cw/final/V53C_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v53c-report
          path: outputs/v53cw/final
          retention-days: 90
