name: v26 early canary (without the night store)

# run: 2
# The v26 canary run while the night store is still downloading: two configurations of every family and the
# after-report stages on a test summary, with no extended-session bars (V26_NO_NIGHTS). Checks only that the code
# runs on the real inputs; no result of it is used. No market data is published.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v26-canary.yml

permissions:
  contents: read

concurrency:
  group: v26-canary
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  V26_NO_NIGHTS: "1"

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - run: python scripts/run_v26.py real --canary --workers 4 --out outputs/v26w/canary
      - name: After-report stages on a test summary
        env:
          V26_QUICK: "1"
        run: |
          mkdir -p outputs/v26w/fake
          python -c "import json; f={'v19:DS1': 'v19:DS1_RUNUP|0', 'v25:PS': 'v25:PS_PATTERN|1000'}; json.dump({'families': {k: {'picks': {str(y): n for y in range(2018, 2027)}} for k, n in f.items()}, 'members': {str(y): sorted(f) for y in range(2018, 2027)}}, open('outputs/v26w/fake/summary.json', 'w'))"
          python scripts/run_v26.py robust --family 0 --report outputs/v26w/fake --out outputs/v26w/fake/robust
          python scripts/run_v26.py robust --family 1 --report outputs/v26w/fake --out outputs/v26w/fake/robust
          python scripts/run_v26.py book --account 100000 --risk 0.005 --report outputs/v26w/fake --out outputs/v26w/fake/book
          python scripts/run_v26.py final --robust outputs/v26w/fake/robust --book outputs/v26w/fake/book --report outputs/v26w/fake --out outputs/v26w/fake/final
