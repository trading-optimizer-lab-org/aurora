name: Borrow logger ticker

# scripts/borrow_ticker.py: GitHub's cron skips and delays runs, so one run of this workflow sleeps until each
# start time of the borrow logger and dispatches it, then hands over to its own successor before the 6-hour job
# limit. The cron below only restarts the chain if it ever breaks. No secrets; the log shows only start times.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      parent:
        description: "Ticker run that started this one (set by the chain)"
        default: ""
      since:
        description: "Where the parent's window ended (set by the chain)"
        default: ""

permissions:
  actions: write
  contents: read

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT: ${{ inputs.parent }}
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 scripts/borrow_ticker.py
