name: Reusable SP500 DEHB Mega Shard v1

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      matrix_json:
        required: true
        type: string
      runtime_input_run_id:
        required: true
        type: string
      previous_run_id:
        required: false
        default: "0"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  worker:
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(inputs.matrix_json) }}
    uses: ./.github/workflows/_sp500-dehb-mega-worker-v1.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      job_id: ${{ matrix.job_id }}
      job_payload: ${{ toJSON(matrix) }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      previous_shard_run_id: ${{ inputs.previous_run_id }}
