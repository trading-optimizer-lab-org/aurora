name: Crypto carry (pre-registered)

# Train + validation of docs/research/CRYPTO_CARRY_PREREGISTRATION.md.
# Only Binance monthly files before 2024-01 are downloaded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-carry
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download data and evaluate
        run: python scripts/run_crypto_carry.py --output-dir outputs/crypto_carry

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/crypto_carry/REPORT.md ]; then
            cat outputs/crypto_carry/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: crypto-carry
          path: outputs/crypto_carry
          if-no-files-found: warn
          retention-days: 90
