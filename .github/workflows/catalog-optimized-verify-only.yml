name: SP500 Optimized Catalog Verify Only

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      optimized_result_run_id: {required: true, type: string}
      reference_run_id: {required: true, type: string}

permissions: {actions: read, contents: read}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/optimized
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.optimized_result_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reference_run_id }}
      - run: >-
          python -m scripts.verify_sp500_optimized_run
          --optimized "$RUNNER_TEMP/optimized"
          --reference "$RUNNER_TEMP/reference"
          --output outputs/equivalence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: sp500-catalog-qualification-evidence
          path: outputs/equivalence.json
          if-no-files-found: error
          retention-days: 90
