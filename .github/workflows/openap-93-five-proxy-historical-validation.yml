name: OpenAP Five Proxy Historical Validation

on:
  push:
    branches:
      - codex/openap-full-data-quality-fix
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision containing the validator
        required: true
        default: HEAD
        type: string
      base_run_id:
        description: Run containing openap-yfinance-sec-current-score-results
        required: true
        default: "30837929185"
        type: string
      public_inputs_run_id:
        description: Run containing the audited OpenAP public inputs and official reference archive
        required: true
        default: "30995267332"
        type: string
      public_inputs_artifact_name:
        description: Artifact containing the public inputs and official reference archive
        required: true
        default: "openap-93-max-free-full-results"
        type: string
      crosswalk_artifact_run_id:
        description: Optional run containing an authorized PERMNO-to-symbol crosswalk
        required: false
        default: ""
        type: string
      crosswalk_artifact_name:
        description: Artifact name containing the crosswalk CSV or Parquet
        required: false
        default: "permno-crosswalk"
        type: string
      crosswalk_url:
        description: Optional public authorized crosswalk URL; leave empty to fail closed
        required: false
        default: ""
        type: string
      min_pairs:
        description: Minimum paired firms required in a month
        required: true
        default: "30"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-93-five-proxy-historical-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused test dependency
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile validator
        run: |
          python -m py_compile research/openap_93/historical_proxy_validation.py
          python -m py_compile research/openap_93/official_portfolio_similarity.py
          python -m py_compile scripts/run_openap_93_five_proxy_validation.py
          python -m py_compile scripts/run_openap_93_official_portfolio_similarity.py
      - name: Run focused validator tests
        run: |
          python -m pytest tests/test_openap_93_five_proxy_validation.py -q --tb=short
          python -m pytest tests/test_openap_93_official_portfolio_similarity.py -q --tb=short

  historical_validate:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and official OpenAP downloader
        run: python -m pip install --disable-pip-version-check -e . openassetpricing==0.0.2
      - name: Download audited base database artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-yfinance-sec-current-score-results
          path: inputs/openap_base
          run-id: ${{ inputs.base_run_id || '30837929185' }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download audited public inputs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.public_inputs_artifact_name || 'openap-93-max-free-full-results' }}
          path: inputs/public
          run-id: ${{ inputs.public_inputs_run_id || '30995267332' }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download optional crosswalk artifact
        if: ${{ inputs.crosswalk_artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.crosswalk_artifact_name }}
          path: inputs/crosswalk
          run-id: ${{ inputs.crosswalk_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Download optional crosswalk URL
        if: ${{ inputs.crosswalk_url != '' }}
        run: curl --fail --location --retry 3 --output inputs/crosswalk.csv "${{ inputs.crosswalk_url }}"
      - name: Locate audited inputs
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          db=$(find inputs/openap_base -type f -name '*.duckdb' -print -quit)
          ref=$(find inputs/public -type f \( -name 'signed_predictors_dl_wide.zip' -o -name 'signed_predictors_dl_wide.csv' \) -print -quit)
          ff3=$(find inputs/public -type f \( -name 'ff3_daily.parquet' -o -name 'ff3_daily.csv' \) -print -quit || true)
          official=$(find inputs/public -type f \( -name 'PredictorAltPorts_Deciles.zip' -o -name 'deciles_ew.zip' -o -name 'deciles_ew.csv' \) -print -quit || true)
          crosswalk=$(find inputs/crosswalk -type f \( -name '*.csv' -o -name '*.parquet' \) -print -quit 2>/dev/null || true)
          earnings=$(find inputs/earnings -type f \( -name 'eps_history.csv' -o -name 'eps_history.parquet' \) -print -quit 2>/dev/null || true)
          test -n "$db"
          test -n "$ref"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "reference=$ref" >> "$GITHUB_OUTPUT"
          echo "ff3=$ff3" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"
          echo "crosswalk=$crosswalk" >> "$GITHUB_OUTPUT"
          echo "earnings=$earnings" >> "$GITHUB_OUTPUT"
      - name: Download public historical EPS history
        run: |
          mkdir -p inputs/earnings
          curl --fail --location --retry 3 \
            --output inputs/earnings/eps_history.csv \
            https://www.dolthub.com/csv/post-no-preference/earnings/master/eps_history
      - name: Run causal historical validation
        run: |
          args=(--base-db "${{ steps.locate.outputs.db }}" --reference "${{ steps.locate.outputs.reference }}" --output-dir outputs/openap_five_proxy_historical_validation --min-pairs "${{ inputs.min_pairs || '30' }}")
          if [ -n "${{ steps.locate.outputs.ff3 }}" ]; then args+=(--ff3-daily "${{ steps.locate.outputs.ff3 }}"); fi
          if [ -n "${{ steps.locate.outputs.crosswalk }}" ]; then args+=(--crosswalk "${{ steps.locate.outputs.crosswalk }}"); fi
          args+=(--earnings-history inputs/earnings/eps_history.csv)
          python scripts/run_openap_93_five_proxy_validation.py "${args[@]}"
          python scripts/run_openap_93_proxy_pairwise_similarity.py \
            --panel outputs/openap_five_proxy_historical_validation/proxy_reconstruction_panel.parquet \
            --output-dir outputs/openap_five_proxy_historical_validation \
            --min-pairs "${{ inputs.min_pairs || '30' }}"
          python scripts/run_openap_93_official_portfolio_similarity.py \
            --proxy-panel outputs/openap_five_proxy_historical_validation/proxy_reconstruction_panel.parquet \
            --monthly outputs/openap_five_proxy_historical_validation/proxy_validation_monthly.csv \
            --output-dir outputs/openap_five_proxy_historical_validation/official_portfolio_similarity \
            --release 202510,202410,202408 \
            $([[ -n "${{ steps.locate.outputs.official }}" ]] && printf '%s' "--official-deciles ${{ steps.locate.outputs.official }}")
      - name: Verify fail-closed invariants
        run: |
          test -s outputs/openap_five_proxy_historical_validation/proxy_validation_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/openap_five_proxy_historical_validation')
          summary = json.loads((root / 'proxy_validation_summary.json').read_text())
          audit = json.loads((root / 'proxy_validation_audit.json').read_text())
          assert summary['locked_opened'] is False
          assert summary['backtest_enabled'] is False
          assert summary['validation_used_for_selection'] is False
          assert audit['lookahead_checked'] is True
          portfolio_summary = json.loads((root / 'official_portfolio_similarity' / 'official_proxy_portfolio_similarity_summary.json').read_text())
          assert portfolio_summary['locked_opened'] is False
          assert portfolio_summary['backtest_enabled'] is False
          assert portfolio_summary['validation_used_for_selection'] is False
          assert portfolio_summary['official_spread_rows'] > 0
          assert portfolio_summary['proxy_spread_rows'] > 0
          PY
      - name: Upload five-proxy validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-five-proxy-historical-validation-results
          path: outputs/openap_five_proxy_historical_validation/
          if-no-files-found: error
          retention-days: 30
