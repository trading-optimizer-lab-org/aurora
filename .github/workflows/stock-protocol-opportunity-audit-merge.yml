name: Stock Protocol Opportunity Audit Merge

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing the three completed period shards
        required: true
        default: "29767985778"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest scipy statsmodels pyarrow
      - name: Compile and test the merger contract
        run: >-
          python -m py_compile
          research/stock_protocol/opportunity_audit.py
          scripts/merge_stock_protocol_opportunity_audit_shards.py
          scripts/verify_stock_protocol_opportunity_audit.py
      - run: pytest tests/test_stock_protocol_opportunity_audit.py -q
      - uses: actions/download-artifact@v4
        with:
          repository: trading-optimizer-lab-org/aurora
          run-id: ${{ inputs.source_run_id }}
          pattern: stock-protocol-opportunity-audit-shard-*
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit-shards
      - name: Merge the completed immutable period shards
        run: >-
          python scripts/merge_stock_protocol_opportunity_audit_shards.py
          --shards-root audit-shards
          --output-root audit-results
      - name: Verify final contract and reconciliation
        run: python scripts/verify_stock_protocol_opportunity_audit.py audit-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-protocol-all-opportunities-and-realistic-portfolio-audit
          path: audit-results
          if-no-files-found: error
          retention-days: 90
