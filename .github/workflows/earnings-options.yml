name: "Earnings options study (pre-registered, 10 trials)"

# docs/research/EARNINGS_OPTIONS_PREREGISTRATION.md: data (SEC + Alpaca, cache eo-cache-*), then the evaluation.
# Only the report, the summary and the trade returns are uploaded.
# run: 2
on:
  push:
    branches: [research/earnings-options]
    paths:
      - .github/workflows/earnings-options.yml

permissions:
  contents: read
  actions: read

env:
  APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

concurrency:
  group: earnings-options
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/eo_cache
          key: eo-cache-none
          restore-keys: eo-cache-
      - run: python scripts/run_earnings_options.py data --cache outputs/eo_cache --end 2026-10-23
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/eo_cache
          key: eo-cache-${{ github.run_id }}-${{ github.run_attempt }}
  evaluate:
    needs: data
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/eo_cache
          key: eo-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: eo-cache-${{ github.run_id }}-
          fail-on-cache-miss: true
      - run: python scripts/run_earnings_options.py eval --cache outputs/eo_cache --out outputs/earnings_options
      - if: always()
        run: |
          if [ -f outputs/earnings_options/REPORT.md ]; then cat outputs/earnings_options/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: earnings-options
          path: |
            outputs/earnings_options/REPORT.md
            outputs/earnings_options/summary.json
            outputs/earnings_options/trades.csv
          retention-days: 90
