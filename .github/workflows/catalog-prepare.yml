name: AURORA catalog preparation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/..

concurrency:
  group: aurora-catalog-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.target_count }}
    steps:
      - name: Check out the protected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use the controller Python family
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Install only the locked controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock

      - id: targets
        name: Select active catalogs only
        shell: bash
        run: >-
          python scripts/select_catalog_preparation_targets.py
          --repo-root .
          --campaign-key ""
          --github-output "$GITHUB_OUTPUT"

  prepare:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/catalog-prepare-one.yml
    with:
      campaign_key: ${{ matrix.campaign_key }}
