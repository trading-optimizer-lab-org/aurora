name: SP500 Megarun F001-F240 Data Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sp500-search-method-benchmark-short
    paths:
      - .github/workflows/sp500-megarun-preflight-240.yml
      - config/sp500_megarun_free_data_240.json
      - config/sp500_megarun_free_data_120.json
      - config/sp500_megarun_free_sources.json
      - config/sp500_megarun_free_sources_240.json
      - config/sp500_megarun_feature_contract_240.json
      - infra/sp500_megarun/**
      - scripts/build_sp500_megarun_preflight_240.py
      - scripts/inventory_sp500_megarun_train_snapshot.py
      - scripts/run_sp500_megarun_feature_smoke_f001_f020.py
      - scripts/run_sp500_megarun_market_feature_smoke_f021_f031.py
      - tests/test_sp500_megarun_*.py

permissions:
  contents: read

concurrency:
  group: sp500-megarun-preflight-240-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan_spy_windows:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      window_count: ${{ steps.plan.outputs.window_count }}
    steps:
      - name: Freeze bounded 1993-2020 SPY windows
        id: plan
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os

          windows = []
          for split, start, end in (
              ("train", dt.date(1993, 1, 22), dt.date(2010, 12, 31)),
              ("validation", dt.date(2011, 1, 1), dt.date(2020, 12, 31)),
          ):
              cursor = start
              while cursor <= end:
                  bounded_end = min(cursor + dt.timedelta(days=364), end)
                  windows.append(
                      {
                          "window_id": f"{len(windows):03d}",
                          "start": cursor.isoformat(),
                          "end": bounded_end.isoformat(),
                          "split": split,
                      }
                  )
                  cursor = bounded_end + dt.timedelta(days=1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps({'include': windows}, separators=(',', ':'))}\n")
              handle.write(f"window_count={len(windows)}\n")
          PY

  spy_windows:
    needs: plan_spy_windows
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJson(needs.plan_spy_windows.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact audited revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Restore bounded data runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Download one bounded free SPY window
        run: |
          python scripts/download_sp500_stooq_window.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --split "${{ matrix.split }}" \
            --window-id "${{ matrix.window_id }}" \
            --source-mode yahoo-fallback \
            --output-dir "$RUNNER_TEMP/spy-window"
      - name: Upload immutable bounded SPY window
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-preflight-240-spy-${{ github.run_id }}-${{ matrix.window_id }}
          path: ${{ runner.temp }}/spy-window
          if-no-files-found: error
          retention-days: 7

  build_preflight:
    needs: [plan_spy_windows, spy_windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
      GITHUB_ACTIONS: "true"
    steps:
      - name: Check out the exact audited revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Restore bounded data runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install "pytest==9.0.3" "openpyxl==3.1.5" "xlrd==2.0.2" "python-calamine==0.6.1"
          python -m pip install --no-deps -e .
      - name: Verify contract adapters partitioning and locked guard
        run: |
          python -m pytest \
            tests/test_sp500_megarun_preflight_240.py \
            tests/test_sp500_megarun_data_contract.py \
            tests/test_sp500_megarun_source_adapters.py \
            tests/test_sp500_megarun_materializer.py \
            tests/test_sp500_megarun_source_probe.py \
            tests/test_sp500_megarun_feature_contract.py \
            tests/test_sp500_megarun_feature_audit.py \
            tests/test_sp500_megarun_feature_engine_price.py \
            tests/test_sp500_megarun_feature_smoke.py \
            tests/test_sp500_megarun_feature_input_normalizers.py \
            tests/test_sp500_megarun_market_feature_engine.py \
            tests/test_sp500_megarun_market_feature_smoke.py \
            tests/test_sp500_megarun_snapshot_schema_inventory.py \
            -q
      - name: Download every bounded SPY window
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-preflight-240-spy-${{ github.run_id }}-*
          path: ${{ runner.temp }}/spy-windows
      - name: Merge and reject any 2021 observation
        run: |
          python scripts/merge_sp500_stooq_windows.py \
            --input-root "$RUNNER_TEMP/spy-windows" \
            --output-dir "$RUNNER_TEMP/spy-merged" \
            --expected-windows "${{ needs.plan_spy_windows.outputs.window_count }}" \
            --requested-start "1993-01-22" \
            --requested-end "2020-12-31"
      - name: Materialize all free inputs and build the 240-lane gate
        id: build
        continue-on-error: true
        run: |
          python scripts/build_sp500_megarun_preflight_240.py \
            --contract config/sp500_megarun_free_data_240.json \
            --sources config/sp500_megarun_free_sources_240.json \
            --spy-csv "$RUNNER_TEMP/spy-merged/stooq_spy_us_history.csv" \
            --work-dir "$RUNNER_TEMP/preflight-240" \
            --output-dir outputs/sp500_megarun_preflight_240
      - name: Inventory train schemas without mounting validation
        id: schema_inventory
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/inventory_sp500_megarun_train_snapshot.py \
            --train-snapshot outputs/sp500_megarun_preflight_240/train_snapshot_1993_2010 \
            --output outputs/sp500_megarun_preflight_240/train_schema_inventory.json
      - name: Execute and audit F001-F020 on train only
        id: feature_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/run_sp500_megarun_feature_smoke_f001_f020.py \
            --train-snapshot outputs/sp500_megarun_preflight_240/train_snapshot_1993_2010 \
            --output-dir outputs/sp500_megarun_feature_smoke_f001_f020
      - name: Execute and audit F021-F031 on train only
        id: market_feature_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/run_sp500_megarun_market_feature_smoke_f021_f031.py \
            --train-snapshot outputs/sp500_megarun_preflight_240/train_snapshot_1993_2010 \
            --output-dir outputs/sp500_megarun_market_feature_smoke_f021_f031
      - name: Upload first-cycle train snapshot
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-train-1993-2010-F001-F240-${{ github.run_id }}
          path: outputs/sp500_megarun_preflight_240/train_snapshot_1993_2010
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload closed validation snapshot separately
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-VALIDATION-CLOSED-2011-2020-F001-F240-${{ github.run_id }}
          path: outputs/sp500_megarun_preflight_240/validation_snapshot_2011_2020
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload source receipts lane matrix and mount policy
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-preflight-240-evidence-${{ github.run_id }}
          path: |
            outputs/sp500_megarun_preflight_240/*.json
            config/sp500_megarun_free_data_240.json
            config/sp500_megarun_free_sources_240.json
            config/sp500_megarun_feature_contract_240.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload F001-F020 feature smoke evidence
        if: always() && steps.feature_smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-feature-smoke-F001-F020-${{ github.run_id }}
          path: outputs/sp500_megarun_feature_smoke_f001_f020
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload F021-F031 market feature smoke evidence
        if: always() && steps.market_feature_smoke.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-market-feature-smoke-F021-F031-${{ github.run_id }}
          path: outputs/sp500_megarun_market_feature_smoke_f021_f031
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Fail closed unless data schema and executable feature gates pass
        if: always() && (steps.build.outcome != 'success' || steps.schema_inventory.outcome != 'success' || steps.feature_smoke.outcome != 'success' || steps.market_feature_smoke.outcome != 'success')
        run: exit 1
