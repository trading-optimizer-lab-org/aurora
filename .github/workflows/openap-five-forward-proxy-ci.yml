name: OpenAP Five Forward Proxy CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/openap-five-forward-proxy-ci.yml"
      - "research/openap_93/**"
      - "scripts/run_openap_five_forward_proxies.py"
      - "tests/test_openap_93_forward_proxy_*.py"
      - "tests/test_openap_93_five_proxy_validation.py"
      - "tests/test_openap_93_official_portfolio_similarity.py"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run focused contract tests
        run: >-
          python -m pytest
          tests/test_openap_93_forward_proxy_*.py
          tests/test_openap_93_five_proxy_validation.py
          tests/test_openap_93_official_portfolio_similarity.py
          -q --tb=short
