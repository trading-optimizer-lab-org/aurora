name: SP500 Search Method Benchmark Short (catalog entrypoint retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework_contract:
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: retired-sp500-search-entrypoint
      retention_days: 1
      forced_job_count: 1

  retired:
    needs: framework_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          echo "Direct catalog and Atlas launch modes were removed."
          echo "Create one signed catalog request for the protected controller instead."
