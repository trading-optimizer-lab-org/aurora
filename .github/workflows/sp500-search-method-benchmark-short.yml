name: SP500 Search Method Benchmark Short

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  DATA_ARTIFACT: sp500-search-method-benchmark-prepared-${{ github.run_id }}
  UNIT_ARTIFACT_PREFIX: sp500-search-method-unit-${{ github.run_id }}

jobs:
  framework_contract:
    # Declare the common Aurora contract for policy and reusable-workflow
    # compatibility; the manual scientific benchmark keeps its own stages.
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-search-method-benchmark-framework-contract
      retention_days: 1
      execution_mode: optimized
      forced_job_count: 1

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Prepare bounded SPY dataset
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark prepare \
            --output-dir "$RUNNER_TEMP/prepared"
      - name: Upload one immutable prepared dataset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  preflight:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Verify date firewall and immutable space
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "prepared"
          manifest = json.loads((root / "benchmark_dataset_manifest.json").read_text())
          if manifest["loaded_last_date"] > "2010-12-31":
              raise SystemExit("DATA_AFTER_TRAIN_END")
          if manifest["locked_start_unopened"] != "2021-01-01":
              raise SystemExit("LOCKED_BOUNDARY_MISMATCH")
          if manifest["validation_start_unopened"] != "2011-01-01":
              raise SystemExit("VALIDATION_BOUNDARY_MISMATCH")
          table = pd.read_parquet(root / "spy_ledger.parquet")
          dates = pd.to_datetime(table["date"], errors="raise")
          if dates.max() > pd.Timestamp("2010-12-31"):
              raise SystemExit("PARQUET_DATE_BOUNDARY_BREACH")
          print("preflight ok", dates.min().date(), dates.max().date())
          PY
      - name: Build immutable search-space manifest
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark space \
            --output-dir "$RUNNER_TEMP/space"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/space
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Run common warm-start smoke
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark smoke \
            --data-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
          retention-days: 30

  plan:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          SEEDS: "104729 209759 314159 419431 524287 630529 735731"
          METHODS: "M0_RANDOM M1_SCRAMBLED_SOBOL M2_TPE M3_SMAC_RF_SMBO M4_DIFFERENTIAL_EVOLUTION M5_STRONGLY_TYPED_GENETIC_PROGRAMMING M6_GP_TO_TPE_HYBRID"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          seeds = [int(x) for x in os.environ["SEEDS"].split()]
          methods = os.environ["METHODS"].split()
          items = [{"method": m, "seed": s, "unit": f"{m}-{s}"} for m in methods for s in seeds]
          assert len(items) == 49
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"include": items}, separators=(",", ":")) + "\n")
          PY

  benchmark:
    needs: [plan, preflight]
    strategy:
      fail-fast: false
      max-parallel: 49
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Run one deterministic method and seed
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark unit \
            --method "${{ matrix.method }}" \
            --seed "${{ matrix.seed }}" \
            --data-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/unit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.UNIT_ARTIFACT_PREFIX }}-${{ matrix.method }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/unit
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  freeze_check:
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.UNIT_ARTIFACT_PREFIX }}-*
          path: ${{ runner.temp }}/units
      - name: Verify 49 freezes before audit
        run: |
          set -euo pipefail
          count=$(find "$RUNNER_TEMP/units" -name unit_result.json | wc -l)
          test "$count" -eq 49
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = sorted((Path(os.environ["RUNNER_TEMP"]) / "units").rglob("unit_result.json"))
          for path in files:
              payload = json.loads(path.read_text())
              assert len(payload["freeze_candidates"]) <= 5
              assert payload["date_access"]["validation_rows"] == 0
              assert payload["date_access"]["locked_rows"] == 0
          print("freeze check ok", len(files))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/units
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  audit:
    needs: [freeze_check, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/units
      - name: Audit frozen candidates only on 2006-2010
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark audit \
            --data-root "$RUNNER_TEMP/prepared" \
            --freeze-root "$RUNNER_TEMP/units" \
            --output-dir "$RUNNER_TEMP/audit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [benchmark, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.UNIT_ARTIFACT_PREFIX }}-*
          path: ${{ runner.temp }}/units
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
      - name: Aggregate and rank without opening validation
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark aggregate \
            --unit-root "$RUNNER_TEMP/units" \
            --audit-root "$RUNNER_TEMP/audit" \
            --output-dir "$RUNNER_TEMP/final"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-benchmark-results
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

  independent_verify:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-benchmark-results
          path: ${{ runner.temp }}/final
      - name: Verify final boundaries and winner inputs
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.benchmark verify \
            --output-dir "$RUNNER_TEMP/final"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-independent-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/final/verification.json
          if-no-files-found: error
          retention-days: 90

  conclude:
    needs: independent_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-benchmark-results
          path: ${{ runner.temp }}/final
      - name: Write final status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "final"
          summary = json.loads((root / "summary.json").read_text())
          status = summary["status"]
          (root / "RESULT_STATUS.md").write_text(
              f"# {status}\n\nBest method: `{summary['best_method']}`\n\n"
              "Validation rows accessed: `0`\nLocked rows accessed: `0`\n",
              encoding="utf-8",
          )
          print(status, summary["best_method"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-benchmark-final-report
          path: ${{ runner.temp }}/final/RESULT_STATUS.md
          if-no-files-found: error
          retention-days: 90
