name: SP500 Search Method Benchmark Short

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  framework_contract:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-search-short-framework-contract
      retention_days: 1
      forced_job_count: 1

  expanded:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    needs: framework_contract
    uses: ./.github/workflows/sp500-search-method-benchmark-expanded.yml
    permissions:
      actions: read
      contents: read

  selected_validation_once:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    uses: ./.github/workflows/sp500-selected-validation-12-once.yml
    with:
      commit_sha: ${{ github.sha }}
      validation_ack: OPEN_SP500_MEGARUN_VALIDATION_2011_2020_SELECTED_12_ONCE
