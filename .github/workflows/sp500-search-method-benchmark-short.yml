name: SP500 Search Method Benchmark Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: selected_validation_once
        type: choice
        options:
          - selected_validation_once
          - f024_inverse_diagnostic
          - optimized_catalog_qualification
      component_store_run_id:
        description: Compatible component store from a prior optimized run
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  framework_contract:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-search-short-framework-contract
      retention_days: 1
      forced_job_count: 1

  expanded:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    needs: framework_contract
    uses: ./.github/workflows/sp500-search-method-benchmark-expanded.yml
    permissions:
      actions: read
      contents: read

  selected_validation_once:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'selected_validation_once' }}
    uses: ./.github/workflows/sp500-selected-validation-12-once.yml
    with:
      commit_sha: ${{ github.sha }}
      validation_ack: OPEN_SP500_MEGARUN_VALIDATION_2011_2020_SELECTED_12_ONCE

  f024_inverse_diagnostic:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'f024_inverse_diagnostic' }}
    uses: ./.github/workflows/sp500-f024-inverse-diagnostic.yml
    with:
      commit_sha: ${{ github.sha }}
      validation_ack: OPEN_SP500_MEGARUN_VALIDATION_2011_2020_SELECTED_12_ONCE

  optimized_catalog_qualification:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_qualification' }}
    uses: ./.github/workflows/catalog-optimized-run.yml
    with:
      commit_sha: ${{ github.sha }}
      runtime_input_run_id: "31418682679"
      admission_evidence_path: config/sp500_catalog_admission_evidence_qualification_v1.json
      reference_run_id: "31904259109"
      component_store_run_id: ${{ inputs.component_store_run_id }}
