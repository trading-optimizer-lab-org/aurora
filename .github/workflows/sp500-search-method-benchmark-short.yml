name: SP500 Search Method Benchmark Short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: selected_validation_once
        type: choice
        options:
          - selected_validation_once
          - f024_inverse_diagnostic
          - optimized_catalog_qualification
          - optimized_catalog_verify_only
          - optimized_catalog_equivalence_diagnostic
          - optimized_catalog_component_determinism
          - optimized_catalog_reference_oracle
      component_store_run_id:
        description: Compatible component store from a prior optimized run
        required: false
        default: ""
      optimized_result_run_id:
        description: Completed optimized result run to verify without recomputing
        required: false
        default: ""
      component_cost_run_id:
        description: Measured component-cost evidence run
        required: false
        default: "31948898747"
      evaluation_cache_run_ids:
        description: Comma-separated compatible optimized runs or checkpoints
        required: false
        default: ""
      benchmark_workers:
        description: Qualification-only worker candidate; 0 uses promoted policy
        required: false
        default: "0"
      benchmark_processes:
        description: Qualification-only process candidate; 0 uses promoted policy
        required: false
        default: "0"

permissions:
  actions: read
  contents: read

jobs:
  framework_contract:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-search-short-framework-contract
      retention_days: 1
      forced_job_count: 1

  expanded:
    if: ${{ github.ref != 'refs/heads/codex/sp500-search-method-benchmark-short' }}
    needs: framework_contract
    uses: ./.github/workflows/sp500-search-method-benchmark-expanded.yml
    permissions:
      actions: read
      contents: read

  selected_validation_once:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'selected_validation_once' }}
    uses: ./.github/workflows/sp500-selected-validation-12-once.yml
    with:
      commit_sha: ${{ github.sha }}
      validation_ack: OPEN_SP500_MEGARUN_VALIDATION_2011_2020_SELECTED_12_ONCE

  f024_inverse_diagnostic:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'f024_inverse_diagnostic' }}
    uses: ./.github/workflows/sp500-f024-inverse-diagnostic.yml
    with:
      commit_sha: ${{ github.sha }}
      validation_ack: OPEN_SP500_MEGARUN_VALIDATION_2011_2020_SELECTED_12_ONCE

  optimized_catalog_qualification:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_qualification' }}
    uses: ./.github/workflows/catalog-optimized-run.yml
    with:
      commit_sha: ${{ github.sha }}
      runtime_input_run_id: "31418682679"
      admission_evidence_path: config/sp500_catalog_admission_evidence_qualification_v1.json
      reference_run_id: "31948898747"
      component_store_run_id: ${{ inputs.component_store_run_id }}
      component_cost_run_id: ${{ inputs.component_cost_run_id }}
      evaluation_cache_run_ids: ${{ inputs.evaluation_cache_run_ids }}
      benchmark_workers: ${{ fromJSON(inputs.benchmark_workers) }}
      benchmark_processes: ${{ fromJSON(inputs.benchmark_processes) }}

  optimized_catalog_verify_only:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_verify_only' }}
    uses: ./.github/workflows/catalog-optimized-verify-only.yml
    with:
      commit_sha: ${{ github.sha }}
      optimized_result_run_id: ${{ inputs.optimized_result_run_id }}
      reference_run_id: "31948898747"

  optimized_catalog_equivalence_diagnostic:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_equivalence_diagnostic' }}
    uses: ./.github/workflows/catalog-equivalence-diagnostic.yml
    with:
      commit_sha: ${{ github.sha }}

  optimized_catalog_component_determinism:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_component_determinism' }}
    uses: ./.github/workflows/catalog-component-determinism.yml
    with:
      commit_sha: ${{ github.sha }}

  optimized_catalog_reference_oracle:
    if: ${{ github.ref == 'refs/heads/codex/sp500-search-method-benchmark-short' && inputs.mode == 'optimized_catalog_reference_oracle' }}
    uses: ./.github/workflows/catalog-reference-oracle.yml
    with:
      commit_sha: ${{ github.sha }}
      runtime_input_run_id: "31418682679"
