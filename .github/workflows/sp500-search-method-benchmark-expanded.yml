name: SP500 Search Method Benchmark Expanded

on:
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  DATA_ARTIFACT: sp500-search-method-expanded-prepared-${{ github.run_id }}
  UNIT_ARTIFACT_PREFIX: sp500-search-method-expanded-unit-${{ github.run_id }}
  BENCHMARK_SEEDS: "104729 209759 314159 419431 524287 630529 735731 840731 945959 1050977 1155871 1260829 1366063 1471109 1576271 1681301 1786367 1891429 1996499 2101549 2206637"

jobs:
  framework_contract:
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-search-method-benchmark-expanded-framework-contract
      retention_days: 1
      execution_mode: optimized
      forced_job_count: 1

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - name: Prepare bounded SPY dataset
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded prepare \
            --output-dir "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  preflight:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Verify bounded dataset and future-data firewall
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          root = Path(os.environ["RUNNER_TEMP"]) / "prepared"
          manifest = json.loads((root / "benchmark_dataset_manifest.json").read_text())
          assert manifest["loaded_last_date"] == "2010-12-31"
          assert manifest["locked_start_unopened"] == "2021-01-01"
          assert manifest["validation_start_unopened"] == "2011-01-01"
          table = pd.read_parquet(root / "spy_ledger.parquet")
          dates = pd.to_datetime(table["date"], errors="raise")
          assert dates.max() == pd.Timestamp("2010-12-31")
          assert dates.max() < pd.Timestamp("2021-01-01")
          assert manifest["date_parser"] == "strict_explicit_numeric_unit_seconds"
          print("preflight ok", dates.min().date(), dates.max().date())
          PY
      - name: Build expanded immutable search-space manifest
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded space \
            --output-dir "$RUNNER_TEMP/space"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-expanded-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/space
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Run common warm-start smoke
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded smoke \
            --data-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-expanded-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
          retention-days: 30

  plan:
    needs: smoke
    runs-on: ubuntu-24.04
    outputs:
      matrix_batch_1: ${{ steps.matrix.outputs.matrix_batch_1 }}
      matrix_batch_2: ${{ steps.matrix.outputs.matrix_batch_2 }}
    steps:
      - id: matrix
        env:
          SEEDS: ${{ env.BENCHMARK_SEEDS }}
          METHODS: "M00_RANDOM M01_SCRAMBLED_SOBOL M02_TPE M03_SMAC_RF_SMBO M04_DIFFERENTIAL_EVOLUTION M05_GENETIC_PROGRAMMING M06_GP_TPE_HYBRID M07_DEHB_REAL M08_BOHB M09_HYPERBAND M10_ASHA M11_CMA_ES M12_PSO M13_GP_BAYESIAN_OPTIMIZATION M14_TURBO M15_OPTUNA M16_NEVERGRAD M17_NSGA_II M18_LATIN_HYPERCUBE M19_HALTON M20_SUCCESSIVE_HALVING M21_POPULATION_BASED_TRAINING M22_ADVANCED_SURROGATE_ASSISTED"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          seeds = [int(value) for value in os.environ["SEEDS"].split()]
          methods = os.environ["METHODS"].split()
          assert len(seeds) == 21 and len(set(seeds)) == 21
          assert len(methods) == 23 and len(set(methods)) == 23
          batch_1 = [{"method": method, "seed": seed, "unit": f"{method}-{seed}"} for method in methods for seed in seeds[:11]]
          batch_2 = [{"method": method, "seed": seed, "unit": f"{method}-{seed}"} for method in methods for seed in seeds[11:]]
          assert len(batch_1) == 253
          assert len(batch_2) == 230
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix_batch_1=" + json.dumps({"include": batch_1}, separators=(",", ":")) + "\n")
              handle.write("matrix_batch_2=" + json.dumps({"include": batch_2}, separators=(",", ":")) + "\n")
          PY

  benchmark_batch_1:
    needs: [plan, preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_batch_1) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Run one expanded method and seed
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded unit \
            --method "${{ matrix.method }}" \
            --seed "${{ matrix.seed }}" \
            --data-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/unit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.UNIT_ARTIFACT_PREFIX }}-${{ matrix.method }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/unit
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  benchmark_batch_2:
    needs: [benchmark_batch_1, plan, preflight]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_batch_2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - name: Run one expanded method and seed
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded unit \
            --method "${{ matrix.method }}" \
            --seed "${{ matrix.seed }}" \
            --data-root "$RUNNER_TEMP/prepared" \
            --output-dir "$RUNNER_TEMP/unit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.UNIT_ARTIFACT_PREFIX }}-${{ matrix.method }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/unit
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  freeze_check:
    needs: [benchmark_batch_1, benchmark_batch_2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.UNIT_ARTIFACT_PREFIX }}-*
          path: ${{ runner.temp }}/units
      - name: Verify 483 freezes before audit
        run: |
          set -euo pipefail
          count=$(find "$RUNNER_TEMP/units" -name unit_result.json | wc -l)
          test "$count" -eq 483
          python - <<'PY'
          import json, os
          from pathlib import Path
          files = sorted((Path(os.environ["RUNNER_TEMP"]) / "units").rglob("unit_result.json"))
          for path in files:
              payload = json.loads(path.read_text())
              assert len(payload["freeze_candidates"]) == 5
              assert payload["date_access"]["validation_rows"] == 0
              assert payload["date_access"]["locked_rows"] == 0
              assert payload["cost_used"] <= payload["max_cost_units"] + 1e-6
          print("freeze check ok", len(files))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-expanded-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/units
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  audit:
    needs: [freeze_check, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-expanded-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/units
      - name: Audit frozen full-fidelity candidates on 2006-2010 only
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded audit \
            --data-root "$RUNNER_TEMP/prepared" \
            --freeze-root "$RUNNER_TEMP/units" \
            --output-dir "$RUNNER_TEMP/audit"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-expanded-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [benchmark_batch_2, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ env.UNIT_ARTIFACT_PREFIX }}-*
          path: ${{ runner.temp }}/units
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-expanded-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit
      - name: Aggregate without opening validation or locked
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded aggregate \
            --unit-root "$RUNNER_TEMP/units" \
            --audit-root "$RUNNER_TEMP/audit" \
            --output-dir "$RUNNER_TEMP/final"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-benchmark-expanded-results
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

  independent_verify:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/github-performance.lock
      - name: Install locked Aurora runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-benchmark-expanded-results
          path: ${{ runner.temp }}/final
      - name: Verify methods, result counts and future-data boundaries
        run: |
          set -euo pipefail
          python -m aurora.infra.sp500_search_method_benchmark.expanded verify \
            --output-dir "$RUNNER_TEMP/final"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-expanded-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/final/verification.json
          if-no-files-found: error
          retention-days: 90

  conclude:
    needs: independent_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-search-method-benchmark-expanded-results
          path: ${{ runner.temp }}/final
      - name: Write final status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "final"
          summary = json.loads((root / "summary.json").read_text())
          (root / "RESULT_STATUS.md").write_text(
              f"# {summary['status']}\n\n"
              f"Best audit method: `{summary['best_method']}`\n\n"
              f"Best search-efficiency method: `{summary['best_search_efficiency_method']}`\n\n"
              "Validation rows accessed: `0`\nLocked rows accessed: `0`\n",
              encoding="utf-8",
          )
          print(summary["status"], summary["best_method"], summary["best_search_efficiency_method"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-search-method-benchmark-expanded-final-report
          path: ${{ runner.temp }}/final/RESULT_STATUS.md
          if-no-files-found: error
          retention-days: 90
