name: "v54dd: maximum drawdown of the fixed daily books"

# scripts/gen_v54dd_wf.py writes this file. Artifacts hold aggregates only.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v54dd.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v54dd
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v54-run-*
          path: outputs/v54ddw/runs
          merge-multiple: true
          run-id: 41497719624
          github-token: ${{ github.token }}
      - run: |
          python scripts/run_v54dd.py final --runs outputs/v54ddw/runs --out outputs/v54ddw/final
          cat outputs/v54ddw/final/V54DD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v54dd-report
          path: outputs/v54ddw/final
          retention-days: 90
