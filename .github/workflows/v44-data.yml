name: "v44 data: news, EDGAR times, the filing store, SPY/IWM and BTC minutes, the book's ticks"

# scripts/run_v44_data.py (V44_PREREGISTRATION.md section 0). Two jobs in a row (they share Alpaca's rate limit):
# a = EDGAR acceptance times, BTC, SPY/IWM minutes, the book's tick aggregates; b = the filing store and the news.
# Market data stays in the Actions cache; the step summary gets counts only.
# run: 2
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v44-data.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v44-data
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  a:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/sec
          key: v14-sec-none
          restore-keys: v14-sec-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v43
          key: v43-data-none
          restore-keys: v43-data-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v44
          key: v44-a-none
          restore-keys: v44-a-
      - run: python scripts/run_v44_data.py btc
      - run: python scripts/run_v44_data.py edgar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - run: python scripts/run_v44_data.py index
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - run: python scripts/run_v44_data.py ticks --budget-min 200
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v44
          key: v44-a-${{ github.run_id }}-${{ github.run_attempt }}

  b:
    needs: a
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v43
          key: v43-data-none
          restore-keys: v43-data-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v44
          key: v44-a-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v44-a-${{ github.run_id }}-
          fail-on-cache-miss: true
      - name: Restore a partial b of an earlier attempt (resume)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v44
          key: v44-data-${{ github.run_id }}-none
          restore-keys: v44-data-${{ github.run_id }}-
      - run: python scripts/run_v44_data.py filing --budget-min 90
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - run: python scripts/run_v44_data.py news --budget-min 230
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - if: always()
        run: |
          for f in btc.parquet edgar.parquet index.parquet ticks.parquet news.parquet filing/store/cands.parquet; do
            if [ -f "outputs/v44/$f" ]; then echo "- $f: present" >> "$GITHUB_STEP_SUMMARY"; else echo "- $f: MISSING" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v44
            !outputs/v44/filing/minutes
            !outputs/v44/index_days
            !outputs/v44/tick_days
          key: v44-data-${{ github.run_id }}-${{ github.run_attempt }}
