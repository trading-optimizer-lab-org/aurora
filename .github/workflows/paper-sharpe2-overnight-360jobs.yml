name: Paper Sharpe2 Overnight 360 Jobs

on:
  workflow_dispatch:
    inputs:
      max_parallel_requested:
        description: "Global intended standard runner concurrency"
        required: true
        default: "360"
      cboe_time_budget_minutes:
        description: "CBOE/VIX minutes per stage"
        required: true
        default: "70"
      ensemble_configs_per_stage:
        description: "Operable ensemble configs per stage"
        required: true
        default: "6500"
      spy_time_budget_minutes:
        description: "SPY paper-rule minutes per stage"
        required: true
        default: "75"
      compact_artifact:
        description: "Upload compact final tables for short iterative runs"
        required: true
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_sharpe2_overnight_360jobs
  CBOE_DIR: outputs/paper_sharpe2_overnight_360jobs/cboe_vix_sentiment_deep
  ENSEMBLE_DIR: outputs/paper_sharpe2_overnight_360jobs/operable_paper_ensemble_deep
  SPY_DIR: outputs/paper_sharpe2_overnight_360jobs/spy_paper_rules_deep

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      first_half: ${{ steps.matrix.outputs.first_half }}
      second_half: ${{ steps.matrix.outputs.second_half }}
    steps:
      - id: matrix
        name: Build 360 bundle matrix split into 2 x 180
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("first_half=" + json.dumps(list(range(180))))
          print("second_half=" + json.dumps(list(range(180, 360))))
          PY

  data_cboe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Build CBOE/VIX paper data
        run: python scripts/run_paper_cboe_sentiment_sharpe2.py --mode data --output-dir "$CBOE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-cboe-data
          path: ${{ env.CBOE_DIR }}/*

  data_ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Build operable paper ensemble data
        run: python scripts/run_paper_operable_ensemble_sharpe2.py --mode data --output-dir "$ENSEMBLE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-ensemble-data
          path: ${{ env.ENSEMBLE_DIR }}/*

  data_spy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Build SPY paper-rule data
        run: python scripts/run_paper_spy_weekly_sharpe2.py --mode data --output-dir "$SPY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-spy-data
          path: ${{ env.SPY_DIR }}/*

  search_bundle_a:
    runs-on: ubuntu-latest
    needs: [plan, data_cboe, data_ensemble, data_spy]
    timeout-minutes: 560
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.first_half) }}
    steps: &bundle_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: overnight-cboe-data
          path: ${{ env.CBOE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: overnight-ensemble-data
          path: ${{ env.ENSEMBLE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: overnight-spy-data
          path: ${{ env.SPY_DIR }}
      - name: Run bundled paper stages
        run: |
          set -e
          for STAGE in "${{ matrix.stage }}" "$(( ${{ matrix.stage }} + 360 ))"; do
            python scripts/run_paper_cboe_sentiment_sharpe2.py \
              --mode shard \
              --output-dir "$CBOE_DIR" \
              --stage "$STAGE" \
              --total-stages 720 \
              --configs-per-stage 5000000 \
              --time-budget-minutes "${{ inputs.cboe_time_budget_minutes }}" \
              --top-per-stage 160
          done

          for STAGE in "${{ matrix.stage }}" "$(( ${{ matrix.stage }} + 360 ))" "$(( ${{ matrix.stage }} + 720 ))"; do
            python scripts/run_paper_operable_ensemble_sharpe2.py \
              --mode shard \
              --output-dir "$ENSEMBLE_DIR" \
              --stage "$STAGE" \
              --total-stages 1080 \
              --configs-per-stage "${{ inputs.ensemble_configs_per_stage }}"
          done

          for STAGE in "${{ matrix.stage }}" "$(( ${{ matrix.stage }} + 360 ))"; do
            python scripts/run_paper_spy_weekly_sharpe2.py \
              --mode shard \
              --output-dir "$SPY_DIR" \
              --stage "$STAGE" \
              --configs-per-stage 5000000 \
              --time-budget-minutes "${{ inputs.spy_time_budget_minutes }}" \
              --top-per-stage 180
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overnight-bundle-stage-${{ matrix.stage }}
          path: |
            ${{ env.CBOE_DIR }}/shards/stage_*
            ${{ env.ENSEMBLE_DIR }}/shards/stage_*
            ${{ env.SPY_DIR }}/shards/stage_*

  search_bundle_b:
    runs-on: ubuntu-latest
    needs: [plan, data_cboe, data_ensemble, data_spy]
    timeout-minutes: 560
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.second_half) }}
    steps: *bundle_steps

  merge_all:
    runs-on: ubuntu-latest
    needs: [data_cboe, data_ensemble, data_spy, search_bundle_a, search_bundle_b]
    if: always()
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: overnight-cboe-data
          path: ${{ env.CBOE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: overnight-ensemble-data
          path: ${{ env.ENSEMBLE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          name: overnight-spy-data
          path: ${{ env.SPY_DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: overnight-bundle-stage-*
          path: ${{ env.OUTPUT_DIR }}/bundles
          merge-multiple: true
      - name: Move bundled shards into campaign folders
        run: |
          mkdir -p "$CBOE_DIR/shards" "$ENSEMBLE_DIR/shards" "$SPY_DIR/shards"
          if [ -d "$OUTPUT_DIR/bundles/cboe_vix_sentiment_deep/shards" ]; then
            cp -R "$OUTPUT_DIR/bundles/cboe_vix_sentiment_deep/shards/"* "$CBOE_DIR/shards/" || true
          fi
          if [ -d "$OUTPUT_DIR/bundles/operable_paper_ensemble_deep/shards" ]; then
            cp -R "$OUTPUT_DIR/bundles/operable_paper_ensemble_deep/shards/"* "$ENSEMBLE_DIR/shards/" || true
          fi
          if [ -d "$OUTPUT_DIR/bundles/spy_paper_rules_deep/shards" ]; then
            cp -R "$OUTPUT_DIR/bundles/spy_paper_rules_deep/shards/"* "$SPY_DIR/shards/" || true
          fi
          find "$OUTPUT_DIR/bundles" -path "*/cboe_vix_sentiment_deep/shards/stage_*" -type d -exec cp -R {} "$CBOE_DIR/shards/" \; || true
          find "$OUTPUT_DIR/bundles" -path "*/operable_paper_ensemble_deep/shards/stage_*" -type d -exec cp -R {} "$ENSEMBLE_DIR/shards/" \; || true
          find "$OUTPUT_DIR/bundles" -path "*/spy_paper_rules_deep/shards/stage_*" -type d -exec cp -R {} "$SPY_DIR/shards/" \; || true
          echo "CBOE shards: $(find "$CBOE_DIR/shards" -name shard_summary.json | wc -l)"
          echo "Ensemble shards: $(find "$ENSEMBLE_DIR/shards" -name stage_summary.json | wc -l)"
          echo "SPY shards: $(find "$SPY_DIR/shards" -name shard_summary.json | wc -l)"
      - name: Merge campaigns
        run: |
          python scripts/run_paper_cboe_sentiment_sharpe2.py --mode merge --output-dir "$CBOE_DIR" --total-stages 720 --allow-partial
          python scripts/run_paper_operable_ensemble_sharpe2.py --mode merge --output-dir "$ENSEMBLE_DIR" --total-stages 1080 --allow-partial
          python scripts/run_paper_spy_weekly_sharpe2.py --mode merge --output-dir "$SPY_DIR"
          COMPACT_FLAG=""
          if [ "${{ inputs.compact_artifact }}" = "true" ]; then
            COMPACT_FLAG="--compact"
          fi
          python scripts/merge_paper_sharpe2_overnight.py --output-dir "$OUTPUT_DIR" $COMPACT_FLAG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-sharpe2-overnight-360jobs-results
          path: ${{ env.OUTPUT_DIR }}
