name: Initialize catalog fast authority from verified history

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: aurora-catalog-fast-admission-v1
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CATALOG_PROTECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact protected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the controller Python family
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install only the locked controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - id: write_authority
        name: Write current authority edition
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_catalog_fast_authority_bootstrap.py \
            --repo-root . \
              --output "$RUNNER_TEMP/catalog-fast-authority-publication-v1.json" \
              --github-output "$GITHUB_OUTPUT"
      - id: publish_authority
        name: Publish current authority edition
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.write_authority.outputs.authority_artifact_name }}
          path: ${{ runner.temp }}/catalog-fast-authority-publication-v1.json
          if-no-files-found: error
          retention-days: 90
      - id: inspect_publication
        name: Check current authority publication
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/verify_catalog_fast_authority.py --repo-root . --output "$RUNNER_TEMP/catalog-fast-authority-initial.json"
          verification_exit=$?
          echo "verification_exit=$verification_exit" >> "$GITHUB_OUTPUT"
          exit "$verification_exit"
      - id: recover_authority
        name: Recover missing authority publication
        if: ${{ steps.write_authority.outcome == 'success' && steps.inspect_publication.outputs.verification_exit == '4' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.write_authority.outputs.authority_artifact_name }}
          path: ${{ runner.temp }}/catalog-fast-authority-publication-v1.json
          if-no-files-found: error
          retention-days: 90
      - id: verify_authority
        name: Verify initial authority through its production reader
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.inspect_publication.outputs.verification_exit }}" == "0" ]]; then exit 0; fi
          test "${{ steps.inspect_publication.outputs.verification_exit }}" = "4"
          python scripts/verify_catalog_fast_authority.py \
            --repo-root . \
            --output "$RUNNER_TEMP/catalog-fast-authority-initial.json"
