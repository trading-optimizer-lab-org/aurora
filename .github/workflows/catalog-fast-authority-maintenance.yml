name: Initialize catalog fast authority from verified history

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Fixed protected maintenance operation"
        type: choice
        required: true
        default: bootstrap
        options:
          - bootstrap
          - reconcile
          - atlas-terminal-correction-378

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  bootstrap:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: aurora-catalog-fast-admission-v1
      queue: max
      cancel-in-progress: false
    env:
      PYTHONPATH: ${{ github.workspace }}/..
      GH_TOKEN: ${{ github.token }}
      CATALOG_PROTECTED_COMMIT_SHA: ${{ github.sha }}
      CATALOG_AUTHORITY_MAINTENANCE_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Check out the exact protected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the controller Python family
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install only the locked controller dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - name: Download the original Atlas gate
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-fast-gate-378
          run-id: 36032882147
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/atlas-gate
      - name: Download the original Atlas preflight
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          run-id: 36032882147
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/atlas-preflight
      - name: Download the original Atlas final results
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-final-results
          run-id: 36032882147
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/atlas-final
      - name: Download the original blocked terminal
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-terminal-receipt-4fe5767ac61c2b8ac92adce450bd0d726801f033c5e7e3f29f8d40b59d281834
          run-id: 36032882147
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/atlas-old-terminal
      - name: Reverify all original Atlas results
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_atlas_terminal_correction.py \
            --repo-root . \
            --gate "$RUNNER_TEMP/atlas-gate" \
            --preflight "$RUNNER_TEMP/atlas-preflight" \
            --final "$RUNNER_TEMP/atlas-final" \
            --old-terminal "$RUNNER_TEMP/atlas-old-terminal/catalog-terminal-receipt-v1.json" \
            --output "$RUNNER_TEMP/catalog-terminal-receipt-v1.json" \
            --proof-output "$RUNNER_TEMP/atlas-terminal-correction-proof.json"
      - id: upload_corrected_terminal
        name: Publish independently verified Atlas terminal
        if: ${{ env.CATALOG_AUTHORITY_MAINTENANCE_OPERATION == 'atlas-terminal-correction-378' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-terminal-correction-378
          path: ${{ runner.temp }}/catalog-terminal-receipt-v1.json
          if-no-files-found: error
          retention-days: 90
      - id: write_authority
        name: Write current authority edition
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CATALOG_AUTHORITY_MAINTENANCE_OPERATION" == "reconcile" ]]; then
            python scripts/reconcile_catalog_fast_authority.py \
              --repo-root . \
              --output "$RUNNER_TEMP/catalog-fast-authority-publication-v1.json" \
              --github-output "$GITHUB_OUTPUT"
          elif [[ "$CATALOG_AUTHORITY_MAINTENANCE_OPERATION" == "atlas-terminal-correction-378" ]]; then
            python scripts/publish_atlas_terminal_correction.py \
              --repo-root . \
              --receipt "$RUNNER_TEMP/catalog-terminal-receipt-v1.json" \
              --proof "$RUNNER_TEMP/atlas-terminal-correction-proof.json" \
              --artifact-id "${{ steps.upload_corrected_terminal.outputs.artifact-id }}" \
              --artifact-digest "${{ steps.upload_corrected_terminal.outputs.artifact-digest }}" \
              --output "$RUNNER_TEMP/catalog-fast-authority-publication-v1.json" \
              --github-output "$GITHUB_OUTPUT"
          else
            python scripts/publish_catalog_fast_authority_bootstrap.py \
              --repo-root . \
              --output "$RUNNER_TEMP/catalog-fast-authority-publication-v1.json" \
              --github-output "$GITHUB_OUTPUT"
          fi
      - id: publish_authority
        if: ${{ steps.write_authority.outputs.authority_already_applied != 'true' }}
        name: Publish current authority edition
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.write_authority.outputs.authority_artifact_name }}
          path: ${{ runner.temp }}/catalog-fast-authority-publication-v1.json
          if-no-files-found: error
          retention-days: 90
      - id: inspect_publication
        if: ${{ steps.write_authority.outputs.authority_already_applied != 'true' }}
        name: Check current authority publication
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/verify_catalog_fast_authority.py --repo-root . --output "$RUNNER_TEMP/catalog-fast-authority-initial.json"
          verification_exit=$?
          echo "verification_exit=$verification_exit" >> "$GITHUB_OUTPUT"
          exit "$verification_exit"
      - id: recover_authority
        name: Recover missing authority publication
        if: ${{ steps.write_authority.outcome == 'success' && steps.inspect_publication.outputs.verification_exit == '4' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.write_authority.outputs.authority_artifact_name }}
          path: ${{ runner.temp }}/catalog-fast-authority-publication-v1.json
          if-no-files-found: error
          retention-days: 90
      - id: verify_authority
        if: ${{ steps.write_authority.outputs.authority_already_applied != 'true' }}
        name: Verify initial authority through its production reader
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.inspect_publication.outputs.verification_exit }}" == "0" ]]; then exit 0; fi
          test "${{ steps.inspect_publication.outputs.verification_exit }}" = "4"
          python scripts/verify_catalog_fast_authority.py \
            --repo-root . \
            --output "$RUNNER_TEMP/catalog-fast-authority-initial.json"
