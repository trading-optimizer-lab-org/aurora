name: "v33 canary (the v33 stages on a test summary)"

# scripts/run_v33.py in quick mode (V29_QUICK: the small grid) on v28's test summary of five picks, before the real run.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v33-canary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v33-canary
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  V29_QUICK: "1"

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - name: Test summary
        run: |
          mkdir -p outputs/v33w/fake
          cp tests/data/v28_after_canary_summary.json outputs/v33w/fake/summary.json
      - run: python scripts/run_v33.py real --shard 0 --shards 1 --report outputs/v33w/fake --out outputs/v33w/fake/real
      - run: python scripts/run_v33.py select --parts outputs/v33w/fake/real --report outputs/v33w/fake --out outputs/v33w/fake/picks
      - run: python scripts/run_v33.py variants --shard 0 --shards 1 --picks outputs/v33w/fake/picks --report outputs/v33w/fake --out outputs/v33w/fake/var
      - run: python scripts/run_v33.py choose --picks outputs/v33w/fake/picks --parts outputs/v33w/fake/var --report outputs/v33w/fake --out outputs/v33w/fake/choice
      - run: python scripts/run_v33.py arms --shard 0 --shards 1 --choice outputs/v33w/fake/choice --report outputs/v33w/fake --out outputs/v33w/fake/arms
      - run: python scripts/run_v33.py final --picks outputs/v33w/fake/picks --choice outputs/v33w/fake/choice --arms outputs/v33w/fake/arms --report outputs/v33w/fake --out outputs/v33w/fake/report
      - if: always()
        run: if [ -f outputs/v33w/fake/report/V33_REPORT.md ]; then cat outputs/v33w/fake/report/V33_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
