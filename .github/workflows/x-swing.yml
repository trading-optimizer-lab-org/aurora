name: "X traders momentum swing study"

# docs/research/X_SWING_PREREGISTRATION.md: downloads the free_us_daily layout from Yahoo inside the job (nothing
# but the report and strategy returns is uploaded), then runs scripts/run_x_swing.py.
# run: 1
on:
  push:
    branches: [research/x-momentum-swing]
    paths:
      - .github/workflows/x-swing.yml

permissions:
  contents: read

concurrency:
  group: x-swing
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download prices (8 parallel shards)
        run: |
          for k in 0 1 2 3 4 5 6 7; do
            python scripts/fetch_x_swing_prices.py shard --shard $k --shards 8 --out outputs/xs_data &
          done
          wait
          python scripts/fetch_x_swing_prices.py finish --out outputs/xs_data
      - run: python scripts/run_x_swing.py --prices-dir outputs/xs_data --output-dir outputs/x_swing
      - if: always()
        run: if [ -f outputs/x_swing/REPORT.md ]; then cat outputs/x_swing/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: x-swing-report
          path: |
            outputs/x_swing/REPORT.md
            outputs/x_swing/results.json
          retention-days: 90
