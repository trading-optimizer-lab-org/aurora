      - if: always()
        run: if [ -f outputs/v23w/report/REPORT.md ]; then cat outputs/v23w/report/REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v23-report
          path: |
            outputs/v23w/report/REPORT.md
            outputs/v23w/report/summary.json
            outputs/v23w/report/streams.parquet
          retention-days: 90
