name: SP500 Global Component Worker

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      component_shard_index: {required: true, type: number}
      admission_token_sha256: {required: true, type: string}

permissions: {actions: read, contents: read}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_ACTIONS: "true"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "NEHALEM"
      NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements/catalog-optimized.lock"
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-run-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - run: >-
          python scripts/build_sp500_component_store.py
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --data-contract config/sp500_megarun_free_data_240.json
          --feature-contract config/sp500_megarun_feature_contract_240.json
          --catalog-dir config/sp500_megarun_strategy_catalog_v1
          --selected-config config/sp500_megarun_selected_dehb_13.json
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --resolved-contract "$RUNNER_TEMP/plan/resolved_contract.json"
          --run-plan "$RUNNER_TEMP/plan/run_plan.json"
          --component-schedule "$RUNNER_TEMP/plan/component_schedule.json"
          --admission-token "${{ inputs.admission_token_sha256 }}"
          --component-shard-index "${{ inputs.component_shard_index }}"
          --total-component-shards 60
          --output-dir "outputs/component-${{ inputs.component_shard_index }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-component-part-${{ inputs.component_shard_index }}
          path: outputs/component-${{ inputs.component_shard_index }}
          if-no-files-found: error
          retention-days: 7
