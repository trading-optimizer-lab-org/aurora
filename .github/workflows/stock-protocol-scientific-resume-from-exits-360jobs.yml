name: Stock Protocol Scientific Resume From Exits 360 Jobs

"on":
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed full-universe run containing the frozen exit layer
        required: true
        default: "29558183535"

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  QF_DATA_DIR: ${{ github.workspace }}/qf-data
  MANIFEST: config/stock_protocol_36_tests.yaml
  DATA_END: "2020-12-31"
  LOCKED_START: "2021-01-01"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e . pytest
      - name: Validate portfolio recovery and postselection contracts
        run: >-
          pytest -q
          tests/test_stock_protocol_scientific_engine.py
          tests/test_stock_protocol_scientific_pipeline.py
          tests/test_stock_protocol_scientific_postselection.py
          tests/test_stock_protocol_scientific_artifact.py
          tests/test_stock_protocol_scientific_workflow.py
      - name: Confirm immutable research boundary
        shell: bash
        run: |
          test "$DATA_END" = "2020-12-31"
          test "$LOCKED_START" = "2021-01-01"
          echo "locked_opened=false"
          echo "validation_used_for_selection=false"

  recover_source:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Download only the immutable pack and successful frozen layers
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            aurora-full-us-daily-pre2021 \
            stock-protocol-signal-merged \
            stock-protocol-weights-merged \
            stock-protocol-entries-merged \
            stock-protocol-exits-merged
          do
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$name" \
              --dir "recovered/$name"
          done
      - name: Verify frozen source provenance and locked boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("recovered/aurora-full-us-daily-pre2021")
          audit = json.loads((root / "pre2021_pack_audit.json").read_text(encoding="utf-8"))
          pack = json.loads((root / "pack_audit.json").read_text(encoding="utf-8"))
          exits = json.loads(
              Path("recovered/stock-protocol-exits-merged/exits_snapshot.json").read_text(
                  encoding="utf-8"
              )
          )
          if audit["pack_symbols"] != 4828 or audit["pack_rows"] != 20327106:
              raise SystemExit("recovered full-universe counts do not match the frozen pack")
          if audit["locked_opened"] is not False or audit["locked_rows"] != 0:
              raise SystemExit("recovered pack reports locked access")
          if audit["last_date"] != "2020-12-31":
              raise SystemExit("recovered pack crosses the research boundary")
          if pack["dataset_hash"] != exits["dataset_hash"]:
              raise SystemExit("frozen exit layer does not belong to the recovered pack")
          print(f"pack_symbols={audit['pack_symbols']}")
          print(f"pack_rows={audit['pack_rows']}")
          print(f"dataset_hash={pack['dataset_hash']}")
          print("locked_opened=false")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-full-us-daily-pre2021
          path: recovered/aurora-full-us-daily-pre2021
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-signal-merged
          path: recovered/stock-protocol-signal-merged
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-weights-merged
          path: recovered/stock-protocol-weights-merged
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-entries-merged
          path: recovered/stock-protocol-entries-merged
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-exits-merged
          path: recovered/stock-protocol-exits-merged
          retention-days: 30

  portfolio:
    needs: recover_source
    uses: ./.github/workflows/_stock-protocol-scientific-layer.yml
    with:
      layer: portfolio
      pack_artifact_name: aurora-full-us-daily-pre2021
      previous_artifact: stock-protocol-exits-merged
      previous_snapshot_file: exits_snapshot.json

  costs:
    needs: portfolio
    uses: ./.github/workflows/_stock-protocol-scientific-layer.yml
    with:
      layer: costs
      pack_artifact_name: aurora-full-us-daily-pre2021
      previous_artifact: stock-protocol-portfolio-merged
      previous_snapshot_file: portfolio_snapshot.json

  prepare_robustness:
    needs: costs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: aurora-full-us-daily-pre2021, path: pack}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-costs-merged, path: costs}
      - name: Prepare frozen preholdout candidates and 360 real tasks
        run: >-
          python scripts/run_stock_protocol_scientific_postselection.py prepare
          --manifest "$MANIFEST"
          --pack-root pack
          --costs-snapshot costs/costs_snapshot.json
          --output-root postselection
          --task-count 360
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("postselection/robustness_plan.json", encoding="utf-8"))
          assert plan["task_count"] == 360
          print("matrix_a=" + json.dumps(plan["matrix_a"], separators=(",", ":")))
          print("matrix_b=" + json.dumps(plan["matrix_b"], separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-scientific-postselection-inputs
          path: postselection
          retention-days: 30

  robustness_a:
    needs: prepare_robustness
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        task_index: ${{ fromJSON(needs.prepare_robustness.outputs.matrix_a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-postselection-inputs, path: postselection}
      - run: >-
          python scripts/run_stock_protocol_scientific_postselection.py evaluate-task
          --plan postselection/robustness_plan.json
          --returns postselection/development_returns.csv
          --trades postselection/development_trades.csv
          --task-index "${{ matrix.task_index }}"
          --output-root task-output
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-robustness-task-${{ matrix.task_index }}
          path: task-output
          retention-days: 30

  robustness_b:
    needs: prepare_robustness
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        task_index: ${{ fromJSON(needs.prepare_robustness.outputs.matrix_b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-postselection-inputs, path: postselection}
      - run: >-
          python scripts/run_stock_protocol_scientific_postselection.py evaluate-task
          --plan postselection/robustness_plan.json
          --returns postselection/development_returns.csv
          --trades postselection/development_trades.csv
          --task-index "${{ matrix.task_index }}"
          --output-root task-output
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-robustness-task-${{ matrix.task_index }}
          path: task-output
          retention-days: 30

  robustness_merge:
    needs: [prepare_robustness, robustness_a, robustness_b]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-postselection-inputs, path: postselection}
      - uses: actions/download-artifact@v4
        with:
          pattern: stock-protocol-robustness-task-*
          path: robustness-tasks
          merge-multiple: true
      - name: Merge exact 360-task statistical evidence
        run: >-
          python scripts/run_stock_protocol_scientific_postselection.py merge
          --plan postselection/robustness_plan.json
          --tasks-root robustness-tasks
          --output-root robustness-merged
      - name: Freeze evidence before holdout
        run: >-
          python scripts/run_stock_protocol_scientific_postselection.py freeze-robustness
          --manifest "$MANIFEST"
          --walk-forward-snapshot postselection/walk_forward_snapshot.json
          --robustness-results robustness-merged/robustness_results.csv
          --output robustness-merged/robustness_snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-scientific-robustness-merged
          path: robustness-merged
          retention-days: 30

  holdout:
    needs: robustness_merge
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: aurora-full-us-daily-pre2021, path: pack}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-robustness-merged, path: robustness}
      - name: Evaluate frozen set once on final prelocked holdout
        run: >-
          python scripts/run_stock_protocol_scientific_postselection.py holdout
          --manifest "$MANIFEST"
          --pack-root pack
          --robustness-snapshot robustness/robustness_snapshot.json
          --output-root holdout-output
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-scientific-holdout
          path: holdout-output
          retention-days: 30

  assemble:
    needs: holdout
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: aurora-full-us-daily-pre2021, path: source/data}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-signal-merged, path: source/signal}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-weights-merged, path: source/weights}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-entries-merged, path: source/entries}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-exits-merged, path: source/exits}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-portfolio-merged, path: source/portfolio}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-costs-merged, path: source/costs}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-postselection-inputs, path: source/postselection}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-robustness-merged, path: source/robustness}
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-scientific-holdout, path: source/holdout}
      - name: Assemble strict finalizer inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p finalizer-input/daily_equity_curves finalizer-input/trade_ledgers finalizer-input/position_ledgers
          cp source/signal/signal_results.csv finalizer-input/signal_results.csv
          cp source/weights/weights_results.csv finalizer-input/weight_results.csv
          cp source/entries/entries_results.csv finalizer-input/entry_results.csv
          cp source/exits/exits_results.csv finalizer-input/exit_results.csv
          cp source/portfolio/portfolio_results.csv finalizer-input/portfolio_results.csv
          cp source/costs/costs_results.csv finalizer-input/cost_results.csv
          cp source/postselection/walk_forward_results.csv finalizer-input/walk_forward_results.csv
          cp source/robustness/robustness_results.csv finalizer-input/robustness_results.csv
          cp source/robustness/parameter_stability.csv finalizer-input/parameter_stability.csv
          cp source/robustness/statistical_tests.csv finalizer-input/statistical_tests.csv
          cp source/holdout/holdout_2016_2020.csv finalizer-input/holdout_2016_2020.csv
          cp source/postselection/data_audit.json finalizer-input/data_audit.json
          cp source/postselection/daily_equity_curves/* finalizer-input/daily_equity_curves/
          cp source/postselection/trade_ledgers/* finalizer-input/trade_ledgers/
          cp source/postselection/position_ledgers/* finalizer-input/position_ledgers/
          if [ -d source/holdout/daily_equity_curves ]; then cp source/holdout/daily_equity_curves/* finalizer-input/daily_equity_curves/; fi
          if [ -d source/holdout/trade_ledgers ]; then cp source/holdout/trade_ledgers/* finalizer-input/trade_ledgers/; fi
          if [ -d source/holdout/position_ledgers ]; then cp source/holdout/position_ledgers/* finalizer-input/position_ledgers/; fi
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          paths = ["source/postselection/yearly_results.csv", "source/holdout/holdout_yearly_results.csv"]
          frames = [pd.read_csv(path) for path in paths if Path(path).is_file()]
          if not frames:
              raise SystemExit("no yearly results found")
          pd.concat(frames, ignore_index=True).to_csv("finalizer-input/yearly_results.csv", index=False)
          PY
      - name: Build complete non-partial artifact
        run: >-
          python scripts/finalize_stock_protocol_scientific.py
          --input-root finalizer-input
          --output-root final-artifact
          --manifest "$MANIFEST"
      - name: Attach dataset provenance and required audits
        shell: bash
        run: |
          set -euo pipefail
          for name in full_dataset_inventory.csv full_dataset_audit.json two_symbol_root_cause.md pre2021_pack_audit.json pre2021_symbol_coverage.csv data_shard_manifest.json dataset_exclusions.csv
          do
            cp "source/data/$name" "final-artifact/$name"
          done
      - name: Verify complete final contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("final-artifact")
          required = {
              "full_dataset_inventory.csv", "full_dataset_audit.json", "two_symbol_root_cause.md",
              "pre2021_pack_audit.json", "pre2021_symbol_coverage.csv", "data_shard_manifest.json",
              "dataset_exclusions.csv", "implementation_matrix.csv", "signal_layer_results.csv",
              "entry_layer_results.csv", "exit_layer_results.csv", "portfolio_layer_results.csv",
              "cost_scenarios.csv", "walk_forward_results.csv", "robustness_results.csv",
              "holdout_2016_2020.csv", "pareto_frontier.csv", "final_recommendation.md",
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          if missing:
              raise SystemExit(f"missing final outputs: {missing}")
          audit = json.loads((root / "pre2021_pack_audit.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "final_summary.json").read_text(encoding="utf-8"))
          matrix = pd.read_csv(root / "implementation_matrix.csv")
          if audit["pack_symbols"] != 4828 or audit["pack_rows"] != 20327106:
              raise SystemExit("final artifact dataset counts changed")
          if audit["locked_opened"] is not False or audit["locked_rows"] != 0:
              raise SystemExit("locked data detected")
          if summary["partial"] is not False or summary["locked_opened"] is not False:
              raise SystemExit("final scientific summary is partial or unlocked")
          if len(matrix) != 36:
              raise SystemExit(f"implementation matrix must contain 36 tests, got {len(matrix)}")
          evidence = (
              "signal_layer_results.csv", "entry_layer_results.csv", "exit_layer_results.csv",
              "portfolio_layer_results.csv", "cost_scenarios.csv", "walk_forward_results.csv",
              "robustness_results.csv", "holdout_2016_2020.csv", "pareto_frontier.csv",
          )
          for name in evidence:
              frame = pd.read_csv(root / name)
              if frame.empty:
                  raise SystemExit(f"empty final evidence: {name}")
          print("locked_opened=false")
          print("validation_used_for_selection=false")
          print("partial=false")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-scientific-full-universe-360jobs-results
          path: final-artifact
          retention-days: 90
