name: Paper CBOE Sentiment Sharpe2 360 Jobs

on:
  workflow_dispatch:
    inputs:
      configs_per_stage:
        description: "Configs tested per stage"
        required: true
        default: "25000"
      time_budget_minutes:
        description: "Internal stage runtime"
        required: true
        default: "45"
      max_parallel_requested:
        description: "Requested concurrent jobs"
        required: true
        default: "360"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_cboe_sentiment_sharpe2_360jobs

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Build paper CBOE sentiment data
        run: python scripts/run_paper_cboe_sentiment_sharpe2.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}/*

  plan_a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build stages 0-179
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("matrix=" + json.dumps([{"stage": stage} for stage in range(180)]))
          PY

  plan_b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build stages 180-359
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("matrix=" + json.dumps([{"stage": stage} for stage in range(180, 360)]))
          PY

  search_a:
    runs-on: ubuntu-latest
    needs: [data, plan_a]
    timeout-minutes: 105
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan_a.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Run CBOE sentiment stage
        run: |
          python scripts/run_paper_cboe_sentiment_sharpe2.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}"
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*

  search_b:
    runs-on: ubuntu-latest
    needs: [data, plan_b]
    timeout-minutes: 105
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan_b.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Run CBOE sentiment stage
        run: |
          python scripts/run_paper_cboe_sentiment_sharpe2.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}"
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*

  merge:
    runs-on: ubuntu-latest
    needs: [data, search_a, search_b]
    if: always()
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper-cboe-sentiment-sharpe2-stage-*
          path: ${{ env.OUTPUT_DIR }}/shards
          merge-multiple: true
      - name: Merge stages
        run: python scripts/run_paper_cboe_sentiment_sharpe2.py --mode merge --output-dir "$OUTPUT_DIR"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-cboe-sentiment-sharpe2-360jobs-results
          path: ${{ env.OUTPUT_DIR }}
