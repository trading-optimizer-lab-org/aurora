name: security
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 04:00 UTC: catches vendor advisories without a PR.
    - cron: "0 4 * * 1"

# R61. bandit (static security patterns) + pip-audit (CVE check on
# resolved deps). Non-blocking initially so the first run produces a
# baseline rather than blocking every PR.
jobs:
  bandit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit==1.9.4
      - run: >-
          bandit -r .
          -x ./tests,./docs,./build,./experimental
          --severity-level high

  pip-audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --strict --skip-editable .
