name: security
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 04:00 UTC: catches vendor advisories without a PR.
    - cron: "0 4 * * 1"

# R61. bandit (static security patterns) + pip-audit (CVE check on
# resolved deps). Non-blocking initially so the first run produces a
# baseline rather than blocking every PR.
jobs:
  bandit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      - run: bandit -r . -x tests,docs,build,experimental --severity-level high

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit --strict --skip-editable .
