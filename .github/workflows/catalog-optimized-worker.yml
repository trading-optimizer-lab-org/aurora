name: SP500 Exact Recipe Payload Worker

on:
  workflow_call:
    inputs:
      request_sha256: {required: true, type: string}
      authority_id: {required: true, type: string}
      campaign_id: {required: true, type: string}
      science_sha256: {required: true, type: string}
      execution_plan_sha256: {required: true, type: string}
      execution_protocol_sha256: {required: true, type: string}
      protected_commit_sha: {required: true, type: string}
      decision_sha256: {required: true, type: string}
      worker_id: {required: true, type: number}
      descriptor_bundle_artifact: {required: true, type: string}
      descriptor_member: {required: true, type: string}
      descriptor_sha256: {required: true, type: string}
      admission_token_sha256: {required: true, type: string}
      recovery_descriptor_artifact: {required: false, type: string, default: ""}
      recovery_descriptor_member: {required: false, type: string, default: ""}
      recovery_descriptor_sha256: {required: false, type: string, default: ""}

permissions: {actions: read, contents: read}

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 60
    env:
      GITHUB_ACTIONS: "true"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "NEHALEM"
      NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
      PYTHONPATH: ${{ github.workspace }}/..
    steps:
      - name: Check out the protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Verify protected source commit
        env:
          REQUESTED_PROTECTED_COMMIT_SHA: ${{ inputs.protected_commit_sha }}
          TRUSTED_PROTECTED_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$REQUESTED_PROTECTED_COMMIT_SHA" = "$TRUSTED_PROTECTED_COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$TRUSTED_PROTECTED_COMMIT_SHA"

      - name: Download compact worker descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.descriptor_bundle_artifact }}
          path: ${{ runner.temp }}/descriptor-bundle

      - name: Download frozen campaign contract and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download an exact sealed recovery descriptor when selected
        if: ${{ inputs.recovery_descriptor_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.recovery_descriptor_artifact }}
          path: ${{ runner.temp }}/recovery-descriptor

      - name: Verify exact recipe descriptor and frozen plan
        id: descriptor
        shell: bash
        env:
          DESCRIPTOR_MEMBER: ${{ inputs.descriptor_member }}
          EXPECTED_DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
          EXPECTED_WORKER_ID: ${{ inputs.worker_id }}
          EXPECTED_AUTHORITY_ID: ${{ inputs.authority_id }}
          EXPECTED_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          EXPECTED_EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
          RECOVERY_DESCRIPTOR_ARTIFACT: ${{ inputs.recovery_descriptor_artifact }}
          RECOVERY_DESCRIPTOR_MEMBER: ${{ inputs.recovery_descriptor_member }}
          RECOVERY_DESCRIPTOR_SHA256: ${{ inputs.recovery_descriptor_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          root = temp / "descriptor-bundle"
          relative = Path(os.environ["DESCRIPTOR_MEMBER"])
          if relative.is_absolute() or ".." in relative.parts:
              raise SystemExit("RECIPE_DESCRIPTOR_PATH_INVALID")
          source = (root / relative).resolve(strict=True)
          if not source.is_relative_to(root.resolve()):
              raise SystemExit("RECIPE_DESCRIPTOR_PATH_INVALID")
          original_raw = source.read_bytes()
          if hashlib.sha256(original_raw).hexdigest() != os.environ["EXPECTED_DESCRIPTOR_SHA256"]:
              raise SystemExit("RECIPE_DESCRIPTOR_HASH_INVALID")
          original = json.loads(original_raw)
          raw = original_raw
          payload = original
          recovery_artifact = os.environ["RECOVERY_DESCRIPTOR_ARTIFACT"]
          recovery_member = os.environ["RECOVERY_DESCRIPTOR_MEMBER"]
          recovery_sha256 = os.environ["RECOVERY_DESCRIPTOR_SHA256"]
          if bool(recovery_artifact) != bool(recovery_member) or bool(recovery_artifact) != bool(recovery_sha256):
              raise SystemExit("RECOVERY_DESCRIPTOR_ROUTE_INVALID")
          if recovery_artifact:
              recovery_root = temp / "recovery-descriptor"
              recovery_relative = Path(recovery_member)
              if recovery_relative.is_absolute() or ".." in recovery_relative.parts:
                  raise SystemExit("RECOVERY_DESCRIPTOR_PATH_INVALID")
              recovery_source = (recovery_root / recovery_relative).resolve(strict=True)
              if not recovery_source.is_relative_to(recovery_root.resolve()):
                  raise SystemExit("RECOVERY_DESCRIPTOR_PATH_INVALID")
              raw = recovery_source.read_bytes()
              if hashlib.sha256(raw).hexdigest() != recovery_sha256:
                  raise SystemExit("RECOVERY_DESCRIPTOR_HASH_INVALID")
              payload = json.loads(raw)
              immutable_fields = set(original) - {
                  "attempt_id",
                  "prior_checkpoint_chain_artifact",
              }
              if any(payload.get(field) != original.get(field) for field in immutable_fields):
                  raise SystemExit("RECOVERY_DESCRIPTOR_SCIENCE_DRIFT")
              if (
                  set(payload) not in (
                      set(original),
                      set(original) | {"operational_replan"},
                  )
                  or not str(payload.get("attempt_id", "")).startswith(
                      os.environ["EXPECTED_AUTHORITY_ID"] + ":worker:"
                  )
                  or payload.get("attempt_id") == original.get("attempt_id")
              ):
                  raise SystemExit("RECOVERY_DESCRIPTOR_IDENTITY_INVALID")
          required = {
              "worker_id",
              "attempt_id",
              "assignment_artifact",
              "assignment_member",
              "assignment_sha256",
              "data_partition_artifacts",
              "data_partition_manifest_sha256",
              "component_bundle_artifacts",
              "component_bundle_manifest_sha256",
              "prior_checkpoint_chain_artifact",
              "checkpoint_slot_artifacts",
              "checkpoint_slot_manifest_sha256",
              "checkpoint_slot_count",
              "expected_strategy_count",
              "expected_strategy_manifest_sha256",
          }
          if set(payload) != required:
              if set(payload) != required | {"operational_replan"}:
                  raise SystemExit("RECIPE_DESCRIPTOR_SCHEMA_INVALID")
          if payload["worker_id"] != int(os.environ["EXPECTED_WORKER_ID"]):
              raise SystemExit("RECIPE_DESCRIPTOR_WORKER_INVALID")
          if payload["checkpoint_slot_count"] not in (1, 2, 4, 8):
              raise SystemExit("RECIPE_CHECKPOINT_SLOT_COUNT_INVALID")
          for field in ("data_partition_artifacts", "component_bundle_artifacts"):
              values = payload[field]
              if not isinstance(values, list) or not values or values != sorted(set(values)):
                  raise SystemExit("RECIPE_PAYLOAD_ARTIFACT_SET_INVALID")
          slots = payload["checkpoint_slot_artifacts"]
          if (
              not isinstance(slots, list)
              or len(slots) != 8
              or len(set(slots)) != 8
          ):
              raise SystemExit("RECIPE_CHECKPOINT_ARTIFACT_PLAN_INVALID")
          plan = json.loads(
              (temp / "sealed-plan/execution_plan_receipt.json").read_text()
          )
          run_plan = json.loads(
              (temp / "sealed-plan/run_plan.json").read_text()
          )
          if (
              plan["campaign_id"] != os.environ["EXPECTED_CAMPAIGN_ID"]
              or plan["execution_plan_sha256"]
              != os.environ["EXPECTED_EXECUTION_PLAN_SHA256"]
              or plan["validation_opened"] is not False
              or plan["locked_opened"] is not False
          ):
              raise SystemExit("RECIPE_EXECUTION_PLAN_BINDING_INVALID")
          processes_per_worker = int(run_plan["processes_per_worker"])
          block_size = int(run_plan["block_size"])
          operational_replan = payload.get("operational_replan")
          if operational_replan is not None:
              if set(operational_replan) != {
                  "schema_version",
                  "worker_id",
                  "attempt_id",
                  "reason_code",
                  "processes_per_worker",
                  "block_size",
                  "replan_receipt_sha256",
              }:
                  raise SystemExit("RECIPE_OPERATIONAL_REPLAN_INVALID")
              identity = {
                  key: value
                  for key, value in operational_replan.items()
                  if key != "replan_receipt_sha256"
              }
              observed_replan_sha256 = hashlib.sha256(
                  json.dumps(
                      identity,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode()
              ).hexdigest()
              if (
                  operational_replan["schema_version"] != "1"
                  or operational_replan["worker_id"] != payload["worker_id"]
                  or operational_replan["attempt_id"] != payload["attempt_id"]
                  or operational_replan["reason_code"]
                  not in {"OUT_OF_MEMORY", "DISK_EXHAUSTED"}
                  or operational_replan["replan_receipt_sha256"]
                  != observed_replan_sha256
                  or not 1
                  <= int(operational_replan["processes_per_worker"])
                  <= processes_per_worker
                  or not 1 <= int(operational_replan["block_size"]) <= block_size
                  or (
                      int(operational_replan["processes_per_worker"])
                      == processes_per_worker
                      and int(operational_replan["block_size"]) == block_size
                  )
              ):
                  raise SystemExit("RECIPE_OPERATIONAL_REPLAN_INVALID")
              processes_per_worker = int(
                  operational_replan["processes_per_worker"]
              )
              block_size = int(operational_replan["block_size"])
          (root / "recipe-descriptor.json").write_bytes(raw)
          for field, filename in (
              ("data_partition_artifacts", "data-artifacts.txt"),
              ("component_bundle_artifacts", "component-artifacts.txt"),
          ):
              (root / filename).write_text(
                  "".join(f"{item}\n" for item in payload[field]), encoding="utf-8"
              )
          outputs = {
              "attempt_id": payload["attempt_id"],
              "assignment_artifact": payload["assignment_artifact"],
              "assignment_member": payload["assignment_member"],
              "assignment_sha256": payload["assignment_sha256"],
              "prepared_input_identity_sha256": plan[
                  "prepared_input_identity_sha256"
              ],
              "data_partition_manifest_sha256": payload[
                  "data_partition_manifest_sha256"
              ],
              "component_bundle_manifest_sha256": payload[
                  "component_bundle_manifest_sha256"
              ],
              "prior_checkpoint_chain_artifact": payload[
                  "prior_checkpoint_chain_artifact"
              ],
              "resume_completed_slot_count": (
                  int(payload["prior_checkpoint_chain_artifact"].rsplit("-s", 1)[1])
                  if payload["prior_checkpoint_chain_artifact"]
                  else 0
              ),
              "checkpoint_slot_count": payload["checkpoint_slot_count"],
              "expected_strategy_count": payload["expected_strategy_count"],
              "runtime_transport_artifact": plan["runtime_transport_artifact"],
              "runtime_mode": plan["runtime_mode"],
              "runtime_identity_sha256": plan["runtime_identity_sha256"],
              "numeric_profile_sha256": plan["numeric_profile_sha256"],
              "active_recipe_workers": plan["active_recipe_workers"],
              "processes_per_worker": processes_per_worker,
              "block_size": block_size,
              "terminal_attempt_artifact": plan["worker_artifacts"][
                  str(payload["worker_id"])
              ]["terminal_attempt_artifact"],
          }
          for index, name in enumerate(slots, start=1):
              outputs[f"checkpoint_artifact_{index}"] = name
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for key, value in outputs.items():
                  out.write(f"{key}={value}\n")
          PY

      - name: Download the one selected runtime transport
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.descriptor.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Activate sealed offline runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ steps.descriptor.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ steps.descriptor.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ steps.descriptor.outputs.numeric_profile_sha256 }}

      - name: Download only exact assignment, data, components, and prior checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNMENT_ARTIFACT: ${{ steps.descriptor.outputs.assignment_artifact }}
          PRIOR_CHECKPOINT: ${{ steps.descriptor.outputs.prior_checkpoint_chain_artifact }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assignment" "$RUNNER_TEMP/data" "$RUNNER_TEMP/components" "$RUNNER_TEMP/prior"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ASSIGNMENT_ARTIFACT" --dir "$RUNNER_TEMP/assignment"
          while IFS= read -r artifact; do
            test -n "$artifact"
            mkdir -p "$RUNNER_TEMP/data/$artifact"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$RUNNER_TEMP/data/$artifact"
          done < "$RUNNER_TEMP/descriptor-bundle/data-artifacts.txt"
          while IFS= read -r artifact; do
            test -n "$artifact"
            mkdir -p "$RUNNER_TEMP/components/$artifact"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "$RUNNER_TEMP/components/$artifact"
          done < "$RUNNER_TEMP/descriptor-bundle/component-artifacts.txt"
          if [ -n "$PRIOR_CHECKPOINT" ]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$PRIOR_CHECKPOINT" --dir "$RUNNER_TEMP/prior"
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          descriptor = json.loads(
              (temp / "descriptor-bundle/recipe-descriptor.json").read_text()
          )
          assignment_root = temp / "assignment"
          member = Path(descriptor["assignment_member"])
          target = (assignment_root / member).resolve(strict=True)
          if not target.is_relative_to(assignment_root.resolve()):
              raise SystemExit("RECIPE_ASSIGNMENT_PATH_INVALID")
          if hashlib.sha256(target.read_bytes()).hexdigest() != descriptor["assignment_sha256"]:
              raise SystemExit("RECIPE_ASSIGNMENT_HASH_INVALID")
          expected_artifacts = descriptor["component_bundle_artifacts"]
          observed_artifacts = sorted(
              path.name for path in (temp / "components").iterdir() if path.is_dir()
          )
          if observed_artifacts != expected_artifacts:
              raise SystemExit("COMPONENT_PAYLOAD_INCOMPLETE")
          bundle_ids = []
          for artifact in expected_artifacts:
              wrappers = list(
                  (temp / "components" / artifact).rglob(
                      "component_bundle_manifest.json"
                  )
              )
              if len(wrappers) != 1:
                  raise SystemExit("COMPONENT_PAYLOAD_INCOMPLETE")
              wrapper = json.loads(wrappers[0].read_text())
              bundle_ids.append(wrapper["bundle_identity_sha256"])
          component_identity = {
              "schema_version": "1",
              "bundle_ids": bundle_ids,
              "artifacts": expected_artifacts,
          }
          observed_manifest = hashlib.sha256(
              json.dumps(
                  component_identity,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode()
          ).hexdigest()
          if observed_manifest != descriptor["component_bundle_manifest_sha256"]:
              raise SystemExit("COMPONENT_PAYLOAD_MANIFEST_INVALID")
          prior_name = descriptor["prior_checkpoint_chain_artifact"]
          if prior_name:
              try:
                  resume_slot = int(prior_name.rsplit("-s", 1)[1])
              except (IndexError, ValueError):
                  raise SystemExit("RECOVERY_CHECKPOINT_NAME_INVALID") from None
              prior_root = temp / "prior"
              required = {
                  "results.parquet",
                  "receipt.json",
                  "shard_attempt_manifest.json",
                  "checkpoint_chain_manifest.json",
              }
              observed = {
                  path.name for path in prior_root.iterdir() if path.is_file()
              }
              if not required.issubset(observed):
                  raise SystemExit("RECOVERY_CHECKPOINT_CONTENT_MISSING")
              chain = json.loads(
                  (prior_root / "checkpoint_chain_manifest.json").read_text()
              )
              receipt_sha256 = hashlib.sha256(
                  (prior_root / "receipt.json").read_bytes()
              ).hexdigest()
              if (
                  chain.get("worker_id") != descriptor["worker_id"]
                  or chain.get("slot_index") != resume_slot
                  or chain.get("slot_count") != descriptor["checkpoint_slot_count"]
                  or chain.get("current_receipt_sha256") != receipt_sha256
              ):
                  raise SystemExit("RECOVERY_CHECKPOINT_CHAIN_INVALID")
              chain_identity = {
                  key: value for key, value in chain.items() if key != "chain_sha256"
              }
              chain_sha256 = hashlib.sha256(
                  json.dumps(
                      chain_identity,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode()
              ).hexdigest()
              if chain_sha256 != chain.get("chain_sha256"):
                  raise SystemExit("RECOVERY_CHECKPOINT_CHAIN_INVALID")
              destination = temp / f"checkpoint-{resume_slot}"
              shutil.copytree(prior_root, destination)
          PY

      - name: Assemble only the exact train input needed by recipes
        shell: bash
        run: >-
          python -m scripts.assemble_sp500_runtime_fragments
          --fragment-root "$RUNNER_TEMP/data"
          --output-dir "$RUNNER_TEMP/runtime"
          --artifact-list-file "$RUNNER_TEMP/descriptor-bundle/data-artifacts.txt"
          --prepared-input-identity-sha256 "${{ steps.descriptor.outputs.prepared_input_identity_sha256 }}"
          --expected-artifact-manifest-sha256 "${{ steps.descriptor.outputs.data_partition_manifest_sha256 }}"

      - name: Resolve verified registered campaign inputs
        id: campaign_inputs
        shell: bash
        env:
          CATALOG_ADMISSION_TOKEN: ${{ inputs.admission_token_sha256 }}
        run: >-
          python scripts/resolve_catalog_worker_inputs.py
          --repo-root .
          --resolved-contract "$RUNNER_TEMP/assignment/resolved_contract.json"
          --run-plan "$RUNNER_TEMP/assignment/run_plan.json"
          --admission-token "$CATALOG_ADMISSION_TOKEN"
          --github-output "$GITHUB_OUTPUT"

      - name: Compute checkpoint segment 1
        id: compute_1
        env:
          CATALOG_CAMPAIGN_CONTRACT: ${{ steps.campaign_inputs.outputs.campaign_contract_path }}
          CATALOG_DIRECTORY: ${{ steps.campaign_inputs.outputs.catalog_dir }}
          CATALOG_SELECTED_CONFIG: ${{ steps.campaign_inputs.outputs.selected_config_path }}
        if: >-
          ${{ fromJSON(steps.descriptor.outputs.checkpoint_slot_count) >= 1 &&
          fromJSON(steps.descriptor.outputs.resume_completed_slot_count) < 1 }}
        shell: bash
        run: >-
          python -m scripts.run_catalog_recipe_worker_guarded
          --failure-receipt "$RUNNER_TEMP/catalog-worker-failure.json"
          --authority-id "${{ inputs.authority_id }}"
          --campaign-id "${{ inputs.campaign_id }}"
          --execution-plan-sha256 "${{ inputs.execution_plan_sha256 }}"
          --protected-commit-sha "${{ github.sha }}"
          --worker-id "${{ inputs.worker_id }}"
          --attempt-id "${{ steps.descriptor.outputs.attempt_id }}"
          --stage recipe_worker
          --
          --campaign-contract "$CATALOG_CAMPAIGN_CONTRACT"
          --catalog-dir "$CATALOG_DIRECTORY"
          --selected-config "$CATALOG_SELECTED_CONFIG"
          --component-store "$RUNNER_TEMP/components"
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --resolved-contract "$RUNNER_TEMP/assignment/resolved_contract.json"
          --run-plan "$RUNNER_TEMP/assignment/run_plan.json"
          --resume-work-manifest "$RUNNER_TEMP/assignment/resume_work_manifest.json"
          --recipe-dag "$RUNNER_TEMP/assignment/recipe_dag.parquet"
          --recipe-dag-manifest "$RUNNER_TEMP/assignment/recipe_dag_manifest.json"
          --payload-descriptor "$RUNNER_TEMP/descriptor-bundle/recipe-descriptor.json"
          --assignment-file "$RUNNER_TEMP/assignment/${{ steps.descriptor.outputs.assignment_member }}"
          --checkpoint-slot-index 1
          --checkpoint-policy "$RUNNER_TEMP/sealed-plan/checkpoint_policy.json"
          --checkpoint-slot-count "${{ steps.descriptor.outputs.checkpoint_slot_count }}"
          --admission-token "${{ inputs.admission_token_sha256 }}"
          --shard-index "${{ inputs.worker_id }}"
          --total-shards "${{ steps.descriptor.outputs.active_recipe_workers }}"
          --processes-per-worker-override "${{ steps.descriptor.outputs.processes_per_worker }}"
          --block-size-override "${{ steps.descriptor.outputs.block_size }}"
          --output-dir "$RUNNER_TEMP/checkpoint-1"

      - name: Upload checkpoint segment 1
        id: upload_1
        if: >-
          ${{ fromJSON(steps.descriptor.outputs.checkpoint_slot_count) >= 1 &&
          steps.compute_1.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.descriptor.outputs.checkpoint_artifact_1 }}
          path: ${{ runner.temp }}/checkpoint-1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Compute checkpoint segment 2
        id: compute_2
        env:
          CATALOG_CAMPAIGN_CONTRACT: ${{ steps.campaign_inputs.outputs.campaign_contract_path }}
          CATALOG_DIRECTORY: ${{ steps.campaign_inputs.outputs.catalog_dir }}
          CATALOG_SELECTED_CONFIG: ${{ steps.campaign_inputs.outputs.selected_config_path }}
        if: >-
          ${{ fromJSON(steps.descriptor.outputs.checkpoint_slot_count) >= 2 &&
          fromJSON(steps.descriptor.outputs.resume_completed_slot_count) < 2 &&
          ((fromJSON(steps.descriptor.outputs.resume_completed_slot_count) == 1 &&
          steps.descriptor.outputs.prior_checkpoint_chain_artifact != '') ||
          (steps.upload_1.outcome == 'success' &&
          steps.upload_1.outputs['artifact-id'] != '' &&
          steps.upload_1.outputs['artifact-digest'] != '')) }}
        shell: bash
        run: >-
          python -m scripts.run_catalog_recipe_worker_guarded
          --failure-receipt "$RUNNER_TEMP/catalog-worker-failure.json"
          --authority-id "${{ inputs.authority_id }}"
          --campaign-id "${{ inputs.campaign_id }}"
          --execution-plan-sha256 "${{ inputs.execution_plan_sha256 }}"
          --protected-commit-sha "${{ github.sha }}"
          --worker-id "${{ inputs.worker_id }}"
          --attempt-id "${{ steps.descriptor.outputs.attempt_id }}"
          --stage recipe_worker
          --
          --campaign-contract "$CATALOG_CAMPAIGN_CONTRACT"
          --catalog-dir "$CATALOG_DIRECTORY"
          --selected-config "$CATALOG_SELECTED_CONFIG"
          --component-store "$RUNNER_TEMP/components"
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --resolved-contract "$RUNNER_TEMP/assignment/resolved_contract.json"
          --run-plan "$RUNNER_TEMP/assignment/run_plan.json"
          --resume-work-manifest "$RUNNER_TEMP/assignment/resume_work_manifest.json"
          --recipe-dag "$RUNNER_TEMP/assignment/recipe_dag.parquet"
          --recipe-dag-manifest "$RUNNER_TEMP/assignment/recipe_dag_manifest.json"
          --payload-descriptor "$RUNNER_TEMP/descriptor-bundle/recipe-descriptor.json"
          --assignment-file "$RUNNER_TEMP/assignment/${{ steps.descriptor.outputs.assignment_member }}"
          --checkpoint-slot-index 2
          --checkpoint-policy "$RUNNER_TEMP/sealed-plan/checkpoint_policy.json"
          --checkpoint-slot-count "${{ steps.descriptor.outputs.checkpoint_slot_count }}"
