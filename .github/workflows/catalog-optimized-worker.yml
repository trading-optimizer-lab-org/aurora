          attempt_id="$VERIFIED_ATTEMPT_ID"
          if [ -z "$attempt_id" ]; then
            attempt_id="$AUTHORITY_ID:worker:$WORKER_ID:unverified:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          fi
          common=(
            --authority-id "$AUTHORITY_ID"
            --campaign-id "$CAMPAIGN_ID"
            --execution-plan-sha256 "$EXECUTION_PLAN_SHA256"
            --protected-commit-sha "$PROTECTED_COMMIT_SHA"
            --worker-id "$WORKER_ID"
            --attempt-id "$attempt_id"
            --output "$RUNNER_TEMP/catalog-worker-failure-final.json"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -f "$RUNNER_TEMP/catalog-worker-failure.json" ]; then
            python -m scripts.prepare_catalog_worker_failure \
              "${common[@]}" \
              --existing "$RUNNER_TEMP/catalog-worker-failure.json"
            exit 0
          fi
          reason="UNKNOWN_WORKER_FAILURE"
          stage="setup"
          source="WORKER_STEP_FAILED_WITHOUT_CLASSIFIED_RECEIPT"
          for outcome in \
            "$UPLOAD_1" "$UPLOAD_2" "$UPLOAD_3" "$UPLOAD_4" \
            "$UPLOAD_5" "$UPLOAD_6" "$UPLOAD_7" "$UPLOAD_8"; do
            if [ "$outcome" = "failure" ]; then
              reason="ARTIFACT_UPLOAD_FAILED"
              stage="checkpoint_upload"
              source="CHECKPOINT_ARTIFACT_UPLOAD_FAILED"
            fi
          done
          any_compute="false"
          for outcome in \
            "$COMPUTE_1" "$COMPUTE_2" "$COMPUTE_3" "$COMPUTE_4" \
            "$COMPUTE_5" "$COMPUTE_6" "$COMPUTE_7" "$COMPUTE_8"; do
            if [ "$outcome" = "success" ] || [ "$outcome" = "failure" ]; then
              any_compute="true"
            fi
          done
          if [ "$reason" = "UNKNOWN_WORKER_FAILURE" ] && \
             [ "$any_compute" = "true" ]; then
            reason="INTEGRITY_ERROR"
            stage="terminal_manifest"
            source="DURABLE_CHECKPOINT_RECEIPT_INVALID"
          fi
          python -m scripts.prepare_catalog_worker_failure \
            "${common[@]}" \
            --stage "$stage" \
            --reason-code "$reason" \
            --exit-code 1 \
            --exception-type WorkflowStepFailure \
            --source-error-code "$source"

      - name: Publish the sealed failed worker attempt
        if: ${{ always() && steps.failure.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.failure.outputs.failure_artifact }}
          path: ${{ runner.temp }}/catalog-worker-failure-final.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write tiny terminal attempt manifest without result rows
        id: terminal
        if: ${{ always() && steps.durable_chain.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          descriptor = json.loads(
              (temp / "descriptor-bundle/recipe-descriptor.json").read_text()
          )
          completed = []
          prior = descriptor["prior_checkpoint_chain_artifact"]
          resume_slot = int(prior.rsplit("-s", 1)[1]) if prior else 0
          if resume_slot:
              receipt = temp / f"checkpoint-{resume_slot}/receipt.json"
              if not receipt.is_file():
                  raise SystemExit("RECOVERY_CHECKPOINT_RECEIPT_MISSING")
              completed.append(
                  {
                      "slot": resume_slot,
                      "receipt_sha256": hashlib.sha256(receipt.read_bytes()).hexdigest(),
                      "cumulative_prior_chain": True,
                  }
              )
          for index in range(resume_slot + 1, descriptor["checkpoint_slot_count"] + 1):
              root = temp / f"checkpoint-{index}"
              receipt = root / "receipt.json"
              if not receipt.is_file():
                  raise SystemExit("CHECKPOINT_RECEIPT_MISSING")
              completed.append(
                  {
                      "slot": index,
                      "receipt_sha256": hashlib.sha256(receipt.read_bytes()).hexdigest(),
                      "cumulative_prior_chain": False,
                  }
              )
          payload = {
              "schema_version": "1",
              "worker_id": descriptor["worker_id"],
              "attempt_id": descriptor["attempt_id"],
              "completed_checkpoint_slots": completed,
              "expected_strategy_count": descriptor["expected_strategy_count"],
              "terminal_contains_result_rows": False,
              "validation_opened": False,
              "locked_opened": False,
          }
          Path("terminal-attempt-manifest.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload tiny terminal attempt manifest
        if: ${{ steps.terminal.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.descriptor.outputs.terminal_attempt_artifact }}
          path: terminal-attempt-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
