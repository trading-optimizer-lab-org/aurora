name: SP500 Optimized Recipe Worker

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      shard_index: {required: true, type: number}
      admission_token_sha256: {required: true, type: string}

permissions: {actions: read, contents: read}

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_ACTIONS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-run-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-global-component-store
          path: ${{ runner.temp }}/component-store
      - run: >-
          python scripts/run_sp500_optimized_recipe_worker.py
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --catalog-dir config/sp500_megarun_strategy_catalog_v1
          --selected-config config/sp500_megarun_selected_dehb_13.json
          --component-store "$RUNNER_TEMP/component-store"
          --resolved-contract "$RUNNER_TEMP/plan/resolved_contract.json"
          --run-plan "$RUNNER_TEMP/plan/run_plan.json"
          --admission-token "${{ inputs.admission_token_sha256 }}"
          --shard-index "${{ inputs.shard_index }}" --total-shards 360
          --output-dir "outputs/shard-${{ inputs.shard_index }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-shard-${{ inputs.shard_index }}
          path: outputs/shard-${{ inputs.shard_index }}
          if-no-files-found: error
          retention-days: 30
