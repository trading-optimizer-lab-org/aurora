name: SP500 Continuous DEHB Worker Pool v2

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      campaign_id: {required: true, type: string}
      pool_generation: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      bootstrap_run_id: {required: true, type: string}
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: {required: true}
  workflow_dispatch:
    inputs:
      commit_sha: {required: true}
      campaign_id: {required: true}
      pool_generation: {required: true}
      runtime_input_run_id: {required: true}
      bootstrap_run_id: {required: true}

permissions: {actions: read, contents: read}
concurrency:
  group: sp500-continuous-pool-${{ inputs.campaign_id }}-${{ inputs.pool_generation }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
      matrix_c: ${{ steps.matrix.outputs.matrix_c }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Install matrix builder
        run: python -m pip install --no-deps -e .
      - name: Build replacement-aware matrices
        id: matrix
        run: >-
          python scripts/build_sp500_dehb_continuous_pool_matrices.py
          --pool-generation "${{ inputs.pool_generation }}"
          --github-output "$GITHUB_OUTPUT"

  shard_a:
    needs: plan
    strategy: {fail-fast: false, max-parallel: 120, matrix: "${{ fromJSON(needs.plan.outputs.matrix_a) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env: &worker_env
      GITHUB_ACTIONS: "true"
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "NEHALEM"
      NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
    steps: &worker_steps
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Run continuous worker lifetime
        uses: ./.github/actions/sp500-dehb-continuous-worker
        with:
          commit-sha: ${{ inputs.commit_sha }}
          campaign-id: ${{ inputs.campaign_id }}
          pool-generation: ${{ inputs.pool_generation }}
          worker-lifetime-id: ${{ matrix.worker_lifetime_id }}
          runtime-input-run-id: ${{ inputs.runtime_input_run_id }}
          bootstrap-run-id: ${{ inputs.bootstrap_run_id }}
          github-token: ${{ github.token }}

  shard_b:
    needs: plan
    strategy: {fail-fast: false, max-parallel: 120, matrix: "${{ fromJSON(needs.plan.outputs.matrix_b) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env: *worker_env
    steps: *worker_steps

  shard_c:
    needs: plan
    strategy: {fail-fast: false, max-parallel: 120, matrix: "${{ fromJSON(needs.plan.outputs.matrix_c) }}"}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env: *worker_env
    steps: *worker_steps
