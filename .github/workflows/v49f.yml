name: "v49 final: the report from run 41105727077"

# The v49 final job could not download the 5 run artifacts (download failed after 5 retries) and its re-run ended in
# startup_failure. This builds the same report from that run's artifacts; no backtest is repeated.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v49f.yml

permissions:
  contents: read
  actions: read

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v49-run-*
          path: outputs/v49w/runs
          merge-multiple: true
          run-id: 41105727077
          github-token: ${{ github.token }}
      - run: python scripts/run_v49.py final --runs outputs/v49w/runs --out outputs/v49w/report
      - if: always()
        run: if [ -f outputs/v49w/report/V49_REPORT.md ]; then cat outputs/v49w/report/V49_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v49-report
          path: outputs/v49w/report
          retention-days: 90
