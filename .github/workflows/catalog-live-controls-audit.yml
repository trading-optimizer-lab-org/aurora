name: Catalog live controls audit

on:
  workflow_call:
    inputs:
      purpose:
        required: true
        type: string
      caller_workflow:
        required: true
        type: string
      caller_job:
        required: true
        type: string
      protected_commit_sha:
        required: true
        type: string
      audit_context_sha256:
        required: true
        type: string
    outputs:
      receipt_artifact_name:
        description: Secret-free controls receipt artifact name.
        value: ${{ jobs.audit.outputs.receipt_artifact_name }}
      receipt_sha256:
        description: Secret-free controls receipt SHA-256.
        value: ${{ jobs.audit.outputs.receipt_sha256 }}
      receipt_status:
        description: Controls receipt status.
        value: ${{ jobs.audit.outputs.receipt_status }}

jobs:
  audit:
    name: Run protected read-only audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: catalog-production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: catalog-live-controls-audit-v1
      queue: max
      cancel-in-progress: false
    outputs:
      receipt_artifact_name: ${{ steps.receipt_artifact.outputs.name }}
      receipt_sha256: ${{ steps.controls.outputs.receipt_sha256 }}
      receipt_status: ${{ steps.controls.outputs.receipt_status }}
    steps:
      - id: provenance
        name: Validate the real caller and protected provenance
        shell: bash
        env:
          EXPECTED_PURPOSE: ${{ inputs.purpose }}
          EXPECTED_CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          EXPECTED_CALLER_JOB: ${{ inputs.caller_job }}
          EXPECTED_PROTECTED_COMMIT_SHA: ${{ inputs.protected_commit_sha }}
          EXPECTED_AUDIT_CONTEXT_SHA256: ${{ inputs.audit_context_sha256 }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTUAL_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ACTUAL_EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          repository="trading-optimizer-lab-org/aurora"
          controller="trading-optimizer-lab-org/aurora/.github/workflows/catalog-run-controller.yml@refs/heads/main"
          qualification="trading-optimizer-lab-org/aurora/.github/workflows/catalog-live-controls-qualification.yml@refs/heads/main"
          keeper="trading-optimizer-lab-org/aurora/.github/workflows/catalog-artifact-keeper.yml@refs/heads/main"
          watchdog="trading-optimizer-lab-org/aurora/.github/workflows/catalog-run-watchdog.yml@refs/heads/main"
          reconciler="trading-optimizer-lab-org/aurora/.github/workflows/catalog-request-reconciler.yml@refs/heads/main"

          [[ "$ACTUAL_REPOSITORY" == "$repository" ]] || {
            echo "CATALOG_AUDIT_REPOSITORY_INVALID" >&2; exit 1;
          }
          [[ "$EXPECTED_PROTECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "CATALOG_AUDIT_PROTECTED_COMMIT_INVALID" >&2; exit 1;
          }
          [[ "$EXPECTED_AUDIT_CONTEXT_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "CATALOG_AUDIT_CONTEXT_INVALID" >&2; exit 1;
          }
          [[ "$ACTUAL_WORKFLOW_SHA" == "$EXPECTED_PROTECTED_COMMIT_SHA" ]]
          [[ "$ACTUAL_REF" == "refs/heads/main" ]]
          [[ "$ACTUAL_SHA" == "$EXPECTED_PROTECTED_COMMIT_SHA" ]]

          case "$EXPECTED_PURPOSE:$EXPECTED_CALLER_WORKFLOW:$EXPECTED_CALLER_JOB" in
            admission:.github/workflows/catalog-run-controller.yml:live_controls_audit_before_reserve|\
            terminal:.github/workflows/catalog-run-controller.yml:live_controls_audit_before_terminal|\
            admission:.github/workflows/catalog-live-controls-qualification.yml:qualify_live_admission_controls|\
            terminal:.github/workflows/catalog-live-controls-qualification.yml:qualify_live_terminal_controls|\
            maintenance:.github/workflows/catalog-artifact-keeper.yml:live_controls_audit_before_maintenance) ;;
            *) echo "CATALOG_AUDIT_LOGICAL_CALLER_INVALID" >&2; exit 1 ;;
          esac

          case "$EXPECTED_CALLER_WORKFLOW" in
            .github/workflows/catalog-run-controller.yml)
              case "$ACTUAL_WORKFLOW_REF:$ACTUAL_EVENT_NAME" in
                "$controller":issues|"$controller":schedule|\
                "$watchdog":schedule|"$reconciler":schedule) ;;
                *) echo "CATALOG_AUDIT_CALLER_EVENT_INVALID" >&2; exit 1 ;;
              esac
              ;;
            .github/workflows/catalog-live-controls-qualification.yml)
              [[ "$ACTUAL_WORKFLOW_REF:$ACTUAL_EVENT_NAME" == "$qualification:workflow_dispatch" ]] || {
                echo "CATALOG_AUDIT_CALLER_EVENT_INVALID" >&2; exit 1;
              }
              ;;
            .github/workflows/catalog-artifact-keeper.yml)
              case "$ACTUAL_WORKFLOW_REF:$ACTUAL_EVENT_NAME" in
                "$keeper":schedule|"$keeper":workflow_dispatch) ;;
                *) echo "CATALOG_AUDIT_CALLER_EVENT_INVALID" >&2; exit 1 ;;
              esac
              ;;
            *) echo "CATALOG_AUDIT_CALLER_EVENT_INVALID" >&2; exit 1 ;;
          esac

      - name: Check out the exact protected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: trading-optimizer-lab-org/aurora
          ref: ${{ inputs.protected_commit_sha }}
          persist-credentials: false

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Install the locked read-only audit runtime
        shell: bash
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          -r requirements/catalog-controller-linux-py311.lock

      - name: Mint, audit, emit the secret-free receipt, and discard credentials
        id: controls
        shell: bash
        env:
          AURORA_CATALOG_AUDITOR_APP_ID: ${{ vars.AURORA_CATALOG_AUDITOR_APP_ID }}
          AURORA_CATALOG_AUDITOR_PRIVATE_KEY: ${{ secrets.AURORA_CATALOG_AUDITOR_PRIVATE_KEY }}
          AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN: ${{ secrets.AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN }}
          AURORA_CATALOG_ENTERPRISE_CACHE_VERIFIER_TOKEN: ${{ secrets.AURORA_CATALOG_ENTERPRISE_CACHE_VERIFIER_TOKEN }}
          AURORA_CATALOG_PACKAGE_INVENTORY_TOKEN: ${{ secrets.AURORA_CATALOG_PACKAGE_INVENTORY_TOKEN }}
          AUDIT_PURPOSE: ${{ inputs.purpose }}
          AUDIT_CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          AUDIT_CALLER_JOB: ${{ inputs.caller_job }}
          AUDIT_PROTECTED_COMMIT_SHA: ${{ inputs.protected_commit_sha }}
          AUDIT_CONTEXT_SHA256: ${{ inputs.audit_context_sha256 }}
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          set -euo pipefail
          python scripts/audit_catalog_github_controls.py \
            --repository trading-optimizer-lab-org/aurora \
            --desired config/catalog_github_controls_v1.json \
            --auditor config/catalog_github_auditor_v1.json \
            --workflow-auditor \
            --purpose "$AUDIT_PURPOSE" \
            --caller-workflow "$AUDIT_CALLER_WORKFLOW" \
            --caller-job "$AUDIT_CALLER_JOB" \
            --protected-commit-sha "$AUDIT_PROTECTED_COMMIT_SHA" \
            --audit-context-sha256 "$AUDIT_CONTEXT_SHA256" \
            --output catalog_github_controls_receipt_v1.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Freeze the bounded receipt artifact name
        id: receipt_artifact
        shell: bash
        env:
          AUDIT_PURPOSE: ${{ inputs.purpose }}
          AUDIT_CONTEXT_SHA256: ${{ inputs.audit_context_sha256 }}
        run: |
          set -euo pipefail
          printf 'name=catalog-live-controls-%s-%s\n' \
            "$AUDIT_PURPOSE" "$AUDIT_CONTEXT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish the secret-free controls receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.receipt_artifact.outputs.name }}
          path: catalog_github_controls_receipt_v1.json
          if-no-files-found: error
          retention-days: 90
