name: Catalog live controls audit

on:
  workflow_call:
    inputs:
      purpose:
        description: "Closed audit purpose: admission, terminal, or maintenance."
        required: true
        type: string
      caller_workflow:
        description: Fixed protected caller workflow path.
        required: true
        type: string
      caller_job:
        description: Fixed caller job bound by repository topology tests.
        required: true
        type: string
      protected_commit_sha:
        description: Exact protected commit being audited.
        required: true
        type: string
      audit_context_sha256:
        description: SHA-256 of the fixed, non-secret audit context.
        required: true
        type: string
    outputs:
      receipt_artifact_name:
        description: Fixed current-run artifact containing the secret-free receipt.
        value: ${{ jobs.audit.outputs.receipt_artifact_name }}
      receipt_sha256:
        description: Content hash of the secret-free controls receipt.
        value: ${{ jobs.audit.outputs.receipt_sha256 }}
      receipt_status:
        description: Ready or blocked result from the controls receipt.
        value: ${{ jobs.audit.outputs.receipt_status }}

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  audit:
    name: Read-only catalog controls audit
    if: >-
      inputs.protected_commit_sha == github.sha &&
      (
        (inputs.caller_workflow == '.github/workflows/catalog-run-controller.yml' &&
         inputs.caller_job == 'live_controls_audit_before_reserve' &&
         inputs.purpose == 'admission') ||
        (inputs.caller_workflow == '.github/workflows/catalog-run-controller.yml' &&
         inputs.caller_job == 'live_controls_audit_before_terminal' &&
         inputs.purpose == 'terminal') ||
        (inputs.caller_workflow == '.github/workflows/catalog-artifact-keeper.yml' &&
         inputs.caller_job == 'live_controls_audit_before_maintenance' &&
         inputs.purpose == 'maintenance') ||
        (inputs.caller_workflow == '.github/workflows/catalog-live-controls-qualification.yml' &&
         inputs.caller_job == 'qualify_live_admission_controls' &&
         inputs.purpose == 'admission') ||
        (inputs.caller_workflow == '.github/workflows/catalog-live-controls-qualification.yml' &&
         inputs.caller_job == 'qualify_live_terminal_controls' &&
         inputs.purpose == 'terminal')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: catalog-production
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_artifact_name: ${{ steps.receipt_artifact.outputs.name }}
      receipt_sha256: ${{ steps.controls.outputs.receipt_sha256 }}
      receipt_status: ${{ steps.controls.outputs.receipt_status }}
    steps:
      - name: Check out the exact protected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.protected_commit_sha }}
          persist-credentials: false

      - name: Use Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Install the locked read-only audit runtime
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          -r requirements/catalog-controller-linux-py311.lock

      - name: Mint, audit, emit the secret-free receipt, and discard credentials
        id: controls
        env:
          AURORA_CATALOG_AUDITOR_APP_ID: ${{ vars.AURORA_CATALOG_AUDITOR_APP_ID }}
          AURORA_CATALOG_AUDITOR_PRIVATE_KEY: ${{ secrets.AURORA_CATALOG_AUDITOR_PRIVATE_KEY }}
          AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN: ${{ secrets.AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN }}
        run: >-
          python scripts/audit_catalog_github_controls.py
          --repository trading-optimizer-lab-org/aurora
          --desired config/catalog_github_controls_v1.json
          --auditor config/catalog_github_auditor_v1.json
          --workflow-auditor
          --purpose "${{ inputs.purpose }}"
          --caller-workflow "${{ inputs.caller_workflow }}"
          --caller-job "${{ inputs.caller_job }}"
          --protected-commit-sha "${{ inputs.protected_commit_sha }}"
          --audit-context-sha256 "${{ inputs.audit_context_sha256 }}"
          --output catalog_github_controls_receipt_v1.json
          --github-output "$GITHUB_OUTPUT"

      - name: Freeze the bounded receipt artifact name
        id: receipt_artifact
        shell: bash
        run: >-
          echo "name=catalog-live-controls-${{ inputs.purpose }}-${{ inputs.audit_context_sha256 }}"
          >> "$GITHUB_OUTPUT"

      - name: Publish the secret-free controls receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.receipt_artifact.outputs.name }}
          path: catalog_github_controls_receipt_v1.json
          if-no-files-found: error
          retention-days: 90
