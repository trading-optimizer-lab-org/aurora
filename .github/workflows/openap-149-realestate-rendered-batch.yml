name: OpenAP 149 Rendered Realestate Sector Batch

on:
  push:
    branches:
      - codex/openap-proxy44-validation
    paths:
      - .github/workflows/openap-149-realestate-rendered-batch.yml
      - research/openap_181/realestate_rendered_batch.py
      - research/openap_181/sec_rendered_reports.py
      - scripts/run_openap_149_realestate_rendered_batch.py
      - tests/test_openap_149_realestate_rendered_batch.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      sec_artifact_run_id:
        description: Successful run containing the 48 official SEC lake shards
        required: true
        default: "31270341796"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-realestate-rendered-batch
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify rendered realestate sector contracts
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pytest \
            tests/test_openap_149_realestate_rendered_batch.py \
            -q --tb=short

  acquire:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      GITHUB_ACTIONS: "true"
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Download all verified SEC lake shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/sec
          run-id: ${{ inputs.sec_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Acquire rendered realestate sector batch
        run: |
          python scripts/run_openap_149_realestate_rendered_batch.py \
            --sec-root inputs/sec \
            --formation-at 2026-08-09T23:59:59Z \
            --target-sic2 35 \
            --anchor-cik 320193 \
            --minimum-issuers 5 \
            --maximum-issuers 12 \
            --source-run-id "${{ inputs.sec_artifact_run_id }}" \
            --output-dir openap_149_realestate_rendered_batch
      - name: Verify bounded fail-closed output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import pandas as pd

          root = Path("outputs/openap_149_realestate_rendered_batch")
          summary = json.loads(
              (root / "openap_149_realestate_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          manifest = pd.read_csv(
              root / "openap_149_realestate_acquisition_manifest.csv"
          )
          assert summary["source_file_counts"] == {
              "companyfacts": 48,
              "submissions": 48,
              "status": 48,
              "summary": 48,
          }
          assert 5 <= summary["candidates_selected"] <= 12
          assert len(manifest) == summary["candidates_selected"]
          assert summary["strict_score_eligible"] is False
          assert summary["fidelity"] == "reconstructed_not_strict"
          assert summary["locked_opened"] is False
          assert summary["forward_opened"] is False
          assert summary["validation_used_for_selection"] is False
          assert summary["cost_eur"] == 0
          if summary["current_values_computed"]:
              current = pd.read_csv(
                  root / "openap_149_realestate_current.csv"
              )
              assert len(current) == summary["current_values_computed"]
              assert current["current_signal_computed"].all()
              assert not current["strict_score_eligible"].any()
          else:
              assert summary["status"] in {
                  "blocked_coverage",
                  "blocked_source_failure",
              }
          PY
      - name: Upload rendered realestate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-realestate-rendered-current
          path: outputs/openap_149_realestate_rendered_batch/
          if-no-files-found: error
          retention-days: 90
