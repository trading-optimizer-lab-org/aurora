name: Open Asset Pricing Correlation Audit

on:
  workflow_dispatch:
    inputs:
      correlation_threshold:
        description: Absolute correlation threshold
        required: true
        default: "0.80"
      extreme_threshold:
        description: Extreme absolute correlation threshold
        required: true
        default: "0.90"
      min_overlap_months:
        description: Minimum overlapping monthly returns
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl gdown

      - name: Download official Open Asset Pricing files
        run: |
          gdown 10sOryk_ddjkXagaajTKUk1nwJs2ZLRiI -O PredictorLSretWide.csv
          gdown 1nLQWwt1023NLrfhdQiCvIRbFkiW2z3fG -O PredictorSummary.xlsx
          test -s PredictorLSretWide.csv
          test -s PredictorSummary.xlsx

      - name: Analyze all 185 selected predictors
        run: |
          python scripts/analyze_openassetpricing_correlations.py \
            --returns PredictorLSretWide.csv \
            --summary PredictorSummary.xlsx \
            --output-dir outputs/openassetpricing_correlation_audit \
            --correlation-threshold "${{ inputs.correlation_threshold }}" \
            --extreme-threshold "${{ inputs.extreme_threshold }}" \
            --min-overlap "${{ inputs.min_overlap_months }}"

      - name: Validate outputs
        run: |
          test -s outputs/openassetpricing_correlation_audit/correlation_summary.json
          test -s outputs/openassetpricing_correlation_audit/all_pairwise_correlations.csv
          test -s outputs/openassetpricing_correlation_audit/selected_185_predictors.csv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openassetpricing-correlation-audit
          path: outputs/openassetpricing_correlation_audit/
          if-no-files-found: error
          retention-days: 30
