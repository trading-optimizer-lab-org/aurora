name: SPY Daily Direction Funnel Top All Features 4 Waves 1h

on:
  workflow_dispatch:
    inputs:
      configs_per_stage:
        description: "Configs tested per stage"
        required: true
        default: "30000"
      time_budget_minutes:
        description: "Clean internal stage runtime before upload"
        required: true
        default: "8"
      target_accuracy:
        description: "Report-only threshold for accepted.csv; leaderboard is the main output"
        required: true
        default: "1.00"
      job_timeout_minutes:
        description: "Hard timeout per search job"
        required: true
        default: "12"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/spy_daily_direction_funnel_top_all_features_4waves_1h
  SEARCH_PLAN: funnel_top
  WAVES: "4"
  JOBS_PER_WAVE: "355"

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download no-locked daily SPY direction data
        run: python scripts/run_spy_daily_direction_accuracy.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-funnel-top-4waves-data
          path: ${{ env.OUTPUT_DIR }}/data
          if-no-files-found: error

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    steps:
      - name: Build 355-stage balanced matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          full = [{"stage": stage} for stage in range(355)]
          print("matrix_a=" + json.dumps(full[:178]))
          print("matrix_b=" + json.dumps(full[178:]))
          PY

  wave_0_a:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: spy-daily-direction-funnel-top-4waves-data
          path: ${{ env.OUTPUT_DIR }}/data
      - name: Run SPY daily direction stage
        run: |
          STAGE=$(( ${{ matrix.stage }} + WAVE_INDEX * 10000 ))
          python scripts/run_spy_daily_direction_accuracy.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "$STAGE" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --target-accuracy "${{ inputs.target_accuracy }}" \
            --search-plan "$SEARCH_PLAN"
      - name: Upload stage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-funnel-top-wave-${{ env.WAVE_INDEX }}-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*
          if-no-files-found: warn
    env:
      WAVE_INDEX: "0"

  wave_0_b:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "0"

  wave_1_a:
    runs-on: ubuntu-latest
    needs: [wave_0_a, wave_0_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "1"

  wave_1_b:
    runs-on: ubuntu-latest
    needs: [wave_0_a, wave_0_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "1"

  wave_2_a:
    runs-on: ubuntu-latest
    needs: [wave_1_a, wave_1_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "2"

  wave_2_b:
    runs-on: ubuntu-latest
    needs: [wave_1_a, wave_1_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "2"

  wave_3_a:
    runs-on: ubuntu-latest
    needs: [wave_2_a, wave_2_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "3"

  wave_3_b:
    runs-on: ubuntu-latest
    needs: [wave_2_a, wave_2_b, plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps
    env:
      WAVE_INDEX: "3"

  merge:
    runs-on: ubuntu-latest
    needs: [data, wave_3_a, wave_3_b]
    if: always()
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora and ML deps
        run: python -m pip install -e . scikit-learn
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: spy-daily-direction-funnel-top-4waves-data
          path: ${{ env.OUTPUT_DIR }}/data
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: spy-daily-direction-funnel-top-wave-*-stage-*
          path: ${{ env.OUTPUT_DIR }}/shards
      - name: Merge stages
        run: |
          python scripts/run_spy_daily_direction_accuracy.py \
            --mode merge \
            --output-dir "$OUTPUT_DIR" \
            --target-accuracy "${{ inputs.target_accuracy }}" \
            --waves "$WAVES" \
            --jobs-per-wave "$JOBS_PER_WAVE" \
            --ranking-only \
            --search-plan-summary "$SEARCH_PLAN"
      - name: Validate non-empty no-locked final output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ env.OUTPUT_DIR }}")
          summary = json.loads((root / "spy_daily_direction_summary.json").read_text(encoding="utf-8"))
          if int(summary.get("leaderboard_rows", 0)) <= 0:
              raise SystemExit("empty leaderboard; refusing fake-success artifact")
          if bool(summary.get("locked_opened")) or int(summary.get("locked_rows_accessed", 0)) != 0:
              raise SystemExit("locked data was opened")
          if bool(summary.get("validation_used_for_selection")):
              raise SystemExit("validation was used for selection")
          feature_audit = root / "data" / "feature_audit.json"
          if not feature_audit.exists():
              raise SystemExit("missing feature_audit.json")
          print(json.dumps({
              "leaderboard_rows": summary["leaderboard_rows"],
              "stages_completed": summary["stages_completed"],
              "stages_expected": summary["stages_expected"],
              "partial": summary["partial"],
              "locked_opened": summary["locked_opened"],
          }, indent=2))
          PY
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: spy-daily-direction-funnel-top-all-features-4waves-1h-results
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
