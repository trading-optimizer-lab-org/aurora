        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-181-completion-audit-results
          path: outputs/openap_181_completion/
          if-no-files-found: error
          retention-days: 90
