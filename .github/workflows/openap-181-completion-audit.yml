name: OpenAP 181 Completion Audit

on:
  push:
    branches:
      - codex/openap-proxy44-validation
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to audit
        required: true
        type: string
      current_score_run_id:
        description: Optional successful current-score run providing coverage_185 evidence
        required: false
        default: ""
        type: string
      sec_accounting_evidence_run_id:
        description: Optional successful SEC accounting run providing blocker evidence
        required: false
        default: ""
        type: string
      sec_transport_evidence_run_id:
        description: Optional all-runner official SEC transport probe providing blocker evidence
        required: false
        default: ""
        type: string
      patent_evidence_run_id:
        description: Optional pinned patent source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      short_interest_evidence_run_id:
        description: Optional official FINRA source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-181-completion-audit
  cancel-in-progress: false

jobs:
  patent_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.patent_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-patent-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  short_interest_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.short_interest_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-short-interest-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  audit:
    needs: [patent_probe, short_interest_probe]
    if: ${{ always() && (needs.patent_probe.result == 'success' || needs.patent_probe.result == 'skipped') && (needs.short_interest_probe.result == 'success' || needs.short_interest_probe.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: "true"
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CURRENT_SCORE_EVIDENCE_RUN_ID: ${{ inputs.current_score_run_id || (github.event_name == 'push' && '31270341796') || '' }}
      SEC_ACCOUNTING_EVIDENCE_RUN_ID: ${{ inputs.sec_accounting_evidence_run_id || (github.event_name == 'push' && '31307096969') || '' }}
      SEC_TRANSPORT_EVIDENCE_RUN_ID: ${{ inputs.sec_transport_evidence_run_id || '' }}
      PATENT_EVIDENCE_RUN_ID: ${{ inputs.patent_evidence_run_id || '' }}
      SHORT_INTEREST_EVIDENCE_RUN_ID: ${{ inputs.short_interest_evidence_run_id || '' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile and test completion contract
        run: |
          python -m py_compile research/openap_181/completion.py research/openap_181/official_formulas.py research/openap_181/source_research.py research/openap_181/implementation_status.py research/openap_181/patent_batch.py research/openap_181/short_interest_batch.py research/openap_181/sec_accounting_batch.py research/openap_181/sec_companyfacts_access.py research/openap_181/sec_fsd_access.py research/openap_181/sec_fsd_inputs.py
          python -m py_compile scripts/run_openap_181_completion.py scripts/fetch_openap_181_official_formulas.py scripts/run_openap_181_source_research.py scripts/run_openap_181_implementation_status.py scripts/run_openap_181_patent_source_probe.py scripts/run_openap_181_short_interest_source_probe.py scripts/run_openap_181_sec_accounting_batch.py scripts/run_openap_181_sec_accounting_validation.py scripts/run_openap_181_sec_companyfacts_access.py scripts/run_openap_181_sec_fsd_access.py scripts/run_openap_181_sec_fsd_inputs.py
          python -m pytest tests/test_openap_181_completion.py tests/test_openap_181_patent_batch.py tests/test_openap_181_short_interest_batch.py tests/test_openap_181_sec_accounting_batch.py tests/test_openap_181_sec_companyfacts_access.py tests/test_openap_181_sec_fsd_access.py tests/test_openap_181_sec_fsd_inputs.py tests/test_openap_181_sec_workflow.py tests/test_openap_93_max_free.py -q --tb=short
      - name: Download pinned official SignalDoc
        run: |
          mkdir -p inputs
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/OpenSourceAP/CrossSection/8db892442c2c3a3779b0f1eac4370d3655be15a1/SignalDoc.csv \
            --output inputs/SignalDoc.csv
          test -s inputs/SignalDoc.csv
      - name: Download current-score evidence
        if: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-yfinance-sec-current-score-results
          path: inputs/current_score
          run-id: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate current-score coverage evidence
        if: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID != '' }}
        run: |
          current_coverage="$(find inputs/current_score -name coverage_185.csv -type f -print -quit)"
          current_summary="$(find inputs/current_score -name execution_summary.json -type f -print -quit)"
          test -s "$current_coverage"
          test -s "$current_summary"
          echo "CURRENT_SCORE_RUN_ID=$CURRENT_SCORE_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "CURRENT_COVERAGE=$current_coverage" >> "$GITHUB_ENV"
          echo "CURRENT_SUMMARY=$current_summary" >> "$GITHUB_ENV"
      - name: Download SEC accounting blocker evidence
        if: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID != '' && env.SEC_TRANSPORT_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-sec-accounting-validation
          path: inputs/sec_accounting
          run-id: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate SEC accounting blocker evidence
        if: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID != '' && env.SEC_TRANSPORT_EVIDENCE_RUN_ID == '' }}
        run: |
          sec_evidence="$(find inputs/sec_accounting -name sec_accounting_batch_evidence.csv -type f -print -quit)"
          test -s "$sec_evidence"
          echo "SEC_ACCOUNTING_EVIDENCE=$sec_evidence" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_EFFECTIVE_RUN_ID=$SEC_ACCOUNTING_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_ARTIFACT=openap-181-sec-accounting-validation" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_BLOCKER_REASON=official_sec_fsd_access_blocked_http_403" >> "$GITHUB_ENV"
      - name: Download all-runner official SEC transport blocker evidence
        if: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-sec-official-transport-probe-summary
          path: inputs/sec_transport
          run-id: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prefer all-runner official SEC transport blocker evidence
        if: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID != '' }}
        run: |
          sec_evidence="$(find inputs/sec_transport -name sec_accounting_batch_evidence.csv -type f -print -quit)"
          test -s "$sec_evidence"
          echo "SEC_ACCOUNTING_EVIDENCE=$sec_evidence" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_EFFECTIVE_RUN_ID=$SEC_TRANSPORT_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_ARTIFACT=openap-181-sec-official-transport-probe-summary" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_BLOCKER_REASON=official_sec_access_blocked_all_github_hosted_runner_families_http_403" >> "$GITHUB_ENV"
      - name: Download pinned patent source evidence
        if: ${{ env.PATENT_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-patent-source-probe-results
          path: inputs/patent
          run-id: ${{ env.PATENT_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run pinned patent source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.PATENT_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-patent-source-probe-results
          path: inputs/patent
      - name: Locate pinned patent source evidence
        if: ${{ env.PATENT_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          patent_evidence="$(find inputs/patent -name patent_batch_evidence.csv -type f -print -quit)"
          patent_summary="$(find inputs/patent -name patent_source_probe.json -type f -print -quit)"
          test -s "$patent_evidence"
          test -s "$patent_summary"
          grep -q '"source_commit": "2ee29097f7ca05fc0e56905e82474ad426c387b9"' "$patent_summary"
          grep -q 'patent_source_partial:' "$patent_evidence"
          echo "PATENT_EVIDENCE=$patent_evidence" >> "$GITHUB_ENV"
          if [[ -z "${PATENT_EVIDENCE_RUN_ID:-}" ]]; then
            echo "PATENT_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Download official short-interest source evidence
        if: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-short-interest-source-probe-results
          path: inputs/short_interest
          run-id: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run official short-interest source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.SHORT_INTEREST_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-short-interest-source-probe-results
          path: inputs/short_interest
      - name: Locate official short-interest source evidence
        if: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          short_interest_evidence="$(find inputs/short_interest -name short_interest_batch_evidence.csv -type f -print -quit)"
          short_interest_summary="$(find inputs/short_interest -name short_interest_source_probe.json -type f -print -quit)"
          test -s "$short_interest_evidence"
          test -s "$short_interest_summary"
          grep -q '"listed_history_start": "2021-06-01"' "$short_interest_summary"
          grep -q 'short_interest_source_partial:' "$short_interest_evidence"
          echo "SHORT_INTEREST_EVIDENCE=$short_interest_evidence" >> "$GITHUB_ENV"
          if [[ -z "${SHORT_INTEREST_EVIDENCE_RUN_ID:-}" ]]; then
            echo "SHORT_INTEREST_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Build fail-closed 181 manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_openap_181_official_formulas.py \
            --signal-doc inputs/SignalDoc.csv \
            --output-dir outputs/openap_181_completion
          current_coverage_args=()
          if [ -n "${CURRENT_COVERAGE:-}" ]; then
            current_coverage_args+=(--current-coverage "$CURRENT_COVERAGE")
          fi
          python scripts/run_openap_181_completion.py \
            --signal-doc inputs/SignalDoc.csv \
            --signals-93 config/openap_93/signals_93.yaml \
            --formula-inventory outputs/openap_181_completion/openap_181_formula_inventory.csv \
            "${current_coverage_args[@]}" \
            --output-dir outputs/openap_181_completion
          python scripts/run_openap_181_source_research.py \
            --manifest outputs/openap_181_completion/openap_181_completion_manifest.csv \
            --formula-inventory outputs/openap_181_completion/openap_181_formula_inventory.csv \
            --output-dir outputs/openap_181_completion
          twelve_data_args=(--twelve-data-credential-check)
          if [[ -n "${TWELVE_DATA_API_KEY:-}" ]]; then
            twelve_data_args+=(--twelve-data-credential-available)
          fi
          evidence_args=()
          if [[ -n "${SEC_ACCOUNTING_EVIDENCE:-}" ]]; then
            evidence_args+=(--evidence "$SEC_ACCOUNTING_EVIDENCE")
          fi
          if [[ -n "${PATENT_EVIDENCE:-}" ]]; then
            evidence_args+=(--evidence "$PATENT_EVIDENCE")
          fi
          if [[ -n "${SHORT_INTEREST_EVIDENCE:-}" ]]; then
            evidence_args+=(--evidence "$SHORT_INTEREST_EVIDENCE")
          fi
          python scripts/run_openap_181_implementation_status.py \
            --manifest outputs/openap_181_completion/openap_181_completion_manifest.csv \
            --resolution outputs/openap_181_completion/signal_resolution_181.csv \
            --documentary-blockers \
            "${twelve_data_args[@]}" \
            "${evidence_args[@]}" \
            --evidence-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --evidence-artifact openap-181-completion-audit-results \
            --implementation-commit "$SOURCE_SHA" \
            --output-dir outputs/openap_181_completion
      - name: Verify mandatory counts and safety flags
        run: |
          python - <<'PY'
          import json
          import os
          import pandas as pd
          from aurora.research.openap_181.implementation_status import (
              TWELVE_DATA_MARKET_SIGNALS,
          )
          root = "outputs/openap_181_completion"
          manifest = pd.read_csv(f"{root}/openap_181_completion_manifest.csv")
          summary = json.load(open(f"{root}/openap_181_summary.json", encoding="utf-8"))
          formulas = json.load(open(f"{root}/openap_181_formula_summary.json", encoding="utf-8"))
          source_summary = json.load(open(f"{root}/source_research_summary.json", encoding="utf-8"))
          resolution = pd.read_csv(f"{root}/signal_resolution_181.csv")
          matrix = pd.read_csv(f"{root}/signal_source_matrix_181.csv")
          sources = pd.read_csv(f"{root}/source_inventory_free.csv")
          unresolved = pd.read_csv(f"{root}/unresolved_signals.csv")
          implementation = pd.read_csv(f"{root}/signal_implementation_status_181.csv")
          strict_inventory = pd.read_csv(f"{root}/strict_score_signal_inventory.csv")
          assert len(manifest) == manifest["signal"].nunique() == 181
          assert manifest["current_usable"].astype(str).str.lower().eq("false").all()
          assert summary["official_predictors"] == 212
          assert summary["already_ready_exact"] == 31
          assert summary["unfinished_signals"] == 181
          assert summary["completion_claimed"] is False
          assert summary["fail_closed"] is True
          assert summary["locked_opened"] is False
          assert summary["validation_used_for_selection"] is False
          assert formulas["signals"] == 181
          assert formulas["resolved"] + formulas["ambiguous"] + formulas["unresolved"] == 181
          assert formulas["resolved"] == 177
          assert formulas["ambiguous"] == 0
          assert formulas["unresolved"] == 4
          assert len(resolution) == resolution["signal"].nunique() == 181
          assert set(resolution["signal"]) == set(manifest["signal"])
          assert not resolution.fillna("").astype(str).apply(lambda column: column.str.strip().eq("").any()).any()
          assert not resolution.astype(str).apply(lambda column: column.str.lower().eq("nan").any()).any()
          assert set(matrix["signal"]) == set(manifest["signal"])
          assert matrix["coverage_verified"].astype(str).str.lower().eq("false").all()
          assert sources["source_id"].nunique() == len(sources)
          assert sources["source_url"].str.startswith("https://").all()
          automation = sources["automation_allowed"].astype(str).str.lower().eq("true")
          assert sources.loc[automation, "terms_or_license_url"].str.startswith("https://").all()
          assert set(unresolved["signal"]).issubset(set(manifest["signal"]))
          assert source_summary["signals"] == source_summary["unique_signals"] == 181
          assert source_summary["completion_claimed"] is False
          assert source_summary["coverage_claimed"] is False
          assert len(implementation) == implementation["signal"].nunique() == 181
          assert set(implementation["signal"]) == set(manifest["signal"])
          documentary_classes = {
              "formula_ambiguous", "historical_point_in_time_missing",
              "identifier_bridge_missing", "no_free_authorized_source",
              "proxy_only", "source_access_unverified",
          }
          documentary = resolution["final_research_classification"].isin(
              documentary_classes
          )
          credential_missing = not bool(os.environ.get("TWELVE_DATA_API_KEY", ""))
          expected_market_blockers = 36 if credential_missing else 0
          sec_evidence_present = bool(os.environ.get("SEC_ACCOUNTING_EVIDENCE", ""))
          patent_evidence_present = bool(os.environ.get("PATENT_EVIDENCE", ""))
          short_interest_evidence_present = bool(os.environ.get("SHORT_INTEREST_EVIDENCE", ""))
          expected_sec_blockers = 3 if sec_evidence_present else 0
          expected_patent_blockers = 2 if patent_evidence_present else 0
          expected_short_interest_blockers = 3 if short_interest_evidence_present else 0
          assert documentary.sum() == 58
          assert len(TWELVE_DATA_MARKET_SIGNALS) == 36
          assert set(TWELVE_DATA_MARKET_SIGNALS).issubset(set(resolution["signal"]))
          expected_blocked = 58 + expected_market_blockers + expected_sec_blockers + expected_patent_blockers + expected_short_interest_blockers
          assert implementation["strict_gate_result"].eq("blocked").sum() == expected_blocked
          assert implementation["strict_gate_result"].eq("not_attempted").sum() == 181 - expected_blocked
          assert not implementation["score_eligible"].astype(str).str.lower().eq("true").any()
          assert implementation["blocking_reason"].fillna("").astype(str).str.strip().ne("").all()
          blocked = implementation.loc[implementation["strict_gate_result"].eq("blocked")]
          sec_signals = {"Cash", "GP", "Investment"}
          patent_signals = {"CitationsRD", "PatentsRD"}
          short_interest_signals = {"ShortInterest", "IO_ShortInterest", "Recomm_ShortInterest"}
          externally_evidenced = set(sec_signals)
          if patent_evidence_present:
              externally_evidenced.update(patent_signals)
          if short_interest_evidence_present:
              externally_evidenced.update(short_interest_signals)
          generated = blocked.loc[~blocked["signal"].isin(externally_evidenced)]
          assert generated["evidence_run_url"].eq(
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          ).all()
          assert generated["evidence_artifact"].eq(
              "openap-181-completion-audit-results"
          ).all()
          assert generated["implementation_commit"].eq(
              os.environ["SOURCE_SHA"]
          ).all()
          sec_status = implementation.loc[implementation["signal"].isin(sec_signals)]
          if sec_evidence_present:
              assert sec_status["strict_gate_result"].eq("blocked").all()
              assert sec_status["blocking_reason"].eq(
                  os.environ["SEC_ACCOUNTING_BLOCKER_REASON"]
              ).all()
              assert sec_status["evidence_run_url"].eq(
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SEC_ACCOUNTING_EVIDENCE_EFFECTIVE_RUN_ID']}"
              ).all()
              assert sec_status["evidence_artifact"].eq(
                  os.environ["SEC_ACCOUNTING_EVIDENCE_ARTIFACT"]
              ).all()
          else:
              assert sec_status["strict_gate_result"].eq("not_attempted").all()
          patent_status = implementation.loc[
              implementation["signal"].isin(patent_signals)
          ]
          if patent_evidence_present:
              assert patent_status["formula_implemented"].astype(str).str.lower().eq("true").all()
              assert patent_status["strict_gate_result"].eq("blocked").all()
              assert patent_status["blocking_reason"].str.startswith(
                  "patent_source_partial:"
              ).all()
              assert patent_status["evidence_run_url"].eq(
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['PATENT_EVIDENCE_RUN_ID']}"
              ).all()
              assert patent_status["evidence_artifact"].eq(
                  "openap-181-patent-source-probe-results"
              ).all()
              assert patent_status["implementation_commit"].eq(
                  os.environ["SOURCE_SHA"]
              ).all()
          short_interest_status = implementation.loc[
              implementation["signal"].isin(short_interest_signals)
          ]
          if short_interest_evidence_present:
              assert short_interest_status["formula_implemented"].astype(str).str.lower().eq("true").all()
              assert short_interest_status["strict_gate_result"].eq("blocked").all()
              assert short_interest_status["blocking_reason"].str.startswith(
                  "short_interest_source_partial:"
              ).all()
              assert short_interest_status["evidence_run_url"].eq(
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SHORT_INTEREST_EVIDENCE_RUN_ID']}"
              ).all()
              assert short_interest_status["evidence_artifact"].eq(
                  "openap-181-short-interest-source-probe-results"
              ).all()
              assert short_interest_status["implementation_commit"].eq(
                  os.environ["SOURCE_SHA"]
              ).all()
          market_status = implementation.loc[
              implementation["signal"].isin(TWELVE_DATA_MARKET_SIGNALS)
          ]
          if credential_missing:
              assert market_status["blocking_reason"].eq(
                  "credential_missing:twelve_data_basic_api_key_not_configured"
              ).all()
              assert market_status["strict_gate_result"].eq("blocked").all()
          else:
              assert market_status["strict_gate_result"].eq("not_attempted").all()
          assert len(strict_inventory) == strict_inventory["signal"].nunique() == 31
          assert strict_inventory["eligibility_basis"].eq("preexisting_exact_31").all()
          for name in {
              "signal_source_matrix_181.csv", "signal_resolution_181.csv",
              "source_inventory_free.csv", "unresolved_signals.csv", "RESEARCH_REPORT.md",
              "signal_implementation_status_181.csv", "strict_score_signal_inventory.csv",
              "IMPLEMENTATION_VALIDATION_REPORT.md",
          }:
              assert __import__("pathlib").Path(root, name).stat().st_size > 0
          if __import__("os").environ.get("CURRENT_SCORE_RUN_ID", ""):
              assert manifest["raw_status"].ne("").all()
              assert manifest["raw_current_non_null_count"].ge(0).all()
          PY
      - name: Upload completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-181-completion-audit-results
          path: outputs/openap_181_completion/
          if-no-files-found: error
          retention-days: 90
