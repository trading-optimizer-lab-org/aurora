name: OpenAP 181 Completion Audit

on:
  push:
    branches:
      - codex/openap-proxy44-validation
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to audit
        required: true
        type: string
      current_score_run_id:
        description: Optional successful current-score run providing coverage_185 evidence
        required: false
        default: ""
        type: string
      sec_accounting_evidence_run_id:
        description: Optional successful SEC accounting run providing blocker evidence
        required: false
        default: ""
        type: string
      sec_transport_evidence_run_id:
        description: Optional all-runner official SEC transport probe providing blocker evidence
        required: false
        default: ""
        type: string
      patent_evidence_run_id:
        description: Optional pinned patent source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      short_interest_evidence_run_id:
        description: Optional official FINRA source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      options_evidence_run_id:
        description: Optional pinned options source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      analyst_evidence_run_id:
        description: Optional pinned analyst source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      relationship_evidence_run_id:
        description: Optional pinned relationship source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      microstructure_evidence_run_id:
        description: Optional pinned microstructure source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      rio_evidence_run_id:
        description: Optional pinned RIO source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      complex_accounting_evidence_run_id:
        description: Optional complex accounting source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      accruals_noa_evidence_run_id:
        description: Optional accruals and NOA source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      operating_accounting_evidence_run_id:
        description: Optional operating accounting source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      financing_issuance_evidence_run_id:
        description: Optional financing and issuance source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string
      valuation_accounting_evidence_run_id:
        description: Optional valuation accounting source probe providing per-signal blocker evidence
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-181-completion-audit
  cancel-in-progress: false

jobs:
  operating_accounting_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operating_accounting_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-operating-accounting-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  financing_issuance_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.financing_issuance_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-financing-issuance-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  valuation_accounting_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.valuation_accounting_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-valuation-accounting-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  accruals_noa_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.accruals_noa_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-accruals-noa-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  complex_accounting_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.complex_accounting_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-complex-accounting-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  rio_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rio_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-rio-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  microstructure_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.microstructure_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-microstructure-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  relationship_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.relationship_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-relationship-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  analyst_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyst_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-analyst-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  patent_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.patent_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-patent-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  short_interest_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.short_interest_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-short-interest-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  options_probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.options_evidence_run_id == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/openap-181-options-source-probe.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
    secrets: inherit

  audit:
    needs: [operating_accounting_probe, financing_issuance_probe, valuation_accounting_probe, accruals_noa_probe, complex_accounting_probe, rio_probe, microstructure_probe, relationship_probe, analyst_probe, patent_probe, short_interest_probe, options_probe]
    if: ${{ always() && (needs.operating_accounting_probe.result == 'success' || needs.operating_accounting_probe.result == 'skipped') && (needs.financing_issuance_probe.result == 'success' || needs.financing_issuance_probe.result == 'skipped') && (needs.valuation_accounting_probe.result == 'success' || needs.valuation_accounting_probe.result == 'skipped') && (needs.accruals_noa_probe.result == 'success' || needs.accruals_noa_probe.result == 'skipped') && (needs.complex_accounting_probe.result == 'success' || needs.complex_accounting_probe.result == 'skipped') && (needs.rio_probe.result == 'success' || needs.rio_probe.result == 'skipped') && (needs.microstructure_probe.result == 'success' || needs.microstructure_probe.result == 'skipped') && (needs.relationship_probe.result == 'success' || needs.relationship_probe.result == 'skipped') && (needs.analyst_probe.result == 'success' || needs.analyst_probe.result == 'skipped') && (needs.patent_probe.result == 'success' || needs.patent_probe.result == 'skipped') && (needs.short_interest_probe.result == 'success' || needs.short_interest_probe.result == 'skipped') && (needs.options_probe.result == 'success' || needs.options_probe.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: "true"
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      CURRENT_SCORE_EVIDENCE_RUN_ID: ${{ inputs.current_score_run_id || (github.event_name == 'push' && '31270341796') || '' }}
      SEC_ACCOUNTING_EVIDENCE_RUN_ID: ${{ inputs.sec_accounting_evidence_run_id || (github.event_name == 'push' && '31307096969') || '' }}
      SEC_TRANSPORT_EVIDENCE_RUN_ID: ${{ inputs.sec_transport_evidence_run_id || '' }}
      PATENT_EVIDENCE_RUN_ID: ${{ inputs.patent_evidence_run_id || '' }}
      SHORT_INTEREST_EVIDENCE_RUN_ID: ${{ inputs.short_interest_evidence_run_id || '' }}
      OPTIONS_EVIDENCE_RUN_ID: ${{ inputs.options_evidence_run_id || '' }}
      ANALYST_EVIDENCE_RUN_ID: ${{ inputs.analyst_evidence_run_id || '' }}
      RELATIONSHIP_EVIDENCE_RUN_ID: ${{ inputs.relationship_evidence_run_id || '' }}
      MICROSTRUCTURE_EVIDENCE_RUN_ID: ${{ inputs.microstructure_evidence_run_id || '' }}
      RIO_EVIDENCE_RUN_ID: ${{ inputs.rio_evidence_run_id || '' }}
      COMPLEX_ACCOUNTING_EVIDENCE_RUN_ID: ${{ inputs.complex_accounting_evidence_run_id || '' }}
      ACCRUALS_NOA_EVIDENCE_RUN_ID: ${{ inputs.accruals_noa_evidence_run_id || '' }}
      OPERATING_ACCOUNTING_EVIDENCE_RUN_ID: ${{ inputs.operating_accounting_evidence_run_id || '' }}
      FINANCING_ISSUANCE_EVIDENCE_RUN_ID: ${{ inputs.financing_issuance_evidence_run_id || '' }}
      VALUATION_ACCOUNTING_EVIDENCE_RUN_ID: ${{ inputs.valuation_accounting_evidence_run_id || '' }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Compile and test completion contract
        run: |
          python -m py_compile research/openap_181/completion.py research/openap_181/official_formulas.py research/openap_181/source_research.py research/openap_181/implementation_status.py research/openap_181/operating_accounting_batch.py research/openap_181/financing_issuance_batch.py research/openap_181/valuation_accounting_batch.py research/openap_181/accruals_noa_batch.py research/openap_181/complex_accounting_batch.py research/openap_181/rio_batch.py research/openap_181/microstructure_batch.py research/openap_181/relationship_batch.py research/openap_181/analyst_batch.py research/openap_181/options_batch.py research/openap_181/patent_batch.py research/openap_181/short_interest_batch.py research/openap_181/sec_accounting_batch.py research/openap_181/sec_companyfacts_access.py research/openap_181/sec_fsd_access.py research/openap_181/sec_fsd_inputs.py
          python -m py_compile scripts/run_openap_181_completion.py scripts/fetch_openap_181_official_formulas.py scripts/run_openap_181_source_research.py scripts/run_openap_181_implementation_status.py scripts/run_openap_181_operating_accounting_source_probe.py scripts/run_openap_181_financing_issuance_source_probe.py scripts/run_openap_181_valuation_accounting_source_probe.py scripts/run_openap_181_accruals_noa_source_probe.py scripts/run_openap_181_complex_accounting_source_probe.py scripts/run_openap_181_rio_source_probe.py scripts/run_openap_181_microstructure_source_probe.py scripts/run_openap_181_relationship_source_probe.py scripts/run_openap_181_analyst_source_probe.py scripts/run_openap_181_options_source_probe.py scripts/run_openap_181_patent_source_probe.py scripts/run_openap_181_short_interest_source_probe.py scripts/run_openap_181_sec_accounting_batch.py scripts/run_openap_181_sec_accounting_validation.py scripts/run_openap_181_sec_companyfacts_access.py scripts/run_openap_181_sec_fsd_access.py scripts/run_openap_181_sec_fsd_inputs.py
          python -m pytest tests/test_openap_181_completion.py tests/test_openap_181_operating_accounting_batch.py tests/test_openap_181_financing_issuance_batch.py tests/test_openap_181_valuation_accounting_batch.py tests/test_openap_181_accruals_noa_batch.py tests/test_openap_181_complex_accounting_batch.py tests/test_openap_181_rio_batch.py tests/test_openap_181_microstructure_batch.py tests/test_openap_181_relationship_batch.py tests/test_openap_181_analyst_batch.py tests/test_openap_181_options_batch.py tests/test_openap_181_patent_batch.py tests/test_openap_181_short_interest_batch.py tests/test_openap_181_sec_accounting_batch.py tests/test_openap_181_sec_companyfacts_access.py tests/test_openap_181_sec_fsd_access.py tests/test_openap_181_sec_fsd_inputs.py tests/test_openap_181_sec_workflow.py tests/test_openap_93_max_free.py -q --tb=short
      - name: Download pinned official SignalDoc
        run: |
          mkdir -p inputs
          curl --fail --location --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/OpenSourceAP/CrossSection/8db892442c2c3a3779b0f1eac4370d3655be15a1/SignalDoc.csv \
            --output inputs/SignalDoc.csv
          test -s inputs/SignalDoc.csv
      - name: Download current-score evidence
        if: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-yfinance-sec-current-score-results
          path: inputs/current_score
          run-id: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate current-score coverage evidence
        if: ${{ env.CURRENT_SCORE_EVIDENCE_RUN_ID != '' }}
        run: |
          current_coverage="$(find inputs/current_score -name coverage_185.csv -type f -print -quit)"
          current_summary="$(find inputs/current_score -name execution_summary.json -type f -print -quit)"
          test -s "$current_coverage"
          test -s "$current_summary"
          echo "CURRENT_SCORE_RUN_ID=$CURRENT_SCORE_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "CURRENT_COVERAGE=$current_coverage" >> "$GITHUB_ENV"
          echo "CURRENT_SUMMARY=$current_summary" >> "$GITHUB_ENV"
      - name: Download SEC accounting blocker evidence
        if: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID != '' && env.SEC_TRANSPORT_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-sec-accounting-validation
          path: inputs/sec_accounting
          run-id: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate SEC accounting blocker evidence
        if: ${{ env.SEC_ACCOUNTING_EVIDENCE_RUN_ID != '' && env.SEC_TRANSPORT_EVIDENCE_RUN_ID == '' }}
        run: |
          sec_evidence="$(find inputs/sec_accounting -name sec_accounting_batch_evidence.csv -type f -print -quit)"
          test -s "$sec_evidence"
          echo "SEC_ACCOUNTING_EVIDENCE=$sec_evidence" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_EFFECTIVE_RUN_ID=$SEC_ACCOUNTING_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_ARTIFACT=openap-181-sec-accounting-validation" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_BLOCKER_REASON=official_sec_fsd_access_blocked_http_403" >> "$GITHUB_ENV"
      - name: Download all-runner official SEC transport blocker evidence
        if: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-sec-official-transport-probe-summary
          path: inputs/sec_transport
          run-id: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prefer all-runner official SEC transport blocker evidence
        if: ${{ env.SEC_TRANSPORT_EVIDENCE_RUN_ID != '' }}
        run: |
          sec_evidence="$(find inputs/sec_transport -name sec_accounting_batch_evidence.csv -type f -print -quit)"
          test -s "$sec_evidence"
          echo "SEC_ACCOUNTING_EVIDENCE=$sec_evidence" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_EFFECTIVE_RUN_ID=$SEC_TRANSPORT_EVIDENCE_RUN_ID" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_EVIDENCE_ARTIFACT=openap-181-sec-official-transport-probe-summary" >> "$GITHUB_ENV"
          echo "SEC_ACCOUNTING_BLOCKER_REASON=official_sec_access_blocked_all_github_hosted_runner_families_http_403" >> "$GITHUB_ENV"
      - name: Download pinned patent source evidence
        if: ${{ env.PATENT_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-patent-source-probe-results
          path: inputs/patent
          run-id: ${{ env.PATENT_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run pinned patent source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.PATENT_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-patent-source-probe-results
          path: inputs/patent
      - name: Locate pinned patent source evidence
        if: ${{ env.PATENT_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          patent_evidence="$(find inputs/patent -name patent_batch_evidence.csv -type f -print -quit)"
          patent_summary="$(find inputs/patent -name patent_source_probe.json -type f -print -quit)"
          test -s "$patent_evidence"
          test -s "$patent_summary"
          grep -q '"source_commit": "2ee29097f7ca05fc0e56905e82474ad426c387b9"' "$patent_summary"
          grep -q 'patent_source_partial:' "$patent_evidence"
          patent_commit="$(python - "$patent_evidence" <<'PY'
          import re
          import sys
          import pandas as pd
          commits = pd.read_csv(sys.argv[1])["implementation_commit"].astype(str).unique()
          assert len(commits) == 1 and re.fullmatch(r"[0-9a-f]{40}", commits[0])
          print(commits[0])
          PY
          )"
          echo "PATENT_EVIDENCE=$patent_evidence" >> "$GITHUB_ENV"
          echo "PATENT_EVIDENCE_COMMIT=$patent_commit" >> "$GITHUB_ENV"
          if [[ -z "${PATENT_EVIDENCE_RUN_ID:-}" ]]; then
            echo "PATENT_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Download official short-interest source evidence
        if: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-short-interest-source-probe-results
          path: inputs/short_interest
          run-id: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run official short-interest source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.SHORT_INTEREST_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-short-interest-source-probe-results
          path: inputs/short_interest
      - name: Locate official short-interest source evidence
        if: ${{ env.SHORT_INTEREST_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          short_interest_evidence="$(find inputs/short_interest -name short_interest_batch_evidence.csv -type f -print -quit)"
          short_interest_summary="$(find inputs/short_interest -name short_interest_source_probe.json -type f -print -quit)"
          test -s "$short_interest_evidence"
          test -s "$short_interest_summary"
          grep -q '"listed_history_start": "2021-06-01"' "$short_interest_summary"
          grep -q 'short_interest_source_partial:' "$short_interest_evidence"
          short_interest_commit="$(python - "$short_interest_evidence" <<'PY'
          import re
          import sys
          import pandas as pd
          commits = pd.read_csv(sys.argv[1])["implementation_commit"].astype(str).unique()
          assert len(commits) == 1 and re.fullmatch(r"[0-9a-f]{40}", commits[0])
          print(commits[0])
          PY
          )"
          echo "SHORT_INTEREST_EVIDENCE=$short_interest_evidence" >> "$GITHUB_ENV"
          echo "SHORT_INTEREST_EVIDENCE_COMMIT=$short_interest_commit" >> "$GITHUB_ENV"
          if [[ -z "${SHORT_INTEREST_EVIDENCE_RUN_ID:-}" ]]; then
            echo "SHORT_INTEREST_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Download pinned RIO source evidence
        if: ${{ env.RIO_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-rio-source-probe-results
          path: inputs/rio
          run-id: ${{ env.RIO_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run pinned RIO source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.RIO_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-rio-source-probe-results
          path: inputs/rio
      - name: Locate pinned RIO source evidence
        if: ${{ env.RIO_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          rio_evidence="$(find inputs/rio -name rio_batch_evidence.csv -type f -print -quit)"
          rio_summary="$(find inputs/rio -name rio_source_probe.json -type f -print -quit)"
          test -s "$rio_evidence"
          test -s "$rio_summary"
          grep -q '"exact_free_authorized_source_found": false' "$rio_summary"
          grep -q 'rio_source_blocked:' "$rio_evidence"
          rio_commit="$(python - "$rio_evidence" <<'PY'
          import re
          import sys
          import pandas as pd
          evidence = pd.read_csv(sys.argv[1])
          assert len(evidence) == evidence["signal"].nunique() == 4
          assert evidence["formula_implemented"].eq(True).all()
          assert evidence["strict_gate_result"].eq("blocked").all()
          commits = evidence["implementation_commit"].astype(str).unique()
          assert len(commits) == 1 and re.fullmatch(r"[0-9a-f]{40}", commits[0])
          print(commits[0])
          PY
          )"
          echo "RIO_EVIDENCE=$rio_evidence" >> "$GITHUB_ENV"
          echo "RIO_EVIDENCE_COMMIT=$rio_commit" >> "$GITHUB_ENV"
          if [[ -z "${RIO_EVIDENCE_RUN_ID:-}" ]]; then
            echo "RIO_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Download pinned operating accounting source evidence
        if: ${{ env.OPERATING_ACCOUNTING_EVIDENCE_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-operating-accounting-source-probe-results
          path: inputs/operating_accounting
          run-id: ${{ env.OPERATING_ACCOUNTING_EVIDENCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download in-run operating accounting source evidence
        if: ${{ github.event_name == 'workflow_dispatch' && env.OPERATING_ACCOUNTING_EVIDENCE_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-operating-accounting-source-probe-results
          path: inputs/operating_accounting
      - name: Locate operating accounting source evidence
        if: ${{ env.OPERATING_ACCOUNTING_EVIDENCE_RUN_ID != '' || github.event_name == 'workflow_dispatch' }}
        run: |
