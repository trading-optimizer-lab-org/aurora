                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RIO_EVIDENCE_RUN_ID']}"
              ).all()
              assert rio_status["evidence_artifact"].eq(
                  "openap-181-rio-source-probe-results"
              ).all()
              assert rio_status["implementation_commit"].eq(
                  os.environ["RIO_EVIDENCE_COMMIT"]
              ).all()
          relationship_status = implementation.loc[
              implementation["signal"].isin(relationship_signals)
          ]
          if relationship_evidence_present:
              assert len(relationship_status) == relationship_status["signal"].nunique() == 5
              assert relationship_status["formula_implemented"].astype(str).str.lower().eq("true").all()
              assert relationship_status["strict_gate_result"].eq("blocked").all()
              assert relationship_status["blocking_reason"].str.startswith(
                  "relationship_source_blocked:"
              ).all()
              assert relationship_status["blocking_reason"].nunique() == 5
              assert relationship_status.set_index("signal")["blocking_reason"].to_dict() == RELATIONSHIP_BLOCKERS
              assert relationship_status["evidence_run_url"].eq(
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['RELATIONSHIP_EVIDENCE_RUN_ID']}"
              ).all()
              assert relationship_status["evidence_artifact"].eq(
                  "openap-181-relationship-source-probe-results"
              ).all()
              assert relationship_status["implementation_commit"].eq(
                  os.environ["RELATIONSHIP_EVIDENCE_COMMIT"]
              ).all()
          market_status = implementation.loc[
              implementation["signal"].isin(TWELVE_DATA_MARKET_SIGNALS)
          ]
          generic_market_status = market_status.loc[
              ~market_status["signal"].isin(
                  microstructure_signals if microstructure_evidence_present else set()
              )
          ]
          if credential_missing:
              assert generic_market_status["blocking_reason"].eq(
                  "credential_missing:twelve_data_basic_api_key_not_configured"
              ).all()
              assert generic_market_status["strict_gate_result"].eq("blocked").all()
          else:
              assert generic_market_status["strict_gate_result"].eq("not_attempted").all()
          assert len(strict_inventory) == strict_inventory["signal"].nunique() == 31
          assert strict_inventory["eligibility_basis"].eq("preexisting_exact_31").all()
          for name in {
              "signal_source_matrix_181.csv", "signal_resolution_181.csv",
              "source_inventory_free.csv", "unresolved_signals.csv", "RESEARCH_REPORT.md",
              "signal_implementation_status_181.csv", "strict_score_signal_inventory.csv",
              "IMPLEMENTATION_VALIDATION_REPORT.md",
          }:
              assert __import__("pathlib").Path(root, name).stat().st_size > 0
          if __import__("os").environ.get("CURRENT_SCORE_RUN_ID", ""):
              assert manifest["raw_status"].ne("").all()
              assert manifest["raw_current_non_null_count"].ge(0).all()
          PY
