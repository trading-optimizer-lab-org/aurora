name: "v51 data: event symbol-days and their one-minute bars"

# scripts/run_v51_data.py (V51_PREREGISTRATION.md section 2): the event superset of every setup from the daily panel
# and Alpaca SIP one-minute bars, 04:00-19:59, of the event day and the next sessions, kept only in the Actions cache
# (no market data is published); the counts go to the summary. The cache is saved only when the download is complete.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v51-data.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v51-data
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - run: python scripts/run_v51_data.py census --out outputs/v51
      - run: python scripts/run_v51_data.py minutes --out outputs/v51
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      - if: always()
        run: |
          for f in census coverage; do
            if [ -f outputs/v51/$f.json ]; then cat outputs/v51/$f.json >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v51
          key: v51-min-${{ github.run_id }}-${{ github.run_attempt }}
