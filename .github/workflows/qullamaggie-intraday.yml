name: Qullamaggie phase 1 intraday (pre-registered)

# docs/research/QULLAMAGGIE_INTRADAY_PREREGISTRATION.md: fetches one-minute
# bars (2016-2020 only) for the candidate days from Alpaca, keeps them in the
# Actions cache (never published) and uploads only the report.
# Needs the repository secrets ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY.
on:
  workflow_dispatch:
  push:
    branches: [research/stock-catalog]
    paths:
      - research/qullamaggie_intraday.py
      - scripts/run_qullamaggie_intraday.py
      - .github/workflows/qullamaggie-intraday.yml

permissions:
  contents: read

concurrency:
  group: qullamaggie-intraday
  cancel-in-progress: true

jobs:
  intraday:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check Alpaca credentials
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::error::Add the repository secrets ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore Alpaca minute cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-

      - name: Fetch minute bars and run the study
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: >-
          python scripts/run_qullamaggie_intraday.py run --workers 4 --panel-dir outputs/stock_panel
          --cache outputs/alpaca --output-dir outputs/qullamaggie_intraday

      - name: Save Alpaca minute cache
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/qullamaggie_intraday/REPORT.md ]; then
            cat outputs/qullamaggie_intraday/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qullamaggie-intraday
          path: |
            outputs/qullamaggie_intraday/REPORT.md
            outputs/qullamaggie_intraday/summary.json
            outputs/qullamaggie_intraday/results.parquet
            outputs/qullamaggie_intraday/reference.parquet
          if-no-files-found: warn
          retention-days: 90
