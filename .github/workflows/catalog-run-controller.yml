name: AURORA catalog run controller

on:
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, locked, unlocked, labeled, unlabeled]
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: read

env:
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  issue_tamper_guard:
    name: issue_tamper_guard
    if: ${{ github.event_name == 'issues' && github.event.action != 'opened' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-authority-admission-v1
      cancel-in-progress: false
    steps:
      - name: Check out protected controller code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Build a bounded incident without evaluating issue text in a shell
        id: incident
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text("utf-8"))
          config = json.loads(Path("config/catalog_authority_anchor_v1.json").read_text("utf-8"))
          issue = event.get("issue") or {}
          number = issue.get("number")
          title = issue.get("title") or ""
          authority_number = config.get("issue_number")
          authority = isinstance(number, int) and number == authority_number
          request = (
              isinstance(number, int)
              and number > 0
              and title.startswith("[AURORA CATALOG RUN REQUEST] ")
          )
          relevant = authority or request
          marker = (
              "AURORA_CATALOG_AUTHORITY_ISSUE_TAMPER_V1"
              if authority
              else "AURORA_CATALOG_REQUEST_TAMPER_V1"
          )
          payload = {
              "schema_version": "1",
              "marker": marker,
              "relevant": relevant,
              "authority_issue": authority,
              "issue_number": number if isinstance(number, int) and number > 0 else None,
              "event_action": event.get("action"),
              "actor": (event.get("sender") or {}).get("login"),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "protected_commit_sha": os.environ["GITHUB_SHA"],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["incident_sha256"] = hashlib.sha256(canonical.encode()).hexdigest()
          Path("incident.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"relevant={str(relevant).lower()}\n")
              output.write(f"authority={str(authority).lower()}\n")
              output.write(f"issue_number={number if isinstance(number, int) and number > 0 else 0}\n")
          PY
      - name: Mirror the immutable tamper incident first
        if: ${{ steps.incident.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-tamper-${{ github.run_id }}-${{ github.run_attempt }}
          path: incident.json
          if-no-files-found: error
          retention-days: 90
      - name: Record request incident after its mirror
        if: ${{ steps.incident.outputs.relevant == 'true' && steps.incident.outputs.authority != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.issue_number }}
        shell: bash
        run: |
          test "$ISSUE_NUMBER" -gt 0
          python - <<'PY'
          import json
          from pathlib import Path
          incident = json.loads(Path("incident.json").read_text("utf-8"))
          body = "AURORA_CATALOG_REQUEST_TAMPER_V1\n```json\n" + json.dumps(incident, sort_keys=True, separators=(",", ":")) + "\n```\n"
          Path("comment-request.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --input comment-request.json >/dev/null

  filter:
    if: ${{ github.event_name == 'workflow_call' || (github.event_name == 'issues' && github.event.action == 'opened') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.verify.outputs.relevant }}
      valid: ${{ steps.verify.outputs.valid }}
      issue_number: ${{ steps.verify.outputs.issue_number }}
      request_sha256: ${{ steps.verify.outputs.request_sha256 }}
      protected_commit_sha: ${{ steps.verify.outputs.protected_commit_sha }}
      reason_code: ${{ steps.verify.outputs.reason_code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - name: Fetch and verify the exact signed request
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          CONTROLLER_ENABLED: ${{ vars.CATALOG_CONTROLLER_ENABLED }}
          CONTROLLER_ARMED: ${{ vars.CATALOG_CONTROLLER_PRODUCTION_ARMED }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          from aurora.infra.sp500_megarun.catalog_run_request import parse_catalog_run_request

          number_text = os.environ.get("REQUESTED_ISSUE_NUMBER", "")
          if not number_text.isdigit() or int(number_text) < 1:
              raise SystemExit("CATALOG_REQUEST_ISSUE_NUMBER_INVALID")
          number = int(number_text)
          raw = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/{number}"],
              check=True,
              capture_output=True,
          ).stdout
          issue = json.loads(raw)
          actors = json.loads(Path("config/catalog_controller_actors_v1.json").read_text("utf-8"))
          valid = False
          relevant = issue.get("title", "").startswith("[AURORA CATALOG RUN REQUEST] ")
          reason = "CATALOG_CONTROLLER_DISABLED"
          request_sha = hashlib.sha256(raw).hexdigest()
          controller_enabled = os.environ.get("CONTROLLER_ENABLED") == "true"
          controller_armed = os.environ.get("CONTROLLER_ARMED") == "true"
          if actors.get("production_enabled") is True and controller_enabled and controller_armed:
              allowed = set(actors.get("request_actors", ()))
              key_path = actors.get("requester_public_key_path")
              if issue.get("user", {}).get("login") not in allowed:
                  reason = "CATALOG_REQUEST_ACTOR_INVALID"
              elif not isinstance(key_path, str):
                  reason = "CATALOG_REQUESTER_KEY_UNAVAILABLE"
              else:
                  try:
                      request = parse_catalog_run_request(
                          issue.get("title", ""),
                          issue.get("body", ""),
                          Path(key_path).read_bytes(),
                      )
                  except Exception:
                      reason = "CATALOG_REQUEST_INVALID"
                  else:
                      canonical = json.dumps(
                          request.model_dump(mode="json"),
                          sort_keys=True,
                          separators=(",", ":"),
                      ).encode()
                      request_sha = hashlib.sha256(canonical).hexdigest()
                      valid = True
                      reason = "CATALOG_REQUEST_VERIFIED"
          receipt = {
              "schema_version": "1",
              "issue_number": number,
              "issue_id": issue.get("id"),
              "request_sha256": request_sha,
              "valid": valid,
              "relevant": relevant,
              "reason_code": reason,
              "protected_commit_sha": os.environ["GITHUB_SHA"],
          }
          Path("filter-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"valid={str(valid).lower()}\n")
              output.write(f"relevant={str(relevant).lower()}\n")
              output.write(f"issue_number={number}\n")
              output.write(f"request_sha256={request_sha}\n")
              output.write(f"protected_commit_sha={os.environ['GITHUB_SHA']}\n")
              output.write(f"reason_code={reason}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-filter-receipt
          path: filter-receipt.json
          if-no-files-found: error
          retention-days: 90

  routing_snapshot:
    needs: filter
    if: ${{ needs.filter.outputs.valid == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      snapshot_sha256: ${{ steps.snapshot.outputs.snapshot_sha256 }}
      request_sha256: ${{ steps.snapshot.outputs.request_sha256 }}
      campaign_id: ${{ steps.snapshot.outputs.campaign_id }}
      applicable_commit_sha: ${{ steps.snapshot.outputs.applicable_commit_sha }}
      request_receipt_orphan: ${{ steps.snapshot.outputs.request_receipt_orphan }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.filter.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - name: Capture a bounded routing snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.filter.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -gt 0
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-routing-snapshot" \
            --github-output "$GITHUB_OUTPUT"
      - name: Bind the stable snapshot to the exact filtered request
        env:
          FILTER_REQUEST_SHA256: ${{ needs.filter.outputs.request_sha256 }}
          SNAPSHOT_REQUEST_SHA256: ${{ steps.snapshot.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FILTER_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$SNAPSHOT_REQUEST_SHA256" = "$FILTER_REQUEST_SHA256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-routing-snapshot
          path: ${{ runner.temp }}/catalog-routing-snapshot
          if-no-files-found: error
          retention-days: 7

  route_without_privileged_audit:
    needs: [filter, routing_snapshot]
    if: >-
      ${{ needs.routing_snapshot.result == 'success' &&
      needs.routing_snapshot.outputs.request_receipt_orphan != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needs_live_audit: ${{ steps.route.outputs.needs_live_audit }}
      outcome: ${{ steps.route.outputs.outcome }}
      protected_commit_sha: ${{ needs.routing_snapshot.outputs.applicable_commit_sha }}
      reason_code: ${{ steps.route.outputs.reason_code }}
      route_sha256: ${{ steps.route.outputs.route_sha256 }}
      authority_id: ${{ steps.route.outputs.authority_id }}
      campaign_id: ${{ needs.routing_snapshot.outputs.campaign_id }}
      request_sha256: ${{ needs.routing_snapshot.outputs.request_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.routing_snapshot.outputs.applicable_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-routing-snapshot
          path: ${{ runner.temp }}/catalog-routing-snapshot
      - name: Route from the immutable bounded snapshot
        id: route
        shell: bash
        run: |
          set -euo pipefail
          python scripts/route_catalog_run.py \
            --input "$RUNNER_TEMP/catalog-routing-snapshot/routing-command.json" \
            --output "$RUNNER_TEMP/catalog-route-decision.json" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-route-decision
          path: ${{ runner.temp }}/catalog-route-decision.json
          if-no-files-found: error
          retention-days: 90

  prepare_admission_candidates:
    needs: [routing_snapshot, route_without_privileged_audit]
    if: ${{ needs.route_without_privileged_audit.outputs.needs_live_audit == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      audit_context_sha256: ${{ steps.candidate.outputs.audit_context_sha256 }}
      candidate_manifest_sha256: ${{ steps.candidate.outputs.candidate_manifest_sha256 }}
      controls_commit_sha: ${{ steps.candidate.outputs.controls_commit_sha }}
      execution_protocol_sha256: ${{ steps.candidate.outputs.execution_protocol_sha256 }}
      protected_commit_sha: ${{ steps.candidate.outputs.protected_commit_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.route_without_privileged_audit.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-routing-snapshot
          path: ${{ runner.temp }}/catalog-routing-snapshot
      - id: candidate
        name: Derive bounded admission candidates without scientific compute
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_PROTECTED_COMMIT_SHA: ${{ needs.route_without_privileged_audit.outputs.protected_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_admission_candidates.py \
            --routing-snapshot-dir "$RUNNER_TEMP/catalog-routing-snapshot" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-admission-candidates" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-admission-candidates
          path: ${{ runner.temp }}/catalog-admission-candidates
          if-no-files-found: error
          retention-days: 7

  live_controls_audit_before_reserve:
    needs: prepare_admission_candidates
    if: ${{ needs.prepare_admission_candidates.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: catalog-production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: catalog-live-controls-audit-v1
      queue: max
      cancel-in-progress: false
    outputs:
      receipt_artifact_name: ${{ steps.controls.outputs.receipt_artifact_name }}
      receipt_sha256: ${{ steps.controls.outputs.receipt_sha256 }}
      receipt_status: ${{ steps.controls.outputs.receipt_status }}
    steps:
      - name: Check out the exact protected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: trading-optimizer-lab-org/aurora
          ref: ${{ needs.prepare_admission_candidates.outputs.controls_commit_sha }}
          persist-credentials: false
      - id: controls
        name: Run protected read-only audit
        uses: ./.github/actions/catalog-live-controls-audit
        with:
          purpose: admission
          caller-workflow: .github/workflows/catalog-run-controller.yml
          caller-job: live_controls_audit_before_reserve
          protected-commit-sha: ${{ needs.prepare_admission_candidates.outputs.controls_commit_sha }}
          audit-context-sha256: ${{ needs.prepare_admission_candidates.outputs.audit_context_sha256 }}
          auditor-app-id: ${{ vars.AURORA_CATALOG_AUDITOR_APP_ID }}
          auditor-private-key: ${{ secrets.AURORA_CATALOG_AUDITOR_PRIVATE_KEY }}
          enterprise-billing-token: ${{ secrets.AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN }}
          enterprise-cache-verifier-token: ${{ secrets.AURORA_CATALOG_ENTERPRISE_CACHE_VERIFIER_TOKEN }}
          package-inventory-token: ${{ secrets.AURORA_CATALOG_PACKAGE_INVENTORY_TOKEN }}

  admission:
    needs: [routing_snapshot, prepare_admission_candidates, live_controls_audit_before_reserve]
    if: ${{ needs.live_controls_audit_before_reserve.outputs.receipt_status == 'ready' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      call_engine: ${{ steps.decision.outputs.call_engine }}
      outcome: ${{ steps.decision.outputs.outcome }}
      reason_code: ${{ steps.decision.outputs.reason_code }}
      request_issue_number: ${{ steps.decision.outputs.request_issue_number }}
      request_sha256: ${{ steps.decision.outputs.request_sha256 }}
      authority_id: ${{ steps.decision.outputs.authority_id }}
      campaign_id: ${{ steps.decision.outputs.campaign_id }}
      science_sha256: ${{ steps.decision.outputs.science_sha256 }}
      execution_plan_sha256: ${{ steps.decision.outputs.execution_plan_sha256 }}
      execution_protocol_sha256: ${{ steps.decision.outputs.execution_protocol_sha256 }}
      protected_commit_sha: ${{ steps.decision.outputs.protected_commit_sha }}
      controls_commit_sha: ${{ steps.decision.outputs.controls_commit_sha }}
      retry_not_before: ${{ steps.decision.outputs.retry_not_before }}
      decision_sha256: ${{ steps.decision.outputs.decision_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare_admission_candidates.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-routing-snapshot
          path: ${{ runner.temp }}/catalog-routing-snapshot
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-candidates
          path: ${{ runner.temp }}/catalog-admission-candidates
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.live_controls_audit_before_reserve.outputs.receipt_artifact_name }}
          path: ${{ runner.temp }}/catalog-live-controls
      - id: decision
        name: Select capacity, decide, and seal without authority
        env:
          CATALOG_EXPECTED_CANDIDATE_MANIFEST_SHA256: ${{ needs.prepare_admission_candidates.outputs.candidate_manifest_sha256 }}
          CATALOG_EXPECTED_CONTROLS_RECEIPT_SHA256: ${{ needs.live_controls_audit_before_reserve.outputs.receipt_sha256 }}
          CATALOG_EXPECTED_AUDIT_CONTEXT_SHA256: ${{ needs.prepare_admission_candidates.outputs.audit_context_sha256 }}
          CATALOG_PROTECTED_COMMIT_SHA: ${{ needs.prepare_admission_candidates.outputs.protected_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_admission_decision.py \
            --candidate-dir "$RUNNER_TEMP/catalog-admission-candidates" \
            --routing-snapshot-dir "$RUNNER_TEMP/catalog-routing-snapshot" \
            --controls-receipt "$RUNNER_TEMP/catalog-live-controls/catalog_github_controls_receipt_v1.json" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-admission-output" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-admission-decision-${{ steps.decision.outputs.decision_sha256 }}
          path: |
            ${{ runner.temp }}/catalog-admission-output/controller-decision
            ${{ runner.temp }}/catalog-admission-output/evidence
          if-no-files-found: error
          retention-days: 90
      - if: ${{ steps.decision.outputs.call_engine == 'true' && steps.decision.outputs.sealed_plan_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-sealed-execution-plan-${{ steps.decision.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-admission-output/sealed-plan
          if-no-files-found: error
          retention-days: 90

  reserve:
    name: reserve
    needs: [routing_snapshot, admission]
    if: ${{ needs.admission.outputs.call_engine == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-authority-admission-v1
      cancel-in-progress: false
    outputs:
      authority_committed: ${{ steps.verify.outputs.authority_committed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admission.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-decision-${{ needs.admission.outputs.decision_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-decision
      - name: Recheck the complete ledger and FIFO while holding the writer lock
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -gt 0
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-reserve-before"
      - id: prepare
        name: Prepare exactly one RESERVED or RECOVERING record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_authority_record.py \
            --mode reserve \
            --decision "$RUNNER_TEMP/catalog-admission-decision/controller-decision/decision.json" \
            --routing-command "$RUNNER_TEMP/catalog-reserve-before/routing-command.json" \
            --output-dir "$RUNNER_TEMP/catalog-reserve-record" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_mirror
        name: Reconcile any orphaned reservation mirror before writing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind authority \
            --candidate "$RUNNER_TEMP/catalog-reserve-record/record.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-reserve-record/comment.md" \
            --comments-document "$RUNNER_TEMP/catalog-reserve-before/authority-comments.json" \
            --output-dir "$RUNNER_TEMP/catalog-reserve-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: mirror
        name: Mirror the exact authority record before its comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-reserve-delivery/record.json
          if-no-files-found: error
          retention-days: 90
      - id: repair_claim
        name: Claim one mirror-comment repair attempt
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-reserve-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-reserve-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back the mirror, append the exact comment, and read it back
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_mirror.outputs.existing_artifact_id ||
            steps.mirror.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-reserve-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-reserve-mirror"
          unzip -q "$RUNNER_TEMP/catalog-reserve-mirror.zip" -d "$RUNNER_TEMP/catalog-reserve-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-reserve-delivery/record.json" "$RUNNER_TEMP/catalog-reserve-mirror/record.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          body = Path(os.environ["RUNNER_TEMP"], "catalog-reserve-delivery", "comment.md").read_text("utf-8")
          Path(os.environ["RUNNER_TEMP"], "catalog-reserve-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          authority_number="$(python -c "import json; print(json.load(open('config/catalog_authority_anchor_v1.json', encoding='utf-8'))['issue_number'])")"
          [[ "$authority_number" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$authority_number/comments" \
            --input "$RUNNER_TEMP/catalog-reserve-comment-request.json" \
            > "$RUNNER_TEMP/catalog-reserve-posted-comment.json"
      - name: Capture the complete post-write dual ledger
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -gt 0
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-reserve-after"
      - id: verify
        name: Permit compute only after exact mirror/comment/provenance read-back
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_catalog_authority_record.py \
            --candidate "$RUNNER_TEMP/catalog-reserve-record/candidate.json" \
            --routing-command "$RUNNER_TEMP/catalog-reserve-after/routing-command.json" \
            --output "$RUNNER_TEMP/catalog-reserve-verified.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve the verified reservation receipt
        if: ${{ steps.verify.outputs.authority_committed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-authority-reserve-receipt-${{ steps.verify.outputs.record_sha256 }}
          path: ${{ runner.temp }}/catalog-reserve-verified.json
          if-no-files-found: error
          retention-days: 90

  report_nonexecuting_decision:
    name: report_nonexecuting_decision
    needs: [filter, routing_snapshot, route_without_privileged_audit, admission]
    if: >-
      ${{ always() && needs.filter.result == 'success' &&
      needs.filter.outputs.relevant == 'true' &&
      needs.routing_snapshot.result == 'success' &&
      (needs.routing_snapshot.outputs.request_receipt_orphan == 'true' ||
      (needs.routing_snapshot.outputs.request_receipt_orphan != 'true' &&
      needs.admission.outputs.call_engine != 'true' &&
      needs.route_without_privileged_audit.outputs.reason_code != 'CATALOG_RETRY_NOT_DUE')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-request-receipt-v1-${{ needs.filter.outputs.issue_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.filter.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - name: Download the routing command when routing reached a decision
        if: ${{ needs.routing_snapshot.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-routing-snapshot
          path: ${{ runner.temp }}/catalog-routing-snapshot
      - id: receipt
        name: Prepare one provenance-bound nonexecuting receipt
        if: ${{ needs.routing_snapshot.outputs.request_receipt_orphan != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          routing_args=()
          if [ -f "$RUNNER_TEMP/catalog-routing-snapshot/routing-command.json" ]; then
            routing_args=(
              --routing-command
              "$RUNNER_TEMP/catalog-routing-snapshot/routing-command.json"
              --request-receipts
              "$RUNNER_TEMP/catalog-routing-snapshot/request-receipts.json"
            )
          fi
          python scripts/prepare_catalog_request_receipt.py \
            --mode nonexecuting \
            --decision-outcome "${{ needs.admission.outputs.outcome || needs.route_without_privileged_audit.outputs.outcome || 'blocked' }}" \
            --reason-code "${{ needs.admission.outputs.reason_code || needs.route_without_privileged_audit.outputs.reason_code || needs.filter.outputs.reason_code }}" \
            --issue-number "${{ needs.filter.outputs.issue_number }}" \
            --request-sha256 "${{ needs.filter.outputs.request_sha256 }}" \
            --campaign-id "${{ needs.route_without_privileged_audit.outputs.campaign_id }}" \
            --authority-id "${{ needs.admission.outputs.authority_id || needs.route_without_privileged_audit.outputs.authority_id }}" \
            --retry-not-before "${{ needs.admission.outputs.retry_not_before }}" \
            "${routing_args[@]}" \
            --output-dir "$RUNNER_TEMP/catalog-nonexecuting-request-receipt" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_mirror
        name: Reconcile any orphaned request receipt before writing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/catalog-nonexecuting-request-receipt/request-receipt.json"
          candidate_comment="$RUNNER_TEMP/catalog-nonexecuting-request-receipt/comment.md"
          output_dir="$RUNNER_TEMP/catalog-nonexecuting-request-delivery"
          if [ "${{ needs.routing_snapshot.outputs.request_receipt_orphan }}" = "true" ]; then
            candidate="$RUNNER_TEMP/catalog-routing-snapshot/request-receipt-orphan.json"
            candidate_comment="$RUNNER_TEMP/catalog-routing-snapshot/request-receipt-orphan-comment.md"
            output_dir="$RUNNER_TEMP/catalog-request-orphan-delivery"
          fi
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind request \
            --candidate "$candidate" \
            --candidate-comment "$candidate_comment" \
            --output-dir "$output_dir" \
            --github-output "$GITHUB_OUTPUT"
      - name: Require one bounded orphan-repair outcome
        if: ${{ needs.routing_snapshot.outputs.request_receipt_orphan == 'true' }}
        env:
          REPAIR_ACTION: ${{ steps.reconcile_mirror.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REPAIR_ACTION" in
            repair_comment|idempotent) ;;
            *) exit 2 ;;
          esac
      - id: orphan_mirror_readback
        name: Read back the historical orphan mirror before claiming repair
        if: >-
          ${{ needs.routing_snapshot.outputs.request_receipt_orphan == 'true' &&
          steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.reconcile_mirror.outputs.existing_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-request-orphan-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-request-orphan-mirror"
          unzip -q "$RUNNER_TEMP/catalog-request-orphan-mirror.zip" -d "$RUNNER_TEMP/catalog-request-orphan-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-request-orphan-delivery/request-receipt.json" "$RUNNER_TEMP/catalog-request-orphan-mirror/request-receipt.json"
      - id: mirror
        name: Mirror the request receipt first
        if: >-
          ${{ needs.routing_snapshot.outputs.request_receipt_orphan != 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-nonexecuting-request-delivery/artifact
          if-no-files-found: error
          retention-days: 90
      - id: repair_claim
        name: Claim one mirror-comment repair attempt
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-nonexecuting-request-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          delivery_dir="$RUNNER_TEMP/catalog-nonexecuting-request-delivery"
          if [ "${{ needs.routing_snapshot.outputs.request_receipt_orphan }}" = "true" ]; then
            delivery_dir="$RUNNER_TEMP/catalog-request-orphan-delivery"
          fi
          cmp --silent "$delivery_dir/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back, append exactly once
        if: ${{ steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: >-
            ${{ steps.receipt.outputs.issue_number ||
            needs.filter.outputs.issue_number }}
          ORPHAN: ${{ needs.routing_snapshot.outputs.request_receipt_orphan }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_mirror.outputs.existing_artifact_id ||
            steps.mirror.outputs.artifact-id }}
          RECEIPT_SHA256: ${{ steps.reconcile_mirror.outputs.payload_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ORPHAN" = "true" ]; then
            [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
            [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
            [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$ISSUE_NUMBER" = "${{ needs.filter.outputs.issue_number }}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-request-orphan-mirror-final.zip"
            mkdir "$RUNNER_TEMP/catalog-request-orphan-mirror-final"
            unzip -q "$RUNNER_TEMP/catalog-request-orphan-mirror-final.zip" -d "$RUNNER_TEMP/catalog-request-orphan-mirror-final"
            cmp --silent "$RUNNER_TEMP/catalog-request-orphan-delivery/request-receipt.json" "$RUNNER_TEMP/catalog-request-orphan-mirror-final/request-receipt.json"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          body = (root / "catalog-request-orphan-delivery" / "comment.md").read_text("utf-8")
          (root / "catalog-request-orphan-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$RUNNER_TEMP/catalog-request-orphan-comment-request.json" \
              > "$RUNNER_TEMP/catalog-request-orphan-post-response.json"
            exit 0
          fi
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-nonexecuting-request-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-nonexecuting-request-mirror"
          unzip -q "$RUNNER_TEMP/catalog-nonexecuting-request-mirror.zip" -d "$RUNNER_TEMP/catalog-nonexecuting-request-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-nonexecuting-request-delivery/request-receipt.json" "$RUNNER_TEMP/catalog-nonexecuting-request-mirror/request-receipt.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-nonexecuting-comments-before.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          body = (root / "catalog-nonexecuting-request-delivery" / "comment.md").read_text("utf-8")
          pages = json.loads((root / "catalog-nonexecuting-comments-before.json").read_text("utf-8"))
          comments = [row for page in pages for row in page]
          exact = [
              row for row in comments
              if row.get("body") == body
              and (row.get("user") or {}).get("login") == "github-actions[bot]"
              and row.get("created_at") == row.get("updated_at")
          ]
          if len(exact) > 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_DUPLICATE")
          (root / "catalog-nonexecuting-post-required.txt").write_text(
              "false\n" if exact else "true\n", encoding="utf-8"
          )
          (root / "catalog-nonexecuting-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          if [ "$(cat "$RUNNER_TEMP/catalog-nonexecuting-post-required.txt")" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$RUNNER_TEMP/catalog-nonexecuting-comment-request.json" >/dev/null
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-nonexecuting-comments-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          body = (root / "catalog-nonexecuting-request-delivery" / "comment.md").read_text("utf-8")
          pages = json.loads((root / "catalog-nonexecuting-comments-after.json").read_text("utf-8"))
          exact = [
              row for page in pages for row in page
              if row.get("body") == body
              and (row.get("user") or {}).get("login") == "github-actions[bot]"
              and row.get("created_at") == row.get("updated_at")
          ]
          if len(exact) != 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_READBACK_INVALID")
          PY

      - id: orphan_readback
        name: Verify the repaired receipt through a fresh complete snapshot
        if: ${{ needs.routing_snapshot.outputs.request_receipt_orphan == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.filter.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-request-orphan-readback"
          test ! -f "$RUNNER_TEMP/catalog-request-orphan-readback/request-receipt-orphan.json"
      - name: Preserve the bounded repair read-back
        if: ${{ needs.routing_snapshot.outputs.request_receipt_orphan == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-request-receipt-repair-${{ steps.reconcile_mirror.outputs.payload_sha256 }}
          path: ${{ runner.temp }}/catalog-request-orphan-readback
          if-no-files-found: error
          retention-days: 90

  record_running:
    name: record_running
    needs: [admission, reserve]
    if: ${{ needs.reserve.outputs.authority_committed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-authority-admission-v1
      cancel-in-progress: false
    outputs:
      authority_execution_state_committed: ${{ steps.verify.outputs.authority_committed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admission.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-decision-${{ needs.admission.outputs.decision_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-decision
      - name: Recheck the complete dual ledger before RUNNING
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ISSUE_NUMBER" -gt 0
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-running-before"
      - id: prepare
        name: Prepare RUNNING or verify the current RECOVERING owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_authority_record.py \
            --mode running \
            --decision "$RUNNER_TEMP/catalog-admission-decision/controller-decision/decision.json" \
            --routing-command "$RUNNER_TEMP/catalog-running-before/routing-command.json" \
            --output-dir "$RUNNER_TEMP/catalog-running-record" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_mirror
        name: Reconcile any orphaned RUNNING mirror before writing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind authority \
            --candidate "$RUNNER_TEMP/catalog-running-record/record.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-running-record/comment.md" \
            --comments-document "$RUNNER_TEMP/catalog-running-before/authority-comments.json" \
            --output-dir "$RUNNER_TEMP/catalog-running-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: mirror
        name: Mirror RUNNING before appending its exact comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-running-delivery/record.json
          if-no-files-found: error
          retention-days: 90
      - id: repair_claim
        name: Claim one mirror-comment repair attempt
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-running-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-running-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back the mirror and append the exact RUNNING comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_mirror.outputs.existing_artifact_id ||
            steps.mirror.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-running-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-running-mirror"
          unzip -q "$RUNNER_TEMP/catalog-running-mirror.zip" -d "$RUNNER_TEMP/catalog-running-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-running-delivery/record.json" "$RUNNER_TEMP/catalog-running-mirror/record.json"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          body = Path(os.environ["RUNNER_TEMP"], "catalog-running-delivery", "comment.md").read_text("utf-8")
          Path(os.environ["RUNNER_TEMP"], "catalog-running-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          authority_number="$(python -c "import json; print(json.load(open('config/catalog_authority_anchor_v1.json', encoding='utf-8'))['issue_number'])")"
          [[ "$authority_number" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$authority_number/comments" \
            --input "$RUNNER_TEMP/catalog-running-comment-request.json" \
            > "$RUNNER_TEMP/catalog-running-posted-comment.json"
      - name: Capture the complete post-RUNNING dual ledger
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-running-after"
      - id: verify
        name: Expose the execution gate only after complete read-back
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_catalog_authority_record.py \
            --candidate "$RUNNER_TEMP/catalog-running-record/candidate.json" \
            --routing-command "$RUNNER_TEMP/catalog-running-after/routing-command.json" \
            --output "$RUNNER_TEMP/catalog-running-verified.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve the verified execution-state receipt
        if: ${{ steps.verify.outputs.authority_committed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-authority-running-receipt-${{ steps.verify.outputs.record_sha256 }}
          path: ${{ runner.temp }}/catalog-running-verified.json
          if-no-files-found: error
          retention-days: 90

  engine_optimized_catalog_v1:
    needs: [admission, reserve, record_running]
    if: >-
      needs.admission.outputs.call_engine == 'true' &&
      needs.reserve.outputs.authority_committed == 'true' &&
      needs.record_running.outputs.authority_execution_state_committed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/catalog-optimized-run.yml
    with:
      request_sha256: ${{ needs.admission.outputs.request_sha256 }}
      authority_id: ${{ needs.admission.outputs.authority_id }}
      campaign_id: ${{ needs.admission.outputs.campaign_id }}
      science_sha256: ${{ needs.admission.outputs.science_sha256 }}
      execution_plan_sha256: ${{ needs.admission.outputs.execution_plan_sha256 }}
      execution_protocol_sha256: ${{ needs.admission.outputs.execution_protocol_sha256 }}
      protected_commit_sha: ${{ needs.admission.outputs.protected_commit_sha }}
      decision_sha256: ${{ needs.admission.outputs.decision_sha256 }}

  record_nonterminal_wait:
    name: record_nonterminal_wait
    needs: [admission, engine_optimized_catalog_v1]
    if: ${{ always() && needs.engine_optimized_catalog_v1.outputs.campaign_state == 'WAITING_RETRY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-authority-admission-v1
      cancel-in-progress: false
    outputs:
      authority_wait_committed: ${{ steps.verify.outputs.authority_committed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admission.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-decision-${{ needs.admission.outputs.decision_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-decision
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-engine-outcome-${{ needs.admission.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-engine-outcome
      - name: Recheck the complete dual ledger before WAITING_RETRY
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-wait-before"
      - id: prepare
        name: Prepare the exact nonterminal WAITING_RETRY record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_authority_record.py \
            --mode waiting_retry \
            --decision "$RUNNER_TEMP/catalog-admission-decision/controller-decision/decision.json" \
            --routing-command "$RUNNER_TEMP/catalog-wait-before/routing-command.json" \
            --evidence-sha256 "${{ needs.engine_optimized_catalog_v1.outputs.outcome_evidence_sha256 }}" \
            --failure-fingerprint "${{ needs.engine_optimized_catalog_v1.outputs.failure_fingerprint }}" \
            --failure-occurrence-count "${{ needs.engine_optimized_catalog_v1.outputs.failure_occurrence_count }}" \
            --reason-code "${{ needs.engine_optimized_catalog_v1.outputs.failure_reason_code }}" \
            --output-dir "$RUNNER_TEMP/catalog-wait-record" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_mirror
        name: Reconcile any orphaned WAITING_RETRY mirror before writing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind authority \
            --candidate "$RUNNER_TEMP/catalog-wait-record/record.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-wait-record/comment.md" \
            --comments-document "$RUNNER_TEMP/catalog-wait-before/authority-comments.json" \
            --output-dir "$RUNNER_TEMP/catalog-wait-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: mirror
        name: Mirror WAITING_RETRY before its exact comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-wait-delivery/record.json
          if-no-files-found: error
          retention-days: 90
      - id: repair_claim
        name: Claim one mirror-comment repair attempt
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-wait-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: ${{ steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-wait-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back the WAITING_RETRY mirror and append its comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_mirror.outputs.existing_artifact_id ||
            steps.mirror.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-wait-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-wait-mirror"
          unzip -q "$RUNNER_TEMP/catalog-wait-mirror.zip" -d "$RUNNER_TEMP/catalog-wait-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-wait-delivery/record.json" "$RUNNER_TEMP/catalog-wait-mirror/record.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          body = Path(os.environ["RUNNER_TEMP"], "catalog-wait-delivery", "comment.md").read_text("utf-8")
          Path(os.environ["RUNNER_TEMP"], "catalog-wait-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          authority_number="$(python -c "import json; print(json.load(open('config/catalog_authority_anchor_v1.json', encoding='utf-8'))['issue_number'])")"
          [[ "$authority_number" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$authority_number/comments" \
            --input "$RUNNER_TEMP/catalog-wait-comment-request.json" \
            > "$RUNNER_TEMP/catalog-wait-posted-comment.json"
      - name: Capture the complete post-WAITING_RETRY dual ledger
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-wait-after"
      - id: verify
        name: Verify WAITING_RETRY from the fresh dual ledger
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_catalog_authority_record.py \
            --candidate "$RUNNER_TEMP/catalog-wait-record/candidate.json" \
            --routing-command "$RUNNER_TEMP/catalog-wait-after/routing-command.json" \
            --output "$RUNNER_TEMP/catalog-wait-verified.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve the verified WAITING_RETRY receipt
        if: ${{ steps.verify.outputs.authority_committed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-authority-wait-receipt-${{ steps.verify.outputs.record_sha256 }}
          path: ${{ runner.temp }}/catalog-wait-verified.json
          if-no-files-found: error
          retention-days: 90
      - id: request
        name: Prepare the exact nonterminal request status receipt
        if: ${{ steps.verify.outputs.authority_committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_request_receipt.py \
            --mode waiting-retry \
            --authority-candidate "$RUNNER_TEMP/catalog-wait-record/candidate.json" \
            --engine-outcome "$RUNNER_TEMP/catalog-engine-outcome/catalog-engine-outcome-v1.json" \
            --request-receipts "$RUNNER_TEMP/catalog-wait-before/request-receipts.json" \
            --output-dir "$RUNNER_TEMP/catalog-wait-request-receipt" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_request_mirror
        name: Reconcile any orphaned WAITING_RETRY request receipt
        if: ${{ steps.request.outputs.receipt_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind request \
            --candidate "$RUNNER_TEMP/catalog-wait-request-receipt/request-receipt.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-wait-request-receipt/comment.md" \
            --output-dir "$RUNNER_TEMP/catalog-wait-request-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: request_mirror
        name: Mirror WAITING_RETRY request status before posting it
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_request_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-wait-request-delivery/artifact
          if-no-files-found: error
          retention-days: 90
      - id: request_repair_claim
        name: Claim one mirror-comment repair attempt
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_request_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-wait-request-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.request_repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-wait-request-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back and post the exact nonterminal request status once
        if: ${{ steps.request.outputs.receipt_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_request_mirror.outputs.existing_artifact_id ||
            steps.request_mirror.outputs.artifact-id }}
          RECEIPT_SHA256: ${{ steps.reconcile_request_mirror.outputs.payload_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-wait-request-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-wait-request-mirror"
          unzip -q "$RUNNER_TEMP/catalog-wait-request-mirror.zip" -d "$RUNNER_TEMP/catalog-wait-request-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-wait-request-delivery/request-receipt.json" "$RUNNER_TEMP/catalog-wait-request-mirror/request-receipt.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-wait-request-comments-before.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          body = (root / "catalog-wait-request-delivery" / "comment.md").read_text("utf-8")
          pages = json.loads((root / "catalog-wait-request-comments-before.json").read_text("utf-8"))
          exact = [
              row for page in pages for row in page
              if row.get("body") == body
              and (row.get("user") or {}).get("login") == "github-actions[bot]"
              and row.get("created_at") == row.get("updated_at")
          ]
          if len(exact) > 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_DUPLICATE")
          (root / "catalog-wait-request-post-required.txt").write_text(
              "false\n" if exact else "true\n", encoding="utf-8"
          )
          (root / "catalog-wait-request-comment.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          if [ "$(cat "$RUNNER_TEMP/catalog-wait-request-post-required.txt")" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$RUNNER_TEMP/catalog-wait-request-comment.json" >/dev/null
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-wait-request-comments-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          body = (root / "catalog-wait-request-delivery" / "comment.md").read_text("utf-8")
          pages = json.loads((root / "catalog-wait-request-comments-after.json").read_text("utf-8"))
          exact = [
              row for page in pages for row in page
              if row.get("body") == body
              and (row.get("user") or {}).get("login") == "github-actions[bot]"
              and row.get("created_at") == row.get("updated_at")
          ]
          if len(exact) != 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_READBACK_INVALID")
          PY

  prepare_terminal_evidence:
    needs:
      - prepare_admission_candidates
      - admission
      - record_running
      - engine_optimized_catalog_v1
      - record_nonterminal_wait
    if: >-
      ${{ always() &&
      needs.admission.outputs.authority_id != '' &&
      needs.record_running.outputs.authority_execution_state_committed == 'true' &&
      needs.record_nonterminal_wait.result == 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      protected_commit_sha: ${{ steps.index.outputs.protected_commit_sha }}
      controls_commit_sha: ${{ needs.admission.outputs.controls_commit_sha }}
      audit_context_sha256: ${{ steps.index.outputs.audit_context_sha256 }}
      prepared_evidence_sha256: ${{ steps.index.outputs.prepared_evidence_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admission.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-decision-${{ needs.admission.outputs.decision_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-decision
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ needs.admission.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-sealed-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-live-controls-admission-${{ needs.prepare_admission_candidates.outputs.audit_context_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-controls
      - name: Download the explicit engine outcome when it exists
        if: ${{ needs.engine_optimized_catalog_v1.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-engine-outcome-${{ needs.admission.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-engine-outcome
      - name: Download the bound runtime/prepared seal if reached
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-runtime-prepared-seal-${{ needs.admission.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-runtime-prepared
      - name: Download the component seal if reached
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-component-store-seal-${{ needs.admission.outputs.authority_id }}
          path: ${{ runner.temp }}/catalog-component-seal
      - name: Download the final root if reached
        if: ${{ needs.engine_optimized_catalog_v1.outputs.final_evidence_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_optimized_catalog_v1.outputs.final_evidence_artifact }}
          path: ${{ runner.temp }}/catalog-final-root
      - name: Download terminal science if reached
        if: ${{ needs.engine_optimized_catalog_v1.outputs.science_evidence_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_optimized_catalog_v1.outputs.science_evidence_artifact }}
          path: ${{ runner.temp }}/catalog-terminal-science
      - name: Download runtime audit if reached
        if: ${{ needs.engine_optimized_catalog_v1.outputs.runtime_audit_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_optimized_catalog_v1.outputs.runtime_audit_artifact }}
          path: ${{ runner.temp }}/catalog-runtime-audit
      - name: Download recovery evidence if reached
        if: ${{ needs.engine_optimized_catalog_v1.outputs.recovery_evidence_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_optimized_catalog_v1.outputs.recovery_evidence_artifact }}
          path: ${{ runner.temp }}/catalog-recovery-evidence
      - name: Capture one fresh read-only lifecycle and dual-ledger snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-terminal-routing"
      - id: index
        name: Verify and bind the fixed pre-audit evidence set
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_terminal_evidence.py \
            --repo-root . \
            --admission-root "$RUNNER_TEMP/catalog-admission-decision" \
            --sealed-plan "$RUNNER_TEMP/catalog-sealed-plan" \
            --routing-root "$RUNNER_TEMP/catalog-terminal-routing" \
            --admission-controls "$RUNNER_TEMP/catalog-admission-controls/catalog_github_controls_receipt_v1.json" \
            --engine-outcome-root "$RUNNER_TEMP/catalog-engine-outcome" \
            --runtime-prepared-root "$RUNNER_TEMP/catalog-runtime-prepared" \
            --component-seal-root "$RUNNER_TEMP/catalog-component-seal" \
            --final-root "$RUNNER_TEMP/catalog-final-root" \
            --science-root "$RUNNER_TEMP/catalog-terminal-science" \
            --runtime-audit-root "$RUNNER_TEMP/catalog-runtime-audit" \
            --recovery-root "$RUNNER_TEMP/catalog-recovery-evidence" \
            --engine-result "${{ needs.engine_optimized_catalog_v1.result }}" \
            --output-dir "$RUNNER_TEMP/catalog-prepared-terminal-evidence" \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish only the bounded prepared terminal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-prepared-terminal-evidence-${{ steps.index.outputs.prepared_evidence_sha256 }}
          path: ${{ runner.temp }}/catalog-prepared-terminal-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  live_controls_audit_before_terminal:
    needs: prepare_terminal_evidence
    if: ${{ needs.prepare_terminal_evidence.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: catalog-production
    permissions:
      actions: read
      contents: read
    concurrency:
      group: catalog-live-controls-audit-v1
      queue: max
      cancel-in-progress: false
    outputs:
      receipt_artifact_name: ${{ steps.controls.outputs.receipt_artifact_name }}
      receipt_sha256: ${{ steps.controls.outputs.receipt_sha256 }}
      receipt_status: ${{ steps.controls.outputs.receipt_status }}
    steps:
      - name: Check out the exact protected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: trading-optimizer-lab-org/aurora
          ref: ${{ needs.prepare_terminal_evidence.outputs.controls_commit_sha }}
          persist-credentials: false
      - id: controls
        name: Run protected read-only audit
        uses: ./.github/actions/catalog-live-controls-audit
        with:
          purpose: terminal
          caller-workflow: .github/workflows/catalog-run-controller.yml
          caller-job: live_controls_audit_before_terminal
          protected-commit-sha: ${{ needs.prepare_terminal_evidence.outputs.controls_commit_sha }}
          audit-context-sha256: ${{ needs.prepare_terminal_evidence.outputs.audit_context_sha256 }}
          auditor-app-id: ${{ vars.AURORA_CATALOG_AUDITOR_APP_ID }}
          auditor-private-key: ${{ secrets.AURORA_CATALOG_AUDITOR_PRIVATE_KEY }}
          enterprise-billing-token: ${{ secrets.AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN }}
          enterprise-cache-verifier-token: ${{ secrets.AURORA_CATALOG_ENTERPRISE_CACHE_VERIFIER_TOKEN }}
          package-inventory-token: ${{ secrets.AURORA_CATALOG_PACKAGE_INVENTORY_TOKEN }}

  prepare_terminal_decision:
    needs: [prepare_terminal_evidence, live_controls_audit_before_terminal]
    if: ${{ needs.live_controls_audit_before_terminal.outputs.receipt_status == 'ready' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_artifact_name: ${{ steps.bundle.outputs.candidate_artifact_name }}
      state: ${{ steps.finalizer.outputs.state }}
      reason_code: ${{ steps.finalizer.outputs.reason_code }}
      terminal_decision_sha256: ${{ steps.finalizer.outputs.terminal_decision_sha256 }}
      authority_append_allowed: ${{ steps.finalizer.outputs.authority_append_allowed }}
      request_comment_allowed: ${{ steps.finalizer.outputs.request_comment_allowed }}
      standalone_incident_artifact_required: ${{ steps.finalizer.outputs.standalone_incident_artifact_required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare_terminal_evidence.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-prepared-terminal-evidence-${{ needs.prepare_terminal_evidence.outputs.prepared_evidence_sha256 }}
          path: ${{ runner.temp }}/catalog-prepared-terminal-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.live_controls_audit_before_terminal.outputs.receipt_artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-controls
      - name: Bind the fresh terminal controls receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_terminal_decision.py \
            --prepared-root "$RUNNER_TEMP/catalog-prepared-terminal-evidence" \
            --terminal-controls "$RUNNER_TEMP/catalog-terminal-controls/catalog_github_controls_receipt_v1.json" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-envelope"
      - id: finalizer
        name: Render the only pure terminal candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_catalog_controller_run.py \
            --decision "$RUNNER_TEMP/catalog-terminal-envelope/finalizer-envelope.json" \
            --authority-issue "$RUNNER_TEMP/catalog-terminal-envelope/external/authority_issue.json" \
            --authority-comments "$RUNNER_TEMP/catalog-terminal-envelope/external/authority_comments.json" \
            --authority-mirrors "$RUNNER_TEMP/catalog-terminal-envelope/external/authority_mirrors.json" \
            --authority-timeline "$RUNNER_TEMP/catalog-terminal-envelope/external/authority_timeline.json" \
            --authority-anchor "$RUNNER_TEMP/catalog-terminal-envelope/external/authority_anchor.json" \
            --request-issue "$RUNNER_TEMP/catalog-terminal-envelope/external/request_issue.json" \
            --request-timeline "$RUNNER_TEMP/catalog-terminal-envelope/external/request_timeline.json" \
            --request-receipts "$RUNNER_TEMP/catalog-terminal-envelope/external/request_receipts.json" \
            --tamper-incidents "$RUNNER_TEMP/catalog-terminal-envelope/external/tamper_incidents.json" \
            --github-controls-before-reserve "$RUNNER_TEMP/catalog-terminal-envelope/external/github_controls_before_reserve.json" \
            --github-controls-before-terminal "$RUNNER_TEMP/catalog-terminal-envelope/external/github_controls_before_terminal.json" \
            --final-evidence-directory "$RUNNER_TEMP/catalog-terminal-envelope/evidence" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-finalizer" \
            --github-output "$GITHUB_OUTPUT"
      - id: bundle
        name: Freeze the bounded terminal-candidate artifact name
        shell: bash
        run: |
          set -euo pipefail
          name="catalog-terminal-candidate-${{ steps.finalizer.outputs.terminal_decision_sha256 }}"
          echo "candidate_artifact_name=$name" >> "$GITHUB_OUTPUT"
      - name: Publish the bounded terminal candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.bundle.outputs.candidate_artifact_name }}
          path: |
            ${{ runner.temp }}/catalog-terminal-envelope
            ${{ runner.temp }}/catalog-terminal-finalizer
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  finalize:
    name: finalize
    needs:
      - filter
      - admission
      - prepare_terminal_evidence
      - prepare_terminal_decision
    if: ${{ always() && needs.prepare_terminal_decision.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    concurrency:
      group: catalog-authority-admission-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.admission.outputs.protected_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.prepare_terminal_decision.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-admission-decision-${{ needs.admission.outputs.decision_sha256 }}
          path: ${{ runner.temp }}/catalog-admission-decision
      - name: Recheck the complete lifecycle and dual ledger under the writer lock
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-finalize-before"
      - id: prepare
        name: Recheck audit freshness and prepare the only terminal authority record
        if: ${{ needs.prepare_terminal_decision.outputs.authority_append_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_authority_record.py \
            --mode terminal \
            --decision "$RUNNER_TEMP/catalog-admission-decision/controller-decision/decision.json" \
            --routing-command "$RUNNER_TEMP/catalog-finalize-before/routing-command.json" \
            --terminal-decision "$RUNNER_TEMP/catalog-terminal-candidate/catalog-terminal-finalizer/catalog_terminal_decision.json" \
            --terminal-controls "$RUNNER_TEMP/catalog-terminal-candidate/catalog-terminal-envelope/external/github_controls_before_terminal.json" \
            --audit-context-sha256 "${{ needs.prepare_terminal_evidence.outputs.audit_context_sha256 }}" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-record" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_mirror
        name: Reconcile any orphaned terminal authority mirror
        if: ${{ steps.prepare.outputs.record_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind authority \
            --candidate "$RUNNER_TEMP/catalog-terminal-record/record.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-terminal-record/comment.md" \
            --comments-document "$RUNNER_TEMP/catalog-finalize-before/authority-comments.json" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-authority-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: mirror
        name: Mirror the terminal authority record before its comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-authority-delivery/record.json
          if-no-files-found: error
          retention-days: 90
      - id: authority_repair_claim
        name: Claim one mirror-comment repair attempt
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-authority-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.authority_repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-terminal-authority-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back the terminal mirror and append its exact authority comment
        if: >-
          ${{ steps.prepare.outputs.append_required == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_mirror.outputs.existing_artifact_id ||
            steps.mirror.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-terminal-record-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-terminal-record-mirror"
          unzip -q "$RUNNER_TEMP/catalog-terminal-record-mirror.zip" -d "$RUNNER_TEMP/catalog-terminal-record-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-terminal-authority-delivery/record.json" "$RUNNER_TEMP/catalog-terminal-record-mirror/record.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          body = Path(os.environ["RUNNER_TEMP"], "catalog-terminal-authority-delivery", "comment.md").read_text("utf-8")
          Path(os.environ["RUNNER_TEMP"], "catalog-terminal-comment-request.json").write_text(
              json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          authority_number="$(python -c "import json; print(json.load(open('config/catalog_authority_anchor_v1.json', encoding='utf-8'))['issue_number'])")"
          [[ "$authority_number" =~ ^[0-9]+$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$authority_number/comments" \
            --input "$RUNNER_TEMP/catalog-terminal-comment-request.json" \
            > "$RUNNER_TEMP/catalog-terminal-posted-comment.json"
      - name: Capture the complete post-terminal dual ledger
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action != 'idempotent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.admission.outputs.request_issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_catalog_routing_snapshot.py \
            --issue-number "$ISSUE_NUMBER" \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-finalize-after"
      - id: verify
        name: Verify the exact terminal record from fresh read-back
        if: >-
          ${{ steps.prepare.outputs.commit_allowed == 'true' &&
          steps.reconcile_mirror.outputs.action == 'upload_new' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_catalog_authority_record.py \
            --candidate "$RUNNER_TEMP/catalog-terminal-record/candidate.json" \
            --routing-command "$RUNNER_TEMP/catalog-finalize-after/routing-command.json" \
            --output "$RUNNER_TEMP/catalog-terminal-authority-verified.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve the verified terminal authority receipt
        if: ${{ steps.verify.outputs.authority_committed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-authority-terminal-receipt-${{ steps.verify.outputs.record_sha256 }}
          path: ${{ runner.temp }}/catalog-terminal-authority-verified.json
          if-no-files-found: error
          retention-days: 90
      - id: request
        name: Prepare the terminal request receipt and atomic close payload
        if: >-
          ${{ steps.verify.outputs.authority_committed == 'true' &&
          needs.prepare_terminal_decision.outputs.request_comment_allowed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_catalog_terminal_request_receipt.py \
            --terminal-decision "$RUNNER_TEMP/catalog-terminal-candidate/catalog-terminal-finalizer/catalog_terminal_decision.json" \
            --authority-candidate "$RUNNER_TEMP/catalog-terminal-record/candidate.json" \
            --summary "$RUNNER_TEMP/catalog-terminal-candidate/catalog-terminal-finalizer/catalog_run_summary.md" \
            --request-receipts "$RUNNER_TEMP/catalog-finalize-before/request-receipts.json" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-request-receipt" \
            --github-output "$GITHUB_OUTPUT"
      - id: reconcile_request_mirror
        name: Reconcile any orphaned terminal request receipt
        if: ${{ steps.request.outputs.receipt_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_catalog_mirror_delivery.py \
            --kind request \
            --candidate "$RUNNER_TEMP/catalog-terminal-request-receipt/request-receipt.json" \
            --candidate-comment "$RUNNER_TEMP/catalog-terminal-request-receipt/comment.md" \
            --output-dir "$RUNNER_TEMP/catalog-terminal-request-delivery" \
            --github-output "$GITHUB_OUTPUT"
      - id: request_mirror
        name: Mirror the terminal request receipt before its comment
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'upload_new' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_request_mirror.outputs.artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-request-delivery/artifact
          if-no-files-found: error
          retention-days: 90
      - id: request_repair_claim
        name: Claim one mirror-comment repair attempt
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'repair_comment' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.reconcile_request_mirror.outputs.repair_claim_artifact_name }}
          path: ${{ runner.temp }}/catalog-terminal-request-delivery/repair-claim.json
          if-no-files-found: error
          retention-days: 90
      - name: Read back the repair claim before any repaired comment
        if: >-
          ${{ steps.request.outputs.receipt_sha256 != '' &&
          steps.reconcile_request_mirror.outputs.action == 'repair_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_CLAIM_ARTIFACT_ID: ${{ steps.request_repair_claim.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPAIR_CLAIM_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$REPAIR_CLAIM_ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-mirror-repair-claim.zip"
          mkdir "$RUNNER_TEMP/catalog-mirror-repair-claim"
          unzip -q "$RUNNER_TEMP/catalog-mirror-repair-claim.zip" -d "$RUNNER_TEMP/catalog-mirror-repair-claim"
          cmp --silent "$RUNNER_TEMP/catalog-terminal-request-delivery/repair-claim.json" "$RUNNER_TEMP/catalog-mirror-repair-claim/repair-claim.json"
      - name: Read back the request mirror, post once, verify, and atomically close
        if: ${{ steps.request.outputs.receipt_sha256 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.request.outputs.issue_number }}
          ARTIFACT_ID: >-
            ${{ steps.reconcile_request_mirror.outputs.existing_artifact_id ||
            steps.request_mirror.outputs.artifact-id }}
          RECEIPT_SHA256: ${{ steps.reconcile_request_mirror.outputs.payload_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/catalog-request-mirror.zip"
          mkdir "$RUNNER_TEMP/catalog-request-mirror"
          unzip -q "$RUNNER_TEMP/catalog-request-mirror.zip" -d "$RUNNER_TEMP/catalog-request-mirror"
          cmp --silent "$RUNNER_TEMP/catalog-terminal-request-delivery/request-receipt.json" "$RUNNER_TEMP/catalog-request-mirror/request-receipt.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-request-comments-before.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          pages = json.loads((root / "catalog-request-comments-before.json").read_text("utf-8"))
          comments = [row for page in pages for row in page]
          receipt_sha = os.environ["RECEIPT_SHA256"]
          exact = [row for row in comments if receipt_sha in (row.get("body") or "")]
          if len(exact) > 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_DUPLICATE")
          if not exact:
              body = (root / "catalog-terminal-request-delivery" / "comment.md").read_text("utf-8")
              (root / "catalog-terminal-request-comment.json").write_text(
                  json.dumps({"body": body}, sort_keys=True, separators=(",", ":")),
                  encoding="utf-8",
              )
              (root / "catalog-request-post-required.txt").write_text("true\n", encoding="utf-8")
          else:
              (root / "catalog-request-post-required.txt").write_text("false\n", encoding="utf-8")
          PY
          if [ "$(cat "$RUNNER_TEMP/catalog-request-post-required.txt")" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --input "$RUNNER_TEMP/catalog-terminal-request-comment.json" >/dev/null
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/catalog-request-comments-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          pages = json.loads(Path(os.environ["RUNNER_TEMP"], "catalog-request-comments-after.json").read_text("utf-8"))
          comments = [row for page in pages for row in page]
          receipt_sha = os.environ["RECEIPT_SHA256"]
          exact = [
              row for row in comments
              if receipt_sha in (row.get("body") or "")
              and (row.get("user") or {}).get("login") == "github-actions[bot]"
              and row.get("created_at") == row.get("updated_at")
          ]
          if len(exact) != 1:
              raise SystemExit("CATALOG_REQUEST_RECEIPT_READBACK_INVALID")
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            --input "$RUNNER_TEMP/catalog-terminal-request-receipt/terminal-issue-patch.json" \
            > "$RUNNER_TEMP/catalog-terminal-issue-patch-response.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" \
            > "$RUNNER_TEMP/catalog-terminal-issue-readback.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          expected_number = int(os.environ["ISSUE_NUMBER"])
          documents = [
              json.loads((root / name).read_text("utf-8"))
              for name in (
                  "catalog-terminal-issue-patch-response.json",
                  "catalog-terminal-issue-readback.json",
              )
          ]
          for issue in documents:
              labels = sorted(row.get("name") for row in issue.get("labels", []))
              if (
                  issue.get("number") != expected_number
                  or issue.get("state") != "closed"
                  or issue.get("state_reason") != "completed"
                  or labels != ["catalog-run-terminal-v1"]
                  or (issue.get("closed_by") or {}).get("login")
                  != "github-actions[bot]"
              ):
                  raise SystemExit("CATALOG_REQUEST_TERMINAL_READBACK_INVALID")
          PY
      - name: Preserve a standalone incident without mutating damaged governance
        if: ${{ needs.prepare_terminal_decision.outputs.standalone_incident_artifact_required == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-terminal-incident-${{ needs.prepare_terminal_decision.outputs.terminal_decision_sha256 }}
          path: ${{ runner.temp }}/catalog-terminal-candidate/catalog-terminal-finalizer/catalog_standalone_incident.json
          if-no-files-found: error
          retention-days: 90
