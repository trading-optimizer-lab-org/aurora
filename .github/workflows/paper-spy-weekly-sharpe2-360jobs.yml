name: Paper SPY Weekly Sharpe2 360 Jobs

on:
  workflow_dispatch:
    inputs:
      configs_per_stage:
        description: "Configs tested per stage"
        required: true
        default: "30000"
      time_budget_minutes:
        description: "Clean internal stage runtime before upload"
        required: true
        default: "45"
      max_parallel_requested:
        description: "Requested concurrent jobs"
        required: true
        default: "360"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_spy_weekly_sharpe2_360jobs

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download no-locked paper feature data
        run: python scripts/run_paper_spy_weekly_sharpe2.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-weekly-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}/*

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    steps:
      - name: Build 360-stage balanced matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          full = [{"stage": stage} for stage in range(360)]
          print("matrix_a=" + json.dumps(full[:180]))
          print("matrix_b=" + json.dumps(full[180:]))
          PY

  search_a:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: 65
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-spy-weekly-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Run paper SPY weekly Sharpe2 stage
        run: |
          python scripts/run_paper_spy_weekly_sharpe2.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}"
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-weekly-sharpe2-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_${{ matrix.stage }}

  search_b:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: 65
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps

  merge:
    runs-on: ubuntu-latest
    needs: [data, search_a, search_b]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-spy-weekly-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper-spy-weekly-sharpe2-stage-*
          path: ${{ env.OUTPUT_DIR }}/shards
          merge-multiple: true
      - name: Merge stages
        run: python scripts/run_paper_spy_weekly_sharpe2.py --mode merge --output-dir "$OUTPUT_DIR"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-weekly-sharpe2-360jobs-results
          path: ${{ env.OUTPUT_DIR }}
