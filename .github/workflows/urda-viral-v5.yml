name: urda-viral-v5

# Short social edit with soundtrack: v3 sequences + v4 extra shots -> one film under 2:20.
# Runs only on a push to its own branch, so work on render/urda-chrono-v4 never starts it.

on:
  push:
    branches: [render/urda-viral-v5]

permissions:
  contents: read
  actions: read

concurrency:
  group: urda-viral-v5
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: render/urda
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: frames-*
          merge-multiple: true
          path: frames
          run-id: 40824487121
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: frames-late-*
          merge-multiple: true
          path: frames
          run-id: 40831984982
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: xframes-*
          merge-multiple: true
          path: frames
          run-id: 40858763387
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: stills-*
          merge-multiple: true
          path: stills
          run-id: 40824487121
          github-token: ${{ github.token }}
      - name: Edit, soundtrack and mux
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q pillow pyproj numpy
          for j in J1 J3 J4 J5 SIG ORB CAB; do echo "$j $(ls frames/$j | wc -l)"; done
          cd render/urda
          python viral.py ../../frames ../../stills ../../work ../../silent.mp4
          python sound.py ../../silent.mp4.cues.json ../../sound.wav
          cd ../..
          ffmpeg -loglevel error -y -i silent.mp4 -i sound.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k \
            -shortest -movflags +faststart urda_choque_trenes_1080p.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 urda_choque_trenes_1080p.mp4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: urda-video-v5
          path: urda_choque_trenes_1080p.mp4
          retention-days: 14
          compression-level: 0
