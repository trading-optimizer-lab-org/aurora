      contract_artifact_name: ${{ format('{0}-contract-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}
      plan_artifact_name: ${{ format('{0}-plan-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}

  final_merge:
    needs: [plan, freeze_contract, merge_level_0, merge_level_1, merge_level_2, merge_level_3]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (
        (
          needs.plan.outputs.merge_root_level == '0' &&
          needs.merge_level_0.result == 'success'
        ) ||
        (
          needs.plan.outputs.merge_root_level == '1' &&
          needs.merge_level_1.result == 'success'
        ) ||
        (
          needs.plan.outputs.merge_root_level == '2' &&
          needs.merge_level_2.result == 'success'
        ) ||
        (
          needs.plan.outputs.merge_root_level == '3' &&
          needs.merge_level_3.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      state_artifact_name: ${{ steps.state_identity.outputs.state_artifact_name }}
    env:
      MERGED_STATE_ARTIFACT_NAME: ${{ format('{0}-campaign-state-merged-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
      - name: Download merge root only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.plan.outputs.merge_root_artifact }}
          path: ${{ runner.temp }}/partials
      - name: Download preflight evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight
      - name: Download all recovery evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.run_label }}-recovery-wave-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-waves
      - name: Select latest successful recovery evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "recovery-waves"
          candidates = []
          for loop_path in source.rglob("recovery_loop.json"):
              payload = json.loads(loop_path.read_text(encoding="utf-8"))
              candidates.append((int(payload["current_wave"]), loop_path))
          if not candidates:
              raise SystemExit("RECOVERY_EVIDENCE_MISSING")
          _, selected = max(candidates)
          target = Path(os.environ["RUNNER_TEMP"]) / "recovery"
          target.mkdir(parents=True, exist_ok=True)
          for path in selected.parent.iterdir():
              if path.is_file():
                  shutil.copy2(path, target / path.name)
          PY
      - name: Download immutable campaign states
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ inputs.run_label }}-campaign-state-after-recovery-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/state-waves
      - name: Select latest immutable campaign state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "state-waves"
          candidates = []
          for pointer in source.rglob("campaign_state_latest.json"):
              payload = json.loads(pointer.read_text(encoding="utf-8"))
              candidates.append((int(payload["version"]), pointer))
          if not candidates:
              raise SystemExit("CAMPAIGN_STATE_MISSING")
          _, selected = max(candidates)
          target = Path(os.environ["RUNNER_TEMP"]) / "state"
          target.mkdir(parents=True, exist_ok=True)
          for path in selected.parent.iterdir():
              if path.is_file():
                  shutil.copy2(path, target / path.name)
          PY
      - name: Build final artifact and reconciliation
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          aurora github final-merge \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --partials-root "$RUNNER_TEMP/partials" \
            --plan-root "$RUNNER_TEMP/plan" \
            --contract-root "$RUNNER_TEMP/contract" \
            --preflight-root "$RUNNER_TEMP/preflight" \
            --recovery-root "$RUNNER_TEMP/recovery" \
            --output-dir "$RUNNER_TEMP/final"
      - name: Record verified merge sources and terminal units
        run: |
          set -euo pipefail
          readarray -t reconciliation < <(
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import pyarrow.parquet as pq

          root = Path(os.environ["RUNNER_TEMP"])
          path = root / "final" / "unit_reconciliation.parquet"
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          rows = pq.read_metadata(path).num_rows
          plan = json.loads(
              (root / "plan" / "merge_plan.json").read_text(
                  encoding="utf-8"
              )
          )
          print(digest)
          print(rows)
          print(plan["root_artifact"])
          PY
          )
          args=(
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json"
            --state-root "$RUNNER_TEMP/state"
            --phase merging
            --completed-unit-manifest-sha256 "${reconciliation[0]}"
            --completed-unit-count "${reconciliation[1]}"
            --pending-unit-count 0
          )
          for artifact in "${reconciliation[@]:2}"; do
            args+=(--verified-source-artifact "$artifact")
          done
          aurora github campaign-update "${args[@]}"
      - name: Emit merged campaign artifact identity
        id: state_identity
        run: |
          echo "state_artifact_name=$MERGED_STATE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload merged immutable campaign state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.MERGED_STATE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/state
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
      - name: Upload unsealed scientific stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-unsealed-final-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  collect_timeline:
    name: Collect GitHub timeline
    needs: final_merge
    if: always() && needs.final_merge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Collect read-only GitHub timing
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/collect_github_run_timeline.py \
            --spec "${{ inputs.spec_path }}" \
            --output-dir "$RUNNER_TEMP/timeline"
      - name: Upload bounded timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timeline
          if-no-files-found: warn
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  seal_final_artifact:
    name: Seal complete final artifact
    needs: [final_merge, collect_timeline]
    if: >-
      always() &&
      needs.final_merge.result == 'success' &&
      needs.collect_timeline.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download unsealed scientific stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-unsealed-final-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
      - name: Download timing evidence before seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-timeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
      - name: Seal telemetry, traceability, and scientific identity
        run: |
          set -euo pipefail
          aurora github seal-final-artifact \
            --spec "$RUNNER_TEMP/final/resolved_run_spec.json" \
            --root "$RUNNER_TEMP/final"
      - name: Upload sealed stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-sealed-final-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  verify:
    needs: [final_merge, seal_final_artifact]
    if: >-
      always() &&
      needs.final_merge.result == 'success' &&
      needs.seal_final_artifact.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERIFIED_STATE_ARTIFACT_NAME: ${{ format('{0}-campaign-state-verified-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download sealed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-sealed-final-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
      - name: Download merged campaign state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.final_merge.outputs.state_artifact_name }}
          path: ${{ runner.temp }}/state
      - name: Record verification start
        run: |
          set -euo pipefail
          aurora github campaign-update \
            --spec "$RUNNER_TEMP/final/resolved_run_spec.json" \
            --state-root "$RUNNER_TEMP/state" \
            --phase verifying
      - name: Independently reopen and verify every file
        id: scientific_verify
        run: |
          set -euo pipefail
          aurora github verify \
            --spec "$RUNNER_TEMP/final/resolved_run_spec.json" \
            --root "$RUNNER_TEMP/final"
      - name: Record completed campaign
        if: steps.scientific_verify.outcome == 'success'
        run: |
          set -euo pipefail
          aurora github campaign-update \
            --spec "$RUNNER_TEMP/final/resolved_run_spec.json" \
            --state-root "$RUNNER_TEMP/state" \
            --phase completed
      - name: Record blocked verification
        if: failure() && steps.scientific_verify.outcome == 'failure'
        run: |
          set -euo pipefail
          aurora github campaign-update \
            --spec "$RUNNER_TEMP/final/resolved_run_spec.json" \
            --state-root "$RUNNER_TEMP/state" \
            --phase blocked_hard_failure \
            --hard-failure-reason FINAL_VERIFICATION_FAILED
      - name: Upload verified immutable campaign state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.VERIFIED_STATE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/state
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
      - name: Upload verified stage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-verified-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  publish:
    name: Publish final artifact
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download verified stage
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-verified-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish
      - name: Publish final reader artifact
        if: needs.verify.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-results
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}
      - name: Preserve failed verification status
        if: needs.verify.result != 'success'
        run: |
          echo "::error::Aurora final verification did not pass"
          exit 1
