            python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "plan"
          units = json.loads(
              (root / "work_unit_manifest.json").read_text(encoding="utf-8")
          )
          plan = json.loads(
              (root / "balanced_shard_plan.json").read_text(encoding="utf-8")
          )
          print(units["sha256"])
          print(units["unit_count"])
          print(plan["plan_sha256"])
          PY
          )
          aurora github campaign-update \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --state-root "$RUNNER_TEMP/state" \
            --phase executing \
            --logical-unit-manifest-sha256 "${identities[0]}" \
            --logical-unit-count "${identities[1]}" \
            --active-plan-sha256 "${identities[2]}" \
