    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.merge_level_0.result == 'success' &&
      needs.plan.outputs.merge_level_1_count != '0'
    uses: ./.github/workflows/_aurora-merge-level-v3.yml
    with:
