name: Aurora Future Run v3

on:
  workflow_call:
    inputs:
      spec_path:
        description: Repository-relative version-3 run spec
        required: true
        type: string
      workload:
        description: Aurora workload reference, aurora.module:OBJECT
        required: true
        type: string
      run_label:
        description: Stable artifact prefix
        required: true
        type: string
      retention_days:
        description: Retention for intermediate and final artifacts
        required: false
        default: 7
        type: number
      execution_mode:
        description: Optimized weighted plan or equivalent baseline
        required: false
        default: optimized
        type: string
      forced_job_count:
        description: Exact baseline job count; zero lets the planner decide
        required: false
        default: 0
        type: number
      prepared_artifact_name:
        description: Existing immutable prepared-input artifact to reuse
        required: false
        default: ""
        type: string
      wheelhouse_artifact_name:
        description: Existing immutable wheelhouse artifact to reuse
        required: false
        default: ""
        type: string
      performance_profile_run_id:
        description: Prior compatible run containing a performance profile
        required: false
        default: ""
        type: string
      performance_profile_artifact_name:
        description: Artifact containing performance_profile.json
        required: false
        default: ""
        type: string
      fault_injection_shard_id:
        description: Test-only initial shard to fail after a valid checkpoint
        required: false
        default: ""
        type: string
      fault_injection_after_units:
        description: Test-only exact checkpoint boundary; zero disables it
        required: false
        default: 0
        type: number
    outputs:
      selected_jobs:
        description: Exact standard-runner shard count selected by the plan
        value: ${{ jobs.plan.outputs.selected_jobs }}
      profile_reused:
        description: Whether planning reused an exact compatible profile
        value: ${{ jobs.plan.outputs.profile_reused }}

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  AURORA_PREPARED_ARTIFACT_NAME: ${{ inputs.prepared_artifact_name || format('{0}-prepared-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}
  AURORA_WHEELHOUSE_ARTIFACT_NAME: ${{ inputs.wheelhouse_artifact_name || format('{0}-wheelhouse-{1}-{2}', inputs.run_label, github.run_id, github.run_attempt) }}

jobs:
  validate:
    needs: prepare_environment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        id: runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Validate requested contract
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          aurora github validate \
            --spec "$SPEC_PATH" \
            --output-dir "$RUNNER_TEMP/preflight"
          python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.github_performance.preflight import load_github_yaml

          payload = load_github_yaml(Path(os.environ["SPEC_PATH"]))
          supplied = str(payload["identity"]["code_sha"])
          observed = os.environ["TRIGGER_SHA"]
          if supplied not in ("", observed):
              raise SystemExit(
                  "CODE_SHA_MISMATCH: spec does not match triggering commit"
              )
          PY
      - name: Upload preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
      - name: Upload immutable environment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: environment_manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  prepare_environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      wheelhouse_sha256: ${{ steps.identity.outputs.wheelhouse_sha256 }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download shared immutable wheelhouse
        if: inputs.wheelhouse_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Set up build Python
        if: inputs.wheelhouse_artifact_name == ''
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Build immutable wheelhouse once
        if: inputs.wheelhouse_artifact_name == ''
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/build_github_performance_wheelhouse.py build \
            --requirements-lock requirements/github-performance.lock \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --code-sha "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch"
      - name: Read wheelhouse identity
        id: identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "wheelhouse"
               / "wheelhouse_manifest.json").read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(
                  f"wheelhouse_sha256={manifest['wheelhouse_sha256']}\n"
              )
          PY
      - name: Upload immutable wheelhouse
        if: inputs.wheelhouse_artifact_name == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  prepare_data:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download shared immutable inputs
        if: inputs.prepared_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
      - name: Prepare immutable data once
        if: inputs.prepared_artifact_name == ''
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          aurora github prepare \
            --spec "$SPEC_PATH" \
            --workload "$WORKLOAD" \
            --output-dir "$RUNNER_TEMP/prepared"
      - name: Upload prepared inputs
        if: inputs.prepared_artifact_name == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  freeze_contract:
    needs: [validate, prepare_environment, prepare_data]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-environment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
      - name: Freeze resolved scientific and performance contract
        env:
          SPEC_PATH: ${{ inputs.spec_path }}
        run: |
          set -euo pipefail
          metric_contract="$(
            python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.github_performance.preflight import load_github_yaml
          print(load_github_yaml(Path(os.environ["SPEC_PATH"]))["metrics"]["contract_path"])
          PY
          )"
          aurora github freeze-contract \
            --spec "$SPEC_PATH" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --environment-manifest "$RUNNER_TEMP/environment/environment_manifest.json" \
            --workflow ".github/workflows/_aurora-future-run-v3.yml" \
            --metric-contract "$metric_contract" \
            --capacity-profile "config/github_capacity_profile.json" \
            --code-sha "$GITHUB_SHA" \
            --output-dir "$RUNNER_TEMP/contract"
      - name: Upload frozen contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  smoke:
    needs: freeze_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
      - name: Run bounded smoke
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          aurora github smoke \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --output "$RUNNER_TEMP/smoke/smoke_result.json"
      - name: Upload smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  pilot:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
      - name: Download prior immutable performance profile
        if: >-
          inputs.performance_profile_run_id != '' &&
          inputs.performance_profile_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.performance_profile_artifact_name }}
          path: ${{ runner.temp }}/performance-profile
          github-token: ${{ github.token }}
          run-id: ${{ inputs.performance_profile_run_id }}
      - name: Resolve exact profile or measure fresh pilot
        env:
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          profile_args=()
          if [[ -d "$RUNNER_TEMP/performance-profile" ]]; then
            mapfile -t profiles < <(
              find "$RUNNER_TEMP/performance-profile" \
                -type f -name performance_profile.json -print
            )
            if [[ "${#profiles[@]}" -ne 1 ]]; then
              echo "Expected exactly one performance_profile.json" >&2
              exit 2
            fi
            profile_args=(
              --performance-profile "${profiles[0]}"
            )
          fi
          aurora github resolve-pilot \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --contract "$RUNNER_TEMP/contract/performance_contract.json" \
            "${profile_args[@]}" \
            --output "$RUNNER_TEMP/pilot/performance_pilot.json" \
            --resolution-output \
              "$RUNNER_TEMP/pilot/planning_pilot_resolution.json"
      - name: Upload pilot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  plan:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      matrix_a: ${{ steps.outputs.outputs.matrix_a }}
      matrix_b: ${{ steps.outputs.outputs.matrix_b }}
      has_matrix_b: ${{ steps.outputs.outputs.has_matrix_b }}
      merge_matrix: ${{ steps.outputs.outputs.merge_matrix }}
      merge_level_0_matrix: ${{ steps.outputs.outputs.merge_level_0_matrix }}
      merge_level_0_count: ${{ steps.outputs.outputs.merge_level_0_count }}
      merge_level_1_matrix: ${{ steps.outputs.outputs.merge_level_1_matrix }}
      merge_level_1_count: ${{ steps.outputs.outputs.merge_level_1_count }}
      merge_level_2_matrix: ${{ steps.outputs.outputs.merge_level_2_matrix }}
      merge_level_2_count: ${{ steps.outputs.outputs.merge_level_2_count }}
      merge_level_3_matrix: ${{ steps.outputs.outputs.merge_level_3_matrix }}
      merge_level_3_count: ${{ steps.outputs.outputs.merge_level_3_count }}
      merge_root_artifact: ${{ steps.outputs.outputs.merge_root_artifact }}
      merge_root_level: ${{ steps.outputs.outputs.merge_root_level }}
      selected_jobs: ${{ steps.outputs.outputs.selected_jobs }}
      profile_reused: ${{ steps.profile.outputs.profile_reused }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_PREPARED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/prepared
      - name: Download pilot evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot
      - name: Expose pilot provenance
        id: profile
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "pilot"
                  / "planning_pilot_resolution.json"
              ).read_text(encoding="utf-8")
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(
                  "profile_reused="
                  + str(bool(payload["profile_reused"])).lower()
                  + "\n"
              )
          PY
      - name: Build adaptive balanced plan
        env:
          WORKLOAD: ${{ inputs.workload }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          FORCED_JOB_COUNT: ${{ inputs.forced_job_count }}
          ARTIFACT_PREFIX: ${{ inputs.run_label }}
        run: |
          set -euo pipefail
          aurora github plan \
            --spec "$RUNNER_TEMP/contract/resolved_run_spec.json" \
            --workload "$WORKLOAD" \
            --prepared "$RUNNER_TEMP/prepared/prepared_inputs.json" \
            --pilot "$RUNNER_TEMP/pilot/performance_pilot.json" \
            --pilot-resolution \
              "$RUNNER_TEMP/pilot/planning_pilot_resolution.json" \
            --execution-mode "$EXECUTION_MODE" \
            --forced-job-count "$FORCED_JOB_COUNT" \
            --artifact-prefix "$ARTIFACT_PREFIX" \
            --output-dir "$RUNNER_TEMP/plan"
      - name: Emit compact GitHub matrices
        id: outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("plan", "plan_outputs.json")
              .read_text(encoding="utf-8")
          )
          names = {
              "matrix_a": "matrix_a_json",
              "matrix_b": "matrix_b_json",
              "has_matrix_b": "has_matrix_b",
              "merge_matrix": "merge_matrix_json",
              "merge_level_0_matrix": "merge_level_0_matrix_json",
              "merge_level_0_count": "merge_level_0_count",
              "merge_level_1_matrix": "merge_level_1_matrix_json",
              "merge_level_1_count": "merge_level_1_count",
              "merge_level_2_matrix": "merge_level_2_matrix_json",
              "merge_level_2_count": "merge_level_2_count",
              "merge_level_3_matrix": "merge_level_3_matrix_json",
              "merge_level_3_count": "merge_level_3_count",
              "merge_root_artifact": "merge_root_artifact",
              "merge_root_level": "merge_root_level",
              "selected_jobs": "selected_jobs",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for output, source in names.items():
                  out.write(f"{output}={payload[source]}\n")
          PY
      - name: Upload immutable execution plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.run_label }}-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention_days }}

  fanout_a:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AURORA_WHEELHOUSE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download frozen contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.run_label }}-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract
      - name: Download prepared inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
