name: v15 data (after-hours and premarket minutes, IBKR borrow calibration)

# scripts/run_v15_data.py. Downloads only; market and borrow data stay in the Actions cache.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_v15_data.py
      - .github/workflows/v15-data.yml

permissions:
  contents: read

concurrency:
  group: v15-data
  cancel-in-progress: true

jobs:
  ah:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 58 ? 48 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/alpaca
          key: v14-alpaca-none
          restore-keys: v14-alpaca-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/sec
          key: v14-sec-none
          restore-keys: v14-sec-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/ah_cache
          key: v15-ah-${{ github.run_id }}
          restore-keys: v15-ah-
      - run: python scripts/run_v15_data.py ah --cache outputs/v15/ah_cache --budget-min 300
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/ah_cache
          key: v15-ah-${{ github.run_id }}-${{ github.run_attempt }}

  borrow:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/alpaca
          key: v14-alpaca-none
          restore-keys: v14-alpaca-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/borrow_cache
          key: v15-borrow-${{ github.run_id }}
          restore-keys: v15-borrow-
      - run: python scripts/run_v15_data.py borrow --cache outputs/v15/borrow_cache
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/borrow_cache
          key: v15-borrow-${{ github.run_id }}-${{ github.run_attempt }}
