name: "v29 canary (the v29 stages on a test summary)"

# scripts/run_v29.py in quick mode (V29_QUICK) on v28's test summary of five picks, before the real run.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v29-canary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v29-canary
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  V29_QUICK: "1"

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - name: Test summary
        run: |
          mkdir -p outputs/v29w/fake
          cp tests/data/v28_after_canary_summary.json outputs/v29w/fake/summary.json
      - run: python scripts/run_v29.py grid --shard 0 --report outputs/v29w/fake --out outputs/v29w/fake/grid
      - run: python scripts/run_v29.py grid --shard 1 --report outputs/v29w/fake --out outputs/v29w/fake/grid
      - run: python scripts/run_v29.py choose --grid outputs/v29w/fake/grid --report outputs/v29w/fake --out outputs/v29w/fake/choice
      - run: python scripts/run_v29.py sens --shard 0 --shards 1 --choice outputs/v29w/fake/choice --report outputs/v29w/fake --out outputs/v29w/fake/sens
      - run: python scripts/run_v29.py final --choice outputs/v29w/fake/choice --sens outputs/v29w/fake/sens --report outputs/v29w/fake --out outputs/v29w/fake/report
      - if: always()
        run: if [ -f outputs/v29w/fake/report/V29_REPORT.md ]; then cat outputs/v29w/fake/report/V29_REPORT.md >> "$GITHUB_STEP_SUMMARY"; fi
