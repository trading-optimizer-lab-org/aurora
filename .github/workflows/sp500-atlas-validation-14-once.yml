name: SP500 Atlas-1 Pareto 14 Validation Once

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact merged revision containing the Atlas validation gate
        required: true
      validation_ack:
        description: Exact one-shot Atlas-1 validation authorization
        required: true

permissions: {actions: read, contents: read}
concurrency:
  group: sp500-atlas-validation-14-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GITHUB_ACTIONS: "true"
      SCIENTIFIC_COMMIT_SHA: ${{ github.sha }}
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      VALIDATION_ACK: ${{ inputs.validation_ack }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Enforce exact revision and one-shot authorization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VALIDATION_ACK" = 'OPEN_SP500_ATLAS_1_VALIDATION_2011_2020_PARETO_14_ONCE'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$REQUESTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_COMMIT_SHA" = "$SCIENTIFIC_COMMIT_SHA"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$SCIENTIFIC_COMMIT_SHA" = "$main_sha"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          # Run 36246141693 was reserved but stopped on missing pydantic during import, before run_validation.
          reservation_sha=''
          for attempt in $(seq 1 60); do
            if reservation_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/sp500-atlas-validation-14-once-v2" --jq '.object.sha' 2>/dev/null); then
              break
            fi
            sleep 5
          done
          [[ "$reservation_sha" =~ ^[0-9a-f]{40}$ ]]
          reservation=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$reservation_sha")
          test "$(jq -r '.tag' <<< "$reservation")" = 'sp500-atlas-validation-14-once-v2'
          test "$(jq -r '.message' <<< "$reservation")" = "ATLAS_VALIDATION_14_RUN_ID=$GITHUB_RUN_ID"
          test "$(jq -r '.object.type' <<< "$reservation")" = 'commit'
          test "$(jq -r '.object.sha' <<< "$reservation")" = "$SCIENTIFIC_COMMIT_SHA"
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sp500-atlas-validation-14-once&per_page=1" --jq '.total_count')
          test "$prior" = "0"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SCIENTIFIC_COMMIT_SHA"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}

      - name: Install frozen scientific runtime
        run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .

      - name: Download Atlas train reduction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-final-results
          path: ${{ runner.temp }}/final-results
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "36032882147"

      - name: Download frozen Atlas catalog and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-atlas-prepared-sp500-atlas-v1-4033278d97f61ca15a29e1cceba454ab7f29396c26ef829ddcf9856154b20cf0
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "36029350912"

      - name: Download immutable training runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-31418682679
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "31418682679"

      - name: Download closed validation snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-VALIDATION-CLOSED-2011-2020-F001-F240-31420960542
          path: ${{ runner.temp }}/validation_snapshot_2011_2020
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "31420960542"

      - name: Validate exactly the frozen 14 strategies
        shell: bash
        run: |
          python -m scripts.run_sp500_atlas_validation_14 \
            --final-results "$RUNNER_TEMP/final-results" \
            --plan "$RUNNER_TEMP/prepared/plan/atlas_run_plan.json" \
            --catalog-dir "$RUNNER_TEMP/prepared/atlas" \
            --runtime-input-pack "$RUNNER_TEMP/runtime" \
            --validation-snapshot "$RUNNER_TEMP/validation_snapshot_2011_2020" \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --working-dir "$RUNNER_TEMP/atlas-validation-work" \
            --output-dir outputs/sp500-atlas-validation-14 \
            --authorization "$VALIDATION_ACK"

      - name: Verify complete result and closed locked period
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("outputs/sp500-atlas-validation-14")
          receipt = json.loads((root / "validation_receipt.json").read_text("utf-8"))
          rows = [json.loads(line) for line in (root / "validation_results.jsonl").read_text("utf-8").splitlines()]
          assert receipt["strategy_count"] == 14
          assert receipt["git_commit"] == os.environ["SCIENTIFIC_COMMIT_SHA"]
          assert receipt["train_parity_verified"] is True
          assert receipt["maximum_date"] == "2020-12-31"
          assert receipt["validation_opened"] is True and receipt["locked_opened"] is False
          assert len(rows) == 14 and len({row["strategy_id"] for row in rows}) == 14
          assert all(row["locked_opened"] is False and row["total_years"] == 10 for row in rows)
          assert all([entry["year"] for entry in row["annual_rows"]] == list(range(2011, 2021)) for row in rows)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-validation-14-once
          path: outputs/sp500-atlas-validation-14
          if-no-files-found: error
          retention-days: 30
