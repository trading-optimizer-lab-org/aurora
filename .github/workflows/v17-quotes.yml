name: v17 cost study (quoted spreads of the gap-fade trades)

# scripts/run_v17_quotes.py, docs/research/V17_PREREGISTRATION.md section 1. Quotes stay in the Actions cache;
# only the aggregated cost report is uploaded.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_v17_quotes.py
      - .github/workflows/v17-quotes.yml

permissions:
  contents: read

concurrency:
  group: v17-quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/inputs
          key: v14-inputs-39399894228-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v15/inputs
          key: v15-inputs-39414563648-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v16/inputs
          key: v16-inputs-39416223503-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v17/quotes
          key: v17-quotes-${{ github.run_id }}
          restore-keys: v17-quotes-
      - run: python scripts/run_v17_quotes.py trades
      - run: python scripts/run_v17_quotes.py quotes
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v17/quotes
          key: v17-quotes-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python scripts/run_v17_quotes.py analyze
      - if: always()
        run: if [ -f outputs/v17/quotes/COSTS.md ]; then cat outputs/v17/quotes/COSTS.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v17-costs
          path: |
            outputs/v17/quotes/COSTS.md
            outputs/v17/quotes/costs.json
          retention-days: 90
