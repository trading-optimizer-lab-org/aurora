name: sealed test, step 1 - freeze the finalists on design data

# docs/research/SEALED_TEST_PROTOCOL.md. Reads only the design-period shard outputs of v14, v15 and v16.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_sealed.py
      - .github/workflows/sealed-freeze.yml

permissions:
  contents: read
  actions: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 58 ? 48 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v14/inputs
          key: v14-inputs-39399894228-1
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v14-part-*
          path: outputs/sealed/parts
          run-id: 39399894228
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v15-part-*
          path: outputs/sealed/parts
          run-id: 39414563648
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v16-part-*
          path: outputs/sealed/parts
          run-id: 39416223503
          github-token: ${{ github.token }}
      - run: python scripts/run_sealed.py freeze --inputs outputs/v14/inputs --parts outputs/sealed/parts --out outputs/sealed/sealed_frozen.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sealed-frozen
          path: outputs/sealed/sealed_frozen.json
          retention-days: 90
