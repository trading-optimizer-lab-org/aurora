            tests/test_sp500_megarun_advanced_feature_smoke.py \
            tests/test_sp500_megarun_microstructure_feature_engine.py \
            tests/test_sp500_megarun_microstructure_feature_smoke.py \
            tests/test_sp500_megarun_positioning_feature_engine.py \
            tests/test_sp500_megarun_positioning_feature_smoke.py \
            tests/test_sp500_megarun_tail_macro_feature_engine.py \
            tests/test_sp500_megarun_tail_macro_feature_smoke.py \
            tests/test_sp500_megarun_fundamental_feature_engine.py \
