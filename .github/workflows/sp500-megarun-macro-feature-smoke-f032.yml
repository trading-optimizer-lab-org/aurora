            tests/test_sp500_megarun_global_factor_feature_engine.py \
            tests/test_sp500_megarun_global_factor_feature_smoke.py \
            -q
      - name: Download only the verified train snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-train-1993-2010-F001-F240-${{ env.SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/train_snapshot_1993_2010
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Execute and audit F021-F031 on train only
