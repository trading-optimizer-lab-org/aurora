jobs:
  smoke_f001_f170:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '31346838255' }}
    steps:
      - name: Check out the exact smoke revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Restore bounded smoke runtime
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/github-performance.lock
          python -m pip install "pytest==9.0.3"
          python -m pip install --no-deps -e .
