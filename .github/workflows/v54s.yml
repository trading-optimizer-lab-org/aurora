name: "v54s: CRASH-long under strict fills"

# scripts/gen_v54s_wf.py writes this file (V54S_PREREGISTRATION.md). Artifacts hold aggregates only.
# run: 1
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v54s.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v54s
  cancel-in-progress: false

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  minute:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [asis, through1, vol3k1, vol3k5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-39825946914-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v51
          key: v51-min-41206767350-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v52
          key: v52-min-41219555974-1
          fail-on-cache-miss: true
      - run: python scripts/run_v53.py merge --src outputs/v51 outputs/v52 --move --out outputs/v53
      - run: python scripts/run_v54s.py minute --rule ${{ matrix.shard }} --procs 4 --out outputs/v54sw/res
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v54s-minute-${{ matrix.shard }}
          path: outputs/v54sw/res
          retention-days: 90

  final:
    needs: [minute]
    if: always() && needs.minute.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: v54s-minute-*
          path: outputs/v54sw/res
          merge-multiple: true
      - run: |
          python scripts/run_v54s.py final --res outputs/v54sw/res --out outputs/v54sw/final
          cat outputs/v54sw/final/V54S_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v54s-report
          path: outputs/v54sw/final
          retention-days: 90
