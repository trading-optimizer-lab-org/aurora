      descriptor_member: ${{ matrix.descriptor_member }}
      descriptor_sha256: ${{ matrix.descriptor_sha256 }}
      admission_token_sha256: ${{ needs.engine_verify_sealed_plan.outputs.admission_token_sha256 }}

  reconcile_wave_0:
    needs:
      - engine_verify_sealed_plan
      - verify_component_store
      - evaluate_a
      - evaluate_b
      - evaluate_c
    if: >-
      ${{ inputs.execution_mode == 'run' && always() &&
      needs.engine_verify_sealed_plan.result == 'success' &&
      needs.verify_component_store.result == 'success' &&
      needs.evaluate_a.result != 'skipped' &&
      (needs.evaluate_b.result != 'skipped' ||
      (needs.engine_verify_sealed_plan.outputs.recipe_matrix_b_count == '0' &&
      needs.evaluate_b.result == 'skipped')) &&
      (needs.evaluate_c.result != 'skipped' ||
      (needs.engine_verify_sealed_plan.outputs.recipe_matrix_c_count == '0' &&
      needs.evaluate_c.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 20
    permissions: {actions: read, contents: read}
    outputs:
      status: ${{ steps.state.outputs.status }}
      campaign_state_artifact: ${{ steps.state.outputs.campaign_state_artifact }}
      attempt_manifest_artifacts: ${{ steps.state.outputs.attempt_manifest_artifacts }}
      failure_manifest_artifacts: ${{ steps.state.outputs.failure_manifest_artifacts }}
      checkpoint_manifest_artifacts: ${{ steps.state.outputs.checkpoint_manifest_artifacts }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download the sealed execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download the verified component-store seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-component-store-seal-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/component-store-seal

      - name: Download the one exact offline runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Restore the exact runtime offline
        id: runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Fetch two stable complete artifact inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for snapshot in 1 2; do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              > "$RUNNER_TEMP/artifacts-$snapshot.json"
          done
          cmp --silent "$RUNNER_TEMP/artifacts-1.json" "$RUNNER_TEMP/artifacts-2.json" || {
            echo "CATALOG_INITIAL_ARTIFACT_INVENTORY_UNSTABLE" >&2
            exit 1
          }

      - name: Seal initial executing state and exact recovery inventory
        id: state
        env:
          RUNTIME_PYTHON: ${{ steps.runtime.outputs.runtime-python }}
          AUTHORITY_ID: ${{ inputs.authority_id }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          SCIENCE_SHA256: ${{ inputs.science_sha256 }}
          EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
          EXECUTION_PROTOCOL_SHA256: ${{ inputs.execution_protocol_sha256 }}
          PROTECTED_COMMIT_SHA: ${{ github.sha }}
          DECISION_SHA256: ${{ inputs.decision_sha256 }}
          ACTIVE_RECIPE_WORKERS: ${{ needs.engine_verify_sealed_plan.outputs.active_recipe_workers }}
          EVALUATE_A_RESULT: ${{ needs.evaluate_a.result }}
          EVALUATE_B_RESULT: ${{ needs.evaluate_b.result }}
          EVALUATE_C_RESULT: ${{ needs.evaluate_c.result }}
        run: |
          set -euo pipefail
          "$RUNTIME_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from aurora.infra.github_performance.campaign import (
              CampaignPhase,
              initialize_campaign_state,
              transition_campaign_state,
              write_campaign_state,
          )
          from aurora.infra.github_performance.contracts import canonical_sha256

          temp = Path(os.environ["RUNNER_TEMP"])
          plan_root = temp / "sealed-plan"
          receipt = json.loads(
              (plan_root / "execution_plan_receipt.json").read_text("utf-8")
          )
          work_manifest = json.loads(
              (plan_root / "resume_work_manifest.json").read_text("utf-8")
          )
          if (
              receipt.get("authority_id") != os.environ["AUTHORITY_ID"]
              or receipt.get("campaign_id") != os.environ["CAMPAIGN_ID"]
              or receipt.get("execution_plan_sha256")
              != os.environ["EXECUTION_PLAN_SHA256"]
          ):
              raise SystemExit("CATALOG_INITIAL_STATE_PLAN_BINDING_INVALID")
          pages = json.loads((temp / "artifacts-1.json").read_text("utf-8"))
          artifacts = [row for page in pages for row in page.get("artifacts", [])]
          names = sorted(
              str(row["name"])
              for row in artifacts
              if row.get("expired") is False
          )
          attempts = sorted(
              name for name in names if name.startswith("catalog-terminal-attempt-")
          )
          failures = sorted(
              name for name in names if name.startswith("catalog-failure-attempt-")
          )
          checkpoints = sorted(
              name for name in names if name.startswith("catalog-checkpoint-")
          )
          expected_workers = int(os.environ["ACTIVE_RECIPE_WORKERS"])
          all_workers_green = all(
              os.environ[name] in {"success", "skipped"}
              for name in (
                  "EVALUATE_A_RESULT",
                  "EVALUATE_B_RESULT",
                  "EVALUATE_C_RESULT",
              )
          )
          expected_checkpoint_policy = json.loads(
              (plan_root / "checkpoint_policy.json").read_text("utf-8")
          )
          expected_checkpoints = sorted(
              artifact
              for row in expected_checkpoint_policy["workers"]
              for artifact in row["checkpoint_slot_artifacts"][
                  : row["checkpoint_slot_count"]
              ]
          )
          if all_workers_green and (
              len(attempts) != expected_workers
              or checkpoints != expected_checkpoints
              or failures
          ):
              raise SystemExit("CATALOG_GREEN_WAVE_ARTIFACT_AMBIGUITY")

          component_seal = temp / "component-store-seal/component-store-seal.json"
          component_sha256 = hashlib.sha256(component_seal.read_bytes()).hexdigest()
          now = datetime.now(UTC)
          state_root = temp / "campaign-state"
          initial = initialize_campaign_state(
              campaign_id=os.environ["CAMPAIGN_ID"],
              scientific_contract_sha256=os.environ["SCIENCE_SHA256"],
              logical_unit_manifest_sha256=work_manifest["manifest_sha256"],
              logical_unit_count=int(receipt["pending_recipe_count"]),
              active_plan_sha256=os.environ["EXECUTION_PLAN_SHA256"],
              authority_id=os.environ["AUTHORITY_ID"],
              request_sha256=os.environ["REQUEST_SHA256"],
              protected_commit_sha=os.environ["PROTECTED_COMMIT_SHA"],
              execution_protocol_sha256=os.environ[
                  "EXECUTION_PROTOCOL_SHA256"
              ],
              controller_decision_sha256=os.environ["DECISION_SHA256"],
              component_store_manifest_sha256=component_sha256,
              failure_history_manifest_sha256=canonical_sha256([]),
              created_at=now,
          )
          write_campaign_state(initial, state_root)
          executing = transition_campaign_state(
              initial,
              phase=CampaignPhase.EXECUTING,
              created_at=now,
          )
          write_campaign_state(executing, state_root)
          artifact_name = f"catalog-campaign-state-{os.environ['AUTHORITY_ID']}-wave-0"
          outputs = {
              "status": "retry",
              "campaign_state_artifact": artifact_name,
              "attempt_manifest_artifacts": json.dumps(
                  attempts, separators=(",", ":")
              ),
              "failure_manifest_artifacts": json.dumps(
                  failures, separators=(",", ":")
              ),
              "checkpoint_manifest_artifacts": json.dumps(
                  checkpoints, separators=(",", ":")
              ),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Publish initial immutable campaign state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.state.outputs.campaign_state_artifact }}
          path: ${{ runner.temp }}/campaign-state
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  recovery_wave_1:
    needs: reconcile_wave_0
    if: ${{ inputs.execution_mode == 'run' && always() && (needs.reconcile_wave_0.outputs.status == 'retry' || needs.reconcile_wave_0.outputs.status == 'replan') }}
    permissions: {actions: read, contents: read}
    uses: ./.github/workflows/catalog-recovery-wave.yml
    with:
      request_sha256: ${{ inputs.request_sha256 }}
      authority_id: ${{ inputs.authority_id }}
      campaign_id: ${{ inputs.campaign_id }}
      science_sha256: ${{ inputs.science_sha256 }}
      execution_plan_sha256: ${{ inputs.execution_plan_sha256 }}
      execution_protocol_sha256: ${{ inputs.execution_protocol_sha256 }}
      protected_commit_sha: ${{ github.sha }}
      decision_sha256: ${{ inputs.decision_sha256 }}
      campaign_state_artifact: ${{ needs.reconcile_wave_0.outputs.campaign_state_artifact }}
      attempt_manifest_artifacts: ${{ needs.reconcile_wave_0.outputs.attempt_manifest_artifacts }}
      failure_manifest_artifacts: ${{ needs.reconcile_wave_0.outputs.failure_manifest_artifacts }}
      checkpoint_manifest_artifacts: ${{ needs.reconcile_wave_0.outputs.checkpoint_manifest_artifacts }}
      current_wave: 1

  recovery_wave_2:
    needs: recovery_wave_1
    if: ${{ inputs.execution_mode == 'run' && always() && (needs.recovery_wave_1.outputs.status == 'retry' || needs.recovery_wave_1.outputs.status == 'replan') }}
    permissions: {actions: read, contents: read}
    uses: ./.github/workflows/catalog-recovery-wave.yml
    with:
      request_sha256: ${{ inputs.request_sha256 }}
      authority_id: ${{ inputs.authority_id }}
      campaign_id: ${{ inputs.campaign_id }}
      science_sha256: ${{ inputs.science_sha256 }}
      execution_plan_sha256: ${{ inputs.execution_plan_sha256 }}
      execution_protocol_sha256: ${{ inputs.execution_protocol_sha256 }}
      protected_commit_sha: ${{ github.sha }}
      decision_sha256: ${{ inputs.decision_sha256 }}
      campaign_state_artifact: ${{ needs.recovery_wave_1.outputs.campaign_state_artifact }}
      attempt_manifest_artifacts: ${{ needs.recovery_wave_1.outputs.attempt_manifest_artifacts }}
      failure_manifest_artifacts: ${{ needs.recovery_wave_1.outputs.failure_manifest_artifacts }}
      checkpoint_manifest_artifacts: ${{ needs.recovery_wave_1.outputs.checkpoint_manifest_artifacts }}
      current_wave: 2

  ready_to_merge:
    needs:
      - reconcile_wave_0
      - recovery_wave_1
      - recovery_wave_2
    if: >-
      ${{ inputs.execution_mode == 'run' && always() &&
      (needs.recovery_wave_1.outputs.status == 'complete' ||
      needs.recovery_wave_2.outputs.status == 'complete') }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 5
    permissions: {actions: read, contents: read}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Confirm selective recovery reached merge readiness
        run: echo "CATALOG_RECOVERY_READY_TO_MERGE"

  reduce_groups:
    needs:
      - engine_verify_sealed_plan
      - ready_to_merge
    if: >-
      ${{ inputs.execution_mode == 'run' && always() &&
      needs.engine_verify_sealed_plan.result == 'success' &&
      needs.engine_verify_sealed_plan.outputs.reduction_matrix_count != '0' &&
      needs.ready_to_merge.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.engine_verify_sealed_plan.outputs.reduction_matrix) }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 30
    permissions: {actions: read, contents: read}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download one selected runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Activate sealed offline runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Download only this sealed checkpoint group
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ matrix.checkpoint_artifact_pattern }}
          path: ${{ runner.temp }}/checkpoint-group
          merge-multiple: false

      - name: Verify and reduce this bounded group
        uses: ./.github/actions/aurora-merge-level
        with:
          mode: catalog
          group-id: ${{ matrix.group_id }}
          input-artifact-pattern: ${{ matrix.checkpoint_artifact_pattern }}
          output-artifact: ${{ matrix.reduction_artifact }}
          workload: optimized_catalog_v1
          retention-days: "1"
          wheelhouse-artifact-name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          contract-artifact-name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          plan-artifact-name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          prepared-artifact-name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          prepared-artifact-run-id: ${{ github.run_id }}
          expected-level: "0"
          expected-authority-id: ${{ inputs.authority_id }}
          expected-campaign-id: ${{ inputs.campaign_id }}
          expected-science-sha256: ${{ inputs.science_sha256 }}
          expected-execution-plan-sha256: ${{ inputs.execution_plan_sha256 }}
          catalog-reducer-entrypoint: python -m scripts.reduce_sp500_optimized_catalog_group
          catalog-inputs-root: ${{ runner.temp }}/checkpoint-group
          catalog-resolved-contract: ${{ runner.temp }}/sealed-plan/resolved_contract.json
          catalog-resume-work-manifest: ${{ runner.temp }}/sealed-plan/resume_work_manifest.json
          catalog-run-plan: ${{ runner.temp }}/sealed-plan/run_plan.json
          catalog-admission-token: ${{ needs.engine_verify_sealed_plan.outputs.admission_token_sha256 }}
          catalog-checkpoint-policy: ${{ runner.temp }}/sealed-plan/checkpoint_policy.json
          catalog-reduction-plan: ${{ runner.temp }}/sealed-plan/reduction_plan.json
          catalog-recipe-assignments: ${{ runner.temp }}/sealed-plan/recipe_assignment_bundle.zip
          catalog-output-dir: ${{ runner.temp }}/reduction-group

      - name: Upload one bounded reduction group
        id: group_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.reduction_artifact }}
          path: ${{ runner.temp }}/reduction-group
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Require a durable group upload receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.group_upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.group_upload.outputs['artifact-digest'] }}
        run: test -n "$ARTIFACT_ID" && test -n "$ARTIFACT_DIGEST"

  reduce:
    needs:
      - engine_verify_sealed_plan
      - verify_component_store
      - reduce_groups
    if: >-
      ${{ inputs.execution_mode == 'run' && always() &&
      needs.engine_verify_sealed_plan.result == 'success' &&
      needs.verify_component_store.result == 'success' &&
      (needs.reduce_groups.result == 'success' ||
      (needs.engine_verify_sealed_plan.outputs.reduction_matrix_count == '0' &&
      needs.reduce_groups.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 60
    outputs:
      campaign_state: ${{ steps.terminal.outputs.campaign_state }}
      final_evidence_artifact: ${{ steps.terminal.outputs.final_evidence_artifact }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download one selected runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Activate sealed offline runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Download only bounded reduction groups
        if: ${{ needs.engine_verify_sealed_plan.outputs.pending_recipe_count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ${{ needs.engine_verify_sealed_plan.outputs.reduction_artifact_pattern }}
          path: ${{ runner.temp }}/reduction-groups
          merge-multiple: false

      - name: Merge the sealed bounded reduction groups
        shell: bash
        run: >-
          python scripts/reduce_sp500_optimized_catalog_run.py
          --input-root "$RUNNER_TEMP/reduction-groups"
          --catalog config/sp500_megarun_strategy_catalog_v1/catalog.jsonl
          --resolved-contract "$RUNNER_TEMP/sealed-plan/resolved_contract.json"
          --resume-work-manifest "$RUNNER_TEMP/sealed-plan/resume_work_manifest.json"
          --run-plan "$RUNNER_TEMP/sealed-plan/run_plan.json"
          --admission-token "${{ needs.engine_verify_sealed_plan.outputs.admission_token_sha256 }}"
          --reduction-plan "$RUNNER_TEMP/sealed-plan/reduction_plan.json"
          --output-dir outputs/final

      - name: Upload bounded final results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.final_evidence_artifact }}
          path: outputs/final
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Expose terminal candidate only after reduction
        id: terminal
        shell: bash
        run: |
          echo "campaign_state=TERMINAL_CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "final_evidence_artifact=${{ needs.engine_verify_sealed_plan.outputs.final_evidence_artifact }}" >> "$GITHUB_OUTPUT"

  verify_terminal_science:
    needs: [engine_verify_sealed_plan, reduce]
    if: >-
      ${{ inputs.execution_mode == 'run' && always() &&
      needs.engine_verify_sealed_plan.result == 'success' &&
      needs.reduce.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 30
    permissions: {actions: read, contents: read}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download exact sealed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download exact bounded final root
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.reduce.outputs.final_evidence_artifact }}
          path: ${{ runner.temp }}/final-root

      - name: Download one selected runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Activate sealed offline runtime for terminal verification
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Fetch only the sealed frozen reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python scripts/fetch_catalog_reference_artifact.py
          --sealed-plan "$RUNNER_TEMP/sealed-plan"
          --output-archive "$RUNNER_TEMP/reference-oracle.zip"
          --output-dir "$RUNNER_TEMP/reference-oracle"
          --receipt "$RUNNER_TEMP/catalog-reference-fetch-receipt-v1.json"

      - name: Verify exact terminal science and equivalence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_catalog_terminal_science.py \
            --final-root "$RUNNER_TEMP/final-root" \
            --reference-root "$RUNNER_TEMP/reference-oracle" \
            --sealed-plan "$RUNNER_TEMP/sealed-plan" \
            --output-dir "$RUNNER_TEMP/terminal-science"
          mv \
            "$RUNNER_TEMP/catalog-reference-fetch-receipt-v1.json" \
            "$RUNNER_TEMP/terminal-science/catalog-reference-fetch-receipt-v1.json"

      - name: Publish terminal science evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-terminal-science-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/terminal-science
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  audit_runtime:
    needs: [engine_verify_sealed_plan, reduce, verify_terminal_science]
    if: ${{ inputs.execution_mode == 'run' && always() && needs.reduce.result == 'success' && needs.verify_terminal_science.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 20
    permissions: {actions: read, contents: read}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: >-
          python -m pip install --only-binary=:all: --no-deps --require-hashes
          -r requirements/catalog-controller-linux-py311.lock
      - name: Download the exact sealed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan
      - name: Collect complete current-run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > run.json
          gh api "repos/$GITHUB_REPOSITORY" > repository.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs-confirmation.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts-confirmation.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          binding = {
              "request_sha256": "${{ inputs.request_sha256 }}",
              "authority_id": "${{ inputs.authority_id }}",
              "campaign_id": "${{ inputs.campaign_id }}",
              "science_sha256": "${{ inputs.science_sha256 }}",
              "execution_plan_sha256": "${{ inputs.execution_plan_sha256 }}",
              "execution_protocol_sha256": "${{ inputs.execution_protocol_sha256 }}",
              "protected_commit_sha": "${{ github.sha }}",
          }
          Path("runtime-binding.json").write_text(
              json.dumps(binding, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          plan = Path(os.environ["RUNNER_TEMP"]) / "sealed-plan"
          pending = json.loads((plan / "pending_component_manifest.json").read_text("utf-8"))
          cached = json.loads((plan / "cached_component_manifest.json").read_text("utf-8"))
          Path("runtime-metrics.env").write_text(
              "COMPONENTS_COMPUTED=" + str(len(pending["component_ids"])) + "\n"
              "COMPONENTS_REUSED=" + str(len(cached["component_ids"])) + "\n",
              encoding="utf-8",
          )
          PY
          . runtime-metrics.env
          python scripts/audit_catalog_runtime.py \
            --binding runtime-binding.json \
            --run run.json \
            --repository repository.json \
            --jobs jobs.json \
            --jobs-confirmation jobs-confirmation.json \
            --artifacts artifacts.json \
            --artifacts-confirmation artifacts-confirmation.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --audited-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --components-reused "$COMPONENTS_REUSED" \
            --components-computed-once "$COMPONENTS_COMPUTED" \
            --output runtime-audit.json
      - name: Publish runtime audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-runtime-audit-${{ inputs.authority_id }}
          path: runtime-audit.json
          if-no-files-found: error
          retention-days: 90

  campaign_outcome:
    needs:
      - engine_verify_sealed_plan
      - prepare_runtime_and_inputs
      - build_components_a
      - build_components_b
      - materialize_cached_components_a
      - materialize_cached_components_b
      - verify_component_store
      - evaluate_a
      - evaluate_b
      - evaluate_c
      - reconcile_wave_0
      - recovery_wave_1
      - recovery_wave_2
      - ready_to_merge
      - reduce_groups
      - reduce
      - verify_terminal_science
      - audit_runtime
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 10
    permissions: {actions: read, contents: read}
    outputs:
      campaign_state: ${{ steps.prepare_outcome.outputs.campaign_state || steps.outcome.outputs.campaign_state }}
      outcome_evidence_sha256: ${{ steps.prepare_outcome.outputs.outcome_evidence_sha256 || steps.outcome.outputs.outcome_evidence_sha256 }}
      final_evidence_artifact: ${{ steps.outcome.outputs.final_evidence_artifact }}
      runtime_audit_artifact: ${{ steps.outcome.outputs.runtime_audit_artifact }}
      science_evidence_artifact: ${{ steps.outcome.outputs.science_evidence_artifact }}
      recovery_evidence_artifact: ${{ steps.outcome.outputs.recovery_evidence_artifact }}
      failure_fingerprint: ${{ steps.outcome.outputs.failure_fingerprint }}
      failure_occurrence_count: ${{ steps.outcome.outputs.failure_occurrence_count }}
      failure_reason_code: ${{ steps.outcome.outputs.failure_reason_code }}
      retry_not_before: ${{ steps.outcome.outputs.retry_not_before }}
      terminal_failure_code: ${{ steps.outcome.outputs.terminal_failure_code }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Expose one preparation-only outcome
        id: prepare_outcome
        if: ${{ inputs.execution_mode == 'prepare' }}
        shell: bash
        env:
          RESULT_ENGINE_VERIFY: ${{ needs.engine_verify_sealed_plan.result }}
          RESULT_PREPARE: ${{ needs.prepare_runtime_and_inputs.result }}
          RESULT_BUILD_A: ${{ needs.build_components_a.result }}
          RESULT_BUILD_B: ${{ needs.build_components_b.result }}
          RESULT_CACHED_A: ${{ needs.materialize_cached_components_a.result }}
          RESULT_CACHED_B: ${{ needs.materialize_cached_components_b.result }}
          RESULT_COMPONENT_SEAL: ${{ needs.verify_component_store.result }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          stages = {
              "engine_verify_sealed_plan": os.environ["RESULT_ENGINE_VERIFY"],
              "prepare_runtime_and_inputs": os.environ["RESULT_PREPARE"],
              "build_components_a": os.environ["RESULT_BUILD_A"],
              "build_components_b": os.environ["RESULT_BUILD_B"],
              "materialize_cached_components_a": os.environ["RESULT_CACHED_A"],
              "materialize_cached_components_b": os.environ["RESULT_CACHED_B"],
              "verify_component_store": os.environ["RESULT_COMPONENT_SEAL"],
          }
          reusable = {"success", "skipped"}
          prepared = (
              stages["engine_verify_sealed_plan"] == "success"
              and stages["prepare_runtime_and_inputs"] == "success"
              and stages["verify_component_store"] == "success"
              and all(stages[name] in reusable for name in (
                  "build_components_a",
                  "build_components_b",
                  "materialize_cached_components_a",
                  "materialize_cached_components_b",
              ))
          )
          identity = {
              "schema_version": "1",
              "execution_mode": "prepare",
              "campaign_state": "PREPARED" if prepared else "BLOCKED",
              "reason_code": (
                  "CATALOG_PREPARATION_COMPLETE"
                  if prepared
                  else "CATALOG_PREPARATION_ENGINE_FAILED"
              ),
              "request_sha256": "${{ inputs.request_sha256 }}",
              "authority_id": "${{ inputs.authority_id }}",
              "campaign_id": "${{ inputs.campaign_id }}",
              "science_sha256": "${{ inputs.science_sha256 }}",
              "execution_plan_sha256": "${{ inputs.execution_plan_sha256 }}",
              "execution_protocol_sha256": "${{ inputs.execution_protocol_sha256 }}",
              "protected_commit_sha": "${{ github.sha }}",
              "stage_results": stages,
              "created_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
          }
          raw = json.dumps(identity, sort_keys=True, separators=(",", ":")).encode()
          receipt = {**identity, "outcome_evidence_sha256": hashlib.sha256(raw).hexdigest()}
          Path("catalog-engine-outcome-v1.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"campaign_state={receipt['campaign_state']}\n")
              output.write(
                  f"outcome_evidence_sha256={receipt['outcome_evidence_sha256']}\n"
              )
          PY

      - name: Build one closed engine-outcome input
        if: ${{ inputs.execution_mode == 'run' }}
        shell: bash
        env:
          RESULT_ENGINE_VERIFY: ${{ needs.engine_verify_sealed_plan.result }}
          RESULT_PREPARE: ${{ needs.prepare_runtime_and_inputs.result }}
          RESULT_BUILD_A: ${{ needs.build_components_a.result }}
          RESULT_BUILD_B: ${{ needs.build_components_b.result }}
          RESULT_CACHED_A: ${{ needs.materialize_cached_components_a.result }}
          RESULT_CACHED_B: ${{ needs.materialize_cached_components_b.result }}
          RESULT_COMPONENT_SEAL: ${{ needs.verify_component_store.result }}
          RESULT_EVALUATE_A: ${{ needs.evaluate_a.result }}
          RESULT_EVALUATE_B: ${{ needs.evaluate_b.result }}
          RESULT_EVALUATE_C: ${{ needs.evaluate_c.result }}
          RESULT_READY: ${{ needs.ready_to_merge.result }}
          RESULT_REDUCE_GROUPS: ${{ needs.reduce_groups.result }}
          RESULT_REDUCE: ${{ needs.reduce.result }}
          RESULT_SCIENCE: ${{ needs.verify_terminal_science.result }}
          RESULT_AUDIT: ${{ needs.audit_runtime.result }}
          RECOVERY_0: ${{ needs.reconcile_wave_0.outputs.status }}
          RECOVERY_1: ${{ needs.recovery_wave_1.outputs.status }}
          RECOVERY_2: ${{ needs.recovery_wave_2.outputs.status }}
          FAILURE_FP_1: ${{ needs.recovery_wave_1.outputs.failure_fingerprint }}
          FAILURE_FP_2: ${{ needs.recovery_wave_2.outputs.failure_fingerprint }}
          FAILURE_COUNT_1: ${{ needs.recovery_wave_1.outputs.failure_occurrence_count }}
          FAILURE_COUNT_2: ${{ needs.recovery_wave_2.outputs.failure_occurrence_count }}
          FAILURE_REASON_1: ${{ needs.recovery_wave_1.outputs.failure_reason_code }}
          FAILURE_REASON_2: ${{ needs.recovery_wave_2.outputs.failure_reason_code }}
          RETRY_NOT_BEFORE_1: ${{ needs.recovery_wave_1.outputs.retry_not_before }}
          RETRY_NOT_BEFORE_2: ${{ needs.recovery_wave_2.outputs.retry_not_before }}
          FINAL_EVIDENCE_ARTIFACT: ${{ needs.reduce.outputs.final_evidence_artifact }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          stages = {
              "engine_verify_sealed_plan": os.environ["RESULT_ENGINE_VERIFY"],
              "prepare_runtime_and_inputs": os.environ["RESULT_PREPARE"],
              "build_components_a": os.environ["RESULT_BUILD_A"],
              "build_components_b": os.environ["RESULT_BUILD_B"],
              "materialize_cached_components_a": os.environ["RESULT_CACHED_A"],
              "materialize_cached_components_b": os.environ["RESULT_CACHED_B"],
              "verify_component_store": os.environ["RESULT_COMPONENT_SEAL"],
              "evaluate_a": os.environ["RESULT_EVALUATE_A"],
              "evaluate_b": os.environ["RESULT_EVALUATE_B"],
              "evaluate_c": os.environ["RESULT_EVALUATE_C"],
              "ready_to_merge": os.environ["RESULT_READY"],
              "reduce_groups": os.environ["RESULT_REDUCE_GROUPS"],
              "reduce": os.environ["RESULT_REDUCE"],
              "verify_terminal_science": os.environ["RESULT_SCIENCE"],
              "audit_runtime": os.environ["RESULT_AUDIT"],
          }
          recovery = [
              os.environ[f"RECOVERY_{wave}"]
                for wave in range(3)
              if os.environ.get(f"RECOVERY_{wave}")
          ]
          evidence_artifact = None
          completed_waves = [
                wave for wave in range(1, 3) if os.environ.get(f"RECOVERY_{wave}")
          ]
          if completed_waves:
              wave = completed_waves[-1]
              evidence_artifact = (
                  f"catalog-recovery-evidence-${{ inputs.authority_id }}-{wave}-"
                  f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
              )
          last_recovery = recovery[-1] if recovery else None
          last_wave = completed_waves[-1] if completed_waves else None
          failure_fingerprint = (
              os.environ.get(f"FAILURE_FP_{last_wave}") or None
              if last_wave is not None
              else None
          )
          failure_count = (
              int(os.environ.get(f"FAILURE_COUNT_{last_wave}") or 0)
              if last_wave is not None
              else 0
          )
          failure_reason = (
              os.environ.get(f"FAILURE_REASON_{last_wave}") or None
              if last_wave is not None
              else None
          )
          retry_not_before = (
              os.environ.get(f"RETRY_NOT_BEFORE_{last_wave}") or None
              if last_wave is not None
              else None
          )
          payload = {
              "request_sha256": "${{ inputs.request_sha256 }}",
              "authority_id": "${{ inputs.authority_id }}",
              "campaign_id": "${{ inputs.campaign_id }}",
              "science_sha256": "${{ inputs.science_sha256 }}",
              "execution_plan_sha256": "${{ inputs.execution_plan_sha256 }}",
              "execution_protocol_sha256": "${{ inputs.execution_protocol_sha256 }}",
              "protected_commit_sha": "${{ github.sha }}",
              "engine_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "engine_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "stage_results": stages,
              "recovery_statuses": recovery,
              "final_evidence_artifact": (
                  os.environ["FINAL_EVIDENCE_ARTIFACT"]
                  if stages["reduce"] == "success"
                  else None
              ),
              "runtime_audit_artifact": (
                  "catalog-runtime-audit-${{ inputs.authority_id }}"
                  if stages["audit_runtime"] == "success"
                  else None
              ),
              "science_evidence_artifact": (
                  "catalog-terminal-science-${{ inputs.authority_id }}"
                  if stages["verify_terminal_science"] == "success"
                  else None
              ),
              "recovery_evidence_artifact": evidence_artifact,
              "failure_fingerprint": failure_fingerprint,
              "failure_occurrence_count": failure_count,
              "failure_reason_code": failure_reason,
              "retry_not_before": retry_not_before,
              "terminal_failure_code": (
                  failure_reason
                  if last_recovery == "failed_scientific"
                  else None
              ),
              "created_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
          }
          Path("engine-outcome-input.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Select and expose exactly one verified engine outcome
        id: outcome
        if: ${{ inputs.execution_mode == 'run' }}
        shell: bash
        run: >-
          python scripts/prepare_catalog_engine_outcome.py
          --input engine-outcome-input.json
          --output catalog-engine-outcome-v1.json
          --github-output "$GITHUB_OUTPUT"

      - name: Publish exact engine outcome evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-engine-outcome-${{ inputs.authority_id }}
          path: catalog-engine-outcome-v1.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
