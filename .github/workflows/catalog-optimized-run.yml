  verify_component_store:
    needs:
      - engine_verify_sealed_plan
      - prepare_runtime_and_inputs
      - build_components_a
      - build_components_b
      - materialize_cached_components_a
      - materialize_cached_components_b
    if: >-
      ${{ always() &&
      needs.engine_verify_sealed_plan.result == 'success' &&
      needs.prepare_runtime_and_inputs.result == 'success' &&
      (needs.build_components_a.result == 'success' || needs.build_components_a.result == 'skipped') &&
      (needs.build_components_b.result == 'success' || needs.build_components_b.result == 'skipped') &&
      (needs.materialize_cached_components_a.result == 'success' || needs.materialize_cached_components_a.result == 'skipped') &&
      (needs.materialize_cached_components_b.result == 'success' || needs.materialize_cached_components_b.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 30
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download frozen component-store input manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Download the selected runtime for store verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.engine_verify_sealed_plan.outputs.runtime_transport_artifact }}
          path: ${{ runner.temp }}/runtime-transport

      - name: Download the verified runtime and prepared-input seal
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-runtime-prepared-seal-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/runtime-prepared-seal

      - name: Activate sealed offline runtime for store verification
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-transport
          runtime-manifest-path: ${{ runner.temp }}/runtime-transport/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Download every current-run exact component transport
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: catalog-component-transport-*
          path: ${{ runner.temp }}/component-transports

      - name: Reconcile and verify the complete global component store
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from aurora.infra.github_performance.contracts import canonical_sha256
          from aurora.infra.sp500_megarun.catalog_component_store import (
              CatalogComponentStore,
          )
          from aurora.infra.sp500_megarun.catalog_optimization_contract import (
              RunOptimizationContractV1,
          )

          temp = Path(os.environ["RUNNER_TEMP"])
          expected = json.loads(
              (temp / "sealed-plan/component_store_input_manifest.json").read_text()
          )
          required = expected["required_component_ids"]
          if required != sorted(set(required)):
              raise SystemExit("COMPONENT_STORE_REQUIRED_SET_INVALID")
          resolved = RunOptimizationContractV1.model_validate_json(
              (temp / "sealed-plan/resolved_contract.json").read_text()
          )
          expected_bundles = {
              row["component_transport_artifact"]: row
              for row in expected["bundles"]
          }
          transport_root = temp / "component-transports"
          observed_artifacts = {
              path.name for path in transport_root.iterdir() if path.is_dir()
          }
          if observed_artifacts != set(expected_bundles):
              raise SystemExit("COMPONENT_PAYLOAD_INCOMPLETE")
          observed = {}
          for artifact_name in sorted(expected_bundles):
              artifact_root = transport_root / artifact_name
              wrappers = list(
                  artifact_root.rglob("component_bundle_manifest.json")
              )
              if len(wrappers) != 1:
                  raise SystemExit("COMPONENT_BUNDLE_MANIFEST_INVALID")
              wrapper = json.loads(wrappers[0].read_text())
              wrapper_identity = {
                  key: value
                  for key, value in wrapper.items()
                  if key != "manifest_sha256"
              }
              if canonical_sha256(wrapper_identity) != wrapper.get("manifest_sha256"):
                  raise SystemExit("COMPONENT_BUNDLE_MANIFEST_INVALID")
              store = CatalogComponentStore.open(
                  wrappers[0].parent,
                  expected_data_snapshot_sha256=resolved.science.data_snapshot_sha256,
                  expected_evaluator_sha256=resolved.science.evaluator_sha256,
              )
              if wrapper["component_store_manifest_sha256"] != store.manifest.manifest_sha256:
                  raise SystemExit("COMPONENT_BUNDLE_MANIFEST_INVALID")
              expected_bundle = expected_bundles[artifact_name]
              if (
                  wrapper["bundle_identity_sha256"]
                  != expected_bundle["bundle_identity_sha256"]
                  or sorted(row["component_id"] for row in wrapper["components"])
                  != expected_bundle["component_ids"]
              ):
                  raise SystemExit("COMPONENT_BUNDLE_IDENTITY_INVALID")
              for entry in wrapper["components"]:
                  component_id = entry["component_id"]
                  source_id = entry["source_configuration_sha256"]
                  store_entry = next(
                      row
                      for row in store.manifest.entries
                      if row.component_id == source_id
                  )
                  store.get(source_id)
                  result_hash = store_entry.result_sha256
                  if result_hash != entry["result_sha256"]:
                      raise SystemExit("COMPONENT_BUNDLE_RESULT_INVALID")
                  previous = observed.get(component_id)
                  if previous is not None:
                      raise SystemExit("COMPONENT_STORE_IDENTITY_CONFLICT")
                  observed[component_id] = result_hash
          if sorted(observed) != required:
              raise SystemExit("COMPONENT_PAYLOAD_INCOMPLETE")
          seal = {
              "schema_version": "1",
              "required_component_ids": required,
              "component_result_sha256": observed,
              "component_store_input_manifest_sha256": hashlib.sha256(
                  (temp / "sealed-plan/component_store_input_manifest.json").read_bytes()
              ).hexdigest(),
              "validation_opened": False,
              "locked_opened": False,
          }
          canonical = json.dumps(
              seal, sort_keys=True, separators=(",", ":"), allow_nan=False
          ).encode()
          seal["seal_sha256"] = hashlib.sha256(canonical).hexdigest()
          Path("component-store-seal.json").write_text(
              json.dumps(seal, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - id: cache_inventory
        name: Capture two identical complete main-cache inventories for reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for snapshot in 1 2; do
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&per_page=100" \
              > "$RUNNER_TEMP/catalog-main-caches-$snapshot.json"
          done
          cmp --silent \
            "$RUNNER_TEMP/catalog-main-caches-1.json" \
            "$RUNNER_TEMP/catalog-main-caches-2.json"

      - id: store_index
        name: Build a small content-bound index for every cache proven reusable
        if: ${{ steps.cache_inventory.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_AUTHORITY_ID: ${{ inputs.authority_id }}
          CATALOG_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CATALOG_SCIENCE_SHA256: ${{ inputs.science_sha256 }}
          CATALOG_EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
          CATALOG_EXECUTION_PROTOCOL_SHA256: ${{ inputs.execution_protocol_sha256 }}
        shell: bash
        run: >-
          python scripts/build_catalog_rebuildable_store_index.py
          --runtime-prepared-seal
          "$RUNNER_TEMP/runtime-prepared-seal/runtime-prepared-seal.json"
          --runtime-root "$RUNNER_TEMP/runtime-transport"
          --component-root "$RUNNER_TEMP/component-transports"
          --cache-inventory "$RUNNER_TEMP/catalog-main-caches-1.json"
          --output "$RUNNER_TEMP/catalog-rebuildable-store-index-v1.json"

      - name: Publish the immutable global reuse index when cache read-back succeeded
        if: ${{ steps.store_index.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.execution_mode == 'prepare' && format('catalog-rebuildable-store-index-prepared-{0}', inputs.authority_id) || 'catalog-rebuildable-store-index-v1' }}
          path: ${{ runner.temp }}/catalog-rebuildable-store-index-v1.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish the small authoritative component-store seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-component-store-seal-${{ inputs.authority_id }}
          path: component-store-seal.json
          if-no-files-found: error
          retention-days: 90

  evaluate_a:
    needs: [engine_verify_sealed_plan, verify_component_store]
    if: ${{ inputs.execution_mode == 'run' && needs.engine_verify_sealed_plan.outputs.recipe_matrix_a_count != '0' }}
    strategy:
