name: SP500 Optimized Catalog Run

on:
  workflow_call:
    inputs:
      request_sha256: {required: true, type: string}
      authority_id: {required: true, type: string}
      campaign_id: {required: true, type: string}
      science_sha256: {required: true, type: string}
      execution_plan_sha256: {required: true, type: string}
      execution_protocol_sha256: {required: true, type: string}
      protected_commit_sha: {required: true, type: string}
      decision_sha256: {required: true, type: string}
      execution_mode: {required: false, type: string, default: run}
    outputs:
      campaign_state:
        value: ${{ jobs.campaign_outcome.outputs.campaign_state }}
      final_evidence_artifact:
        value: ${{ jobs.campaign_outcome.outputs.final_evidence_artifact }}
      outcome_evidence_sha256:
        value: ${{ jobs.campaign_outcome.outputs.outcome_evidence_sha256 }}
      runtime_audit_artifact:
        value: ${{ jobs.campaign_outcome.outputs.runtime_audit_artifact }}
      science_evidence_artifact:
        value: ${{ jobs.campaign_outcome.outputs.science_evidence_artifact }}
      recovery_evidence_artifact:
        value: ${{ jobs.campaign_outcome.outputs.recovery_evidence_artifact }}
      failure_fingerprint:
        value: ${{ jobs.campaign_outcome.outputs.failure_fingerprint }}
      failure_occurrence_count:
        value: ${{ jobs.campaign_outcome.outputs.failure_occurrence_count }}
      failure_reason_code:
        value: ${{ jobs.campaign_outcome.outputs.failure_reason_code }}
      retry_not_before:
        value: ${{ jobs.campaign_outcome.outputs.retry_not_before }}
      terminal_failure_code:
        value: ${{ jobs.campaign_outcome.outputs.terminal_failure_code }}

permissions: {actions: read, contents: read}
concurrency:
  group: sp500-optimized-catalog-${{ inputs.authority_id }}
  cancel-in-progress: false

env:
  GITHUB_ACTIONS: "true"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "NEHALEM"
  NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  engine_verify_sealed_plan:
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 10
    outputs:
      admission_token_sha256: ${{ steps.verify.outputs.admission_token_sha256 }}
      runtime_mode: ${{ steps.verify.outputs.runtime_mode }}
      runtime_identity_sha256: ${{ steps.verify.outputs.runtime_identity_sha256 }}
      runtime_cache_key: ${{ steps.verify.outputs.runtime_cache_key }}
      runtime_transport_artifact: ${{ steps.verify.outputs.runtime_transport_artifact }}
      runtime_source_run_id: ${{ steps.verify.outputs.runtime_source_run_id }}
      numeric_profile_sha256: ${{ steps.verify.outputs.numeric_profile_sha256 }}
      prepared_input_cache_key: ${{ steps.verify.outputs.prepared_input_cache_key }}
      prepared_input_transport_artifact: ${{ steps.verify.outputs.prepared_input_transport_artifact }}
      prepared_input_identity_sha256: ${{ steps.verify.outputs.prepared_input_identity_sha256 }}
      prepared_cache_key_core: ${{ steps.verify.outputs.prepared_cache_key_core }}
      prepared_artifact_core: ${{ steps.verify.outputs.prepared_artifact_core }}
      prepared_cache_key_d_cboe_pcr: ${{ steps.verify.outputs.prepared_cache_key_d_cboe_pcr }}
      prepared_artifact_d_cboe_pcr: ${{ steps.verify.outputs.prepared_artifact_d_cboe_pcr }}
      prepared_cache_key_d_cftc_legacy: ${{ steps.verify.outputs.prepared_cache_key_d_cftc_legacy }}
      prepared_artifact_d_cftc_legacy: ${{ steps.verify.outputs.prepared_artifact_d_cftc_legacy }}
      prepared_cache_key_d_cftc: ${{ steps.verify.outputs.prepared_cache_key_d_cftc }}
      prepared_artifact_d_cftc: ${{ steps.verify.outputs.prepared_artifact_d_cftc }}
      prepared_cache_key_d_z1: ${{ steps.verify.outputs.prepared_cache_key_d_z1 }}
      prepared_artifact_d_z1: ${{ steps.verify.outputs.prepared_artifact_d_z1 }}
      prepared_cache_key_d_fed: ${{ steps.verify.outputs.prepared_cache_key_d_fed }}
      prepared_artifact_d_fed: ${{ steps.verify.outputs.prepared_artifact_d_fed }}
      prepared_cache_key_d_macro_pit: ${{ steps.verify.outputs.prepared_cache_key_d_macro_pit }}
      prepared_artifact_d_macro_pit: ${{ steps.verify.outputs.prepared_artifact_d_macro_pit }}
      prepared_cache_key_d_french_us: ${{ steps.verify.outputs.prepared_cache_key_d_french_us }}
      prepared_artifact_d_french_us: ${{ steps.verify.outputs.prepared_artifact_d_french_us }}
      prepared_cache_key_d_fed_h15_h10: ${{ steps.verify.outputs.prepared_cache_key_d_fed_h15_h10 }}
      prepared_artifact_d_fed_h15_h10: ${{ steps.verify.outputs.prepared_artifact_d_fed_h15_h10 }}
      component_matrix_a: ${{ steps.verify.outputs.component_matrix_a }}
      component_matrix_b: ${{ steps.verify.outputs.component_matrix_b }}
      cached_component_matrix_a: ${{ steps.verify.outputs.cached_component_matrix_a }}
      cached_component_matrix_b: ${{ steps.verify.outputs.cached_component_matrix_b }}
      recipe_matrix_a: ${{ steps.verify.outputs.recipe_matrix_a }}
      recipe_matrix_b: ${{ steps.verify.outputs.recipe_matrix_b }}
      recipe_matrix_c: ${{ steps.verify.outputs.recipe_matrix_c }}
      component_matrix_a_count: ${{ steps.verify.outputs.component_matrix_a_count }}
      component_matrix_b_count: ${{ steps.verify.outputs.component_matrix_b_count }}
      cached_component_matrix_a_count: ${{ steps.verify.outputs.cached_component_matrix_a_count }}
      cached_component_matrix_b_count: ${{ steps.verify.outputs.cached_component_matrix_b_count }}
      recipe_matrix_a_count: ${{ steps.verify.outputs.recipe_matrix_a_count }}
      recipe_matrix_b_count: ${{ steps.verify.outputs.recipe_matrix_b_count }}
      recipe_matrix_c_count: ${{ steps.verify.outputs.recipe_matrix_c_count }}
      reduction_matrix: ${{ steps.verify.outputs.reduction_matrix }}
      reduction_matrix_count: ${{ steps.verify.outputs.reduction_matrix_count }}
      reduction_artifact_pattern: ${{ steps.verify.outputs.reduction_artifact_pattern }}
      pending_recipe_count: ${{ steps.verify.outputs.pending_recipe_count }}
      active_recipe_workers: ${{ steps.verify.outputs.active_recipe_workers }}
      final_evidence_artifact: ${{ steps.verify.outputs.final_evidence_artifact }}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Verify protected source commit
        env:
          REQUESTED_PROTECTED_COMMIT_SHA: ${{ inputs.protected_commit_sha }}
          TRUSTED_PROTECTED_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$REQUESTED_PROTECTED_COMMIT_SHA" = "$TRUSTED_PROTECTED_COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$TRUSTED_PROTECTED_COMMIT_SHA"

      - name: Download the controller-sealed execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Verify the complete immutable plan without replanning
        id: verify
        shell: bash
        env:
          EXPECTED_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          EXPECTED_AUTHORITY_ID: ${{ inputs.authority_id }}
          EXPECTED_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          EXPECTED_SCIENCE_SHA256: ${{ inputs.science_sha256 }}
          EXPECTED_EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
          EXPECTED_EXECUTION_PROTOCOL_SHA256: ${{ inputs.execution_protocol_sha256 }}
          EXPECTED_PROTECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_DECISION_SHA256: ${{ inputs.decision_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sealed-plan"
          required_files = {
              "resolved_contract.json",
              "controller_binding.json",
              "rebuildable_store_plan.json",
              "logical_recipe_manifest.json",
              "component_requirement_manifest.json",
              "component_store_input_manifest.json",
              "pending_component_manifest.json",
              "cached_component_manifest.json",
              "component_matrix_a.json",
              "component_matrix_b.json",
              "cached_component_matrix_a.json",
              "cached_component_matrix_b.json",
              "recipe_assignment_bundle.zip",
              "recipe_matrix_a.json",
              "recipe_matrix_b.json",
              "recipe_matrix_c.json",
              "payload_bundle_manifest.json",
              "checkpoint_policy.json",
              "reduction_plan.json",
              "artifact_plan.json",
              "source_artifacts.json",
              "execution_plan_receipt.json",
          }
          present = {path.name for path in root.iterdir() if path.is_file()}
          if not required_files.issubset(present):
              raise SystemExit("CATALOG_SEALED_PLAN_FILES_MISSING")
          receipt = json.loads((root / "execution_plan_receipt.json").read_text())
          receipt_identity = {
              key: value
              for key, value in receipt.items()
              if key != "receipt_sha256"
          }
          receipt_hash = hashlib.sha256(
              json.dumps(
                  receipt_identity,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode()
          ).hexdigest()
          if receipt_hash != receipt.get("receipt_sha256"):
              raise SystemExit("CATALOG_SEALED_PLAN_RECEIPT_HASH_INVALID")
          bindings = {
              "request_sha256": os.environ["EXPECTED_REQUEST_SHA256"],
              "authority_id": os.environ["EXPECTED_AUTHORITY_ID"],
              "campaign_id": os.environ["EXPECTED_CAMPAIGN_ID"],
              "science_sha256": os.environ["EXPECTED_SCIENCE_SHA256"],
              "execution_plan_sha256": os.environ["EXPECTED_EXECUTION_PLAN_SHA256"],
              "execution_protocol_sha256": os.environ[
                  "EXPECTED_EXECUTION_PROTOCOL_SHA256"
              ],
              "protected_commit_sha": os.environ["EXPECTED_PROTECTED_COMMIT_SHA"],
              "decision_sha256": os.environ["EXPECTED_DECISION_SHA256"],
          }
          if any(receipt.get(key) != value for key, value in bindings.items()):
              raise SystemExit("CATALOG_SEALED_PLAN_BINDING_INVALID")
          if (
              receipt.get("schema_version") != "1"
              or receipt.get("validation_opened") is not False
              or receipt.get("locked_opened") is not False
          ):
              raise SystemExit("CATALOG_SEALED_PLAN_BOUNDARY_INVALID")
          manifest = receipt.get("content_manifest")
          if not isinstance(manifest, list) or not manifest:
              raise SystemExit("CATALOG_SEALED_PLAN_MANIFEST_INVALID")
          seen = set()
          for item in manifest:
              if set(item) != {"path", "sha256", "size_bytes"}:
                  raise SystemExit("CATALOG_SEALED_PLAN_MANIFEST_INVALID")
              relative = Path(item["path"])
              if relative.is_absolute() or ".." in relative.parts or relative.as_posix() in seen:
                  raise SystemExit("CATALOG_SEALED_PLAN_MANIFEST_INVALID")
              seen.add(relative.as_posix())
              target = root / relative
              if (
                  not target.is_file()
                  or target.stat().st_size != item["size_bytes"]
                  or hashlib.sha256(target.read_bytes()).hexdigest() != item["sha256"]
              ):
                  raise SystemExit("CATALOG_SEALED_PLAN_CONTENT_INVALID")
          all_sealed_files = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path.name != "execution_plan_receipt.json"
          }
          if seen != all_sealed_files:
              raise SystemExit("CATALOG_SEALED_PLAN_MANIFEST_COVERAGE_INVALID")
          source_document = json.loads((root / "source_artifacts.json").read_text())
          source_payload = source_document.get("payload")
          source_contract = (
              source_payload.get("source_contract")
              if isinstance(source_payload, dict)
              else None
          )
          source_rows = (
              source_contract.get("artifacts")
              if isinstance(source_contract, dict)
              else None
          )
          runtime_sources = (
              [
                  row
                  for row in source_rows
                  if isinstance(row, dict)
                  and row.get("contract_name") == "runtime_input_pack_v1"
              ]
              if isinstance(source_rows, list)
              else []
          )
          runtime_source_run_id = (
              runtime_sources[0].get("run_id")
              if len(runtime_sources) == 1
              else None
          )
          if (
              isinstance(runtime_source_run_id, bool)
              or not isinstance(runtime_source_run_id, int)
              or runtime_source_run_id < 1
              or runtime_sources[0].get("classification") != "training_input"
              or runtime_sources[0].get("verification_mode")
              != "runtime_input_manifest_v1"
              or runtime_sources[0].get("validation_opened") is not False
              or runtime_sources[0].get("locked_opened") is not False
          ):
              raise SystemExit("CATALOG_RUNTIME_SOURCE_DOCUMENT_INVALID")
          manifest_hash = hashlib.sha256(
              json.dumps(
                  manifest,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode()
          ).hexdigest()
          if manifest_hash != receipt.get("content_manifest_sha256"):
              raise SystemExit("CATALOG_SEALED_PLAN_MANIFEST_HASH_INVALID")
          matrix_names = (
              "component_matrix_a",
              "component_matrix_b",
              "cached_component_matrix_a",
              "cached_component_matrix_b",
              "recipe_matrix_a",
              "recipe_matrix_b",
              "recipe_matrix_c",
          )
          matrices = {}
          combined_utf16 = 0
          for name in matrix_names:
              value = json.loads((root / f"{name}.json").read_text())
              rows = value.get("include")
              if set(value) != {"include"} or not isinstance(rows, list):
                  raise SystemExit("CATALOG_MATRIX_SCHEMA_INVALID")
              for row in rows:
                  if set(row) != {
                      "worker_id",
                      "descriptor_bundle_artifact",
                      "descriptor_member",
                      "descriptor_sha256",
                  }:
                      raise SystemExit("CATALOG_MATRIX_ROW_INVALID")
              encoded = json.dumps(
                  value, sort_keys=True, separators=(",", ":")
              )
              combined_utf16 += len(encoded.encode("utf-16-le"))
              matrices[name] = encoded
          reduction = json.loads((root / "reduction_plan.json").read_text())
          reduction_identity = {
              key: value
              for key, value in reduction.items()
              if key != "content_sha256"
          }
          reduction_hash = hashlib.sha256(
              json.dumps(
                  reduction_identity,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode()
          ).hexdigest()
          groups = reduction.get("groups")
          reduction_matrix = reduction.get("matrix")
          selected_mode = reduction.get("selected_mode")
          central_eligibility = reduction.get("central_eligibility")
          selection_identity = (
              {
                  key: value
                  for key, value in central_eligibility.items()
                  if key != "decision_sha256"
              }
              if isinstance(central_eligibility, dict)
              else None
          )
          active_recipe_workers = receipt["active_recipe_workers"]
          expected_group_size = (
              max(1, active_recipe_workers)
              if selected_mode == "central"
              else 24
          )
          expected_maximum_groups = 1 if selected_mode == "central" else 15
          expected_maximum_fan_in = 360 if selected_mode == "central" else 30
          selection_hash = (
              hashlib.sha256(
                  json.dumps(
                      selection_identity,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode()
              ).hexdigest()
              if selection_identity is not None
              else None
          )
          if (
              reduction.get("schema_version") != "1"
              or reduction.get("document_type") != "reduction_plan"
              or reduction_hash != reduction.get("content_sha256")
              or selected_mode not in {"central", "hierarchical"}
              or not isinstance(central_eligibility, dict)
              or central_eligibility.get("mode") != selected_mode
              or central_eligibility.get("decision_sha256") != selection_hash
              or reduction.get("group_size") != expected_group_size
              or reduction.get("maximum_group_count")
              != expected_maximum_groups
              or reduction.get("fan_in") != expected_group_size
              or reduction.get("maximum_fan_in")
              != expected_maximum_fan_in
              or reduction.get("maximum_levels") != 2
              or not isinstance(groups, list)
              or len(groups) > expected_maximum_groups
              or not isinstance(reduction_matrix, dict)
              or set(reduction_matrix) != {"include"}
              or reduction.get("validation_opened") is not False
              or reduction.get("locked_opened") is not False
          ):
              raise SystemExit("CATALOG_REDUCTION_PLAN_INVALID")
          expected_matrix = []
          covered_workers = []
          plan_prefix = receipt["execution_plan_sha256"][:16]
          for group_id, group in enumerate(groups):
              expected_pattern = (
                  f"catalog-checkpoint-{plan_prefix}-*"
                  if selected_mode == "central"
                  else f"catalog-checkpoint-{plan_prefix}-g{group_id:02d}-*"
              )
              expected_artifact = (
                  f"catalog-reduction-group-{plan_prefix}-g{group_id:02d}"
              )
              if (
                  not isinstance(group, dict)
                  or set(group) != {
                      "group_id",
                      "worker_ids",
                      "checkpoint_artifacts",
                      "checkpoint_artifact_pattern",
                      "reduction_artifact",
                  }
                  or group.get("group_id") != group_id
                  or not isinstance(group.get("worker_ids"), list)
                  or not 1 <= len(group["worker_ids"]) <= expected_group_size
                  or group["worker_ids"] != sorted(group["worker_ids"])
                  or not isinstance(group.get("checkpoint_artifacts"), list)
                  or not group["checkpoint_artifacts"]
                  or group.get("checkpoint_artifact_pattern")
                  != expected_pattern
                  or group.get("reduction_artifact") != expected_artifact
              ):
                  raise SystemExit("CATALOG_REDUCTION_PLAN_INVALID")
              covered_workers.extend(group["worker_ids"])
              expected_matrix.append(
                  {
                      "group_id": group_id,
                      "checkpoint_artifact_pattern": expected_pattern,
                      "reduction_artifact": expected_artifact,
                  }
              )
          if (
              covered_workers != list(range(receipt["active_recipe_workers"]))
              or reduction_matrix != {"include": expected_matrix}
              or reduction.get("reduction_artifact_pattern")
              != f"catalog-reduction-group-{plan_prefix}-*"
              or reduction.get("final_evidence_artifact")
              != receipt["final_evidence_artifact"]
          ):
              raise SystemExit("CATALOG_REDUCTION_PLAN_INVALID")
          reduction_matrix_encoded = json.dumps(
              reduction_matrix,
              sort_keys=True,
              separators=(",", ":"),
          )
          combined_utf16 += len(reduction_matrix_encoded.encode("utf-16-le"))
          if combined_utf16 > 512 * 1024:
              raise SystemExit("CATALOG_MATRIX_OUTPUT_BUDGET_EXCEEDED")
          outputs = {
              "admission_token_sha256": receipt["admission_token_sha256"],
              "runtime_mode": receipt["runtime_mode"],
              "runtime_identity_sha256": receipt["runtime_identity_sha256"],
              "runtime_cache_key": receipt["runtime_cache_key"],
              "runtime_transport_artifact": receipt["runtime_transport_artifact"],
              "runtime_source_run_id": runtime_source_run_id,
              "numeric_profile_sha256": receipt["numeric_profile_sha256"],
              "prepared_input_cache_key": receipt["prepared_input_cache_key"],
              "prepared_input_transport_artifact": receipt[
                  "prepared_input_transport_artifact"
              ],
              "prepared_input_identity_sha256": receipt[
                  "prepared_input_identity_sha256"
              ],
              "pending_recipe_count": receipt["pending_recipe_count"],
              "active_recipe_workers": receipt["active_recipe_workers"],
              "final_evidence_artifact": receipt["final_evidence_artifact"],
              "reduction_matrix": reduction_matrix_encoded,
              "reduction_matrix_count": len(expected_matrix),
              "reduction_artifact_pattern": reduction[
                  "reduction_artifact_pattern"
              ],
          }
          fixed_partitions = {
              "runtime-fragment-core": "core",
              "runtime-fragment-D_CBOE_PCR": "d_cboe_pcr",
              "runtime-fragment-D_CFTC_LEGACY": "d_cftc_legacy",
              "runtime-fragment-D_CFTC": "d_cftc",
              "runtime-fragment-D_Z1": "d_z1",
              "runtime-fragment-D_FED_H3_H6_H8_G19_CP": "d_fed",
              "runtime-fragment-D_MACRO_PIT": "d_macro_pit",
              "runtime-fragment-D_FRENCH_US": "d_french_us",
              "runtime-fragment-D_FED_H15_H10": "d_fed_h15_h10",
          }
          partition_rows = receipt.get("prepared_input_partitions")
          if not isinstance(partition_rows, list):
              raise SystemExit("CATALOG_PREPARED_PARTITION_PLAN_INVALID")
          by_id = {
              row.get("logical_id"): row
              for row in partition_rows
              if isinstance(row, dict)
          }
          if set(by_id) != set(fixed_partitions) or len(by_id) != len(partition_rows):
              raise SystemExit("CATALOG_PREPARED_PARTITION_PLAN_INVALID")
          for logical_id, suffix in fixed_partitions.items():
              row = by_id[logical_id]
              if set(row) != {
                  "logical_id",
                  "transport_artifact",
                  "cache_lookup_key",
              }:
                  raise SystemExit("CATALOG_PREPARED_PARTITION_PLAN_INVALID")
              outputs[f"prepared_cache_key_{suffix}"] = row["cache_lookup_key"]
              outputs[f"prepared_artifact_{suffix}"] = row["transport_artifact"]
          outputs.update(matrices)
          outputs.update(
              {
                  f"{name}_count": len(json.loads(value)["include"])
                  for name, value in matrices.items()
              }
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for key, value in outputs.items():
                  out.write(f"{key}={value}\n")
          PY

      - name: Publish bounded plan-verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-engine-plan-verification-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan/execution_plan_receipt.json
          if-no-files-found: error
          retention-days: 90

  prepare_runtime_and_inputs:
    needs: engine_verify_sealed_plan
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 45
    permissions: {actions: read, contents: read}
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}

      - name: Download the controller-sealed execution plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
          path: ${{ runner.temp }}/sealed-plan

      - name: Use the runtime Python ABI
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""

      - name: Restore exact default-branch runtime cache
        id: runtime_cache
        if: ${{ needs.engine_verify_sealed_plan.outputs.runtime_cache_key != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/runtime-store
          key: ${{ needs.engine_verify_sealed_plan.outputs.runtime_cache_key }}
          lookup-only: false
          fail-on-cache-miss: false

      - name: Refuse runtime construction in a requested run
        if: ${{ inputs.execution_mode == 'run' && steps.runtime_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          echo "CATALOG_PREPARATION_CACHE_MISSING:runtime" >&2
          exit 1

      - name: Validate the complete hashed dependency supply
        if: ${{ inputs.execution_mode == 'prepare' && steps.runtime_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("requirements/catalog-optimized.lock").read_text("utf-8")
          forbidden = ("-e ", "--editable", "git+", "hg+", "svn+", "bzr+", "file:", "--extra-index-url", " @ ")
          if any(token in text for token in forbidden):
              raise SystemExit("RUNTIME_DEPENDENCY_SOURCE_FORBIDDEN")
          requirement_lines = [
              line for line in text.splitlines()
              if line and not line.startswith((" ", "#", "--hash="))
          ]
          if not requirement_lines or any("==" not in line for line in requirement_lines):
              raise SystemExit("RUNTIME_DEPENDENCY_NOT_EXACT")
          hashes = re.findall(r"--hash=sha256:([0-9a-f]{64})", text)
          if len(hashes) < len(requirement_lines):
              raise SystemExit("RUNTIME_DEPENDENCY_HASH_MISSING")
          PY

      - name: Build the one locked runtime store
        id: runtime_build
        if: ${{ inputs.execution_mode == 'prepare' && steps.runtime_cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          RUNTIME_MODE: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          RUNTIME_IDENTITY_SHA256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          NUMERIC_PROFILE_SHA256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/runtime-store"
          mkdir -p "$root/wheelhouse"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement requirements/catalog-optimized.lock \
            --dest "$root/wheelhouse"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "runtime-store"
          lock = Path("requirements/catalog-optimized.lock")
          lock_sha = hashlib.sha256(lock.read_bytes()).hexdigest()
          wheelhouse = root / "wheelhouse"
          wheels = sorted(wheelhouse.iterdir())
          wheel_manifest = {
              "schema_version": "1",
              "dependency_lock_sha256": lock_sha,
              "files": [
                  {
                      "path": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size_bytes": path.stat().st_size,
                  }
                  for path in wheels
              ],
          }
          (wheelhouse / "wheelhouse_manifest.json").write_text(
              json.dumps(wheel_manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          file_list = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "runtime_manifest.json":
                  file_list.append(
                      {
                          "path": path.relative_to(root).as_posix(),
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                          "size_bytes": path.stat().st_size,
                      }
                  )
          observed = [
              (item["path"], item["sha256"], item["size_bytes"]) for item in file_list
          ]
          object_sha = hashlib.sha256(
              json.dumps(
                  observed, sort_keys=True, separators=(",", ":"), allow_nan=False
              ).encode()
          ).hexdigest()
          manifest = {
              "schema_version": "1",
              "runtime_mode": os.environ["RUNTIME_MODE"],
              "runtime_identity_sha256": os.environ["RUNTIME_IDENTITY_SHA256"],
              "object_sha256": object_sha,
              "dependency_lock_sha256": lock_sha,
              "numeric_profile_sha256": os.environ["NUMERIC_PROFILE_SHA256"],
              "source_sha_verified_separately": os.environ["GITHUB_SHA"],
              "file_list": file_list,
          }
          (root / "runtime_manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          manifest_sha = hashlib.sha256(
              (root / "runtime_manifest.json").read_bytes()
          ).hexdigest()
          cache_key = (
              f"aurora-catalog-v1-{os.environ['RUNTIME_IDENTITY_SHA256']}-"
              f"{manifest_sha}-main"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"cache_key={cache_key}\n")
          PY

      - name: Save exact immutable runtime cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.runtime_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/runtime-store
          key: ${{ steps.runtime_build.outputs.cache_key }}

      - name: Activate and verify the selected runtime before input preparation
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.11"
          runtime-mode: ${{ needs.engine_verify_sealed_plan.outputs.runtime_mode }}
          runtime-object-path: ${{ runner.temp }}/runtime-store
          runtime-manifest-path: ${{ runner.temp }}/runtime-store/runtime_manifest.json
          dependency-lock-path: requirements/catalog-optimized.lock
          expected-runtime-identity-sha256: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          expected-source-sha: ${{ github.sha }}
          expected-numeric-profile-sha256: ${{ needs.engine_verify_sealed_plan.outputs.numeric_profile_sha256 }}

      - name: Restore prepared core cache
        id: input_cache_core
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_core != '' }}
