        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_CFTC_LEGACY
          key: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cftc_legacy }}
          lookup-only: false
