      - name: Restore prepared D_FED_H15_H10 cache
        id: input_cache_d_fed_h15_h10
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed_h15_h10 != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_FED_H15_H10
          key: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed_h15_h10 }}
          lookup-only: false
          fail-on-cache-miss: false

      - name: Resolve only proven missing prepared partitions
        id: input_decision
        shell: bash
        env:
          HIT_CORE: ${{ steps.input_cache_core.outputs.cache-hit }}
          HIT_D_CBOE_PCR: ${{ steps.input_cache_d_cboe_pcr.outputs.cache-hit }}
          HIT_D_CFTC_LEGACY: ${{ steps.input_cache_d_cftc_legacy.outputs.cache-hit }}
          HIT_D_CFTC: ${{ steps.input_cache_d_cftc.outputs.cache-hit }}
          HIT_D_Z1: ${{ steps.input_cache_d_z1.outputs.cache-hit }}
          HIT_D_FED: ${{ steps.input_cache_d_fed.outputs.cache-hit }}
          HIT_D_MACRO_PIT: ${{ steps.input_cache_d_macro_pit.outputs.cache-hit }}
          HIT_D_FRENCH_US: ${{ steps.input_cache_d_french_us.outputs.cache-hit }}
          HIT_D_FED_H15_H10: ${{ steps.input_cache_d_fed_h15_h10.outputs.cache-hit }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/missing-partitions.txt"
          check() {
            if [ "$1" != "true" ]; then
              echo "$2" >> "$RUNNER_TEMP/missing-partitions.txt"
            fi
          }
          check "$HIT_CORE" runtime-fragment-core
          check "$HIT_D_CBOE_PCR" runtime-fragment-D_CBOE_PCR
          check "$HIT_D_CFTC_LEGACY" runtime-fragment-D_CFTC_LEGACY
          check "$HIT_D_CFTC" runtime-fragment-D_CFTC
          check "$HIT_D_Z1" runtime-fragment-D_Z1
          check "$HIT_D_FED" runtime-fragment-D_FED_H3_H6_H8_G19_CP
          check "$HIT_D_MACRO_PIT" runtime-fragment-D_MACRO_PIT
          check "$HIT_D_FRENCH_US" runtime-fragment-D_FRENCH_US
          check "$HIT_D_FED_H15_H10" runtime-fragment-D_FED_H15_H10
          if [ -s "$RUNNER_TEMP/missing-partitions.txt" ]; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse input preparation in a requested run
        if: ${{ inputs.execution_mode == 'run' && steps.input_decision.outputs.has_missing == 'true' }}
        shell: bash
        run: |
          echo "CATALOG_PREPARATION_CACHE_MISSING:prepared_input" >&2
          exit 1

      - name: Download and verify the frozen train-only source once
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_decision.outputs.has_missing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/fetch_catalog_runtime_input_artifact.py \
            --sealed-plan "$RUNNER_TEMP/sealed-plan" \
            --output-archive "$RUNNER_TEMP/runtime-source.zip" \
            --output-dir "$RUNNER_TEMP/runtime-source" \
            --receipt "$RUNNER_TEMP/runtime-source-receipt.json"
          source_root="$RUNNER_TEMP/runtime-source"
          runtime_source_run_id="$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"runtime-source-receipt.json").read_text("utf-8"))["run_id"])')"
          args=()
          while IFS= read -r partition; do
            test -n "$partition"
            args+=(--partition-id "$partition")
          done < "$RUNNER_TEMP/missing-partitions.txt"
          python -m scripts.prepare_sp500_runtime_fragments \
            --runtime-input-pack "$source_root" \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --runtime-source-run-id "$runtime_source_run_id" \
            --output-dir "$RUNNER_TEMP/prepared-missing" \
            "${args[@]}"
          mkdir -p "$RUNNER_TEMP/prepared"
          while IFS= read -r partition; do
            test -d "$RUNNER_TEMP/prepared-missing/$partition"
            test ! -e "$RUNNER_TEMP/prepared/$partition"
            cp -a "$RUNNER_TEMP/prepared-missing/$partition" "$RUNNER_TEMP/prepared/$partition"
          done < "$RUNNER_TEMP/missing-partitions.txt"

      - name: Verify every prepared partition and derive immutable save keys
        id: prepared_keys
        shell: bash
        env:
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          AUTHORITY_ID: ${{ inputs.authority_id }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          SCIENCE_SHA256: ${{ inputs.science_sha256 }}
          EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
          EXECUTION_PROTOCOL_SHA256: ${{ inputs.execution_protocol_sha256 }}
          PROTECTED_COMMIT_SHA: ${{ github.sha }}
          RUNTIME_IDENTITY: ${{ needs.engine_verify_sealed_plan.outputs.runtime_identity_sha256 }}
          PREPARED_IDENTITY: ${{ needs.engine_verify_sealed_plan.outputs.prepared_input_identity_sha256 }}
          HIT_CORE: ${{ steps.input_cache_core.outputs.cache-hit }}
          HIT_D_CBOE_PCR: ${{ steps.input_cache_d_cboe_pcr.outputs.cache-hit }}
          HIT_D_CFTC_LEGACY: ${{ steps.input_cache_d_cftc_legacy.outputs.cache-hit }}
          HIT_D_CFTC: ${{ steps.input_cache_d_cftc.outputs.cache-hit }}
          HIT_D_Z1: ${{ steps.input_cache_d_z1.outputs.cache-hit }}
          HIT_D_FED: ${{ steps.input_cache_d_fed.outputs.cache-hit }}
          HIT_D_MACRO_PIT: ${{ steps.input_cache_d_macro_pit.outputs.cache-hit }}
          HIT_D_FRENCH_US: ${{ steps.input_cache_d_french_us.outputs.cache-hit }}
          HIT_D_FED_H15_H10: ${{ steps.input_cache_d_fed_h15_h10.outputs.cache-hit }}
          EXPECTED_CORE: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_core }}
          EXPECTED_D_CBOE_PCR: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cboe_pcr }}
          EXPECTED_D_CFTC_LEGACY: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cftc_legacy }}
          EXPECTED_D_CFTC: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cftc }}
          EXPECTED_D_Z1: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_z1 }}
          EXPECTED_D_FED: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed }}
          EXPECTED_D_MACRO_PIT: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_macro_pit }}
          EXPECTED_D_FRENCH_US: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_french_us }}
          EXPECTED_D_FED_H15_H10: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed_h15_h10 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "prepared"
          partitions = {
              "core": ("runtime-fragment-core", os.environ["EXPECTED_CORE"], os.environ["HIT_CORE"]),
              "d_cboe_pcr": ("runtime-fragment-D_CBOE_PCR", os.environ["EXPECTED_D_CBOE_PCR"], os.environ["HIT_D_CBOE_PCR"]),
              "d_cftc_legacy": ("runtime-fragment-D_CFTC_LEGACY", os.environ["EXPECTED_D_CFTC_LEGACY"], os.environ["HIT_D_CFTC_LEGACY"]),
              "d_cftc": ("runtime-fragment-D_CFTC", os.environ["EXPECTED_D_CFTC"], os.environ["HIT_D_CFTC"]),
              "d_z1": ("runtime-fragment-D_Z1", os.environ["EXPECTED_D_Z1"], os.environ["HIT_D_Z1"]),
              "d_fed": ("runtime-fragment-D_FED_H3_H6_H8_G19_CP", os.environ["EXPECTED_D_FED"], os.environ["HIT_D_FED"]),
              "d_macro_pit": ("runtime-fragment-D_MACRO_PIT", os.environ["EXPECTED_D_MACRO_PIT"], os.environ["HIT_D_MACRO_PIT"]),
              "d_french_us": ("runtime-fragment-D_FRENCH_US", os.environ["EXPECTED_D_FRENCH_US"], os.environ["HIT_D_FRENCH_US"]),
              "d_fed_h15_h10": ("runtime-fragment-D_FED_H15_H10", os.environ["EXPECTED_D_FED_H15_H10"], os.environ["HIT_D_FED_H15_H10"]),
          }
          verified_partitions = []
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for slug, (logical_id, expected_key, cache_hit) in partitions.items():
                  partition = root / logical_id
                  files = []
                  for path in sorted(partition.rglob("*")):
                      if path.is_file():
                          files.append(
                              {
                                  "path": path.relative_to(partition).as_posix(),
                                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                                  "size_bytes": path.stat().st_size,
                              }
                          )
                  if not files:
                      raise SystemExit("CATALOG_PREPARED_PARTITION_EMPTY")
                  manifest_sha = hashlib.sha256(
                      json.dumps(
                          files,
                          sort_keys=True,
                          separators=(",", ":"),
                          allow_nan=False,
                      ).encode()
                  ).hexdigest()
                  cache_key = (
                      f"aurora-catalog-v1-{os.environ['PREPARED_IDENTITY']}-"
                      f"{manifest_sha}-main"
                  )
                  if expected_key and cache_key != expected_key:
                      raise SystemExit("CATALOG_PREPARED_CACHE_CONTENT_INVALID")
                  output.write(f"cache_key_{slug}={cache_key}\n")
                  verified_partitions.append(
                      {
                          "logical_id": logical_id,
                          "cache_key": cache_key,
                          "manifest_sha256": manifest_sha,
                          "file_count": len(files),
                          "size_bytes": sum(item["size_bytes"] for item in files),
                          "files": files,
                          "cache_hit": cache_hit == "true",
                      }
                  )
          runtime_manifest = Path(os.environ["RUNNER_TEMP"]) / "runtime-store/runtime_manifest.json"
          source_artifacts = Path(os.environ["RUNNER_TEMP"]) / "sealed-plan/source_artifacts.json"
          source_fetch = Path(os.environ["RUNNER_TEMP"]) / "runtime-source-receipt.json"
          verified_partitions.sort(key=lambda item: item["logical_id"])
          identity = {
              "schema_version": "1",
              "request_sha256": os.environ["REQUEST_SHA256"],
              "authority_id": os.environ["AUTHORITY_ID"],
              "campaign_id": os.environ["CAMPAIGN_ID"],
              "science_sha256": os.environ["SCIENCE_SHA256"],
              "execution_plan_sha256": os.environ["EXECUTION_PLAN_SHA256"],
              "execution_protocol_sha256": os.environ["EXECUTION_PROTOCOL_SHA256"],
              "protected_commit_sha": os.environ["PROTECTED_COMMIT_SHA"],
              "runtime_identity_sha256": os.environ["RUNTIME_IDENTITY"],
              "runtime_manifest_sha256": hashlib.sha256(runtime_manifest.read_bytes()).hexdigest(),
              "prepared_input_identity_sha256": os.environ["PREPARED_IDENTITY"],
              "source_artifacts_sha256": hashlib.sha256(source_artifacts.read_bytes()).hexdigest(),
              "source_fetch_receipt_sha256": (
                  hashlib.sha256(source_fetch.read_bytes()).hexdigest()
                  if source_fetch.is_file()
                  else None
              ),
              "partitions": verified_partitions,
              "validation_opened": False,
              "locked_opened": False,
          }
          seal = {
              **identity,
              "seal_sha256": hashlib.sha256(
                  json.dumps(
                      identity,
                      sort_keys=True,
                      separators=(",", ":"),
                      allow_nan=False,
                  ).encode()
              ).hexdigest(),
          }
          Path("runtime-prepared-seal.json").write_text(
              json.dumps(seal, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Save prepared core cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_core.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-core
          key: ${{ steps.prepared_keys.outputs.cache_key_core }}

      - name: Save prepared D_CBOE_PCR cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_d_cboe_pcr.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_CBOE_PCR
          key: ${{ steps.prepared_keys.outputs.cache_key_d_cboe_pcr }}

      - name: Save prepared D_CFTC_LEGACY cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_d_cftc_legacy.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_CFTC_LEGACY
          key: ${{ steps.prepared_keys.outputs.cache_key_d_cftc_legacy }}

      - name: Save prepared D_CFTC cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_d_cftc.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_CFTC
          key: ${{ steps.prepared_keys.outputs.cache_key_d_cftc }}

      - name: Save prepared D_Z1 cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_d_z1.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_Z1
          key: ${{ steps.prepared_keys.outputs.cache_key_d_z1 }}

      - name: Save prepared federal block cache
        if: ${{ inputs.execution_mode == 'prepare' && steps.input_cache_d_fed.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
