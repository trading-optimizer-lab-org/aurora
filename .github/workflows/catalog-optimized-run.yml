      - name: Restore prepared D_FRENCH_US cache
        id: input_cache_d_french_us
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_french_us != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_FRENCH_US
          key: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_french_us }}
          lookup-only: false
