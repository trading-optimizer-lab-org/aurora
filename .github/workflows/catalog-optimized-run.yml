      - name: Restore prepared federal block cache
        id: input_cache_d_fed
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_FED_H3_H6_H8_G19_CP
          key: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_fed }}
          lookup-only: false
          fail-on-cache-miss: false

      - name: Restore prepared D_MACRO_PIT cache
        id: input_cache_d_macro_pit
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_macro_pit != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
