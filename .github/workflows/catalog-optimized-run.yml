      - name: Restore prepared D_CFTC cache
        id: input_cache_d_cftc
        if: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cftc != '' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/prepared/runtime-fragment-D_CFTC
          key: ${{ needs.engine_verify_sealed_plan.outputs.prepared_cache_key_d_cftc }}
          lookup-only: false
