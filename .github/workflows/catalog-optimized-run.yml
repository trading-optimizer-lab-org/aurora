name: SP500 Optimized Catalog Run

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      admission_evidence_path: {required: false, type: string, default: "config/sp500_catalog_admission_evidence_current_v1.json"}
      reference_run_id: {required: false, type: string, default: "31948898747"}
      component_store_run_id: {required: false, type: string, default: ""}
      component_cost_run_id: {required: false, type: string, default: ""}
      evaluation_cache_run_ids: {required: false, type: string, default: ""}
      benchmark_workers: {required: false, type: number, default: 0}
      benchmark_processes: {required: false, type: number, default: 0}
      benchmark_component_processes: {required: false, type: number, default: 0}
      benchmark_component_workers: {required: false, type: number, default: 0}
  workflow_dispatch:
    inputs:
      commit_sha: {description: Exact revision, required: true}
      runtime_input_run_id: {description: Immutable train-only runtime pack, required: true, default: "31418682679"}
      reference_run_id: {description: Frozen scientific oracle run, required: false, default: "31948898747"}
      component_store_run_id: {description: Compatible prior component-store run, required: false, default: ""}
      component_cost_run_id: {description: Prior measured component-cost evidence, required: false, default: ""}
      evaluation_cache_run_ids: {description: Comma-separated compatible result or checkpoint runs, required: false, default: ""}
      benchmark_workers: {description: Qualification-only worker candidate; zero uses the promoted policy, required: false, type: number, default: 0}
      benchmark_processes: {description: Qualification-only process candidate; zero uses the promoted policy, required: false, type: number, default: 0}
      benchmark_component_processes: {description: Qualification-only component process candidate; zero uses the promoted policy, required: false, type: number, default: 0}
      benchmark_component_workers: {description: Qualification-only component worker candidate; zero uses the promoted policy, required: false, type: number, default: 0}

permissions: {actions: read, contents: read}
concurrency:
  group: sp500-optimized-catalog-${{ inputs.commit_sha }}
  cancel-in-progress: false

env:
  GITHUB_ACTIONS: "true"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "NEHALEM"
  NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      matrix_c: ${{ steps.plan.outputs.matrix_c }}
      admission_token_sha256: ${{ steps.plan.outputs.admission_token_sha256 }}
      active_workers: ${{ steps.plan.outputs.active_workers }}
      pending_recipe_count: ${{ steps.plan.outputs.pending_recipe_count }}
      cached_recipe_count: ${{ steps.plan.outputs.cached_recipe_count }}
      component_workers: ${{ steps.plan.outputs.component_workers }}
      component_matrix: ${{ steps.plan.outputs.component_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: >-
          uv pip install --system --require-hashes
          -r requirements/catalog-recipe-worker.lock
      - name: Restore latest compatible autotune history artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/autotune"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=sp500-catalog-autotune-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/autotune/state.zip"
            unzip -q "$RUNNER_TEMP/autotune/state.zip" -d "$RUNNER_TEMP/autotune/latest"
          fi
      - name: Download compatible resume sources once for planning
        if: ${{ inputs.evaluation_cache_run_ids != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RUN_IDS: ${{ inputs.evaluation_cache_run_ids }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/resume"
          IFS=',' read -ra run_ids <<< "$CACHE_RUN_IDS"
          for raw_id in "${run_ids[@]}"; do
            run_id="${raw_id//[[:space:]]/}"
            [ -n "$run_id" ] || continue
            mkdir -p "$RUNNER_TEMP/resume/$run_id"
            if ! gh run download "$run_id" -n sp500-strategy-catalog-final-results -D "$RUNNER_TEMP/resume/$run_id/final"; then
              gh run download "$run_id" -p 'sp500-catalog-shard-*' -D "$RUNNER_TEMP/resume/$run_id/shards"
            fi
          done
      - id: plan
        shell: bash
        run: |
          resume_args=()
          if [ -n "${{ inputs.evaluation_cache_run_ids }}" ]; then
            resume_args+=(--resume-root "$RUNNER_TEMP/resume")
          fi
          benchmark_args=()
          autotune_args=()
          thermal_state="cold"
          if [ -n "${{ inputs.component_store_run_id }}" ]; then
            thermal_state="component_warm"
          fi
          if [ -f "$RUNNER_TEMP/autotune/latest/performance_history.json" ]; then
            autotune_args+=(--autotune-history "$RUNNER_TEMP/autotune/latest/performance_history.json")
          fi
          if [ "${{ inputs.benchmark_workers }}" -ne 0 ]; then
            benchmark_args+=(--benchmark-workers "${{ inputs.benchmark_workers }}")
          fi
          if [ "${{ inputs.benchmark_processes }}" -ne 0 ]; then
            benchmark_args+=(--benchmark-processes "${{ inputs.benchmark_processes }}")
          fi
          if [ "${{ inputs.benchmark_component_processes }}" -ne 0 ]; then
            benchmark_args+=(--benchmark-component-processes "${{ inputs.benchmark_component_processes }}")
          fi
          if [ "${{ inputs.benchmark_component_workers }}" -ne 0 ]; then
            benchmark_args+=(--benchmark-component-workers "${{ inputs.benchmark_component_workers }}")
          fi
          python scripts/plan_sp500_optimized_catalog_run.py \
            --repo-root . \
            --policy config/sp500_catalog_optimization_policy_v1.json \
            --campaign config/sp500_megarun_dehb_campaign_v1.json \
            --catalog-dir config/sp500_megarun_strategy_catalog_v1 \
            --selected-config config/sp500_megarun_selected_dehb_13.json \
            --evidence "${{ inputs.admission_evidence_path || 'config/sp500_catalog_admission_evidence_current_v1.json' }}" \
            --output-dir outputs/plan \
            --github-output "$GITHUB_OUTPUT" \
            --thermal-state "$thermal_state" \
            "${resume_args[@]}" \
            "${autotune_args[@]}" \
            "${benchmark_args[@]}"
          python -m scripts.compile_sp500_catalog_recipes \
            --catalog config/sp500_megarun_strategy_catalog_v1/catalog.jsonl \
            --output-dir outputs/plan
          if [ -f "$RUNNER_TEMP/autotune/latest/performance_history.json" ]; then
            cp "$RUNNER_TEMP/autotune/latest/performance_history.json" outputs/plan/autotune_history_prior.json
          fi
      - if: ${{ steps.plan.outputs.pending_recipe_count != '0' && inputs.component_store_run_id == '' && inputs.component_cost_run_id == '' }}
        run: exit 1
      - name: Download latest compatible measured component costs
        if: ${{ steps.plan.outputs.pending_recipe_count != '0' && inputs.component_store_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COST_RUN_ID: ${{ inputs.component_cost_run_id }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cost-source"
          if ! gh run download "$COST_RUN_ID" -n sp500-global-component-store -D "$RUNNER_TEMP/cost-source"; then
            gh run download "$COST_RUN_ID" -n sp500-strategy-catalog-final-results -D "$RUNNER_TEMP/cost-source"
          fi
      - if: ${{ steps.plan.outputs.pending_recipe_count != '0' && inputs.component_store_run_id == '' }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/cost-source/component_performance.json"
          if [ ! -f "$report" ]; then
            report="$RUNNER_TEMP/cost-source/performance.json"
          fi
          python -m scripts.plan_sp500_component_schedule \
            --catalog config/sp500_megarun_strategy_catalog_v1/catalog.jsonl \
            --selected-config config/sp500_megarun_selected_dehb_13.json \
            --data-contract config/sp500_megarun_free_data_240.json \
            --performance-report "$report" \
            --workers "${{ steps.plan.outputs.component_workers }}" \
            --output-dir outputs/plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-run-plan
          path: outputs/plan
          if-no-files-found: error
          retention-days: 30

  prepare_runtime_fragments:
    # This is independent of catalog planning. Running it in parallel removes
    # its 50-second preparation cost from the cold-run critical path.
    if: ${{ inputs.component_store_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: >-
          uv pip install --system --require-hashes
          -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Create verified runtime fragments
        shell: bash
        run: >-
          python -m scripts.prepare_sp500_runtime_fragments
          --runtime-input-pack "$RUNNER_TEMP/runtime-source"
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --runtime-source-run-id "${{ github.run_id }}"
          --output-dir outputs/runtime-fragments
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-core
          path: outputs/runtime-fragments/runtime-fragment-core
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_CBOE_PCR
          path: outputs/runtime-fragments/runtime-fragment-D_CBOE_PCR
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_CFTC_LEGACY
          path: outputs/runtime-fragments/runtime-fragment-D_CFTC_LEGACY
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_CFTC
          path: outputs/runtime-fragments/runtime-fragment-D_CFTC
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_Z1
          path: outputs/runtime-fragments/runtime-fragment-D_Z1
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_FED_H3_H6_H8_G19_CP
          path: outputs/runtime-fragments/runtime-fragment-D_FED_H3_H6_H8_G19_CP
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_MACRO_PIT
          path: outputs/runtime-fragments/runtime-fragment-D_MACRO_PIT
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_FRENCH_US
          path: outputs/runtime-fragments/runtime-fragment-D_FRENCH_US
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-runtime-fragment-D_FED_H15_H10
          path: outputs/runtime-fragments/runtime-fragment-D_FED_H15_H10
          if-no-files-found: error
          retention-days: 7

  build_components:
    needs: [plan, prepare_runtime_fragments]
    if: ${{ needs.plan.outputs.pending_recipe_count != '0' && inputs.component_store_run_id == '' && needs.prepare_runtime_fragments.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.component_matrix) }}
    uses: ./.github/workflows/catalog-component-worker.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      runtime_fragment_run_id: ${{ github.run_id }}
      component_shard_index: ${{ matrix.component_shard }}
      total_component_shards: ${{ fromJSON(needs.plan.outputs.component_workers) }}
      admission_token_sha256: ${{ needs.plan.outputs.admission_token_sha256 }}

  merge_components:
    needs: [plan, build_components]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.pending_recipe_count != '0' && inputs.component_store_run_id == '' && needs.build_components.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: >-
          uv pip install --system --require-hashes
          -r requirements/catalog-recipe-worker.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ inputs.component_store_run_id == '' }}
        with:
          pattern: sp500-component-part-*
          path: ${{ runner.temp }}/component-parts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-run-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ inputs.component_store_run_id == '' }}
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - run: >-
          python -m scripts.merge_sp500_component_store
          --input-root "$RUNNER_TEMP/component-parts"
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --run-plan "$RUNNER_TEMP/plan/run_plan.json"
          --admission-token "${{ needs.plan.outputs.admission_token_sha256 }}"
          --expected-component-count 7281
          --output-dir outputs/component-store
        if: ${{ inputs.component_store_run_id == '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ inputs.component_store_run_id != '' }}
        with:
          name: sp500-global-component-store
          path: outputs/component-store
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.component_store_run_id }}
      - run: >-
          python -m scripts.verify_sp500_component_store
          --component-store outputs/component-store
          --resolved-contract "$RUNNER_TEMP/plan/resolved_contract.json"
          --expected-component-count 7281
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-global-component-store
          path: outputs/component-store
          if-no-files-found: error
          retention-days: 30

  evaluate_a:
    needs: [plan, merge_components]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.pending_recipe_count != '0' && (inputs.component_store_run_id != '' || needs.merge_components.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    uses: ./.github/workflows/catalog-optimized-worker.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      component_store_run_id: ${{ inputs.component_store_run_id || github.run_id }}
      shard_index: ${{ matrix.shard }}
      active_workers: ${{ fromJSON(needs.plan.outputs.active_workers) }}
      admission_token_sha256: ${{ needs.plan.outputs.admission_token_sha256 }}

  evaluate_b:
    needs: [plan, merge_components]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.pending_recipe_count != '0' && (inputs.component_store_run_id != '' || needs.merge_components.result == 'success') && fromJSON(needs.plan.outputs.active_workers) > 120 }}
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    uses: ./.github/workflows/catalog-optimized-worker.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      component_store_run_id: ${{ inputs.component_store_run_id || github.run_id }}
      shard_index: ${{ matrix.shard }}
      active_workers: ${{ fromJSON(needs.plan.outputs.active_workers) }}
      admission_token_sha256: ${{ needs.plan.outputs.admission_token_sha256 }}

  evaluate_c:
    needs: [plan, merge_components]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.pending_recipe_count != '0' && (inputs.component_store_run_id != '' || needs.merge_components.result == 'success') && fromJSON(needs.plan.outputs.active_workers) > 240 }}
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.plan.outputs.matrix_c) }}
    uses: ./.github/workflows/catalog-optimized-worker.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      component_store_run_id: ${{ inputs.component_store_run_id || github.run_id }}
      shard_index: ${{ matrix.shard }}
      active_workers: ${{ fromJSON(needs.plan.outputs.active_workers) }}
      admission_token_sha256: ${{ needs.plan.outputs.admission_token_sha256 }}

  reduce:
    needs: [plan, evaluate_a, evaluate_b, evaluate_c]
    if: ${{ always() && needs.plan.result == 'success' && ((needs.plan.outputs.pending_recipe_count == '0') || ((needs.evaluate_a.result == 'success' || needs.evaluate_a.result == 'skipped') && (needs.evaluate_b.result == 'success' || needs.evaluate_b.result == 'skipped') && (needs.evaluate_c.result == 'success' || needs.evaluate_c.result == 'skipped'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: >-
          uv pip install --system --require-hashes
          -r requirements/catalog-recipe-worker.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.plan.outputs.pending_recipe_count != '0' }}
        with:
          pattern: sp500-catalog-shard-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-run-plan
          path: ${{ runner.temp }}/plan
      - name: Download compatible resume sources once for reduction
        if: ${{ inputs.evaluation_cache_run_ids != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RUN_IDS: ${{ inputs.evaluation_cache_run_ids }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/resume"
          IFS=',' read -ra run_ids <<< "$CACHE_RUN_IDS"
          for raw_id in "${run_ids[@]}"; do
            run_id="${raw_id//[[:space:]]/}"
            [ -n "$run_id" ] || continue
            mkdir -p "$RUNNER_TEMP/resume/$run_id"
            if ! gh run download "$run_id" -n sp500-strategy-catalog-final-results -D "$RUNNER_TEMP/resume/$run_id/final"; then
              gh run download "$run_id" -p 'sp500-catalog-shard-*' -D "$RUNNER_TEMP/resume/$run_id/shards"
            fi
          done
      - shell: bash
        run: |
          resume_args=()
          if [ -n "${{ inputs.evaluation_cache_run_ids }}" ]; then
            resume_args+=(--resume-root "$RUNNER_TEMP/resume")
          fi
          python scripts/reduce_sp500_optimized_catalog_run.py \
            --input-root "$RUNNER_TEMP/shards" \
            --catalog config/sp500_megarun_strategy_catalog_v1/catalog.jsonl \
            --resolved-contract "$RUNNER_TEMP/plan/resolved_contract.json" \
            --resume-work-manifest "$RUNNER_TEMP/plan/resume_work_manifest.json" \
            --run-plan "$RUNNER_TEMP/plan/run_plan.json" \
            --admission-token "${{ needs.plan.outputs.admission_token_sha256 }}" \
            --output-dir outputs/final \
            "${resume_args[@]}"
      - if: ${{ inputs.reference_run_id != '' }}
        run: >-
          python scripts/verify_sp500_optimized_run.py
          --optimized outputs/final
          --reference-manifest config/sp500_catalog_reference_science_v1.json
          --expected-reference-run-id "${{ inputs.reference_run_id }}"
          --output outputs/equivalence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && inputs.reference_run_id != '' }}
        with:
          name: sp500-catalog-qualification-evidence
          path: outputs/equivalence.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-strategy-catalog-final-results
          path: outputs/final
          if-no-files-found: error
          retention-days: 90

  audit_runtime:
    needs: [plan, reduce]
    if: ${{ always() && needs.plan.result == 'success' && needs.reduce.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/final
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ inputs.component_store_run_id == '' }}
        with:
          name: sp500-global-component-store
          path: ${{ runner.temp }}/component-store
      - name: Collect complete Actions metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/run.json"
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
      - name: Build runtime audit
        env:
          PENDING_RECIPES: ${{ needs.plan.outputs.pending_recipe_count }}
          COMPONENT_STORE_RUN_ID: ${{ inputs.component_store_run_id }}
          PYTHONPATH: ${{ github.workspace }}/..
        shell: bash
        run: |
          thermal_state="cold"
          if [ "$PENDING_RECIPES" = "0" ]; then
            thermal_state="fully_hot"
          elif [ -n "$COMPONENT_STORE_RUN_ID" ]; then
            thermal_state="component_warm"
          fi
          component_store_args=()
          if [ -f "$RUNNER_TEMP/component-store/runtime_manifest.json" ]; then
            component_store_args+=(--component-store "$RUNNER_TEMP/component-store")
          fi
          python -m scripts.audit_sp500_catalog_actions_run \
            --run "$RUNNER_TEMP/run.json" \
            --jobs "$RUNNER_TEMP/jobs.json" \
            --artifacts "$RUNNER_TEMP/artifacts.json" \
            --receipt "$RUNNER_TEMP/final/receipt.json" \
            --thermal-state "$thermal_state" \
            --output outputs/runtime_audit.json \
            "${component_store_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-runtime-audit
          path: outputs/runtime_audit.json
          if-no-files-found: error
          retention-days: 90

  update_autotune:
    needs: [plan, reduce, audit_runtime]
    if: ${{ always() && needs.plan.result == 'success' && needs.reduce.result == 'success' && needs.audit_runtime.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - run: >-
          uv pip install --system --require-hashes
          -r requirements/catalog-recipe-worker.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-runtime-audit
          path: ${{ runner.temp }}/audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-qualification-evidence
          path: ${{ runner.temp }}/equivalence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/final
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-run-plan
          path: ${{ runner.temp }}/plan
      - name: Append verified benchmark and promote only after three samples
        shell: bash
        run: |
          mkdir -p outputs/autotune
          science_identity="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"final","receipt.json")))["science_identity_sha256"])')"
          thermal_state="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"audit","runtime_audit.json")))["thermal_state"])')"
          history_args=()
          if [ -f "$RUNNER_TEMP/plan/autotune_history_prior.json" ]; then
            history_args+=(--history "$RUNNER_TEMP/plan/autotune_history_prior.json")
          fi
          python -m scripts.update_sp500_catalog_autotune \
            "${history_args[@]}" \
            --runtime-audit "$RUNNER_TEMP/audit/runtime_audit.json" \
            --equivalence "$RUNNER_TEMP/equivalence/equivalence.json" \
            --science-identity-sha256 "$science_identity" \
            --thermal-state "$thermal_state" \
            --minimum-samples 3 \
            --max-regression-ratio 0.05 \
            --allow-incomplete \
            --output-history outputs/autotune/performance_history.json \
            --output-decision outputs/autotune/decision.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-autotune-state
          path: outputs/autotune
          if-no-files-found: error
          retention-days: 90
