name: GitHub Performance Workload Validation

on:
  workflow_dispatch:
    inputs:
      workload_family:
        description: Representative scientific workload
        required: true
        default: candidate_sweep
        type: choice
        options:
          - candidate_sweep
          - event_study
          - robustness
      execution_mode:
        description: Equivalent baseline or optimized execution plan
        required: true
        default: optimized
        type: choice
        options:
          - baseline
          - optimized
      forced_job_count:
        description: Exact shard count; zero lets the planner decide
        required: false
        default: 0
        type: number

permissions:
  contents: read
  actions: read

jobs:
  candidate_sweep:
    if: inputs.workload_family == 'candidate_sweep'
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_candidate_sweep.yaml
      workload: >-
        aurora.infra.github_performance.workloads.candidate_sweep:WORKLOAD
      run_label: >-
        github-performance-candidate-sweep-${{ inputs.execution_mode }}
      retention_days: 7
      execution_mode: ${{ inputs.execution_mode }}
      forced_job_count: >-
        ${{ fromJSON(format('{0}', inputs.forced_job_count)) }}

  event_study:
    if: inputs.workload_family == 'event_study'
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_event_study.yaml
      workload: >-
        aurora.infra.github_performance.workloads.event_study:WORKLOAD
      run_label: >-
        github-performance-event-study-${{ inputs.execution_mode }}
      retention_days: 7
      execution_mode: ${{ inputs.execution_mode }}
      forced_job_count: >-
        ${{ fromJSON(format('{0}', inputs.forced_job_count)) }}

  robustness:
    if: inputs.workload_family == 'robustness'
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_robustness.yaml
      workload: >-
        aurora.infra.github_performance.workloads.robustness:WORKLOAD
      run_label: >-
        github-performance-robustness-${{ inputs.execution_mode }}
      retention_days: 7
      execution_mode: ${{ inputs.execution_mode }}
      forced_job_count: >-
        ${{ fromJSON(format('{0}', inputs.forced_job_count)) }}
