name: Stock Protocol 36 Tests 360 Jobs

"on":
  workflow_dispatch:
    inputs:
      data_source_run_id:
        description: "Optional prior data run id; empty rebuilds bounded public data"
        required: false
        default: ""
      data_artifact_name:
        description: "Optional prior data artifact name"
        required: false
        default: ""
      max_parallel_requested:
        description: "Requested runner concurrency"
        required: true
        default: "360"
      validation_only:
        description: "Run GitHub validation jobs only"
        required: true
        default: "false"

concurrency:
  group: stock-protocol-36-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  QF_DATA_DIR: ${{ github.workspace }}/qf-data
  MANIFEST: config/stock_protocol_36_tests.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Validate manifest and protocol contracts
        run: >-
          python -m pytest -q
          tests/test_stock_protocol_manifest.py
          tests/test_stock_protocol_dataset.py
          tests/test_stock_protocol_engine.py
          tests/test_stock_protocol_shards.py
          tests/test_stock_protocol_workflow_contract.py
      - name: Confirm locked policy
        run: echo "locked_opened=false"

  plan:
    if: ${{ inputs.validation_only != 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix_a: ${{ steps.make.outputs.matrix_a }}
      matrix_b: ${{ steps.make.outputs.matrix_b }}
      data_a: ${{ steps.make.outputs.data_a }}
      data_b: ${{ steps.make.outputs.data_b }}
    steps:
      - id: make
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("matrix_a=" + json.dumps(list(range(180)), separators=(",", ":")))
          print("matrix_b=" + json.dumps(list(range(180, 360)), separators=(",", ":")))
          print("data_a=" + json.dumps(list(range(16)), separators=(",", ":")))
          print("data_b=" + json.dumps(list(range(16, 32)), separators=(",", ":")))
          PY

  build_universe:
    if: ${{ inputs.validation_only != 'true' && inputs.data_source_run_id == '' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Build current public US universe
        run: python -m aurora.cli.forge data free-us-daily build-universe --output json
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-universe
          path: |
            qf-data/prices/free_us_daily/universe
            qf-data/prices/free_us_daily/metadata
            qf-data/prices/free_us_daily/reports
            qf-data/prices/free_us_daily/catalog.sqlite
          retention-days: 7

  download_data_a:
    if: ${{ inputs.validation_only != 'true' && inputs.data_source_run_id == '' }}
    needs: [plan, build_universe]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.data_a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: stock-protocol-universe
          path: qf-data/prices/free_us_daily
      - name: Download bounded daily prices
        run: >-
          python -m aurora.cli.forge data free-us-daily download-prices
          --start max --end 2021-01-01 --workers 1 --batch-size 15
          --sleep-between-batches 1.5 --retries 3 --retry-wait-seconds 2
          --shard-count 32 --shard-index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-price-shard-${{ matrix.shard }}
          path: |
            qf-data/prices/free_us_daily/raw
            qf-data/prices/free_us_daily/normalized
            qf-data/prices/free_us_daily/reports
            qf-data/prices/free_us_daily/catalog.sqlite
          retention-days: 7

  download_data_b:
    if: ${{ inputs.validation_only != 'true' && inputs.data_source_run_id == '' }}
    needs: [plan, build_universe]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.data_b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: stock-protocol-universe
          path: qf-data/prices/free_us_daily
      - name: Download bounded daily prices
        run: >-
          python -m aurora.cli.forge data free-us-daily download-prices
          --start max --end 2021-01-01 --workers 1 --batch-size 15
          --sleep-between-batches 1.5 --retries 3 --retry-wait-seconds 2
          --shard-count 32 --shard-index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-price-shard-${{ matrix.shard }}
          path: |
            qf-data/prices/free_us_daily/raw
            qf-data/prices/free_us_daily/normalized
            qf-data/prices/free_us_daily/reports
            qf-data/prices/free_us_daily/catalog.sqlite
          retention-days: 7

  merge_data:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, build_universe, download_data_a, download_data_b]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download bounded data source artifact when supplied
        if: ${{ inputs.data_source_run_id != '' && inputs.data_artifact_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ inputs.data_source_run_id }}"
          --repo "${{ github.repository }}"
          --name "${{ inputs.data_artifact_name }}"
          --dir downloaded-source
      - name: Download freshly built universe
        if: ${{ inputs.data_source_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: stock-protocol-universe
          path: final-qf-data/prices/free_us_daily
      - name: Download fresh price shards
        if: ${{ inputs.data_source_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: stock-protocol-price-shard-*
          path: downloaded-shards
      - name: Merge fresh price shards
        if: ${{ inputs.data_source_run_id == '' }}
        run: >-
          python scripts/merge_free_us_daily_shards.py
          --root final-qf-data/prices/free_us_daily
          --shards-dir downloaded-shards
      - name: Locate supplied source
        if: ${{ inputs.data_source_run_id != '' && inputs.data_artifact_name != '' }}
        run: |
          mkdir -p final-qf-data/prices/free_us_daily
          cp -R downloaded-source/. final-qf-data/prices/free_us_daily/
      - name: Build date-bounded research pack
        run: >-
          python scripts/prepare_stock_protocol_data.py
          --source-root final-qf-data/prices/free_us_daily
          --output-root final-qf-data/stock_protocol_pack
          --manifest "$MANIFEST"
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-pack
          path: final-qf-data/stock_protocol_pack
          retention-days: 7

  phase_signal_a:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: pack}
      - uses: ./.github/actions/stock-protocol-stage
        with: {phase: signal, shard: "${{ matrix.shard }}", pack_root: pack, output_root: stage-output}
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-signal-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  phase_signal_b:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
