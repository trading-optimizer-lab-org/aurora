      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-signal-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  freeze_signal:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [phase_signal_a, phase_signal_b]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {pattern: stock-protocol-signal-shard-*, path: phase-shards}
      - run: >-
          python scripts/merge_stock_protocol_phase.py
          --shards-root phase-shards --phase signal --shard-count 360
          --output-root phase-results --manifest "$MANIFEST"
      - run: >-
          python scripts/freeze_stock_protocol_layer.py
          --results phase-results/signal_results.csv --layer signal
          --manifest "$MANIFEST" --output-root phase-results
      - uses: actions/upload-artifact@v4
