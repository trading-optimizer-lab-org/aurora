          --shards-root phase-shards --phase costs --shard-count 360
          --output-root phase-results --manifest "$MANIFEST"
      - run: >-
          python scripts/freeze_stock_protocol_layer.py
          --results phase-results/costs_results.csv --layer costs
          --manifest "$MANIFEST" --output-root phase-results
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-phase-results-costs, path: phase-results, retention-days: 7}

  phase_walk_forward_a:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data, freeze_costs]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: {shard: ${{ fromJSON(needs.plan.outputs.matrix_a) }}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: pack}
      - uses: ./.github/actions/stock-protocol-stage
        with: {phase: walk_forward, shard: "${{ matrix.shard }}", pack_root: pack, output_root: stage-output}
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-walk-forward-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  phase_walk_forward_b:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data, freeze_costs]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: {shard: ${{ fromJSON(needs.plan.outputs.matrix_b) }}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: pack}
      - uses: ./.github/actions/stock-protocol-stage
        with: {phase: walk_forward, shard: "${{ matrix.shard }}", pack_root: pack, output_root: stage-output}
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-walk-forward-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  freeze_walk_forward:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [phase_walk_forward_a, phase_walk_forward_b]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {pattern: stock-protocol-walk-forward-shard-*, path: phase-shards}
      - run: >-
          python scripts/merge_stock_protocol_phase.py
          --shards-root phase-shards --phase walk_forward --shard-count 360
          --output-root phase-results --manifest "$MANIFEST"
      - run: >-
          python scripts/freeze_stock_protocol_layer.py
          --results phase-results/walk_forward_results.csv --layer walk_forward
          --manifest "$MANIFEST" --output-root phase-results
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-phase-results-walk-forward, path: phase-results, retention-days: 7}

  phase_robustness_a:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data, freeze_walk_forward]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: {shard: ${{ fromJSON(needs.plan.outputs.matrix_a) }}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: pack}
      - uses: ./.github/actions/stock-protocol-stage
        with: {phase: robustness, shard: "${{ matrix.shard }}", pack_root: pack, output_root: stage-output}
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-robustness-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  phase_robustness_b:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [plan, merge_data, freeze_walk_forward]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: {shard: ${{ fromJSON(needs.plan.outputs.matrix_b) }}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: pack}
      - uses: ./.github/actions/stock-protocol-stage
        with: {phase: robustness, shard: "${{ matrix.shard }}", pack_root: pack, output_root: stage-output}
      - uses: actions/upload-artifact@v4
        with: {name: stock-protocol-robustness-shard-${{ matrix.shard }}, path: stage-output, retention-days: 7}

  finalize:
    if: ${{ inputs.validation_only != 'true' }}
    needs: [freeze_signal, freeze_weights, freeze_entries, freeze_exits, freeze_portfolio, freeze_costs, freeze_walk_forward, phase_robustness_a, phase_robustness_b]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with: {name: stock-protocol-pack, path: final-input/pack}
      - uses: actions/download-artifact@v4
        with: {pattern: stock-protocol-phase-results-*, path: final-input/phases}
      - name: Download robustness shards
        uses: actions/download-artifact@v4
        with: {pattern: stock-protocol-robustness-shard-*, path: final-input/robustness}
      - name: Merge robustness shards
        run: >-
          python scripts/merge_stock_protocol_phase.py
          --shards-root final-input/robustness --phase robustness --shard-count 360
          --output-root final-input/phases/robustness --manifest "$MANIFEST"
      - name: Finalize artifact
        run: >-
          python scripts/finalize_stock_protocol.py
          --input-root final-input --output-root final
          --manifest "$MANIFEST"
      - uses: actions/upload-artifact@v4
        with:
          name: stock-protocol-36-tests-360jobs-results
          path: final
          retention-days: 30
