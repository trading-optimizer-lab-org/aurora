      - name: Compute merge totals
        id: totals
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          original_shards = 360
          original_strategies_per_shard = 200
          candidate_limit = max(int("${ inputs.candidate_count_per_job }"), 1)
          chunks_per_shard = (original_strategies_per_shard + candidate_limit - 1) // candidate_limit
          total_jobs = original_shards * chunks_per_shard
          if "${ inputs.test_mode }".strip().lower() == "true":
              total_jobs = min(max(int("${ inputs.test_max_jobs }"), 1), total_jobs)
          total_strategies = 0
          for job_index in range(total_jobs):
              chunk_index = job_index % chunks_per_shard
              strategy_offset = chunk_index * candidate_limit
              total_strategies += min(candidate_limit, original_strategies_per_shard - strategy_offset)
