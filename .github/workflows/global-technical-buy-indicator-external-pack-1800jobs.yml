name: Global Technical Buy Indicator External Pack 7200 Jobs

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      external_strategy_pack_path:
        description: "Repo path containing the external strategy pack"
        required: true
        default: "scripts/strategy_packs/gtbi_research_broad_72000"
      candidate_count_per_job:
        description: "Strategies evaluated per job"
        required: true
        default: "10"
      candidate_timeout_seconds:
        description: "Maximum seconds allowed per individual strategy candidate"
        required: true
        default: "1200"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from all packs"
        required: true
        default: "2021-01-01"
      fail_on_unsupported:
        description: "Fail job when an external rule cannot be mapped"
        required: true
        default: "false"
      test_mode:
        description: "Run only test_max_jobs jobs"
        required: true
        default: "false"
      test_max_jobs:
        description: "Maximum jobs in test_mode"
        required: true
        default: "20"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunk_0: ${{ steps.plan.outputs.chunk_0 }}
      chunk_0_count: ${{ steps.plan.outputs.chunk_0_count }}
      chunk_1: ${{ steps.plan.outputs.chunk_1 }}
      chunk_1_count: ${{ steps.plan.outputs.chunk_1_count }}
      chunk_2: ${{ steps.plan.outputs.chunk_2 }}
      chunk_2_count: ${{ steps.plan.outputs.chunk_2_count }}
