name: OpenAP 181 Short Interest Source Probe

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to probe
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openap-181-short-interest-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: "true"
      SOURCE_SHA: ${{ inputs.source_sha }}
      FINRA_FILES_URL: https://www.finra.org/finra-data/browse-catalog/equity-short-interest/files
      OPENAP_COMMIT: 8db892442c2c3a3779b0f1eac4370d3655be15a1
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify short-interest source contracts
        run: |
          python -m py_compile research/openap_181/short_interest_batch.py scripts/run_openap_181_short_interest_source_probe.py
          python -m pytest tests/test_openap_181_short_interest_batch.py -q --tb=short
      - name: Probe bounded official FINRA file and exact formula requirements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_openap_181_short_interest_source_probe.py \
            --output-dir outputs/openap_181_short_interest \
            --download-dir "$RUNNER_TEMP/openap_181_short_interest_raw" \
            --evidence-run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --evidence-artifact openap-181-short-interest-source-probe-results \
            --implementation-commit "$SOURCE_SHA"
      - name: Verify fail-closed decision and raw omission
        run: |
          python - <<'PY'
          import json
          import pathlib
          import pandas as pd
          root = pathlib.Path("outputs/openap_181_short_interest")
          summary = json.load(open(root / "short_interest_source_probe.json", encoding="utf-8"))
          evidence = pd.read_csv(root / "short_interest_batch_evidence.csv")
          metrics = pd.read_csv(root / "finra_short_interest_source_metrics.csv")
          assert summary["formula_sources_verified"] is True
          assert summary["finra_files_page_verified"] is True
          assert summary["finra_about_page_verified"] is True
          assert summary["finra_glossary_verified"] is True
          assert summary["finra_schedule_verified"] is True
          assert summary["latest_public_file_verified"] is True
          assert summary["listed_history_start"] == "2021-06-01"
          assert summary["historical_revisions_available"] is False
          assert summary["raw_redistribution_authorized"] is False
          assert summary["raw_files_in_artifact"] is False
          assert summary["strict_approved"] == 0
          assert summary["locked_opened"] is False
          assert summary["validation_used_for_selection"] is False
          assert int(metrics.loc[0, "rows"]) > 0
          assert str(metrics.loc[0, "signal_coverage_measured"]).lower() == "false"
          assert set(evidence["signal"]) == {"ShortInterest", "IO_ShortInterest", "Recomm_ShortInterest"}
          assert evidence["strict_gate_result"].eq("blocked").all()
          assert evidence["blocking_reason"].str.startswith("short_interest_source_partial:").all()
          assert not any(path.suffix.lower() in {".txt", ".zip"} for path in root.rglob("*"))
          PY
      - name: Upload short-interest source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-181-short-interest-source-probe-results
          path: outputs/openap_181_short_interest/
          if-no-files-found: error
          retention-days: 90
