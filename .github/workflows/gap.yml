name: Gap study against Qullamaggie (diagnostic)

# docs/research/GAP_PREREGISTRATION.md: diagnostic study requested by the owner.
# The 2016-2026 build must reproduce the published 2016-2020 result (gate).
# Market data stays in the Actions cache; only strategy returns and the report
# are uploaded.
on:
  workflow_dispatch:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_gap.py
      - .github/workflows/gap.yml

permissions:
  contents: read

concurrency:
  group: gap
  cancel-in-progress: true

jobs:
  gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore phase 7 minute cache (for the Nasdaq series)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-
          fail-on-cache-miss: true

      - name: Restore the locked-test downloads
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}
          restore-keys: intraday-locked-data-

      - name: Run the gap study
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python scripts/run_gap.py run --panel-dir outputs/stock_panel --out outputs/gap --old-cache outputs/alpaca
          --cache outputs/alpaca_locked --sec-cache outputs/sec_locked --nasdaq outputs/alpaca/ixic.csv --workers 4

      - name: Save the downloads
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/gap/GAP.md ]; then cat outputs/gap/GAP.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: gap-study
          path: |
            outputs/gap/GAP.md
            outputs/gap/levers.parquet
            outputs/gap/monsters.csv
            outputs/gap/coverage.json
          if-no-files-found: warn
          retention-days: 90
