name: Aurora dashboard deploy

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar migraciones D1 remotas antes del despliegue"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "cloudflare/**"
      - "scripts/aurora_dashboard_*.py"
      - ".github/workflows/aurora-dashboard-deploy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/package-lock.json

      - name: Build and test web
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run test:run
          npm --prefix web run build

      - name: Test and typecheck Worker
        run: |
          npm --prefix cloudflare ci
          npm --prefix cloudflare run typecheck
          npm --prefix cloudflare run test:run

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cloudflare/package-lock.json

      - name: Build the static client
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Install Wrangler
        run: npm --prefix cloudflare ci

      - name: Apply D1 migrations when explicitly requested
        if: ${{ inputs.apply_migrations == true }}
        run: npx --prefix cloudflare wrangler d1 migrations apply DB --remote --config cloudflare/wrangler.toml

      - name: Deploy Worker and Static Assets
        run: npx --prefix cloudflare wrangler deploy --config cloudflare/wrangler.toml
