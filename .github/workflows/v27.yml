          path: outputs/v26w/report
          run-id: ${{ needs.wait.outputs.run }}
          github-token: ${{ github.token }}
      - run: python scripts/run_v27.py real --shard ${{ matrix.shard }} --shards 300 --workers 4 --out outputs/v27w/holdout/part
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v27-holdout-real-${{ matrix.shard }}
          path: outputs/v27w/holdout/part
          retention-days: 14
          overwrite: true

  select-h:
    needs: [wait, missing-h, retry-h]
    if: always() && needs.missing-h.result == 'success' && (needs.retry-h.result == 'success' || needs.retry-h.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V27_STUDY: holdout
    outputs:
      names: ${{ steps.sel.outputs.names }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
