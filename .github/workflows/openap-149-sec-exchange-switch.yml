name: OpenAP 149 SEC ExchSwitch Current

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      formula_evidence_run_id:
        description: Run containing the pinned OpenAP formula inventory
        required: true
        default: "31331835149"
        type: string
      formation_at:
        description: Causal current formation timestamp
        required: true
        default: "2026-08-10T23:59:59Z"
        type: string
      notes_periods:
        description: Comma-separated SEC Notes periods covering the 12-month lag
        required: true
        default: "2025q3,2025q4,2026q1,2026q2,2026_07"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-sec-exchange-switch
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify ExchSwitch contracts
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m py_compile \
            research/openap_181/sec_fsd_access.py \
            research/openap_181/sec_notes_listing_inputs.py \
            research/openap_181/sec_listing_identity.py \
            scripts/run_openap_149_sec_notes_access.py \
            scripts/run_openap_149_sec_listing_identity.py
          python -m pytest \
            tests/test_openap_181_sec_fsd_access.py \
            tests/test_openap_181_sec_notes_listing_inputs.py \
            tests/test_openap_181_sec_listing_identity.py \
            -q --tb=short

  acquire:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      FORMATION_AT: ${{ inputs.formation_at }}
      NOTES_PERIODS: ${{ inputs.notes_periods }}
      SEC_USER_AGENT: "Aurora Research gomez5757@users.noreply.github.com"
      GITHUB_ACTIONS: "true"
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Acquire direct official SEC current identity
        run: |
          mkdir -p inputs/sec_current
          curl --fail --location --retry 4 --retry-all-errors \
            --max-filesize 16777216 \
            --header "User-Agent: $SEC_USER_AGENT" \
            https://www.sec.gov/files/company_tickers_exchange.json \
            --output inputs/sec_current/company_tickers_exchange.json
          echo "IDENTITY_RETRIEVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Download pinned official formula evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openap-181-completion-audit-results
          path: inputs/formulas
          run-id: ${{ inputs.formula_evidence_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Acquire bounded official SEC Notes history
        shell: bash
        run: |
          IFS=',' read -ra periods <<< "$NOTES_PERIODS"
          test "${#periods[@]}" -ge 1
          test "${#periods[@]}" -le 8
          period_args=()
          for period in "${periods[@]}"; do
            [[ "$period" =~ ^20[0-9]{2}(q[1-4]|_(0[1-9]|1[0-2]))$ ]]
            period_args+=(--period "$period")
          done
          python scripts/run_openap_149_sec_notes_access.py \
            "${period_args[@]}" \
            --user-agent "$SEC_USER_AGENT" \
            --output-dir openap_149_sec_notes_exchange_switch
      - name: Require complete official Notes access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/openap_149_sec_notes_exchange_switch")
          summary = json.loads(
              (root / "sec_notes_access_summary.json").read_text(encoding="utf-8")
          )
          manifest = pd.read_csv(
              root / "sec_notes_source_manifest.csv", keep_default_na=False
          )
          assert summary["all_downloaded"] is True
          assert summary["periods_requested"] == len(summary["periods"])
          assert summary["periods_requested"] == len(manifest)
          assert manifest["status"].eq("downloaded").all()
          assert manifest["http_status"].astype(int).eq(200).all()
          assert manifest["sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          PY
      - name: Calculate causal non-strict ExchSwitch reconstruction
        run: |
          python scripts/run_openap_149_sec_listing_identity.py \
            --notes-archive-dir outputs/openap_149_sec_notes_exchange_switch/zips \
            --notes-source-manifest outputs/openap_149_sec_notes_exchange_switch/sec_notes_source_manifest.csv \
            --current-sec-identity-json inputs/sec_current/company_tickers_exchange.json \
            --current-sec-identity-source-url https://www.sec.gov/files/company_tickers_exchange.json \
            --identity-retrieved-at "$IDENTITY_RETRIEVED_AT" \
            --formula-root inputs/formulas \
            --formula-source-run-id "${{ inputs.formula_evidence_run_id }}" \
            --implementation-sha "$SOURCE_SHA" \
            --formation-at "$FORMATION_AT" \
            --output-dir openap_149_sec_listing_identity
      - name: Verify ExchSwitch output remains non-strict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("outputs/openap_149_sec_listing_identity")
          values = pd.read_csv(root / "openap_149_sec_exch_switch_current.csv")
          manifest = json.loads(
              (root / "sec_listing_identity_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert values["signal"].eq("ExchSwitch").all()
          assert values["formula_sha256"].str.fullmatch(r"[0-9a-f]{64}").all()
          assert not values["strict_score_eligible"].any()
          finite = values.loc[values["current_usable"].eq(True)]
          assert not finite.empty
          assert finite["value"].isin([0.0, 1.0]).all()
          assert pd.to_datetime(finite["available_at"], utc=True).le(
              pd.to_datetime(finite["formation_at"], utc=True)
          ).all()
          assert manifest["signal"] == "ExchSwitch"
          assert manifest["identity_source_url"] == (
              "https://www.sec.gov/files/company_tickers_exchange.json"
          )
          assert manifest["identity_source_mode"] == "sec_official_live_direct"
          assert manifest["current_universe_rows"] > 1000
          assert manifest["strict_score_eligible"] is False
          assert manifest["locked_opened"] is False
          assert manifest["forward_opened"] is False
          PY
      - name: Upload derived ExchSwitch evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-exchange-switch-current
          path: outputs/openap_149_sec_listing_identity/
          if-no-files-found: error
          retention-days: 90
      - name: Upload source manifests without SEC archives
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-sec-exchange-switch-source-evidence
          path: |
            outputs/openap_149_sec_notes_exchange_switch/sec_notes_source_manifest.csv
            outputs/openap_149_sec_notes_exchange_switch/sec_notes_access_summary.json
          if-no-files-found: error
          retention-days: 90
