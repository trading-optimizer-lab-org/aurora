name: SPY Weekly Global Random Train Yearly Calmar

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing spy-weekly-noleverage-global-random-data"
        required: true
        default: "27809257841"
      stages:
        description: "Fixed shard count"
        required: true
        default: "360"
      configs_per_stage:
        description: "Random configs replayed per shard"
        required: true
        default: "30000"
      time_budget_minutes:
        description: "Internal runtime per shard"
        required: true
        default: "24"
      job_timeout_minutes:
        description: "Hard timeout per shard job"
        required: true
        default: "30"
      cost_bps:
        description: "Round-trip proportional cost basis points per position change unit"
        required: true
        default: "1.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/spy_weekly_global_random_train_yearly_calmar
  DATA_ARTIFACT: spy-weekly-noleverage-global-random-data
  FINAL_ARTIFACT: spy-weekly-global-random-train-yearly-calmar-results
  FILTER_MODE: train_yearly_ge_spy_and_train_calmar_ge_spy

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
    steps:
      - id: matrix
        name: Build 360 shard matrix
        run: |
          test "${{ inputs.stages }}" = "360"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          full = [{"stage": stage} for stage in range(360)]
          print("matrix_a=" + json.dumps(full[:180]))
          print("matrix_b=" + json.dumps(full[180:]))
          PY

  search_a:
    runs-on: ubuntu-latest
    needs: [plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps: &search_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Download data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.data_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "$DATA_ARTIFACT" \
            --dir "$OUTPUT_DIR"
      - name: Replay shard and keep train yearly Calmar SPY beaters
        run: |
          python scripts/run_spy_weekly_global_random_yearly_outperformance.py \
            --mode shard \
            --output-dir "$OUTPUT_DIR" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --cost-bps "${{ inputs.cost_bps }}" \
            --filter-mode "$FILTER_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spy-weekly-global-random-train-yearly-calmar-stage-${{ matrix.stage }}
          path: ${{ env.OUTPUT_DIR }}/shards/stage_*
          if-no-files-found: warn

  search_b:
    runs-on: ubuntu-latest
    needs: [plan]
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps: *search_steps

  merge:
    runs-on: ubuntu-latest
    needs: [search_a, search_b]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: spy-weekly-global-random-train-yearly-calmar-stage-*
          path: ${{ env.OUTPUT_DIR }}/shards
          merge-multiple: true
      - name: Merge train yearly Calmar outperformance results
        run: |
          python scripts/run_spy_weekly_global_random_yearly_outperformance.py \
            --mode merge \
            --output-dir "$OUTPUT_DIR" \
            --filter-mode "$FILTER_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.FINAL_ARTIFACT }}
          path: ${{ env.OUTPUT_DIR }}/final
          if-no-files-found: warn
