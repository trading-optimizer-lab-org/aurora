name: SP500 Catalog Equivalence Diagnostic

on:
  workflow_call:
    inputs:
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      optimized_result_run_id: {required: true, type: string}
      reference_result_run_id: {required: true, type: string}

permissions: {actions: read, contents: read}

env:
  GITHUB_ACTIONS: "true"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "NEHALEM"
  NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      admission_token: ${{ steps.token.outputs.admission_token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
          python scripts/plan_sp500_optimized_catalog_run.py \
            --repo-root . \
            --policy config/sp500_catalog_optimization_policy_v1.json \
            --campaign config/sp500_megarun_dehb_campaign_v1.json \
            --catalog-dir config/sp500_megarun_strategy_catalog_v1 \
            --selected-config config/sp500_megarun_selected_dehb_13.json \
            --evidence config/sp500_catalog_admission_evidence_qualification_v1.json \
            --benchmark-workers 360 \
            --output-dir outputs/plan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-equivalence-plan
          path: outputs/plan
          if-no-files-found: error
          retention-days: 30
      - id: token
        shell: bash
        run: |
          token=$(python -c 'import json; print(json.load(open("outputs/plan/run_plan.json"))["admission_token_sha256"])')
          echo "admission_token=$token" >> "$GITHUB_OUTPUT"

  historical_shards:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [16, 29, 60, 85, 184, 294, 304, 321, 329, 347]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-catalog-equivalence-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - run: >-
          python -m scripts.run_sp500_strategy_catalog_shard
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --data-contract config/sp500_megarun_free_data_240.json
          --feature-contract config/sp500_megarun_feature_contract_240.json
          --catalog-dir config/sp500_megarun_strategy_catalog_v1
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --run-plan "$RUNNER_TEMP/plan/run_plan.json"
          --admission-token "${{ needs.prepare.outputs.admission_token }}"
          --shard-index "${{ matrix.shard }}" --total-shards 360
          --output-dir "outputs/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-diagnostic-shard-${{ matrix.shard }}
          path: outputs/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  diagnose:
    needs: historical_shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ inputs.commit_sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11", cache: ""}
      - run: |
          python -m pip install --require-hashes -r requirements/catalog-optimized.lock
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-catalog-diagnostic-shard-*
          path: ${{ runner.temp }}/historical
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/optimized
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.optimized_result_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-strategy-catalog-final-results
          path: ${{ runner.temp }}/reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reference_result_run_id }}
      - run: >-
          python -m scripts.diagnose_sp500_catalog_equivalence
          --historical-root "$RUNNER_TEMP/historical"
          --optimized-root "$RUNNER_TEMP/optimized"
          --reference-root "$RUNNER_TEMP/reference"
          --diagnostic-config config/sp500_catalog_equivalence_diagnostic_v1.json
          --catalog config/sp500_megarun_strategy_catalog_v1/catalog.jsonl
          --output outputs/diagnostic.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-catalog-equivalence-diagnostic
          path: outputs/diagnostic.json
          if-no-files-found: error
          retention-days: 90
