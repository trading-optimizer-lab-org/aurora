name: Calmar GT1 PValue Bootstrap 173495

on:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: "Total requested parallel jobs, split as 180 + 180."
        required: true
        default: "360"
      total_chunks:
        description: "Total robustness chunks."
        required: true
        default: "720"
      n_bootstrap:
        description: "Bootstrap samples per train/validation period."
        required: true
        default: "80"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AU_DATA_DIR: ${{ github.workspace }}/.aurora-data
  OUTPUT_DIR: outputs/calmar_gt1_pvalue_bootstrap_173495

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - name: Ingest BTCUSDT 5m public data
        run: |
          python -m aurora.cli.forge research kronos ingest-crypto-5m \
            --run-id btc-5m-calmar-gt1-robustness-data-${GITHUB_RUN_ID} \
            --symbol BTCUSDT \
            --library crypto_5m \
            --interval 5m \
            --start "2023-05-01 00:00:00+00:00" \
            --end "2026-04-30 23:55:00+00:00" \
            --version binance_5m_36m \
            --replace \
            --json
      - name: Build BTC external all-feature panel
        run: |
          python scripts/build_crypto_phase12_external.py \
            --symbol BTCUSDT \
            --source-library crypto_5m \
            --source-version binance_5m_36m \
            --output-library crypto_5m_external \
            --output-version binance_5m_36m_phase12_v2 \
            --workers 8
      - name: Build paper return panel
        run: python scripts/run_calmar_gt1_pvalue_bootstrap.py --mode prepare-data --output-dir "$OUTPUT_DIR"
      - name: Upload shared data
        uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-shared-data
          path: |
            .aurora-data/timeseries
            outputs/calmar_gt1_pvalue_bootstrap_173495/paper_data
            outputs/calmar_gt1_pvalue_bootstrap_173495/data_summary.json

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - name: Download source result artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$OUTPUT_DIR/source_artifacts"
          gh run download 26693004318 --repo "${{ github.repository }}" --pattern "btc-5m-all-features-5methods-trainonly-9h-max500-real180-leaderboard" --dir "$OUTPUT_DIR/source_artifacts/run_26693004318"
          gh run download 27100892529 --repo "${{ github.repository }}" --pattern "paper-operable-ensemble-sharpe2-360stages-results" --dir "$OUTPUT_DIR/source_artifacts/run_27100892529"
          gh run download 27149224823 --repo "${{ github.repository }}" --pattern "paper-operable-ensemble-sharpe2-360stages-results" --dir "$OUTPUT_DIR/source_artifacts/run_27149224823"
          gh run download 27132531511 --repo "${{ github.repository }}" --pattern "paper-operable-ensemble-sharpe2-360stages-results" --dir "$OUTPUT_DIR/source_artifacts/run_27132531511"
          gh run download 27124775604 --repo "${{ github.repository }}" --pattern "paper-sharpe2-overnight-360jobs-results" --dir "$OUTPUT_DIR/source_artifacts/run_27124775604"
          gh run download 27099469489 --repo "${{ github.repository }}" --pattern "paper-aqr-factor-sharpe2-360stages-results" --dir "$OUTPUT_DIR/source_artifacts/run_27099469489"
          gh run download 27095540439 --repo "${{ github.repository }}" --pattern "literature-sharpe2-paper-variants-results" --dir "$OUTPUT_DIR/source_artifacts/run_27095540439"
      - name: Prepare 173495 manifest from artifacts
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode prepare-from-artifacts \
            --source-root "$OUTPUT_DIR/source_artifacts" \
            --output-dir "$OUTPUT_DIR"
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-manifest
          path: |
            outputs/calmar_gt1_pvalue_bootstrap_173495/calmar_gt1_pvalue_bootstrap_manifest.csv
            outputs/calmar_gt1_pvalue_bootstrap_173495/prepare_summary.json

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix_a: ${{ steps.matrix.outputs.matrix_a }}
      matrix_b: ${{ steps.matrix.outputs.matrix_b }}
      matrix_c: ${{ steps.matrix.outputs.matrix_c }}
      matrix_d: ${{ steps.matrix.outputs.matrix_d }}
    steps:
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("matrix_a=" + json.dumps([{"chunk": i} for i in range(0, 180)]))
          print("matrix_b=" + json.dumps([{"chunk": i} for i in range(180, 360)]))
          print("matrix_c=" + json.dumps([{"chunk": i} for i in range(360, 540)]))
          print("matrix_d=" + json.dumps([{"chunk": i} for i in range(540, 720)]))
          PY

  chunks_a:
    runs-on: ubuntu-latest
    needs: [data, prepare, plan]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 90
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_a) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-shared-data
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-manifest
          path: ${{ env.OUTPUT_DIR }}
      - name: Run robustness chunk
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode chunk \
            --output-dir "$OUTPUT_DIR" \
            --chunk-index "${{ matrix.chunk }}" \
            --total-chunks "${{ inputs.total_chunks || '720' }}" \
            --n-bootstrap "${{ inputs.n_bootstrap || '80' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/chunks

  chunks_b:
    runs-on: ubuntu-latest
    needs: [data, prepare, plan]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 90
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_b) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-shared-data
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-manifest
          path: ${{ env.OUTPUT_DIR }}
      - name: Run robustness chunk
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode chunk \
            --output-dir "$OUTPUT_DIR" \
            --chunk-index "${{ matrix.chunk }}" \
            --total-chunks "${{ inputs.total_chunks || '720' }}" \
            --n-bootstrap "${{ inputs.n_bootstrap || '80' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/chunks

  chunks_c:
    runs-on: ubuntu-latest
    needs: [data, prepare, plan]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 90
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_c) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-shared-data
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-manifest
          path: ${{ env.OUTPUT_DIR }}
      - name: Run robustness chunk
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode chunk \
            --output-dir "$OUTPUT_DIR" \
            --chunk-index "${{ matrix.chunk }}" \
            --total-chunks "${{ inputs.total_chunks || '720' }}" \
            --n-bootstrap "${{ inputs.n_bootstrap || '80' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/chunks

  chunks_d:
    runs-on: ubuntu-latest
    needs: [data, prepare, plan]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 90
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix_d) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-shared-data
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-manifest
          path: ${{ env.OUTPUT_DIR }}
      - name: Run robustness chunk
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode chunk \
            --output-dir "$OUTPUT_DIR" \
            --chunk-index "${{ matrix.chunk }}" \
            --total-chunks "${{ inputs.total_chunks || '720' }}" \
            --n-bootstrap "${{ inputs.n_bootstrap || '80' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-chunk-${{ matrix.chunk }}
          path: ${{ env.OUTPUT_DIR }}/chunks

  merge:
    runs-on: ubuntu-latest
    needs: [chunks_a, chunks_b, chunks_c, chunks_d]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e ".[ml]"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ env.OUTPUT_DIR }}/artifacts
          pattern: calmar-gt1-pvalue-bootstrap-chunk-*
          merge-multiple: true
      - name: Move downloaded chunks
        run: |
          mkdir -p "$OUTPUT_DIR/chunks"
          find "$OUTPUT_DIR/artifacts" -name 'chunk_*.csv' -exec cp {} "$OUTPUT_DIR/chunks/" \;
          find "$OUTPUT_DIR/artifacts" -name 'chunk_*.json' -exec cp {} "$OUTPUT_DIR/chunks/" \;
      - name: Merge p-value/bootstrap results
        run: |
          python scripts/run_calmar_gt1_pvalue_bootstrap.py \
            --mode merge \
            --output-dir "$OUTPUT_DIR" \
            --total-chunks "${{ inputs.total_chunks || '720' }}" \
            --allow-unsupported
      - uses: actions/upload-artifact@v4
        with:
          name: calmar-gt1-pvalue-bootstrap-173495-results
          path: ${{ env.OUTPUT_DIR }}/final
