name: OpenAP 149 Autonomous Free Reconstruction

on:
  push:
    branches:
      - codex/openap-proxy44-validation
    paths:
      - .github/workflows/openap-149-autonomous-reconstruction.yml
      - config/openap_149_autonomous_reconstruction.yaml
      - config/openap_149_free_source_routes.yaml
      - research/openap_149/**
      - scripts/run_openap_149_autonomous_reconstruction.py
      - tests/test_openap_149_autonomous_policy.py
      - tests/test_openap_149_reconstruction_registry.py
      - tests/test_openap_149_source_collector.py
      - tests/test_openap_149_score_admission.py
      - tests/test_openap_149_provisional_score.py
      - tests/test_openap_149_family_orchestrator.py
      - tests/test_openap_149_portfolio_behavior.py
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: tests
        type: choice
        options:
          - tests
          - reconstruct
          - finalize
      acquisition_run_id:
        description: Immutable upstream acquisition run ID
        required: false
        type: string
      formula_run_id:
        description: Immutable upstream formula run ID
        required: false
        type: string
      price_run_id:
        description: Immutable upstream price run ID
        required: false
        type: string
      reconstruction_run_id:
        description: Immutable reconstruction run ID for final verification
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: openap-149-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-tests:
    if: github.event_name == 'push' || inputs.mode == 'tests'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and focused test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Confirm protected tiers are not unlocked
        shell: bash
        run: |
          if env | cut -d= -f1 | grep -Eiq 'UNLOCK'; then
            echo "An unlock variable is present; refusing execution." >&2
            exit 1
          fi
      - name: Run focused autonomous policy tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_openap_149_autonomous_policy.py \
            tests/test_openap_149_reconstruction_registry.py \
            2>&1 | tee openap-149-focused-tests.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-focused-test-evidence-${{ github.run_id }}
          path: openap-149-focused-tests.log
          if-no-files-found: error
          retention-days: 30
