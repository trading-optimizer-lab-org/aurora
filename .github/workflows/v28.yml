name: v28 small-cap megarun (pre-registered)

# docs/research/V28_PREREGISTRATION.md. Waits for the latest v28 build run; then the v18b inputs, the v23 liquid, v24
# mover and v26 night stores and the v28 inputs -> canary (the first and last configuration of every family) -> 300
# shards x 4 processes of real returns -> failed shards rerun once -> selection -> 300 shards of placebos -> failed
# shards rerun once -> report. The after-report stages are in v28-after.yml.
# Market data stays in the Actions cache; the jobs upload reports and strategy returns.
# run: 4
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - .github/workflows/v28.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: v28
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - name: Wait for the latest v28 build run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 350); do
            line=$(gh run list --repo "${{ github.repository }}" --workflow v28-build.yml --branch research/stock-catalog --limit 1 --json databaseId,status,conclusion -q '.[0] | "\(.databaseId) \(.status) \(.conclusion)"' || echo "")
            echo "$(date -u +%H:%M) v28 build: $line"
            set -- $line
            if [ "$2" = "completed" ]; then
              if [ "$3" = "success" ]; then exit 0; fi
              exit 1
            fi
            sleep 60
          done
          exit 1

  canary:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Add swap
        run: |
          sudo swapoff -a
          avail=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          size=$(( avail > 40 ? 24 : avail - 10 ))
          sudo rm -f /mnt/swapfile
          sudo fallocate -l "${size}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v23/store
          key: v23-store-none
          restore-keys: v23-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v24/store
          key: v24-store-none
          restore-keys: v24-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v26/store
          key: v26-store-none
          restore-keys: v26-store-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/v28/inputs
            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - run: python scripts/run_v28.py real --canary --workers 4 --out outputs/v28w/canary
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v28-canary
          path: outputs/v28w/canary
          retention-days: 14

