            outputs/v28/pmstore
          key: v28-inputs2-none
          restore-keys: v28-inputs2-
          fail-on-cache-miss: true
      - run: python scripts/run_v28.py real --shard ${{ matrix.shard }} --shards 300 --workers 4 --out outputs/v28w/part
