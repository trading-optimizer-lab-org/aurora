            sleep 30
          done
          test "$ok" = 1
          s=$(sed -E 's/.*[(]([0-9]+)[)].*/\1/' failed.txt | grep -E '^[0-9]+$' | sort -n | paste -sd, -)
          echo "failed shards: [$s]"
          echo "shards=[$s]" >> "$GITHUB_OUTPUT"

