name: GTBI V7 Stage Two Required

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtbi-v7-stage-two-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  required:
    name: GTBI V7 stage-two required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Verify stage-two contract
        run: python scripts/validate_gtbi_v7_stage_two_contract.py

      - name: Validate readiness state
        run: python scripts/validate_gtbi_v7_master_plan.py --repository-root .
