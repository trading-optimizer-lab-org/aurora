name: SP500 Megarun Official DEHB Infrastructure Smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode
        type: choice
        required: true
        default: official
        options:
          - official
          - continuous_postgres
          - continuous_migrate
          - continuous_start
          - continuous_continue
      commit_sha:
        description: Exact revision for any continuous mode
        required: false
      campaign_id:
        description: Immutable continuous campaign identifier
        required: false
      runtime_input_run_id:
        description: Immutable train-only runtime input run
        required: false
      launch_contract_run_id:
        description: Exact run containing the launch contract
        required: false
      bootstrap_run_id:
        description: Initial continuous run containing the bootstrap receipt
        required: false
      pool_generation:
        description: Six-digit continuous pool generation
        required: false
        default: "000000"
      source_run_id:
        description: Completed continuous run stopped before a database clone
        required: false

permissions:
  actions: write
  contents: read

concurrency:
  group: sp500-megarun-official-dehb-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  framework_contract:
    if: ${{ inputs.mode == 'official' }}
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: config/github_performance_reference.yaml
      workload: aurora.infra.github_performance.reference_workload:WORKLOAD
      run_label: sp500-dehb-smoke-framework-contract
      retention_days: 1
      forced_job_count: 1

  official_dehb_smoke:
    if: ${{ inputs.mode == 'official' }}
    needs: framework_contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_ACTIONS: "true"
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "NEHALEM"
      NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
      PYTHONPATH: ${{ github.workspace }}/..
    steps:
      - name: Check out the exact infrastructure revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up isolated Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install hash-locked DEHB runtime and isolated test dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/dehb-official.lock
          python -m pip install \
            "pytest==9.0.3" \
            "pydantic==2.13.4" \
            "jsonschema==4.26.0"
          python -m pip check
      - name: Verify adapter and GitHub-only fail-closed gates
        run: |
          python -m pytest \
            tests/test_sp500_megarun_dehb_configspace.py \
            tests/test_sp500_megarun_dehb_official_smoke.py \
            tests/test_sp500_megarun_dehb_evaluation_cache.py \
            tests/test_sp500_megarun_dehb_cache_savings_audit.py \
            tests/test_sp500_megarun_dehb_island_runner.py \
            tests/test_sp500_megarun_dehb_job_runner.py \
            tests/test_sp500_megarun_dehb_campaign_runtime.py \
            tests/test_sp500_megarun_dehb_workflows.py \
            tests/test_sp500_megarun_feature_engine_price.py \
            tests/test_sp500_megarun_feature_contract.py \
            tests/test_sp500_megarun_data_contract.py \
            -q
      - name: Exercise official DEHB with one four-worker island
        run: |
          python scripts/run_sp500_megarun_dehb_official_smoke.py \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --dependency-lock requirements/dehb-official.lock \
            --output-dir outputs/sp500_megarun_dehb_official_smoke
      - name: Provoke failures and close technical gates 55 56 and 60
        run: |
          python scripts/build_sp500_megarun_dehb_technical_evidence.py \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --official-report outputs/sp500_megarun_dehb_official_smoke/dehb_official_smoke_report.json \
            --output outputs/sp500_megarun_dehb_official_smoke/technical_evidence.json
      - name: Upload immutable official DEHB evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-megarun-official-dehb-smoke-${{ github.run_id }}
          path: outputs/sp500_megarun_dehb_official_smoke
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  continuous_postgres:
    if: ${{ inputs.mode == 'continuous_postgres' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: continuous-test-only
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SP500_DEHB_TEST_DATABASE_URL: postgresql://aurora:continuous-test-only@127.0.0.1:5432/aurora
      PYTHONPATH: ${{ github.workspace }}/..
    steps:
      - name: Check out exact continuous revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Verify exact continuous revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.commit_sha }}"
      - name: Set up isolated Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install focused PostgreSQL test runtime
        run: |
          python -m pip install "psycopg[binary,pool]>=3.2,<4" pytest numpy pandas pyarrow \
            "pydantic==2.13.4" "jsonschema==4.26.0" PyYAML
          python -m pip install --no-deps -e .
      - name: Verify continuous unit and PostgreSQL contracts
        run: >-
          python -m pytest
          tests/test_sp500_megarun_dehb_continuous_models.py
          tests/test_sp500_megarun_dehb_continuous_schema.py
          tests/test_sp500_megarun_dehb_continuous_store.py
          tests/test_sp500_megarun_dehb_continuous_island.py
          tests/test_sp500_megarun_dehb_continuous_coordinator.py
          tests/test_sp500_megarun_dehb_continuous_worker.py
          tests/test_sp500_megarun_dehb_continuous_bootstrap.py
          tests/test_sp500_megarun_dehb_continuous_reducer.py
          tests/test_sp500_megarun_dehb_continuous_supervisor.py
          tests/test_sp500_megarun_dehb_continuous_robustness.py
          tests/test_sp500_megarun_dehb_workflows.py
          tests/integration/test_sp500_megarun_dehb_continuous_postgres.py
          -q

  continuous_migrate:
    if: ${{ inputs.mode == 'continuous_migrate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
      SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT }}
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Fail unless the source campaign run is stopped
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.source_run_id }}"
          test "$(gh run view '${{ inputs.source_run_id }}' --json status --jq .status)" = "completed"
          test -n "$SP500_DEHB_COORDINATOR_DATABASE_URL"
          test -n "$SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT"
          test "$SP500_DEHB_COORDINATOR_DATABASE_URL" != "$SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT"
      - name: Prove the source database has no live writers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]>=3.2,<4"
          python -m pip install --no-deps -e .
          python scripts/assert_sp500_dehb_database_quiescent.py \
            --campaign-id "${{ inputs.campaign_id }}"
      - name: Clone the stopped PostgreSQL database exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sp500-dehb-clone"
          docker run --rm \
            -e SP500_DEHB_COORDINATOR_DATABASE_URL \
            -v "$RUNNER_TEMP/sp500-dehb-clone:/clone" \
            postgres:17.10-alpine \
            pg_dump \
              --dbname="$SP500_DEHB_COORDINATOR_DATABASE_URL" \
              --format=custom \
              --file=/clone/coordinator.dump \
              --no-owner \
              --no-privileges \
              --serializable-deferrable
          docker run --rm \
            -e SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT \
            -v "$RUNNER_TEMP/sp500-dehb-clone:/clone" \
            postgres:17.10-alpine \
            pg_restore \
              --dbname="$SP500_DEHB_COORDINATOR_DATABASE_URL_NEXT" \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              --single-transaction \
              /clone/coordinator.dump
      - name: Verify every campaign row and closed boundary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_sp500_dehb_database_clone.py \
            --campaign-id "${{ inputs.campaign_id }}" \
            --output outputs/sp500_dehb_database_clone/verification.json
      - name: Upload non-sensitive clone verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-dehb-database-clone-verification
          path: outputs/sp500_dehb_database_clone/verification.json
          if-no-files-found: error
          retention-days: 30

  continuous_bootstrap:
    if: ${{ inputs.mode == 'continuous_start' }}
    uses: ./.github/workflows/sp500-dehb-continuous-bootstrap-v2.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      campaign_id: ${{ inputs.campaign_id }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      launch_contract_run_id: ${{ inputs.launch_contract_run_id }}
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}

  continuous_coordinator:
    needs: continuous_bootstrap
    if: >-
      ${{ always() &&
          (inputs.mode == 'continuous_start' || inputs.mode == 'continuous_continue') &&
          (inputs.mode == 'continuous_continue' || needs.continuous_bootstrap.result == 'success') }}
    uses: ./.github/workflows/sp500-dehb-continuous-coordinator-v2.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      campaign_id: ${{ inputs.campaign_id }}
      bootstrap_run_id: ${{ inputs.mode == 'continuous_start' && github.run_id || inputs.bootstrap_run_id }}
      lifetime_minutes: "300"
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}

  continuous_pool:
    needs: continuous_bootstrap
    if: >-
      ${{ always() &&
          (inputs.mode == 'continuous_start' || inputs.mode == 'continuous_continue') &&
          (inputs.mode == 'continuous_continue' || needs.continuous_bootstrap.result == 'success') }}
    uses: ./.github/workflows/sp500-dehb-continuous-worker-pool-v2.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      campaign_id: ${{ inputs.campaign_id }}
      pool_generation: pool-${{ inputs.pool_generation }}
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      bootstrap_run_id: ${{ inputs.mode == 'continuous_start' && github.run_id || inputs.bootstrap_run_id }}
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}

  continuous_reducer:
    needs: continuous_bootstrap
    if: >-
      ${{ always() &&
          (inputs.mode == 'continuous_start' || inputs.mode == 'continuous_continue') &&
          (inputs.mode == 'continuous_continue' || needs.continuous_bootstrap.result == 'success') }}
    uses: ./.github/workflows/sp500-dehb-continuous-reducer-v2.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      campaign_id: ${{ inputs.campaign_id }}
      cutoff_sequence: latest
      runtime_input_run_id: ${{ inputs.runtime_input_run_id }}
      bootstrap_run_id: ${{ inputs.mode == 'continuous_start' && github.run_id || inputs.bootstrap_run_id }}
      delay_minutes: "120"
    secrets:
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}

  continuous_continue:
    needs:
      - continuous_bootstrap
      - continuous_coordinator
      - continuous_pool
      - continuous_reducer
    if: >-
      ${{ always() &&
          (inputs.mode == 'continuous_start' || inputs.mode == 'continuous_continue') &&
          (inputs.mode == 'continuous_continue' || needs.continuous_bootstrap.result == 'success') &&
          needs.continuous_coordinator.result == 'success' &&
          needs.continuous_pool.result == 'success' &&
          needs.continuous_reducer.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_ACTIONS: "true"
      GH_TOKEN: ${{ github.token }}
      SP500_DEHB_COORDINATOR_DATABASE_URL: ${{ secrets.SP500_DEHB_COORDINATOR_DATABASE_URL }}
    steps:
      - name: Check out exact continuous revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Set up supervisor runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: ""
      - name: Install supervisor dependencies
        run: |
          python -m pip install "psycopg[binary,pool]>=3.2,<4"
          python -m pip install --no-deps -e .
      - name: Audit campaign and continue only when safe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_sp500_dehb_continuous_campaign.py \
            --campaign-id "${{ inputs.campaign_id }}" \
            --pool-generation "pool-${{ inputs.pool_generation }}" \
            --output "$RUNNER_TEMP/continuous-decision.json"
          action="$(jq -r '.action' "$RUNNER_TEMP/continuous-decision.json")"
          case "$action" in
            healthy|dispatch_next_generation|recover_coordinator)
              generation="${{ inputs.pool_generation }}"
              [[ "$generation" =~ ^[0-9]{6}$ ]]
              next_generation="$(printf '%06d' "$((10#$generation + 1))")"
              bootstrap_run_id="${{ inputs.bootstrap_run_id }}"
              if [[ "${{ inputs.mode }}" == "continuous_start" ]]; then
                bootstrap_run_id="${{ github.run_id }}"
              fi
              gh workflow run sp500-megarun-dehb-official-smoke.yml \
                --ref "${{ github.ref_name }}" \
                -f mode=continuous_continue \
                -f commit_sha="${{ inputs.commit_sha }}" \
                -f campaign_id="${{ inputs.campaign_id }}" \
                -f runtime_input_run_id="${{ inputs.runtime_input_run_id }}" \
                -f bootstrap_run_id="$bootstrap_run_id" \
                -f pool_generation="$next_generation"
              ;;
            drain)
              echo "Campaign frozen; no further worker generation will be dispatched."
              ;;
            halt_conflict|halt_boundary)
              echo "Fail-closed campaign halt: $action" >&2
              exit 1
              ;;
            *)
              echo "Unknown supervisor action: $action" >&2
              exit 1
              ;;
          esac
