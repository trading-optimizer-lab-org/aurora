name: SP500 Atlas Pilot Concurrency and Recovery

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact immutable implementation commit
        required: true
        type: string
      preflight_run_id:
        description: Run containing the frozen train-only plan and pilot manifest
        required: true
        type: string
      runtime_input_run_id:
        description: Verified train-only runtime input pack run
        required: true
        type: string
      pilot_authorization:
        description: Explicit authorization for the production-shard pilot
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GITHUB_ACTIONS: "true"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONPATH: ${{ github.workspace }}/..

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.pilot.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Verify exact commit and explicit pilot authorization
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
          PILOT_AUTHORIZATION: ${{ inputs.pilot_authorization }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMIT" = "$GITHUB_SHA"
          test "$PILOT_AUTHORIZATION" = "AUTHORIZE_SP500_ATLAS_PILOT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
      - id: pilot
        name: Validate fixed pilot manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan
          from aurora.infra.sp500_megarun.atlas_pilot import load_pilot_manifest
          root = Path(os.environ["RUNNER_TEMP"]) / "preflight"
          plan = load_plan(root / "plan" / "atlas_run_plan.json")
          manifest = load_pilot_manifest((root / "plan" / "atlas_pilot_manifest.json").read_text(encoding="utf-8"), plan=plan)
          assert manifest["validation_opened"] is False
          assert manifest["locked_opened"] is False
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("shards=" + json.dumps(manifest["shard_indices"], separators=(",", ":")) + "\n")
          PY

  evaluate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Evaluate one pilot shard without internal retry
        shell: bash
        run: >-
          python scripts/run_sp500_atlas_worker.py
          --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json"
          --catalog-dir "$RUNNER_TEMP/preflight/atlas"
          --runtime-input-pack "$RUNNER_TEMP/runtime"
          --campaign-contract config/sp500_megarun_dehb_campaign_v1.json
          --data-contract config/sp500_megarun_free_data_240.json
          --feature-contract config/sp500_megarun_feature_contract_240.json
          --shard-index "${{ matrix.shard }}"
          --output-dir "$RUNNER_TEMP/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  fault_fixtures:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - run: python scripts/run_sp500_atlas_pilot_faults.py --output fault_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: fault_receipt.json
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: [prepare, evaluate, fault_fixtures]
    if: ${{ needs.prepare.result == 'success' && needs.evaluate.result == 'success' && needs.fault_fixtures.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preflight_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-pilot-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/partitions
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: ${{ runner.temp }}/faults
      - name: Verify pilot coverage and effective concurrency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/summarize_sp500_atlas_pilot.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --pilot-manifest "$RUNNER_TEMP/preflight/plan/atlas_pilot_manifest.json" \
            --partitions-root "$RUNNER_TEMP/partitions" \
            --fault-receipt "$RUNNER_TEMP/faults/fault_receipt.json" \
            --output outputs/pilot_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-results-${{ github.run_id }}
          path: outputs
          if-no-files-found: error
          retention-days: 90
