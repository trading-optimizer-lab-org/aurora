name: GitHub Performance Policy

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/**"
      - "research/**"
      - "infra/github_performance/**"
      - "config/legacy_workflow_allowlist.json"
      - "config/legacy_workflow_migrations.json"
      - "docs/readiness/gtbi-v7/owner_simplification_directive.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow_policy:
    name: Future workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install static policy dependencies
        run: |
          python -m pip install pydantic PyYAML jsonschema
          python -m pip install -e . --no-deps

      - name: Enforce future workflow framework
        run: >-
          python scripts/validate_github_workflow_policy.py
          --repo-root .
          --allowlist config/legacy_workflow_allowlist.json
          --migrations config/legacy_workflow_migrations.json
