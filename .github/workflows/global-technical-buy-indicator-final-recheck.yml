name: Global Technical Buy Indicator Final Recheck

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run id containing global-technical-buy-indicator-stage-* artifacts"
        required: true
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      final_top_n:
        description: "Top shard candidates kept before global recheck"
        required: true
        default: "2000"
      final_global_recheck_top_n:
        description: "Top merged candidates re-evaluated on the full filtered universe"
        required: true
        default: "50"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      locked_start:
        description: "Locked/OOS start date, excluded from pack"
        required: true
        default: "2021-01-01"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"

jobs:
  final_recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download source stage artifacts
        run: |
          gh run download "${{ inputs.source_run_id }}" \
            --repo "${{ github.repository }}" \
            --pattern "global-technical-buy-indicator-stage-*" \
            --dir downloaded-stages
      - name: Merge shard candidates
        run: |
          python scripts/merge_global_technical_buy_indicator_results.py \
            --stages-root downloaded-stages \
            --output-dir final \
            --top-n "${{ inputs.final_top_n }}"
      - name: Download clean global data lake
        run: |
          mkdir -p "$QF_DATA_DIR/prices/free_us_daily"
          gh run download "${{ inputs.data_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.data_artifact_name }}" \
            --dir "$QF_DATA_DIR/prices/free_us_daily"
      - name: Ensure SPY benchmark exists
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          data_root = Path(os.environ["QF_DATA_DIR"]) / "prices" / "free_us_daily"
          out_dir = data_root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          frame = yf.download("SPY", period="max", interval="1d", auto_adjust=False, actions=True, progress=False, threads=False)
          if frame.empty:
              raise SystemExit("SPY benchmark download returned no rows")
          if isinstance(frame.columns, pd.MultiIndex):
              frame.columns = [str(col[0]).strip().lower().replace(" ", "_") for col in frame.columns]
          else:
              frame.columns = [str(col).strip().lower().replace(" ", "_") for col in frame.columns]
          frame = frame.reset_index()
          if "date" not in frame.columns:
              frame = frame.rename(columns={frame.columns[0]: "date"})
          if "adj_close" not in frame.columns:
              frame["adj_close"] = frame["close"]
          if "volume" not in frame.columns:
              frame["volume"] = 0
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce", utc=True).dt.tz_convert(None)
          frame = frame.dropna(subset=["date", "open", "high", "low", "close"]).sort_values("date")
          frame["symbol"] = "SPY"
          cols = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          out_path = out_dir / "SPY.parquet"
          frame[cols].to_parquet(out_path, index=False)
          print(json.dumps({"symbol": "SPY", "rows": int(len(frame)), "path": str(out_path)}, indent=2, sort_keys=True))
          PY
      - name: Final global recheck
        run: |
          python scripts/reevaluate_global_technical_buy_indicator_results.py \
            --merged-dir final \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir final \
            --candidate-limit "${{ inputs.final_global_recheck_top_n }}" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --scoring-profile strict_quality
      - name: Upload final recheck results
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-final-recheck-results
          path: final
          if-no-files-found: error
          retention-days: 14
