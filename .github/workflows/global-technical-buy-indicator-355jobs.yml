name: Global Technical Buy Indicator 355 Jobs

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      configs_per_stage:
        description: "Indicator configs per stage"
        required: true
        default: "1500"
      time_budget_minutes:
        description: "Per-stage search budget"
        required: true
        default: "25"
      search_method:
        description: "Search method"
        required: true
        default: "surrogate_ml"
        type: choice
        options:
          - surrogate_ml
          - dehb_real
      selection_split:
        description: "Split used for scoring"
        required: true
        default: "train"
        type: choice
        options:
          - train
          - validation
      min_selection_trades_per_year:
        description: "Minimum closed trades in every selected split year"
        required: true
        default: "0"
      scoring_profile:
        description: "Candidate scoring profile"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - strict_quality
          - frequency_quality
      family_set:
        description: "Signal family set"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - tradingview_minervini
          - all
      min_market_cap:
        description: "Minimum market cap in USD, 0 disables the filter"
        required: true
        default: "0"
      top_per_stage:
        description: "Top candidates kept per stage"
        required: true
        default: "50"
      final_top_n:
        description: "Top candidates kept in final merge"
        required: true
        default: "250"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from pack"
        required: true
        default: "2021-01-01"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
    steps:
      - id: plan
        name: Build 355-stage matrices
        run: |
          python - <<'PY'
          import json
          import os

          def row(stage: int) -> dict:
              return {
                  "stage": stage,
                  "stage_padded": f"{stage:03d}",
                  "group": f"{stage % 32:03d}",
              }

          all_rows = [row(i) for i in range(355)]
          matrix_a = {"include": all_rows[:178]}
          matrix_b = {"include": all_rows[178:]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix_a={json.dumps(matrix_a, separators=(',', ':'))}\n")
              handle.write(f"matrix_b={json.dumps(matrix_b, separators=(',', ':'))}\n")
          PY

  build_pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download clean global data lake
        run: |
          mkdir -p "$QF_DATA_DIR/prices/free_us_daily"
          gh run download "${{ inputs.data_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.data_artifact_name }}" \
            --dir "$QF_DATA_DIR/prices/free_us_daily"
      - name: Ensure SPY benchmark exists
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          data_root = Path(os.environ["QF_DATA_DIR"]) / "prices" / "free_us_daily"
          out_dir = data_root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          frame = yf.download(
              "SPY",
              period="max",
              interval="1d",
              auto_adjust=False,
              actions=True,
              progress=False,
              threads=False,
          )
          if frame.empty:
              raise SystemExit("SPY benchmark download returned no rows")
          if isinstance(frame.columns, pd.MultiIndex):
              frame.columns = [str(col[0]).strip().lower().replace(" ", "_") for col in frame.columns]
          else:
              frame.columns = [str(col).strip().lower().replace(" ", "_") for col in frame.columns]
          frame = frame.reset_index().rename(columns={"date": "date", "adj_close": "adj_close"})
          if "date" not in frame.columns:
              frame = frame.rename(columns={frame.columns[0]: "date"})
          for col in ("open", "high", "low", "close"):
              if col not in frame.columns:
                  raise SystemExit(f"SPY benchmark missing {col}")
          if "adj_close" not in frame.columns:
              frame["adj_close"] = frame["close"]
          if "volume" not in frame.columns:
              frame["volume"] = 0
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce", utc=True).dt.tz_convert(None)
          frame = frame.dropna(subset=["date", "open", "high", "low", "close"]).sort_values("date")
          frame["symbol"] = "SPY"
          cols = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          out_path = out_dir / "SPY.parquet"
          frame[cols].to_parquet(out_path, index=False)
          payload = {
              "symbol": "SPY",
              "rows": int(len(frame)),
              "first_date": str(frame["date"].min().date()),
              "last_date": str(frame["date"].max().date()),
              "path": str(out_path),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
      - name: Build grouped stage packs
        run: |
          python scripts/build_global_technical_buy_indicator_pack.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir "$QF_DATA_DIR/runs/global_technical_buy_indicator_355jobs/pack" \
            --stage-count 355 \
            --group-count 32 \
            --locked-start "${{ inputs.locked_start }}" \
