            --family-set "${{ inputs.family_set }}" \
            --scoring-profile "${{ inputs.scoring_profile }}"
      - name: Upload stage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-stage-${{ matrix.stage_padded }}
          path: outputs/stage-${{ matrix.stage_padded }}
          if-no-files-found: warn
          retention-days: 7

  search_b:
    needs: [plan, build_pack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 177
      matrix: ${{ fromJson(needs.plan.outputs.matrix_b) }}
    env:
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download pack group
