  search_a:
    needs: [plan, build_pack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 178
      matrix: ${{ fromJson(needs.plan.outputs.matrix_a) }}
    env:
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download pack group
        uses: actions/download-artifact@v4
        with:
          name: global-technical-buy-indicator-pack-group-${{ matrix.group }}
          path: pack-group
      - name: Run stage
        run: |
          python scripts/run_global_technical_buy_indicator_stage.py \
            --pack-dir "pack-group/stage-${{ matrix.stage_padded }}" \
            --output-dir "outputs/stage-${{ matrix.stage_padded }}" \
            --stage "${{ matrix.stage }}" \
            --configs-per-stage "${{ inputs.configs_per_stage }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes }}" \
            --top-per-stage "${{ inputs.top_per_stage }}" \
            --train-end "${{ inputs.train_end }}" \
