name: Intraday combination locked period once

# docs/research/INTRADAY_LOCKED_PREREGISTRATION.md: opens 2021-01-04 to
# 2026-09-30 once for INTRADAY_EQ, on the owner's request. The rehearsal must
# reproduce the published 2016-2020 streams before anything from 2021+ is read.
# Data preparation may be retried; once the "opened" marker is uploaded the
# window is spent and later runs refuse. Market data stays in the Actions cache.
# Needs the secrets ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY and SEC_USER_AGENT.
on:
  workflow_dispatch:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_intraday_locked.py
      - .github/workflows/intraday-locked-once.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: intraday-locked-once
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Refuse if the window was already opened
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -f docs/research/INTRADAY_LOCKED_RESULTS.md
          opened=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=intraday-locked-opened&per_page=1" --jq '.total_count')
          test "$opened" = "0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore phase 7 minute cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-
          fail-on-cache-miss: true

      - name: Restore phase 7 SEC cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/sec
          key: sec-v1-${{ github.run_id }}
          restore-keys: sec-v1-
          fail-on-cache-miss: true

      - name: Rehearse on 2016-2020 (must match the published streams)
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python scripts/run_intraday_locked.py rehearse --panel-dir outputs/stock_panel --cache outputs/alpaca
          --sec-cache outputs/sec

  locked:
    needs: rehearse
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Refuse if the window was already opened
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -f docs/research/INTRADAY_LOCKED_RESULTS.md
          opened=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=intraday-locked-opened&per_page=1" --jq '.total_count')
          test "$opened" = "0"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore phase 7 minute cache (for the Nasdaq series)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-
          fail-on-cache-miss: true

      - name: Restore earlier locked-period downloads (retries only)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}
          restore-keys: intraday-locked-data-

      - name: Prepare 2021+ data (no strategy result)
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python scripts/run_intraday_locked.py prepare --panel-dir outputs/stock_panel --out outputs/locked
          --cache outputs/alpaca_locked --sec-cache outputs/sec_locked --nasdaq outputs/alpaca/ixic.csv

      - name: Save locked-period downloads
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark the window as opened
        run: |
          mkdir -p outputs/opened
          echo "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT $(date -u +%FT%TZ)" > outputs/opened/opened.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intraday-locked-opened
          path: outputs/opened
          retention-days: 90

      - name: Evaluate once
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python scripts/run_intraday_locked.py evaluate --out outputs/locked --cache outputs/alpaca_locked
          --sec-cache outputs/sec_locked

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/locked/LOCKED.md ]; then cat outputs/locked/LOCKED.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: intraday-locked-result
          path: |
            outputs/locked/LOCKED.md
            outputs/locked/results.json
            outputs/locked/streams_locked.csv
            outputs/locked/coverage.json
          if-no-files-found: warn
          retention-days: 90
