name: Minervini SEPA MarketCap 2B Daily Screener

on:
  workflow_dispatch:
    inputs:
      min_market_cap:
        description: "Market cap minimo"
        required: true
        default: "50000000"
      universe:
        description: "Universo: nasdaq_us, yahoo_regions o combined"
        required: true
        default: "combined"
      regions:
        description: "Yahoo region codes separados por coma"
        required: true
        default: "us,gb,de,fr,es,it,nl,se,ch,no,dk,fi,be,at,ie,pt,pl"
      period:
        description: "Historico diario para calcular senales"
        required: true
        default: "3y"
      batch_size:
        description: "Batch size yfinance"
        required: true
        default: "80"

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests yfinance

      - name: Run daily screener
        run: |
          python scripts/screen_minervini_sepa_marketcap2b.py \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --universe "${{ inputs.universe }}" \
            --regions "${{ inputs.regions }}" \
            --period "${{ inputs.period }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --output-dir outputs/minervini_sepa_marketcap2b_daily_screener

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: minervini-sepa-marketcap2b-daily-screener-results
          path: outputs/minervini_sepa_marketcap2b_daily_screener/
          if-no-files-found: error
