name: "Options study 2 probe (data format only)"

# scripts/run_options_study2.py probe: listed expiries, 0DTE bar coverage. Counts and times only, no prices.
# run: 2
on:
  push:
    branches: [research/options-study-2]
    paths:
      - .github/workflows/options-study2-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - run: python scripts/run_options_study2.py probe2
