name: GitHub Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      workload_family:
        description: Equivalent workload family to benchmark
        required: true
        default: candidate_sweep
        type: choice
        options:
          - candidate_sweep
          - event_study
          - robustness
      forced_job_count:
        description: Exact jobs for both modes; zero lets optimized choose
        required: false
        default: 0
        type: number
      performance_profile_run_id:
        description: Prior benchmark run containing an exact profile
        required: false
        default: ""
        type: string
      performance_profile_artifact_name:
        description: Prior benchmark artifact containing the profile
        required: false
        default: ""
        type: string
      fault_injection_shard_id:
        description: Test-only initial shard to fail after a valid checkpoint
        required: false
        default: ""
        type: string
      fault_injection_after_units:
        description: Test-only exact checkpoint boundary; zero disables it
        required: false
        default: 0
        type: number

permissions:
  contents: read
  actions: read

jobs:
  prime_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Build one shared immutable wheelhouse
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          python scripts/build_github_performance_wheelhouse.py build \
            --requirements-lock requirements/github-performance.lock \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --code-sha "$GITHUB_SHA" \
            --source-date-epoch "$source_date_epoch"
      - name: Upload shared immutable wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-performance-benchmark-shared-wheelhouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Restore exact Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Prepare one shared immutable benchmark snapshot
        env:
          WORKLOAD_FAMILY: ${{ inputs.workload_family }}
        run: |
          set -euo pipefail
          case "$WORKLOAD_FAMILY" in
            candidate_sweep)
              spec="config/github_performance_candidate_sweep.yaml"
              workload="aurora.infra.github_performance.workloads.candidate_sweep:WORKLOAD"
              ;;
            event_study)
              spec="config/github_performance_event_study.yaml"
              workload="aurora.infra.github_performance.workloads.event_study:WORKLOAD"
              ;;
            robustness)
              spec="config/github_performance_robustness.yaml"
              workload="aurora.infra.github_performance.workloads.robustness:WORKLOAD"
              ;;
            *)
              echo "Unsupported workload family: $WORKLOAD_FAMILY" >&2
              exit 2
              ;;
          esac
          aurora github prepare \
            --spec "$spec" \
            --workload "$workload" \
            --output-dir "$RUNNER_TEMP/prepared"
      - name: Upload shared immutable benchmark snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-performance-benchmark-${{ inputs.workload_family }}-shared-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  setup_benchmark:
    needs: prime_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up benchmark Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: ""
      - name: Download shared immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-performance-benchmark-shared-wheelhouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Compare locked and wheelhouse setup cold and warm
        run: |
          set -euo pipefail
          python scripts/benchmark_github_performance_environment.py \
            --requirements-lock requirements/github-performance.lock \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --cold-repetitions 3 \
            --warm-repetitions 3 \
            --output "$RUNNER_TEMP/setup-benchmark/environment_setup_benchmark.json"
      - name: Upload environment setup benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-performance-environment-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/setup-benchmark
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  optimized:
    needs: prime_runtime
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: >-
        ${{ inputs.workload_family == 'candidate_sweep' &&
        'config/github_performance_candidate_sweep.yaml' ||
        inputs.workload_family == 'event_study' &&
        'config/github_performance_event_study.yaml' ||
        'config/github_performance_robustness.yaml' }}
      workload: >-
        ${{ inputs.workload_family == 'candidate_sweep' &&
        'aurora.infra.github_performance.workloads.candidate_sweep:WORKLOAD' ||
        inputs.workload_family == 'event_study' &&
        'aurora.infra.github_performance.workloads.event_study:WORKLOAD' ||
        'aurora.infra.github_performance.workloads.robustness:WORKLOAD' }}
      run_label: github-performance-benchmark-${{ inputs.workload_family }}-optimized
      retention_days: 30
      execution_mode: optimized
      forced_job_count: >-
        ${{ fromJSON(format('{0}', inputs.forced_job_count)) }}
      prepared_artifact_name: github-performance-benchmark-${{ inputs.workload_family }}-shared-prepared-${{ github.run_id }}-${{ github.run_attempt }}
      wheelhouse_artifact_name: github-performance-benchmark-shared-wheelhouse-${{ github.run_id }}-${{ github.run_attempt }}
      performance_profile_run_id: ${{ inputs.performance_profile_run_id }}
      performance_profile_artifact_name: ${{ inputs.performance_profile_artifact_name }}
      fault_injection_shard_id: ${{ inputs.fault_injection_shard_id }}
      fault_injection_after_units: >-
        ${{ fromJSON(format('{0}', inputs.fault_injection_after_units)) }}

  baseline:
    needs: optimized
    uses: ./.github/workflows/_aurora-future-run-v3.yml
    with:
      spec_path: >-
        ${{ inputs.workload_family == 'candidate_sweep' &&
        'config/github_performance_candidate_sweep.yaml' ||
        inputs.workload_family == 'event_study' &&
        'config/github_performance_event_study.yaml' ||
        'config/github_performance_robustness.yaml' }}
      workload: >-
        ${{ inputs.workload_family == 'candidate_sweep' &&
        'aurora.infra.github_performance.workloads.candidate_sweep:WORKLOAD' ||
        inputs.workload_family == 'event_study' &&
        'aurora.infra.github_performance.workloads.event_study:WORKLOAD' ||
        'aurora.infra.github_performance.workloads.robustness:WORKLOAD' }}
      run_label: github-performance-benchmark-${{ inputs.workload_family }}-baseline
      retention_days: 30
      execution_mode: baseline
      forced_job_count: >-
        ${{ inputs.forced_job_count > 0 &&
        fromJSON(format('{0}', inputs.forced_job_count)) ||
        fromJSON(needs.optimized.outputs.selected_jobs) }}
      prepared_artifact_name: github-performance-benchmark-${{ inputs.workload_family }}-shared-prepared-${{ github.run_id }}-${{ github.run_attempt }}
      wheelhouse_artifact_name: github-performance-benchmark-shared-wheelhouse-${{ github.run_id }}-${{ github.run_attempt }}
      performance_profile_run_id: ${{ inputs.performance_profile_run_id }}
      performance_profile_artifact_name: ${{ inputs.performance_profile_artifact_name }}
      fault_injection_shard_id: ${{ inputs.fault_injection_shard_id }}
      fault_injection_after_units: >-
        ${{ fromJSON(format('{0}', inputs.fault_injection_after_units)) }}

  compare:
    needs: [optimized, baseline, setup_benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download shared immutable wheelhouse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-performance-benchmark-shared-wheelhouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Restore Aurora runtime
        uses: ./.github/actions/aurora-runtime-setup
        with:
          python-version: "3.12"
          wheelhouse-path: ${{ runner.temp }}/wheelhouse
          dependency-lock-path: requirements/github-performance.lock
      - name: Download optimized result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-performance-benchmark-${{ inputs.workload_family }}-optimized-results
          path: ${{ runner.temp }}/benchmark/optimized
      - name: Download equivalent baseline result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-performance-benchmark-${{ inputs.workload_family }}-baseline-results
          path: ${{ runner.temp }}/benchmark/baseline
      - name: Download environment setup benchmark
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-performance-environment-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark/setup
      - name: Compare only equivalent scientific outputs
        run: |
          set -euo pipefail
          python scripts/compare_github_performance_runs.py \
            --baseline-dir "$RUNNER_TEMP/benchmark/baseline" \
            --optimized-dir "$RUNNER_TEMP/benchmark/optimized" \
            --environment-setup-benchmark \
              "$RUNNER_TEMP/benchmark/setup/environment_setup_benchmark.json" \
            --output-dir "$RUNNER_TEMP/benchmark/comparison"
      - name: Build exact reusable performance profile
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "benchmark"
                  / "setup"
                  / "environment_setup_benchmark.json"
              ).read_text(encoding="utf-8")
          )
          raise SystemExit(
              0
              if (
                  report.get("fast_path_selected") is True
                  and report.get("dependency_environment_reproducible")
                  is True
              )
              else 1
          )
          PY
          then
            printf '%s\n' \
              '{"profile_created":false,"reason":"FAST_PATH_NOT_SELECTED"}' \
              > "$RUNNER_TEMP/benchmark/comparison/performance_profile_status.json"
            exit 0
          fi
          aurora github build-performance-profile \
            --contract \
              "$RUNNER_TEMP/benchmark/optimized/performance_contract.json" \
            --pilot \
              "$RUNNER_TEMP/benchmark/optimized/performance_pilot.json" \
            --environment-setup-benchmark \
              "$RUNNER_TEMP/benchmark/setup/environment_setup_benchmark.json" \
            --source-run-id "$SOURCE_RUN_ID" \
            --output \
              "$RUNNER_TEMP/benchmark/comparison/performance_profile.json"
      - name: Publish benchmark and phase closure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-performance-benchmark-${{ inputs.workload_family }}-results
          path: ${{ runner.temp }}/benchmark/comparison
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
