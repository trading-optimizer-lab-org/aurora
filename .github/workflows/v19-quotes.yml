name: v19q per-trade quoted spreads of the v19r picks

# scripts/run_v19_quotes.py (amendment v19q of docs/research/V19_PREREGISTRATION.md): trades of the v19r picks on the
# v18b inputs -> Alpaca SIP quotes of every leg (cached) -> walk-forward with each trade's own spread. Only the report
# and aggregates are uploaded; quotes and prices stay in the Actions cache.
on:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_v19_quotes.py
      - .github/workflows/v19-quotes.yml

permissions:
  contents: read

concurrency:
  group: v19-quotes
  cancel-in-progress: true

env:
  V14_UNLOCK_SEALED: yes-the-owner-asked

jobs:
  quotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v18
          key: v18-inputs-39433812183-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v19/quotes
          key: v19-quotes-${{ github.run_id }}
          restore-keys: v19-quotes-
      - run: python scripts/run_v19_quotes.py trades
      - run: python scripts/run_v19_quotes.py quotes
      - if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/v19/quotes
          key: v19-quotes-${{ github.run_id }}-${{ github.run_attempt }}
      - run: python scripts/run_v19_quotes.py analyze
      - if: always()
        run: if [ -f outputs/v19/quotes/QUOTES.md ]; then cat outputs/v19/quotes/QUOTES.md >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v19-quotes
          path: |
            outputs/v19/quotes/QUOTES.md
            outputs/v19/quotes/quotes.json
          retention-days: 90
