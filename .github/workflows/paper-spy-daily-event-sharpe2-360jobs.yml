name: Paper SPY Daily Event Sharpe2 360 Jobs

on:
  workflow_dispatch:
    inputs:
      configs_per_stage:
        description: "Configs tested per stage"
        required: true
        default: "20000"
      time_budget_minutes:
        description: "Clean internal stage runtime before upload"
        required: true
        default: "35"
      max_parallel_requested:
        description: "Requested concurrent jobs"
        required: true
        default: "180"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUTPUT_DIR: outputs/paper_spy_daily_event_sharpe2_360jobs

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download no-locked paper event data
        run: python scripts/run_paper_spy_daily_event_sharpe2.py --mode data --output-dir "$OUTPUT_DIR"
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-daily-event-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}/*

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build 360-stage balanced matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          full = [{"stage_a": stage, "stage_b": stage + 180} for stage in range(180)]
          print("matrix=" + json.dumps(full))
          PY

  search:
    runs-on: ubuntu-latest
    needs: [data, plan]
    timeout-minutes: 95
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-spy-daily-event-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Run paper SPY daily event Sharpe2 stage
        run: |
          for STAGE in "${{ matrix.stage_a }}" "${{ matrix.stage_b }}"; do
            python scripts/run_paper_spy_daily_event_sharpe2.py \
              --mode shard \
              --output-dir "$OUTPUT_DIR" \
              --stage "$STAGE" \
              --configs-per-stage "${{ inputs.configs_per_stage }}" \
              --time-budget-minutes "${{ inputs.time_budget_minutes }}"
          done
      - name: Upload stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-daily-event-sharpe2-stage-pair-${{ matrix.stage_a }}-${{ matrix.stage_b }}
          path: |
            ${{ env.OUTPUT_DIR }}/shards/stage_${{ matrix.stage_a }}
            ${{ env.OUTPUT_DIR }}/shards/stage_${{ matrix.stage_b }}

  merge:
    runs-on: ubuntu-latest
    needs: [data, search]
    if: always()
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Aurora
        run: python -m pip install -e .
      - name: Download data
        uses: actions/download-artifact@v4
        with:
          name: paper-spy-daily-event-sharpe2-data
          path: ${{ env.OUTPUT_DIR }}
      - name: Download stage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paper-spy-daily-event-sharpe2-stage-pair-*
          path: ${{ env.OUTPUT_DIR }}/shards
          merge-multiple: true
      - name: Merge stages
        run: python scripts/run_paper_spy_daily_event_sharpe2.py --mode merge --output-dir "$OUTPUT_DIR"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-spy-daily-event-sharpe2-360jobs-results
          path: ${{ env.OUTPUT_DIR }}
