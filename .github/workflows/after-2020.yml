name: Follow-up after 2020 (intraday strategies with Sortino 4+)

# docs/research/AFTER_2020_FOLLOWUP.md: descriptive follow-up requested by the
# owner. The rehearsal must reproduce the published 2016-2020 results first.
# Market data stays in the Actions cache; only strategy returns and the report
# are uploaded.
on:
  workflow_dispatch:
  push:
    branches: [research/stock-catalog]
    paths:
      - scripts/run_after_2020.py
      - .github/workflows/after-2020.yml

permissions:
  contents: read

concurrency:
  group: after-2020
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore phase 7 minute cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-
          fail-on-cache-miss: true

      - name: Restore phase 7 SEC cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/sec
          key: sec-v1-${{ github.run_id }}
          restore-keys: sec-v1-
          fail-on-cache-miss: true

      - name: Rehearse on 2016-2020
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/run_after_2020.py rehearse --panel-dir outputs/stock_panel --cache outputs/alpaca --sec-cache outputs/sec

  evaluate:
    needs: rehearse
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore price panel
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/stock_panel
          key: stock-panel-v1-${{ hashFiles('docs/research/data/stock_catalog_symbols.csv', 'research/stock_data_checks.py', 'scripts/build_stock_panel.py') }}
          fail-on-cache-miss: true

      - name: Restore phase 7 minute cache (for the Nasdaq series)
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: outputs/alpaca
          key: alpaca-minutes-v1-${{ github.run_id }}
          restore-keys: alpaca-minutes-v1-
          fail-on-cache-miss: true

      - name: Restore the locked-test downloads
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}
          restore-keys: intraday-locked-data-

      - name: Drop the daily bars that end on 2026-09-30 (refetched to 2026-10-16)
        run: rm -f outputs/alpaca_locked/daily.parquet

      - name: Evaluate 2021-01-04 to 2026-10-16
        env:
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python scripts/run_after_2020.py evaluate --panel-dir outputs/stock_panel --out outputs/after
          --cache outputs/alpaca_locked --sec-cache outputs/sec_locked --nasdaq outputs/alpaca/ixic.csv

      - name: Save the downloads
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            outputs/alpaca_locked
            outputs/sec_locked
          key: intraday-locked-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/after/AFTER.md ]; then cat outputs/after/AFTER.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: after-2020
          path: |
            outputs/after/AFTER.md
            outputs/after/results.json
            outputs/after/streams_after.csv
            outputs/after/coverage.json
          if-no-files-found: warn
          retention-days: 90
