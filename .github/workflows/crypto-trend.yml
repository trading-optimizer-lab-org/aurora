name: Crypto trend (pre-registered)

# Train + validation of docs/research/CRYPTO_TREND_PREREGISTRATION.md.
# Prices from 2024-01-01 (locked) are dropped on download.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-trend
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download data and evaluate
        run: python scripts/run_crypto_trend.py --output-dir outputs/crypto_trend

      - name: Publish summary
        if: always()
        run: |
          if [ -f outputs/crypto_trend/REPORT.md ]; then
            cat outputs/crypto_trend/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: crypto-trend
          path: outputs/crypto_trend
          if-no-files-found: warn
          retention-days: 90
