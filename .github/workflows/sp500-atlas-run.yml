    needs: [preflight, evaluate_a, evaluate_b, evaluate_c]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
