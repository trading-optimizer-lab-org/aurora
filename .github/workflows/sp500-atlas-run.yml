name: SP500 Atlas Static Run

on:
  workflow_call:
    inputs:
      run_mode: {required: true, type: string}
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: false, type: string, default: ""}
      calibration_run_id: {required: false, type: string, default: ""}
      target_end_iso: {required: false, type: string, default: ""}
      recipe_count: {required: false, type: number, default: 0}
      total_shards: {required: false, type: number, default: 0}
      launch_authorization: {required: false, type: string, default: ""}
      pilot_source_run_id: {required: false, type: string, default: ""}
      request_sha256: {required: false, type: string, default: ""}
      authority_id: {required: false, type: string, default: ""}
      campaign_id: {required: false, type: string, default: ""}
      science_sha256: {required: false, type: string, default: ""}
      execution_plan_sha256: {required: false, type: string, default: ""}
      execution_protocol_sha256: {required: false, type: string, default: ""}
      protected_commit_sha: {required: false, type: string, default: ""}
      decision_sha256: {required: false, type: string, default: ""}
      prepared_receipt_sha256: {required: false, type: string, default: ""}
    outputs:
      plan_sha256:
        description: Exact Atlas plan hash accepted by preflight
        value: ${{ jobs.preflight.outputs.plan_sha256 }}
      final_results_artifact:
        description: Immutable full-run result artifact name
        value: sp500-atlas-final-results

permissions:
  actions: read
  contents: read

concurrency:
  group: sp500-atlas-${{ inputs.commit_sha }}-${{ inputs.run_mode }}
  cancel-in-progress: false

env:
  GITHUB_ACTIONS: "true"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "NEHALEM"
  NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
  PYTHONPATH: ${{ github.workspace }}/..
  ATLAS_REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
  ATLAS_RUNTIME_INPUT_RUN_ID: ${{ inputs.runtime_input_run_id }}
  ATLAS_CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
  ATLAS_TARGET_END_ISO: ${{ inputs.target_end_iso }}
  ATLAS_RECIPE_COUNT: ${{ inputs.recipe_count }}
  ATLAS_TOTAL_SHARDS: ${{ inputs.total_shards }}
  ATLAS_CATALOG_TARGET_END_ISO: "2026-08-20T07:31:00+02:00"
  ATLAS_REQUEST_SHA256: ${{ inputs.request_sha256 }}
  ATLAS_AUTHORITY_ID: ${{ inputs.authority_id }}
  ATLAS_CAMPAIGN_ID: ${{ inputs.campaign_id }}
  ATLAS_SCIENCE_SHA256: ${{ inputs.science_sha256 }}
  ATLAS_EXECUTION_PLAN_SHA256: ${{ inputs.execution_plan_sha256 }}
  ATLAS_EXECUTION_PROTOCOL_SHA256: ${{ inputs.execution_protocol_sha256 }}
  ATLAS_PROTECTED_COMMIT_SHA: ${{ inputs.protected_commit_sha || inputs.commit_sha }}
  ATLAS_DECISION_SHA256: ${{ inputs.decision_sha256 }}
  ATLAS_CLOUD_PREPARED_RECEIPT_SHA256: ${{ inputs.prepared_receipt_sha256 }}

jobs:
  preflight:
    if: ${{ inputs.launch_authorization != 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 30
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      matrix_c: ${{ steps.plan.outputs.matrix_c }}
      pilot_shards: ${{ steps.plan.outputs.pilot_shards }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
      runtime_input_run_id: ${{ steps.plan.outputs.runtime_input_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Require the complete protected cloud interface when PREPARED is supplied
        if: ${{ inputs.prepared_receipt_sha256 != '' || inputs.request_sha256 != '' || inputs.authority_id != '' || inputs.campaign_id != '' || inputs.science_sha256 != '' || inputs.execution_plan_sha256 != '' || inputs.execution_protocol_sha256 != '' || inputs.protected_commit_sha != '' || inputs.decision_sha256 != '' }}
        shell: bash
        env:
          CLOUD_PROTECTED_COMMIT_INPUT: ${{ inputs.protected_commit_sha }}
        run: |
          set -euo pipefail
            test -n "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256"
            test -n "$ATLAS_REQUEST_SHA256"
            test -n "$ATLAS_AUTHORITY_ID"
            test -n "$ATLAS_DECISION_SHA256"
            test -n "$ATLAS_PROTECTED_COMMIT_SHA"
            test -n "$ATLAS_CAMPAIGN_ID"
            test -n "$ATLAS_SCIENCE_SHA256"
            test -n "$ATLAS_EXECUTION_PLAN_SHA256"
            test -n "$ATLAS_EXECUTION_PROTOCOL_SHA256"
            test -n "$CLOUD_PROTECTED_COMMIT_INPUT"
            test "$GITHUB_REPOSITORY" = "trading-optimizer-lab-org/aurora"
            test "$GITHUB_REF" = "refs/heads/main"
            test "$ATLAS_PROTECTED_COMMIT_SHA" = "$GITHUB_SHA"
            test -z "${{ inputs.launch_authorization }}"
            [[ "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_DECISION_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_CAMPAIGN_ID" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_SCIENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_EXECUTION_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ATLAS_EXECUTION_PROTOCOL_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Require the unchanged legacy interface outside cloud PREPARED mode
        if: ${{ inputs.prepared_receipt_sha256 == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_RUNTIME_INPUT_RUN_ID"
          test -n "$ATLAS_CALIBRATION_RUN_ID"
          test -n "$ATLAS_TARGET_END_ISO"
          [[ "$ATLAS_RECIPE_COUNT" =~ ^[1-9][0-9]*$ ]]
          [[ "$ATLAS_TOTAL_SHARDS" =~ ^[1-9][0-9]*$ ]]
      - name: Download the controller-sealed authority/request/decision proof
        if: ${{ inputs.prepared_receipt_sha256 != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
            name: catalog-sealed-execution-plan-${{ inputs.authority_id }}
            path: ${{ runner.temp }}/atlas-controller-plan
      - name: Verify authority, signed request binding, and exact PREPARED plan
        if: ${{ inputs.prepared_receipt_sha256 != '' }}
        shell: bash
        env:
          EXPECTED_TARGET_END_ISO: ${{ inputs.target_end_iso }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from uuid import UUID

          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan
          from aurora.infra.sp500_megarun.catalog_atlas_cloud_identity import AtlasPreparedReceiptV1
          from aurora.infra.sp500_megarun.catalog_controller import (
              catalog_authority_id,
              catalog_campaign_id,
          )
          from aurora.infra.github_performance.contracts import canonical_sha256

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          controller_root = runner_temp / "atlas-controller-plan"
          expected_files = {
              "atlas_prepared_receipt.json",
              "atlas_run_plan.json",
              "atlas_manifest.json",
              "atlas_sealed_envelope.json",
              "atlas_campaign_selection.json",
          }
          entries = {path.name for path in controller_root.iterdir()}
          if entries != expected_files:
              raise SystemExit("ATLAS_CLOUD_GATE_ARTIFACT_LAYOUT_INVALID")
          if any((controller_root / name).is_symlink() for name in expected_files):
              raise SystemExit("ATLAS_CLOUD_GATE_ARTIFACT_SYMLINK_INVALID")

          receipt_path = controller_root / "atlas_prepared_receipt.json"
          plan_path = controller_root / "atlas_run_plan.json"
          manifest_path = controller_root / "atlas_manifest.json"
          envelope_path = controller_root / "atlas_sealed_envelope.json"
          selection_path = controller_root / "atlas_campaign_selection.json"
          receipt = AtlasPreparedReceiptV1.model_validate(
              json.loads(receipt_path.read_text(encoding="utf-8"))
          )
          envelope = json.loads(envelope_path.read_text(encoding="utf-8"))
          if not isinstance(envelope, dict):
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_INVALID")
          envelope_fields = {
              "schema_version",
              "document_type",
              "engine_id",
              "request_sha256",
              "decision_sha256",
              "prepared_receipt_sha256",
              "plan_sha256",
              "authority_id",
              "campaign_id",
              "science_sha256",
              "execution_plan_sha256",
              "execution_protocol_sha256",
              "protected_commit_sha",
              "selection_sha256",
              "target_end_iso",
              "runtime_input_run_id",
              "catalog_manifest_sha256",
              "envelope_sha256",
          }
          if set(envelope) != envelope_fields:
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_FIELDS_INVALID")
          envelope_identity = {
              key: value for key, value in envelope.items() if key != "envelope_sha256"
          }
          if canonical_sha256(envelope_identity) != envelope["envelope_sha256"]:
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_HASH_INVALID")
          for key in (
              "request_sha256",
              "decision_sha256",
              "prepared_receipt_sha256",
              "plan_sha256",
              "science_sha256",
              "execution_plan_sha256",
              "execution_protocol_sha256",
              "selection_sha256",
              "catalog_manifest_sha256",
          ):
              if not isinstance(envelope[key], str) or not re.fullmatch(r"[0-9a-f]{64}", envelope[key]):
                  raise SystemExit(f"ATLAS_CLOUD_ENVELOPE_{key.upper()}_INVALID")
          try:
              UUID(str(envelope["authority_id"]))
          except ValueError as exc:
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_AUTHORITY_ID_INVALID") from exc
          if (
              envelope["schema_version"] != "1"
              or envelope["document_type"] != "atlas_sealed_envelope_v1"
              or envelope["engine_id"] != "atlas_static_v1"
          ):
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_TYPE_INVALID")
          if receipt.receipt_sha256 != os.environ["ATLAS_CLOUD_PREPARED_RECEIPT_SHA256"]:
              raise SystemExit("ATLAS_CLOUD_PREPARED_RECEIPT_HASH_MISMATCH")
          if envelope["prepared_receipt_sha256"] != receipt.receipt_sha256:
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_RECEIPT_MISMATCH")
          if receipt.status != "PREPARED":
              raise SystemExit("ATLAS_CLOUD_PREPARED_STATUS_INVALID")
          if (
              receipt.identity.protected_commit_sha != os.environ["GITHUB_SHA"]
              or envelope["protected_commit_sha"] != os.environ["GITHUB_SHA"]
          ):
              raise SystemExit("ATLAS_CLOUD_PREPARED_COMMIT_MISMATCH")
          requested_target = os.environ["EXPECTED_TARGET_END_ISO"]
          if requested_target and receipt.target_end_iso != requested_target:
              raise SystemExit("ATLAS_CLOUD_PREPARED_TARGET_MISMATCH")
          if envelope["target_end_iso"] != receipt.target_end_iso:
              raise SystemExit("ATLAS_CLOUD_ENVELOPE_TARGET_MISMATCH")
          if receipt.target_end_iso == os.environ["ATLAS_CATALOG_TARGET_END_ISO"]:
              raise SystemExit("ATLAS_CLOUD_PREPARED_TARGET_IS_FROZEN_CATALOG_TARGET")
          target = datetime.fromisoformat(receipt.target_end_iso.replace("Z", "+00:00"))
          if target.tzinfo is None or target <= datetime.now(timezone.utc):
              raise SystemExit("ATLAS_CLOUD_PREPARED_TARGET_NOT_FUTURE")

          plan = load_plan(plan_path)
          if (
              plan.plan_sha256 != receipt.plan_sha256
              or plan.calibration_receipt_sha256 != receipt.calibration_receipt_sha256
              or envelope["plan_sha256"] != plan.plan_sha256
              or envelope["execution_plan_sha256"] != plan.plan_sha256
          ):
              raise SystemExit("ATLAS_CLOUD_PREPARED_PLAN_HASH_MISMATCH")
          if os.environ["ATLAS_EXECUTION_PLAN_SHA256"] and plan.plan_sha256 != os.environ["ATLAS_EXECUTION_PLAN_SHA256"]:
              raise SystemExit("ATLAS_CLOUD_PREPARED_EXECUTION_PLAN_MISMATCH")
          if plan.target_end_iso != receipt.target_end_iso:
              raise SystemExit("ATLAS_CLOUD_PREPARED_PLAN_TARGET_MISMATCH")
          if plan.requested_recipe_count != 209906 or plan.total_shards != 360:
              raise SystemExit("ATLAS_CLOUD_PREPARED_BOUNDS_INVALID")
          if plan.validation_opened or plan.locked_opened:
              raise SystemExit("ATLAS_CLOUD_PREPARED_BOUNDARY_OPEN")

          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          if not isinstance(selection, dict):
              raise SystemExit("ATLAS_CLOUD_SELECTION_INVALID")
          selection_fields = {
              "schema_version",
              "selection_domain",
              "seed",
              "requested_recipe_count",
              "canonical_recipe_count",
              "ranges",
              "selection_sha256",
          }
          if set(selection) != selection_fields:
              raise SystemExit("ATLAS_CLOUD_SELECTION_FIELDS_INVALID")
          selection_identity = {
              key: value for key, value in selection.items() if key != "selection_sha256"
          }
          if (
              selection["schema_version"] != plan.selection_version
              or selection["selection_domain"] != "AURORA-SP500-ATLAS-CAMPAIGN-SELECTION-V1"
              or selection["seed"] != plan.selection_seed
              or selection["requested_recipe_count"] != plan.requested_recipe_count
              or selection["canonical_recipe_count"] != plan.canonical_recipe_count
              or selection["ranges"] != [item.model_dump(mode="json") for item in plan.selection_ranges]
              or selection["selection_sha256"] != plan.selection_sha256
              or canonical_sha256(selection_identity) != selection["selection_sha256"]
          ):
              raise SystemExit("ATLAS_CLOUD_SELECTION_PLAN_MISMATCH")
          if selection["selection_sha256"] != receipt.selection_sha256:
              raise SystemExit("ATLAS_CLOUD_SELECTION_RECEIPT_MISMATCH")

          freeze = json.loads(Path("config/sp500_atlas_1/freeze_manifest_v1.json").read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if not isinstance(manifest, dict) or manifest.get("manifest_sha256") != freeze.get("catalog_manifest_sha256"):
              raise SystemExit("ATLAS_CLOUD_PREPARED_CATALOG_HASH_MISMATCH")
          if (
              manifest.get("catalog_id") != "sp500-atlas-1"
              or manifest.get("target_end_iso") != os.environ["ATLAS_CATALOG_TARGET_END_ISO"]
              or manifest.get("validation_opened") is not False
              or manifest.get("locked_opened") is not False
              or manifest.get("execution_authorized") is not False
          ):
              raise SystemExit("ATLAS_CLOUD_PREPARED_CATALOG_TARGET_INVALID")
          if (
              plan.catalog_id != "sp500-atlas-1"
              or plan.catalog_manifest_sha256 != manifest.get("manifest_sha256")
              or envelope["catalog_manifest_sha256"] != manifest.get("manifest_sha256")
          ):
              raise SystemExit("ATLAS_CLOUD_PREPARED_CATALOG_ID_OR_HASH_INVALID")

          identity = receipt.identity
          if identity.campaign_key != "sp500-atlas-v1":
              raise SystemExit("ATLAS_CLOUD_CAMPAIGN_KEY_INVALID")
          expected_campaign_id = catalog_campaign_id(
              campaign_key=identity.campaign_key,
              scientific_contract_sha256=identity.scientific_contract_sha256,
          )
          expected_authority_id = str(
              catalog_authority_id(
                  request_sha256=os.environ["ATLAS_REQUEST_SHA256"],
                  campaign_id=expected_campaign_id,
              )
          )
          if (
              envelope["campaign_id"] != expected_campaign_id
              or envelope["authority_id"] != expected_authority_id
              or envelope["request_sha256"] != os.environ["ATLAS_REQUEST_SHA256"]
              or envelope["decision_sha256"] != os.environ["ATLAS_DECISION_SHA256"]
              or envelope["science_sha256"] != identity.scientific_contract_sha256
              or envelope["selection_sha256"] != receipt.selection_sha256
              or envelope["runtime_input_run_id"] != identity.runtime_input_run_id
          ):
              raise SystemExit("ATLAS_CLOUD_SIGNED_REQUEST_OR_AUTHORITY_BINDING_INVALID")
          if os.environ["ATLAS_AUTHORITY_ID"] != envelope["authority_id"]:
              raise SystemExit("ATLAS_CLOUD_AUTHORITY_ID_MISMATCH")
          for env_name, envelope_key in (
              ("ATLAS_CAMPAIGN_ID", "campaign_id"),
              ("ATLAS_SCIENCE_SHA256", "science_sha256"),
              ("ATLAS_EXECUTION_PROTOCOL_SHA256", "execution_protocol_sha256"),
          ):
              if os.environ[env_name] and os.environ[env_name] != envelope[envelope_key]:
                  raise SystemExit(f"ATLAS_CLOUD_{envelope_key.upper()}_MISMATCH")

          cloud_root = runner_temp / "atlas-cloud"
          cloud_root.mkdir(exist_ok=True)
          shutil.copy2(receipt_path, cloud_root / "atlas_prepared_receipt.json")
          shutil.copy2(plan_path, cloud_root / "atlas_run_plan.json")
          shutil.copy2(manifest_path, cloud_root / "atlas_manifest.json")
          shutil.copy2(selection_path, cloud_root / "atlas_campaign_selection.json")
          (runner_temp / "atlas-cloud-target.txt").write_text(receipt.target_end_iso + "\n", encoding="utf-8")
          with (Path(os.environ["GITHUB_ENV"])).open("a", encoding="utf-8") as env:
              env.write(f"ATLAS_TARGET_END_ISO={receipt.target_end_iso}\n")
          print(json.dumps({"plan_sha256": plan.plan_sha256, "prepared_receipt_sha256": receipt.receipt_sha256}, sort_keys=True))
          PY
      - name: Verify requested commit is the workflow commit
        shell: bash
        env:
          WORKFLOW_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ATLAS_REQUESTED_COMMIT_SHA" = "$WORKFLOW_COMMIT_SHA"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT_SHA"
      - name: Build and verify the compact catalog
        shell: bash
        run: |
          set -euo pipefail
          catalog_target="$ATLAS_TARGET_END_ISO"
          if [ -n "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256" ]; then
            # Cloud PREPARED binds a future planning target; only the frozen
            # historical target may be used to reconstruct the catalog hash.
            catalog_target="$ATLAS_CATALOG_TARGET_END_ISO"
          fi
          test -n "$catalog_target"
          python scripts/build_sp500_atlas_catalog.py \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --output-dir outputs/atlas \
            --target-end-iso "$catalog_target"
          python scripts/verify_sp500_atlas_catalog.py \
            --catalog-dir outputs/atlas \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json
          if [ -n "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          rebuilt = json.loads(Path("outputs/atlas/manifest.json").read_text(encoding="utf-8"))
          prepared = json.loads((Path(os.environ["RUNNER_TEMP"]) / "atlas-cloud" / "atlas_manifest.json").read_text(encoding="utf-8"))
          freeze = json.loads(Path("config/sp500_atlas_1/freeze_manifest_v1.json").read_text(encoding="utf-8"))
          assert rebuilt == prepared
          assert rebuilt["manifest_sha256"] == freeze["catalog_manifest_sha256"]
          assert rebuilt["target_end_iso"] == os.environ["ATLAS_CATALOG_TARGET_END_ISO"]
          PY
          fi
      - id: plan
        name: Create exact static plan
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256" ]; then
            mkdir -p outputs/plan
            cp "$RUNNER_TEMP/atlas-cloud/atlas_run_plan.json" outputs/plan/atlas_run_plan.json
            python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan

          controller_root = Path(os.environ["RUNNER_TEMP"]) / "atlas-cloud"
          shutil.copy2(
              controller_root / "atlas_campaign_selection.json",
              "outputs/plan/atlas_campaign_selection.json",
          )
          plan = load_plan(Path("outputs/plan/atlas_run_plan.json"))
          if plan.catalog_manifest_sha256 != json.loads(Path("outputs/atlas/manifest.json").read_text(encoding="utf-8"))["manifest_sha256"]:
              raise SystemExit("ATLAS_CLOUD_PLAN_CATALOG_RECONSTRUCTION_MISMATCH")
          selection = json.loads(Path("outputs/plan/atlas_campaign_selection.json").read_text(encoding="utf-8"))
          if selection["selection_sha256"] != plan.selection_sha256:
              raise SystemExit("ATLAS_CLOUD_SELECTION_PLAN_MISMATCH")
          matrices = {
              f"matrix_{name}": {"shard": list(group)}
              for name, group in zip(("a", "b", "c"), plan.matrix_groups(3), strict=True)
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name, value in matrices.items():
                  out.write(f"{name}={json.dumps(value, separators=(',', ':'))}\n")
              out.write(f"plan_sha256={plan.plan_sha256}\n")
              prepared = json.loads((Path(os.environ["RUNNER_TEMP"]) / "atlas-cloud" / "atlas_prepared_receipt.json").read_text(encoding="utf-8"))
              out.write(f"runtime_input_run_id={prepared['identity']['runtime_input_run_id']}\n")
          PY
          else
          calibration_root="$RUNNER_TEMP/calibration"
          rm -rf "$calibration_root"
          mkdir -p "$calibration_root"
          gh run download "$ATLAS_CALIBRATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "sp500-atlas-calibration-${ATLAS_CALIBRATION_RUN_ID}" \
            --dir "$calibration_root"
          receipt="$(find "$calibration_root" -name calibration_receipt.json -type f -print -quit)"
          test -n "$receipt"
          export ATLAS_CALIBRATION_RECEIPT_PATH="$receipt"
          implementation_sha="$ATLAS_REQUESTED_COMMIT_SHA"
          if [ -f config/sp500_atlas_1/freeze_manifest_v1.json ]; then
            test -f config/sp500_atlas_1/freeze_manifest_v1.json
            implementation_sha="$(python -c 'import json; print(json.load(open("config/sp500_atlas_1/freeze_manifest_v1.json", encoding="utf-8"))["scientific_implementation_commit_sha"])')"
          fi
          export ATLAS_IMPLEMENTATION_COMMIT_SHA="$implementation_sha"
          python scripts/plan_sp500_atlas_run.py \
            --catalog-dir outputs/atlas \
            --calibration-receipt "$ATLAS_CALIBRATION_RECEIPT_PATH" \
            --output-dir outputs/plan \
            --target-end-iso "$ATLAS_TARGET_END_ISO" \
            --implementation-commit-sha "$implementation_sha" \
            --recipe-count "$ATLAS_RECIPE_COUNT" \
            --total-shards "$ATLAS_TOTAL_SHARDS" \
            --selection-seed 20260818
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.load(open("outputs/plan/atlas_run_plan.json", encoding="utf-8"))
          matrices = json.load(open("outputs/plan/atlas_worker_matrices.json", encoding="utf-8"))
          assert plan["validation_opened"] is False
          assert plan["locked_opened"] is False
          assert plan["implementation_commit_sha"] == os.environ["ATLAS_IMPLEMENTATION_COMMIT_SHA"]
          assert plan["requested_recipe_count"] == int(os.environ["EXPECTED_RECIPE_COUNT"])
          assert plan["selection_sha256"]
          assert plan["selection_seed"] == 20260818
          assert Path("outputs/plan/atlas_campaign_selection.json").is_file()
          for name, value in matrices.items():
              print(f"{name}={json.dumps(value, separators=(',', ':'))}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name, value in matrices.items():
                  out.write(f"{name}={json.dumps(value, separators=(',', ':'))}\n")
              out.write(f"plan_sha256={plan['plan_sha256']}\n")
              out.write(f"runtime_input_run_id={os.environ['ATLAS_RUNTIME_INPUT_RUN_ID']}\n")
          PY
          fi
          python scripts/plan_sp500_atlas_segments.py \
            --plan outputs/plan/atlas_run_plan.json \
            --output outputs/plan/atlas_segment_manifest.json \
            --max-shards-per-segment 120
          if [ "${{ inputs.run_mode }}" != "smoke" ]; then
            python scripts/plan_sp500_atlas_pilot.py \
              --plan outputs/plan/atlas_run_plan.json \
              --output outputs/plan/atlas_pilot_manifest.json \
              --shard-count 60
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          names = ["atlas_segment_manifest.json"]
          if "${{ inputs.run_mode }}" != "smoke":
              names.append("atlas_pilot_manifest.json")
          for name in names:
              payload = json.loads(Path("outputs/plan", name).read_text(encoding="utf-8"))
              assert payload["validation_opened"] is False
              assert payload["locked_opened"] is False
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          pilot_path = Path("outputs/plan/atlas_pilot_manifest.json")
          pilot = json.loads(pilot_path.read_text(encoding="utf-8")) if pilot_path.is_file() else None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("pilot_shards=" + json.dumps((pilot or {}).get("shard_indices", []), separators=(",", ":")) + "\n")
          PY
        env:
          EXPECTED_RECIPE_COUNT: ${{ env.ATLAS_RECIPE_COUNT }}
      - name: Require explicit authorization and the frozen campaign plan
        if: ${{ inputs.run_mode == 'pilot' || inputs.run_mode == 'full' }}
        shell: bash
        env:
          LAUNCH_AUTHORIZATION: ${{ inputs.launch_authorization }}
        run: |
          set -euo pipefail
          if [ -n "$ATLAS_CLOUD_PREPARED_RECEIPT_SHA256" ]; then
            # Cloud execution is admitted only by the bound authority/request/
            # decision proof and PREPARED receipt; a plain launch token cannot
            # authorize or substitute for that interface.
            test "${{ inputs.run_mode }}" = "full"
            test -z "$LAUNCH_AUTHORIZATION"
            python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("outputs/plan/atlas_run_plan.json").read_text(encoding="utf-8"))
          assert plan["requested_recipe_count"] == 209906
          assert plan["total_shards"] == 360
          assert plan["validation_opened"] is False
          assert plan["locked_opened"] is False
          assert plan["target_end_iso"] != "2026-08-20T07:31:00+02:00"
          print("ATLAS_CLOUD_PREPARED_PLAN_ACCEPTED")
          PY
          else
            if [ "${{ inputs.run_mode }}" = "full" ]; then
              test "$LAUNCH_AUTHORIZATION" = "AUTHORIZE_SP500_ATLAS_FULL_RUN"
            else
              test "$LAUNCH_AUTHORIZATION" = "AUTHORIZE_SP500_ATLAS_PILOT"
            fi
            python - <<'PY'
          import json
          from pathlib import Path

          freeze = json.loads(Path("config/sp500_atlas_1/freeze_manifest_v1.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("outputs/plan/atlas_run_plan.json").read_text(encoding="utf-8"))
          assert freeze["launch_authorized"] is True
          assert freeze["validation_opened"] is False
          assert freeze["locked_opened"] is False
          assert freeze["frozen_plan_sha256"] == plan["plan_sha256"]
          assert freeze["catalog_manifest_sha256"] == plan["catalog_manifest_sha256"]
          assert freeze["catalog_space_sha256"] == plan["catalog_space_sha256"]
          assert freeze["calibration_receipt_sha256"] == plan["calibration_receipt_sha256"]
          assert freeze["scientific_implementation_commit_sha"] == plan["implementation_commit_sha"]
          assert freeze["selection_sha256"] == plan["selection_sha256"]
          assert freeze["selection_seed"] == plan["selection_seed"]
          assert freeze["requested_recipe_count"] == plan["requested_recipe_count"]
          assert freeze["total_shards"] == plan["total_shards"] == 360
          assert plan["target_end_iso"] == "2026-08-20T07:31:00+02:00"
          print("ATLAS_FROZEN_FULL_PLAN_ACCEPTED")
          PY
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-preflight
          path: outputs
          if-no-files-found: error
          retention-days: 30

  pilot_evaluate:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'pilot' }}
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        shard: ${{ fromJSON(needs.preflight.outputs.pilot_shards) }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: sp500-atlas-preflight, path: "${{ runner.temp }}/preflight"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ needs.preflight.outputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.runtime_input_run_id }}
      - name: Evaluate fixed pilot shard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_sp500_atlas_worker.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --catalog-dir "$RUNNER_TEMP/preflight/atlas" \
            --runtime-input-pack "$RUNNER_TEMP/runtime" \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --shard-index "${{ matrix.shard }}" \
            --output-dir "$RUNNER_TEMP/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  pilot_fault_fixtures:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'pilot' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - run: python scripts/run_sp500_atlas_pilot_faults.py --output fault_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: fault_receipt.json
          if-no-files-found: error
          retention-days: 30

  pilot_summarize:
    needs: [preflight, pilot_evaluate, pilot_fault_fixtures]
    if: ${{ always() && needs.preflight.result == 'success' && needs.pilot_evaluate.result == 'success' && needs.pilot_fault_fixtures.result == 'success' && inputs.run_mode == 'pilot' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: sp500-atlas-preflight, path: "${{ runner.temp }}/preflight"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-pilot-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/partitions
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: ${{ runner.temp }}/faults
      - name: Verify pilot coverage and effective concurrency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/summarize_sp500_atlas_pilot.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --pilot-manifest "$RUNNER_TEMP/preflight/plan/atlas_pilot_manifest.json" \
            --partitions-root "$RUNNER_TEMP/partitions" \
            --fault-receipt "$RUNNER_TEMP/faults/fault_receipt.json" \
            --output outputs/pilot_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-results-${{ github.run_id }}
          path: outputs
          if-no-files-found: error
          retention-days: 90

  pilot_verify:
    if: ${{ inputs.run_mode == 'pilot_verify' && inputs.launch_authorization != 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-pilot-shard-${{ inputs.pilot_source_run_id }}-*
          path: ${{ runner.temp }}/partitions
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-pilot-faults-${{ inputs.pilot_source_run_id }}
          path: ${{ runner.temp }}/faults
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - name: Recheck immutable pilot artifacts without re-evaluation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.pilot_source_run_id }}"
          python scripts/summarize_sp500_atlas_pilot.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --pilot-manifest "$RUNNER_TEMP/preflight/plan/atlas_pilot_manifest.json" \
            --partitions-root "$RUNNER_TEMP/partitions" \
            --fault-receipt "$RUNNER_TEMP/faults/fault_receipt.json" \
            --output outputs/pilot_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-verified-results-${{ github.run_id }}
          path: outputs
          if-no-files-found: error
          retention-days: 90

  recover_chunks:
    if: ${{ inputs.run_mode == 'pilot_verify' && inputs.launch_authorization == 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {chunk_index: 0, chunk_start: 0, chunk_stop: 30}
          - {chunk_index: 1, chunk_start: 30, chunk_stop: 60}
          - {chunk_index: 2, chunk_start: 60, chunk_stop: 90}
          - {chunk_index: 3, chunk_start: 90, chunk_stop: 120}
          - {chunk_index: 4, chunk_start: 120, chunk_stop: 150}
          - {chunk_index: 5, chunk_start: 150, chunk_stop: 180}
          - {chunk_index: 6, chunk_start: 180, chunk_stop: 210}
          - {chunk_index: 7, chunk_start: 210, chunk_stop: 240}
          - {chunk_index: 8, chunk_start: 240, chunk_stop: 270}
          - {chunk_index: 9, chunk_start: 270, chunk_stop: 300}
          - {chunk_index: 10, chunk_start: 300, chunk_stop: 330}
          - {chunk_index: 11, chunk_start: 330, chunk_stop: 360}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.pilot_source_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Verify recovery contract and train-only plan
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.commit_sha }}" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ inputs.launch_authorization }}" = "RECOVER_EXISTING_ATLAS_ARTIFACTS"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - name: Verify exact train-only plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan
          plan = load_plan(Path(os.environ["RUNNER_TEMP"]) / "preflight" / "plan" / "atlas_run_plan.json")
          assert plan.train_end == "2010-12-31"
          assert plan.validation_opened is False
          assert plan.locked_opened is False
          assert plan.total_shards == 360
          assert plan.requested_recipe_count == 209906
          PY
      - name: Download only this recovery block from the source run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          for index in $(seq "${{ matrix.chunk_start }}" "$(( ${{ matrix.chunk_stop }} - 1 ))"); do
            target="$RUNNER_TEMP/shards/sp500-atlas-shard-$index"
            mkdir -p "$target"
            gh run download "$SOURCE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "sp500-atlas-shard-$index" \
              --dir "$target"
          done
      - name: Verify this source block without re-evaluation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recover_sp500_atlas_reference.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --partitions-root "$RUNNER_TEMP/shards" \
            --output-dir outputs/chunk \
            --chunk-index "${{ matrix.chunk_index }}" \
            --chunk-start "${{ matrix.chunk_start }}" \
            --chunk-stop "${{ matrix.chunk_stop }}" \
            --source-run-id "$SOURCE_RUN_ID" \
            --workers 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-recovery-chunk-${{ github.run_id }}-${{ matrix.chunk_index }}
          path: outputs/chunk
          if-no-files-found: error
          retention-days: 90

  recover_merge:
    needs: recover_chunks
    if: ${{ always() && inputs.run_mode == 'pilot_verify' && inputs.launch_authorization == 'RECOVER_EXISTING_ATLAS_ARTIFACTS' && needs.recover_chunks.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.pilot_source_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-recovery-chunk-${{ github.run_id }}-*
          path: ${{ runner.temp }}/chunks
          merge-multiple: false
      - name: Merge verified block indexes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_sp500_atlas_reference.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --chunks-root "$RUNNER_TEMP/chunks" \
            --output-dir outputs/final \
            --source-run-id "$SOURCE_RUN_ID" \
            --expected-chunks 12
      - name: Verify complete recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan
          root = Path(os.environ["RUNNER_TEMP"])
          plan = load_plan(root / "preflight" / "plan" / "atlas_run_plan.json")
          receipt = json.loads(Path("outputs/final/reduction_receipt.json").read_text(encoding="utf-8"))
          index = json.loads(Path("outputs/final/source_results_index.json").read_text(encoding="utf-8"))
          assert receipt["accepted"] is True
          assert receipt["plan_sha256"] == plan.plan_sha256
          assert receipt["verified_recipe_count"] == plan.requested_recipe_count
          assert receipt["verified_shard_count"] == plan.total_shards
          assert receipt["verified_chunk_count"] == 12
          assert receipt["storage_mode"] == "source_artifacts_referenced"
          assert receipt["row_hash_verification_mode"] == "artifact_file_hash_bound"
          assert receipt["row_hashes_recomputed"] is False
          assert receipt["result_file_hashes_verified"] is True
          assert receipt["validation_opened"] is False
          assert receipt["locked_opened"] is False
          assert index["source_run_id"] == os.environ["SOURCE_RUN_ID"]
          assert len(index["shards"]) == plan.total_shards
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-recovered-final-results-${{ inputs.pilot_source_run_id }}
          path: outputs/final
          if-no-files-found: error
          retention-days: 90

  evaluate_a:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'full' }}
    strategy:
      fail-fast: false
      # Cloud Atlas is admitted at twenty workers total.  The three fixed
      # matrices therefore reserve a verifiable 6+7+7 aggregate cap; legacy
      # runs retain their previous max-parallel: 120 per-job ceiling.
      max-parallel: ${{ inputs.prepared_receipt_sha256 != '' && 6 || 120 }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix_a) }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: sp500-atlas-preflight, path: "${{ runner.temp }}/preflight"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ needs.preflight.outputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.runtime_input_run_id }}
      - name: Evaluate fixed shard with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/shard"
            if python scripts/run_sp500_atlas_worker.py \
              --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
              --catalog-dir "$RUNNER_TEMP/preflight/atlas" \
              --runtime-input-pack "$RUNNER_TEMP/runtime" \
              --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
              --data-contract config/sp500_megarun_free_data_240.json \
              --feature-contract config/sp500_megarun_feature_contract_240.json \
              --shard-index "${{ matrix.shard }}" \
              --output-dir "$RUNNER_TEMP/shard"; then
              break
            fi
            test "$attempt" -lt 3
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
