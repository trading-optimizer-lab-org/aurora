              --data-contract config/sp500_megarun_free_data_240.json \
              --feature-contract config/sp500_megarun_feature_contract_240.json \
              --shard-index "$shard" \
              --output-dir "$RUNNER_TEMP/shards/shard-$shard"
          done
          python scripts/reduce_sp500_atlas_run.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --partitions-root "$RUNNER_TEMP/shards" \
            --output-dir outputs/final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-smoke-final-results
          path: outputs/final
          if-no-files-found: error
          retention-days: 30

  reduce:
    needs: [preflight, evaluate_a, evaluate_b, evaluate_c]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'full' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
