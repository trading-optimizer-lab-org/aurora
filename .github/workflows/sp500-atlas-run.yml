name: SP500 Atlas Static Run

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "smoke, plan, or controller-owned full run"
        required: true
        default: smoke
        type: choice
        options: [smoke, plan, pilot, pilot_verify, full]
      commit_sha:
        description: "Exact immutable implementation commit"
        required: true
        type: string
      runtime_input_run_id:
        description: "Verified train-only runtime input pack run"
        required: true
        default: "31418682679"
        type: string
      calibration_run_id:
        description: "Verified 20-minute calibration run"
        required: true
        default: "32061399368"
        type: string
      target_end_iso:
        description: "Planning target in Europe/Madrid"
        required: true
        default: "2026-08-20T07:31:00+02:00"
        type: string
      recipe_count:
        description: "Exact finite tranche; 64 for smoke, calibrated value for full"
        required: true
        default: "64"
        type: number
      total_shards:
        description: "Static shard count; 4 for smoke, 360 for full"
        required: true
        default: "4"
        type: number
      launch_authorization:
        description: "Required only for full: AUTHORIZE_SP500_ATLAS_FULL_RUN"
        required: false
        default: ""
        type: string
      pilot_source_run_id:
        description: "Existing pilot run whose immutable artifacts must be verified"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      run_mode: {required: true, type: string}
      commit_sha: {required: true, type: string}
      runtime_input_run_id: {required: true, type: string}
      calibration_run_id: {required: true, type: string}
      target_end_iso: {required: true, type: string}
      recipe_count: {required: true, type: number}
      total_shards: {required: true, type: number}
      launch_authorization: {required: false, type: string}
      pilot_source_run_id: {required: false, type: string}

permissions:
  actions: read
  contents: read

concurrency:
  group: sp500-atlas-${{ inputs.commit_sha }}-${{ inputs.run_mode }}
  cancel-in-progress: false

env:
  GITHUB_ACTIONS: "true"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OPENBLAS_CORETYPE: "NEHALEM"
  NPY_DISABLE_CPU_FEATURES: "AVX,F16C,FMA3,AVX2,AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL"
  PYTHONPATH: ${{ github.workspace }}/..
  ATLAS_REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
  ATLAS_RUNTIME_INPUT_RUN_ID: ${{ inputs.runtime_input_run_id }}
  ATLAS_CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
  ATLAS_TARGET_END_ISO: ${{ inputs.target_end_iso }}
  ATLAS_RECIPE_COUNT: ${{ inputs.recipe_count }}
  ATLAS_TOTAL_SHARDS: ${{ inputs.total_shards }}

jobs:
  preflight:
    if: ${{ inputs.launch_authorization != 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      matrix_c: ${{ steps.plan.outputs.matrix_c }}
      pilot_shards: ${{ steps.plan.outputs.pilot_shards }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Verify requested commit is the workflow commit
        shell: bash
        run: test "$ATLAS_REQUESTED_COMMIT_SHA" = "$GITHUB_SHA"
      - name: Build and verify the compact catalog
        shell: bash
        run: |
          python scripts/build_sp500_atlas_catalog.py \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --output-dir outputs/atlas \
            --target-end-iso "$ATLAS_TARGET_END_ISO"
          python scripts/verify_sp500_atlas_catalog.py \
            --catalog-dir outputs/atlas \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json
      - id: plan
        name: Create exact static plan
        shell: bash
        run: |
          calibration_root="$RUNNER_TEMP/calibration"
          rm -rf "$calibration_root"
          mkdir -p "$calibration_root"
          gh run download "$ATLAS_CALIBRATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "sp500-atlas-calibration-${ATLAS_CALIBRATION_RUN_ID}" \
            --dir "$calibration_root"
          receipt="$(find "$calibration_root" -name calibration_receipt.json -type f -print -quit)"
          test -n "$receipt"
          export ATLAS_CALIBRATION_RECEIPT_PATH="$receipt"
          implementation_sha="$ATLAS_REQUESTED_COMMIT_SHA"
          if [ -f config/sp500_atlas_1/freeze_manifest_v1.json ]; then
            test -f config/sp500_atlas_1/freeze_manifest_v1.json
            implementation_sha="$(python -c 'import json; print(json.load(open("config/sp500_atlas_1/freeze_manifest_v1.json", encoding="utf-8"))["scientific_implementation_commit_sha"])')"
          fi
          export ATLAS_IMPLEMENTATION_COMMIT_SHA="$implementation_sha"
          python scripts/plan_sp500_atlas_run.py \
            --catalog-dir outputs/atlas \
            --calibration-receipt "$ATLAS_CALIBRATION_RECEIPT_PATH" \
            --output-dir outputs/plan \
            --target-end-iso "$ATLAS_TARGET_END_ISO" \
            --implementation-commit-sha "$implementation_sha" \
            --recipe-count "$ATLAS_RECIPE_COUNT" \
            --total-shards "$ATLAS_TOTAL_SHARDS" \
            --selection-seed 20260818
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.load(open("outputs/plan/atlas_run_plan.json", encoding="utf-8"))
          matrices = json.load(open("outputs/plan/atlas_worker_matrices.json", encoding="utf-8"))
          assert plan["validation_opened"] is False
          assert plan["locked_opened"] is False
          assert plan["implementation_commit_sha"] == os.environ["ATLAS_IMPLEMENTATION_COMMIT_SHA"]
          assert plan["requested_recipe_count"] == int(os.environ["EXPECTED_RECIPE_COUNT"])
          assert plan["selection_sha256"]
          assert plan["selection_seed"] == 20260818
          assert Path("outputs/plan/atlas_campaign_selection.json").is_file()
          for name, value in matrices.items():
              print(f"{name}={json.dumps(value, separators=(',', ':'))}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name, value in matrices.items():
                  out.write(f"{name}={json.dumps(value, separators=(',', ':'))}\n")
              out.write(f"plan_sha256={plan['plan_sha256']}\n")
          PY
          python scripts/plan_sp500_atlas_segments.py \
            --plan outputs/plan/atlas_run_plan.json \
            --output outputs/plan/atlas_segment_manifest.json \
            --max-shards-per-segment 120
          if [ "${{ inputs.run_mode }}" != "smoke" ]; then
            python scripts/plan_sp500_atlas_pilot.py \
              --plan outputs/plan/atlas_run_plan.json \
              --output outputs/plan/atlas_pilot_manifest.json \
              --shard-count 60
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          names = ["atlas_segment_manifest.json"]
          if "${{ inputs.run_mode }}" != "smoke":
              names.append("atlas_pilot_manifest.json")
          for name in names:
              payload = json.loads(Path("outputs/plan", name).read_text(encoding="utf-8"))
              assert payload["validation_opened"] is False
              assert payload["locked_opened"] is False
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          pilot_path = Path("outputs/plan/atlas_pilot_manifest.json")
          pilot = json.loads(pilot_path.read_text(encoding="utf-8")) if pilot_path.is_file() else None
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("pilot_shards=" + json.dumps((pilot or {}).get("shard_indices", []), separators=(",", ":")) + "\n")
          PY
        env:
          EXPECTED_RECIPE_COUNT: ${{ env.ATLAS_RECIPE_COUNT }}
      - name: Require explicit authorization and the frozen campaign plan
        if: ${{ inputs.run_mode == 'pilot' || inputs.run_mode == 'full' }}
        shell: bash
        env:
          LAUNCH_AUTHORIZATION: ${{ inputs.launch_authorization }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_mode }}" = "full" ]; then
            test "$LAUNCH_AUTHORIZATION" = "AUTHORIZE_SP500_ATLAS_FULL_RUN"
          else
            test "$LAUNCH_AUTHORIZATION" = "AUTHORIZE_SP500_ATLAS_PILOT"
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          freeze = json.loads(Path("config/sp500_atlas_1/freeze_manifest_v1.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("outputs/plan/atlas_run_plan.json").read_text(encoding="utf-8"))
          assert freeze["launch_authorized"] is True
          assert freeze["validation_opened"] is False
          assert freeze["locked_opened"] is False
          assert freeze["frozen_plan_sha256"] == plan["plan_sha256"]
          assert freeze["catalog_manifest_sha256"] == plan["catalog_manifest_sha256"]
          assert freeze["catalog_space_sha256"] == plan["catalog_space_sha256"]
          assert freeze["calibration_receipt_sha256"] == plan["calibration_receipt_sha256"]
          assert freeze["scientific_implementation_commit_sha"] == plan["implementation_commit_sha"]
          assert freeze["selection_sha256"] == plan["selection_sha256"]
          assert freeze["selection_seed"] == plan["selection_seed"]
          assert freeze["requested_recipe_count"] == plan["requested_recipe_count"]
          assert freeze["total_shards"] == plan["total_shards"] == 360
          assert plan["target_end_iso"] == "2026-08-20T07:31:00+02:00"
          print("ATLAS_FROZEN_FULL_PLAN_ACCEPTED")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-preflight
          path: outputs
          if-no-files-found: error
          retention-days: 30

  pilot_evaluate:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'pilot' }}
    strategy:
      fail-fast: false
      max-parallel: 60
      matrix:
        shard: ${{ fromJSON(needs.preflight.outputs.pilot_shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: sp500-atlas-preflight, path: "${{ runner.temp }}/preflight"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-megarun-dehb-runtime-inputs-${{ inputs.runtime_input_run_id }}
          path: ${{ runner.temp }}/runtime
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_input_run_id }}
      - name: Evaluate fixed pilot shard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_sp500_atlas_worker.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --catalog-dir "$RUNNER_TEMP/preflight/atlas" \
            --runtime-input-pack "$RUNNER_TEMP/runtime" \
            --campaign-contract config/sp500_megarun_dehb_campaign_v1.json \
            --data-contract config/sp500_megarun_free_data_240.json \
            --feature-contract config/sp500_megarun_feature_contract_240.json \
            --shard-index "${{ matrix.shard }}" \
            --output-dir "$RUNNER_TEMP/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  pilot_fault_fixtures:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'pilot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - run: python scripts/run_sp500_atlas_pilot_faults.py --output fault_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: fault_receipt.json
          if-no-files-found: error
          retention-days: 30

  pilot_summarize:
    needs: [preflight, pilot_evaluate, pilot_fault_fixtures]
    if: ${{ always() && needs.preflight.result == 'success' && needs.pilot_evaluate.result == 'success' && needs.pilot_fault_fixtures.result == 'success' && inputs.run_mode == 'pilot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: sp500-atlas-preflight, path: "${{ runner.temp }}/preflight"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-pilot-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/partitions
          merge-multiple: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-pilot-faults-${{ github.run_id }}
          path: ${{ runner.temp }}/faults
      - name: Verify pilot coverage and effective concurrency
        shell: bash
        run: |
          set -euo pipefail
          python scripts/summarize_sp500_atlas_pilot.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --pilot-manifest "$RUNNER_TEMP/preflight/plan/atlas_pilot_manifest.json" \
            --partitions-root "$RUNNER_TEMP/partitions" \
            --fault-receipt "$RUNNER_TEMP/faults/fault_receipt.json" \
            --output outputs/pilot_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-results-${{ github.run_id }}
          path: outputs
          if-no-files-found: error
          retention-days: 90

  pilot_verify:
    if: ${{ inputs.run_mode == 'pilot_verify' && inputs.launch_authorization != 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-pilot-shard-${{ inputs.pilot_source_run_id }}-*
          path: ${{ runner.temp }}/partitions
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-pilot-faults-${{ inputs.pilot_source_run_id }}
          path: ${{ runner.temp }}/faults
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - name: Recheck immutable pilot artifacts without re-evaluation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.pilot_source_run_id }}"
          python scripts/summarize_sp500_atlas_pilot.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --pilot-manifest "$RUNNER_TEMP/preflight/plan/atlas_pilot_manifest.json" \
            --partitions-root "$RUNNER_TEMP/partitions" \
            --fault-receipt "$RUNNER_TEMP/faults/fault_receipt.json" \
            --output outputs/pilot_receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-pilot-verified-results-${{ github.run_id }}
          path: outputs
          if-no-files-found: error
          retention-days: 90

  recover_existing:
    if: ${{ inputs.run_mode == 'pilot_verify' && inputs.launch_authorization == 'RECOVER_EXISTING_ATLAS_ARTIFACTS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Verify recovery authorization and immutable commit
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
          RECOVERY_AUTHORIZATION: ${{ inputs.launch_authorization }}
          SOURCE_RUN_ID: ${{ inputs.pilot_source_run_id }}
        run: |
          set -euo pipefail
          test "$REQUESTED_COMMIT" = "$GITHUB_SHA"
          test "$RECOVERY_AUTHORIZATION" = "RECOVER_EXISTING_ATLAS_ARTIFACTS"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sp500-atlas-preflight
          path: ${{ runner.temp }}/preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sp500-atlas-shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_source_run_id }}
      - name: Verify existing train-only plan before reduction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan

          root = Path(os.environ["RUNNER_TEMP"]) / "preflight"
          plan = load_plan(root / "plan" / "atlas_run_plan.json")
          assert plan.train_end == "2010-12-31"
          assert plan.validation_opened is False
          assert plan.locked_opened is False
          assert plan.total_shards == 360
          print(json.dumps({
              "plan_sha256": plan.plan_sha256,
              "requested_recipe_count": plan.requested_recipe_count,
              "total_shards": plan.total_shards,
              "validation_opened": False,
              "locked_opened": False,
          }, sort_keys=True))
          PY
      - name: Reduce existing shard artifacts without re-evaluation
        env:
          ATLAS_RECOVERY_FAST_PATH: "1"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reduce_sp500_atlas_run.py \
            --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
            --partitions-root "$RUNNER_TEMP/shards" \
            --output-dir outputs/final \
            --artifact-file-hash-only
      - name: Verify recovered reduction receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from aurora.infra.sp500_megarun.atlas_execution_contract import load_plan

          plan = load_plan(
              Path(os.environ["RUNNER_TEMP"])
              / "preflight"
              / "plan"
              / "atlas_run_plan.json"
          )
          receipt = json.loads(Path("outputs/final/reduction_receipt.json").read_text(encoding="utf-8"))
          assert receipt["accepted"] is True
          assert receipt["plan_sha256"] == plan.plan_sha256
          assert receipt["verified_recipe_count"] == plan.requested_recipe_count
          assert receipt["verified_shard_count"] == plan.total_shards
          assert receipt["row_hash_verification_mode"] == "artifact_file_hash_bound"
          assert receipt["row_hashes_recomputed"] is False
          assert receipt["result_file_hashes_verified"] is True
          assert receipt["validation_opened"] is False
          assert receipt["locked_opened"] is False
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sp500-atlas-recovered-final-results-${{ inputs.pilot_source_run_id }}
          path: outputs/final
          if-no-files-found: error
          retention-days: 90

  evaluate_a:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'full' }}
    strategy:
      fail-fast: false
      max-parallel: 120
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix_a) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
