  smoke_serial:
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.run_mode == 'smoke' }}
    runs-on: ubuntu-24.04
    environment: catalog-production
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r requirements/catalog-optimized.lock
      - name: Download smoke inputs with the preinstalled GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name sp500-atlas-preflight \
            --dir "$RUNNER_TEMP/preflight"
          gh run download "${{ needs.preflight.outputs.runtime_input_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "sp500-megarun-dehb-runtime-inputs-${{ needs.preflight.outputs.runtime_input_run_id }}" \
            --dir "$RUNNER_TEMP/runtime"
      - name: Evaluate all smoke blocks and reduce them
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/shards"
          mkdir -p "$RUNNER_TEMP/shards"
          for shard in 0 1 2 3; do
            python scripts/run_sp500_atlas_worker.py \
              --plan "$RUNNER_TEMP/preflight/plan/atlas_run_plan.json" \
              --catalog-dir "$RUNNER_TEMP/preflight/atlas" \
              --runtime-input-pack "$RUNNER_TEMP/runtime" \
