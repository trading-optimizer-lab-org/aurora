name: OpenAP 149 realestate SEC diagnostic

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Aurora revision to execute
        required: true
        type: string
      sec_artifact_run_id:
        description: Successful run containing the 48 official SEC lake shards
        required: true
        default: "31270341796"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: openap-149-realestate-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SEC_ARTIFACT_RUN_ID: ${{ inputs.sec_artifact_run_id }}
      AU_DATA_DIR: ${{ github.workspace }}/outputs
    steps:
      - name: Checkout exact implementation revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and focused tests
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Verify diagnostic contract
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          python -m pytest tests/test_openap_149_sec_companyfacts.py -q --tb=short
      - name: Download all verified SEC lake shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: openap-sec-repair-lake-*
          path: inputs/sec
          run-id: ${{ inputs.sec_artifact_run_id }}
          repository: trading-optimizer-lab-org/aurora
          github-token: ${{ github.token }}
      - name: Trace every realestate coverage gate
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import pandas as pd

          from aurora.core.runtime_paths import base_data_dir
          from aurora.research.openap_181.sec_companyfacts_149 import (
              diagnose_companyfacts_realestate_coverage,
          )

          sec_root = Path("inputs/sec")
          facts_paths = sorted(sec_root.rglob("sec_companyfacts_*.parquet"))
          submission_paths = sorted(sec_root.rglob("sec_submissions_*.parquet"))
          status_paths = sorted(sec_root.rglob("sec_status_*.csv"))
          summary_paths = sorted(sec_root.rglob("sec_summary_*.json"))
          counts = {
              "companyfacts": len(facts_paths),
              "submissions": len(submission_paths),
              "status": len(status_paths),
              "summary": len(summary_paths),
          }
          if set(counts.values()) != {48}:
              raise RuntimeError(f"Expected 48 complete SEC shards, found {counts}")

          companyfacts = pd.concat(
              [pd.read_parquet(path) for path in facts_paths], ignore_index=True
          )
          submissions = pd.concat(
              [pd.read_parquet(path) for path in submission_paths], ignore_index=True
          )
          status = pd.concat(
              [pd.read_csv(path) for path in status_paths], ignore_index=True
          )
          retrieved_at = max(
              pd.Timestamp(json.loads(path.read_text(encoding="utf-8"))["retrieved_at"])
              for path in summary_paths
          ).isoformat()

          report = diagnose_companyfacts_realestate_coverage(
              companyfacts,
              submissions,
              status,
              formation_at="2026-08-09",
              retrieved_at=retrieved_at,
          )
          report.update(
              {
                  "source_sha": os.environ["SOURCE_SHA"],
                  "source_run_id": os.environ["SEC_ARTIFACT_RUN_ID"],
                  "source_file_counts": counts,
                  "formation_at": pd.Timestamp(
                      "2026-08-09", tz="UTC"
                  ).isoformat(),
                  "retrieved_at": retrieved_at,
                  "official_formula_url": (
                      "https://raw.githubusercontent.com/OpenSourceAP/CrossSection/"
                      "8db892442c2c3a3779b0f1eac4370d3655be15a1/Signals/"
                      "pyCode/Predictors/realestate.py"
                  ),
                  "locked_opened": False,
                  "forward_opened": False,
                  "validation_used_for_selection": False,
                  "strict_score_eligible": False,
                  "cost_eur": 0,
              }
          )
          output = base_data_dir() / "openap_149_realestate_diagnostic"
          output.mkdir(parents=True, exist_ok=True)
          (output / "openap_149_realestate_diagnostic.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report["stage_counts"], indent=2, sort_keys=True))
          print(json.dumps(report["concept_cik_counts"], indent=2, sort_keys=True))
          PY
      - name: Upload bounded diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openap-149-realestate-diagnostic
          path: outputs/openap_149_realestate_diagnostic/
          if-no-files-found: error
          retention-days: 90
