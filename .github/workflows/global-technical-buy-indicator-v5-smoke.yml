name: Global Technical Buy Indicator V5 Event First Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gtbi-github-only-external-pack-72000
    paths:
      - ".github/workflows/global-technical-buy-indicator-v5-smoke.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gtbi-v5-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_RUN_ID: "27936694743"
  DATA_ARTIFACT_NAME: free-global-yahoo-daily-data-lake
  EXTERNAL_STRATEGY_PACK_PATH: scripts/strategy_packs/gtbi_research_broad_72000
  CANDIDATE_COUNT_PER_JOB: "1"
  CANDIDATE_TIMEOUT_SECONDS: "7200"
  JOB_WALL_CLOCK_SECONDS: "7200"
  OPTIMIZED_EVALUATION_MODE: optimized_evaluation_v1
  MIN_MARKET_CAP: "2000000000"
  TRAIN_END: "2020-12-31"
  VALIDATION_START: "2021-01-01"
  VALIDATION_END: "2026-06-30"
  LOCKED_START: "2100-01-01"
  TEST_MAX_JOBS: "2"
  TEST_MAX_SIGNAL_GROUPS: "2"

jobs:
  build_external_pack:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      GTBI_BUILD_PACK_VERBOSE: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download data lake artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.DATA_RUN_ID }}
          name: ${{ env.DATA_ARTIFACT_NAME }}
          path: ${{ env.QF_DATA_DIR }}/prices/free_us_daily
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize data lake layout and ensure SPY benchmark exists
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import pandas as pd

          root = Path(os.environ["QF_DATA_DIR"]) / "prices" / "free_us_daily"
          normalized = root / "normalized"
          if not normalized.exists():
              nested = [path.parent for path in root.rglob("normalized/*.parquet")]
              if nested:
                  actual_root = nested[0].parent
                  for child in actual_root.iterdir():
                      target = root / child.name
                      if child.resolve() == target.resolve():
                          continue
                      if target.exists():
                          continue
                      shutil.move(str(child), str(target))
          candidates = [
              root / "normalized" / "SPY.parquet",
              root / "raw" / "yfinance" / "SPY.parquet",
              *root.rglob("SPY.parquet"),
          ]
          out_dir = root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / "SPY.parquet"
          if out_path.exists():
              raise SystemExit(0)
          for src in candidates:
              if src.exists():
                  shutil.copy2(src, out_path)
                  raise SystemExit(0)
          import json
          from urllib.request import Request, urlopen
          locked = pd.Timestamp(os.environ["LOCKED_START"])
          period1 = int(pd.Timestamp("1990-01-01", tz="UTC").timestamp())
          period2 = int(locked.tz_localize("UTC").timestamp()) if locked.tzinfo is None else int(locked.timestamp())
          url = (
              "https://query1.finance.yahoo.com/v8/finance/chart/SPY"
              f"?period1={period1}&period2={period2}&interval=1d&events=div%2Csplits"
          )
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          result = (payload.get("chart", {}).get("result") or [None])[0]
          if not result:
              raise FileNotFoundError("SPY benchmark unavailable from Yahoo chart API")
          timestamps = result.get("timestamp") or []
          quote = (result.get("indicators", {}).get("quote") or [{}])[0]
          adj = (result.get("indicators", {}).get("adjclose") or [{}])[0].get("adjclose")
          spy = pd.DataFrame(
              {
                  "date": pd.to_datetime(timestamps, unit="s", utc=True).tz_convert(None).normalize(),
                  "open": quote.get("open", []),
                  "high": quote.get("high", []),
                  "low": quote.get("low", []),
                  "close": quote.get("close", []),
                  "adj_close": adj if adj is not None else quote.get("close", []),
                  "volume": quote.get("volume", []),
              }
          )
          spy["date"] = pd.to_datetime(spy["date"], errors="coerce")
          spy = spy.dropna(subset=["date"])
          spy = spy[spy["date"] < pd.Timestamp(os.environ["LOCKED_START"])]
          spy["symbol"] = "SPY"
          keep = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          missing = [column for column in keep if column not in spy.columns]
          if missing or spy.empty:
              found = "\n".join(str(path) for path in list(root.rglob("*.parquet"))[:20])
              raise FileNotFoundError(f"SPY benchmark unavailable; missing={missing}. First parquet files:\n{found}")
          spy[keep].to_parquet(out_path, index=False)
          PY
      - name: Build reusable external pack data
        run: |
          python scripts/build_global_technical_buy_indicator_pack.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir external-pack-data-root \
            --stage-count 1 \
            --group-count 1 \
            --locked-start "$LOCKED_START" \
            --min-market-cap "$MIN_MARKET_CAP"
          cp -R external-pack-data-root/stage-000 external-pack-data
      - name: Upload reusable pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
          retention-days: 14

  plan_smoke:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_jobs: ${{ steps.plan.outputs.total_jobs }}
      total_strategies: ${{ steps.plan.outputs.total_strategies }}
      candidate_limit: ${{ steps.plan.outputs.candidate_limit }}
    steps:
      - name: Build smoke matrix
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          original_strategies_per_shard = 200
          candidate_limit = max(int(os.environ["CANDIDATE_COUNT_PER_JOB"]), 1)
          chunks_per_shard = (original_strategies_per_shard + candidate_limit - 1) // candidate_limit
          requested_job_indices = [28074, 47423]
          total_jobs = len(requested_job_indices)
          total_strategies = total_jobs * candidate_limit
          rows = []
          for artifact_job_index, logical_job_index in enumerate(requested_job_indices):
              base_shard_id = logical_job_index // chunks_per_shard
              chunk_index = logical_job_index % chunks_per_shard
              strategy_offset = chunk_index * candidate_limit
              strategy_limit = min(candidate_limit, original_strategies_per_shard - strategy_offset)
              rows.append({
                  "job_index": artifact_job_index,
                  "logical_job_index": logical_job_index,
                  "job_padded": f"{artifact_job_index:04d}",
                  "base_shard_id": base_shard_id,
                  "base_shard_padded": f"{base_shard_id:03d}",
                  "chunk_index": chunk_index,
                  "strategy_offset": strategy_offset,
                  "strategy_limit": strategy_limit,
              })
          print(f"matrix={json.dumps({'include': rows}, separators=(',', ':'))}")
          print(f"total_jobs={total_jobs}")
          print(f"total_strategies={total_strategies}")
          print(f"candidate_limit={candidate_limit}")
          PY

  smoke_test:
    needs:
      - build_external_pack
      - plan_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix: ${{ fromJson(needs.plan_smoke.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download reusable pack data
        uses: actions/download-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
      - name: Run smoke strategy job
        run: |
          OPT_ARGS=(--enable-feature-cache --no-enable-dedupe --no-enable-safe-prefilter --no-enable-early-stopping --no-enable-cost-scheduling)
          RUN_ARGS=(
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily"
            --prebuilt-pack-dir external-pack-data
            --external-strategy-pack-path "$EXTERNAL_STRATEGY_PACK_PATH"
            --external-strategy-shard-id "${{ matrix.base_shard_id }}"
            --external-strategy-offset "${{ matrix.strategy_offset }}"
            --external-strategy-limit "${{ matrix.strategy_limit }}"
            --candidate-timeout-seconds "$CANDIDATE_TIMEOUT_SECONDS"
            --job-wall-clock-seconds "$JOB_WALL_CLOCK_SECONDS"
            --schedule-active-jobs "${{ needs.plan_smoke.outputs.total_jobs }}"
            --test-max-signal-groups "$TEST_MAX_SIGNAL_GROUPS"
            --optimized-evaluation-mode "$OPTIMIZED_EVALUATION_MODE"
            "${OPT_ARGS[@]}"
            --external-strategy-format jsonl
            --min-market-cap "$MIN_MARKET_CAP"
            --locked-start "$LOCKED_START"
            --train-end "$TRAIN_END"
            --validation-start "$VALIDATION_START"
            --validation-end "$VALIDATION_END"
          )
          python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --output-dir "outputs/job-${{ matrix.job_padded }}" &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            echo "[gtbi-locked-heartbeat] job=${{ matrix.job_padded }} logical=${{ matrix.logical_job_index }} still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60
          done
          wait "$pid"
          rm -rf "outputs/job-${{ matrix.job_padded }}/_external_pack_data"
      - name: Upload smoke job artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-job-${{ matrix.job_padded }}
          path: outputs/job-${{ matrix.job_padded }}
          retention-days: 14

  merge_smoke_block:
    needs:
      - plan_smoke
      - smoke_test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download smoke job artifacts
        run: |
          mkdir -p downloaded-jobs
          for ((job_index=0; job_index<${{ needs.plan_smoke.outputs.total_jobs }}; job_index++)); do
            job_padded=$(printf "%04d" "$job_index")
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "gtbi-external-pack-job-$job_padded" \
              --dir "downloaded-jobs/gtbi-external-pack-job-$job_padded"
          done
      - name: Merge smoke block outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-jobs \
            --output-dir block-results \
            --total-strategies-requested "${{ needs.plan_smoke.outputs.total_strategies }}" \
            --total-shards-requested "360" \
            --total-jobs-requested "${{ needs.plan_smoke.outputs.total_jobs }}" \
            --candidate-count-per-job "${{ needs.plan_smoke.outputs.candidate_limit }}" \
            --locked-start "$LOCKED_START" \
            --train-end "$TRAIN_END" \
            --validation-start "$VALIDATION_START" \
            --validation-end "$VALIDATION_END"
      - name: Upload smoke block artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-smoke-results
          path: block-results
          retention-days: 14

  merge_smoke:
    needs:
      - plan_smoke
      - merge_smoke_block
    if: ${{ success() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download smoke block artifact
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "gtbi-external-pack-smoke-results" \
            --dir downloaded-blocks
      - name: Merge smoke final outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-blocks \
            --output-dir final-results \
            --total-strategies-requested "${{ needs.plan_smoke.outputs.total_strategies }}" \
            --total-shards-requested "360" \
            --total-jobs-requested "${{ needs.plan_smoke.outputs.total_jobs }}" \
            --candidate-count-per-job "${{ needs.plan_smoke.outputs.candidate_limit }}" \
            --locked-start "$LOCKED_START" \
            --train-end "$TRAIN_END" \
            --validation-start "$VALIDATION_START" \
            --validation-end "$VALIDATION_END"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          retention-days: 30
