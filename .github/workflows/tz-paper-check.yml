name: "TradeZero paper keys check"

# scripts/tz_paper_check.py: read-only check that the paper keys reach the paper account. Prints counts and
# yes/no facts only; places, cancels and accepts nothing.
# run: 1
on:
  workflow_dispatch:
  push:
    branches: [tz-paper-bot]
    paths:
      - .github/workflows/tz-paper-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TZ_PAPER_KEY_ID: ${{ secrets.TZ_PAPER_KEY_ID }}
      TZ_PAPER_SECRET_KEY: ${{ secrets.TZ_PAPER_SECRET_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/tz_paper_check.py
