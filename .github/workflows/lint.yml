name: lint
permissions:
  contents: read

on: [push, pull_request]

# R18 + R59. Local `ruff check .` and `pre-commit run --all-files` are
# both clean today. Make the same checks blocking in CI.
jobs:
  ruff-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --output-format=github

  ruff-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: |
          ruff check --output-format=github \
            agents/auditor/llm_augmenter.py \
            core/snapshots_distributed.py \
            exports/lean/live.py \
            research/rag.py \
            research/auto_loop/ \
            tests/test_property_v2.py \
            tests/test_protocol_fuzz.py \
            tests/test_llm_augmenter.py \
            tests/test_rag.py \
            tests/test_auto_loop.py \
            tests/test_snapshots_distributed.py \
            tests/test_lean_live.py

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
