name: lint
permissions:
  contents: read

on: [push, pull_request]

# R18 + R59. Local `ruff check .` and `pre-commit run --all-files` are
# both clean today. Make the same checks blocking in CI.
jobs:
  ruff-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.12
      - run: ruff check . --output-format=github

  ruff-strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.12
      - run: |
          ruff check --output-format=github \
            agents/auditor/llm_augmenter.py \
            core/snapshots_distributed.py \
            exports/lean/live.py \
            research/rag.py \
            research/auto_loop/ \
            tests/test_property_v2.py \
            tests/test_protocol_fuzz.py \
            tests/test_llm_augmenter.py \
            tests/test_rag.py \
            tests/test_auto_loop.py \
            tests/test_snapshots_distributed.py \
            tests/test_lean_live.py

  precommit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install pre-commit==4.6.0
      - run: pre-commit run --all-files
