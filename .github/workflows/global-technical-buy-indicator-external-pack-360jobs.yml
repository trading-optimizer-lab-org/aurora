name: Global Technical Buy Indicator External Pack 360 Jobs

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      external_strategy_pack_path:
        description: "Repo path containing the external strategy pack"
        required: true
        default: "scripts/strategy_packs/gtbi_research_broad_72000"
      candidate_count_per_shard:
        description: "Strategies evaluated per shard"
        required: true
        default: "200"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from all packs"
        required: true
        default: "2021-01-01"
      fail_on_unsupported:
        description: "Fail shard when an external rule cannot be mapped"
        required: true
        default: "false"
      test_mode:
        description: "Run at most test_max_shards and 5 strategies per shard"
        required: true
        default: "false"
      test_max_shards:
        description: "Maximum shards in test_mode, capped at 10"
        required: true
        default: "10"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_extra: ${{ steps.plan.outputs.matrix_extra }}
      total_strategies_requested: ${{ steps.plan.outputs.total_strategies_requested }}
      total_shards_requested: ${{ steps.plan.outputs.total_shards_requested }}
      candidate_limit: ${{ steps.plan.outputs.candidate_limit }}
    steps:
      - id: plan
        name: Build 360-shard matrix
        run: |
          python - <<'PY'
          import json
          import os

          test_mode = "${{ inputs.test_mode }}".strip().lower() == "true"
          requested_limit = max(int("${{ inputs.candidate_count_per_shard }}"), 1)
          if test_mode:
              shard_count = min(max(int("${{ inputs.test_max_shards }}"), 1), 10)
              candidate_limit = min(requested_limit, 5)
          else:
              shard_count = 360
              candidate_limit = requested_limit
          rows = [
              {"shard": shard, "shard_padded": f"{shard:03d}", "candidate_limit": candidate_limit}
              for shard in range(shard_count)
          ]
          primary_rows = rows[:180]
          extra_rows = rows[180:]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix={json.dumps({'include': primary_rows}, separators=(',', ':'))}\n")
              handle.write(f"matrix_extra={json.dumps({'include': extra_rows}, separators=(',', ':'))}\n")
              handle.write(f"total_strategies_requested={shard_count * candidate_limit}\n")
              handle.write(f"total_shards_requested={shard_count}\n")
              handle.write(f"candidate_limit={candidate_limit}\n")
          PY

  build_external_pack:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download clean global data lake once
        run: |
          mkdir -p "$QF_DATA_DIR/prices/free_us_daily"
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ inputs.data_run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${{ inputs.data_artifact_name }}" \
              --dir "$QF_DATA_DIR/prices/free_us_daily"; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Ensure SPY benchmark exists
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          data_root = Path(os.environ["QF_DATA_DIR"]) / "prices" / "free_us_daily"
          out_dir = data_root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / "SPY.parquet"
          if out_path.exists():
              existing = pd.read_parquet(out_path)
              if not existing.empty:
                  print(json.dumps({"symbol": "SPY", "rows": int(len(existing)), "path": str(out_path), "cached": True}, indent=2, sort_keys=True))
                  raise SystemExit(0)
          frame = pd.DataFrame()
          last_error = None
          for attempt in range(1, 6):
              try:
                  frame = yf.download("SPY", period="max", interval="1d", auto_adjust=False, actions=True, progress=False, threads=False)
                  if not frame.empty:
                      break
              except Exception as exc:
                  last_error = exc
              time.sleep(attempt * 10)
          if frame.empty:
              if last_error is not None:
                  print(f"last SPY benchmark error: {last_error!r}")
              raise SystemExit("SPY benchmark download returned no rows")
          if isinstance(frame.columns, pd.MultiIndex):
              frame.columns = [str(col[0]).strip().lower().replace(" ", "_") for col in frame.columns]
          else:
              frame.columns = [str(col).strip().lower().replace(" ", "_") for col in frame.columns]
          frame = frame.reset_index()
          if "date" not in frame.columns:
              frame = frame.rename(columns={frame.columns[0]: "date"})
          if "adj_close" not in frame.columns:
              frame["adj_close"] = frame["close"]
          if "volume" not in frame.columns:
              frame["volume"] = 0
          frame["date"] = pd.to_datetime(frame["date"], errors="coerce", utc=True).dt.tz_convert(None)
          frame = frame.dropna(subset=["date", "open", "high", "low", "close"]).sort_values("date")
          frame["symbol"] = "SPY"
          cols = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          frame[cols].to_parquet(out_path, index=False)
          print(json.dumps({"symbol": "SPY", "rows": int(len(frame)), "path": str(out_path)}, indent=2, sort_keys=True))
          PY
      - name: Build reusable external pack data
        run: |
          python scripts/build_global_technical_buy_indicator_pack.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir "$QF_DATA_DIR/runs/global_technical_buy_indicator_external_pack/pack" \
            --stage-count 1 \
            --group-count 1 \
            --locked-start "${{ inputs.locked_start }}" \
            --min-rows 260 \
            --min-market-cap "${{ inputs.min_market_cap }}"
      - name: Upload reusable external pack data
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: ${{ env.QF_DATA_DIR }}/runs/global_technical_buy_indicator_external_pack/pack/stage-000
          if-no-files-found: error
          retention-days: 3

  run_shard:
    needs: [plan, build_external_pack]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download reusable external pack data
        uses: actions/download-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
      - name: Run external strategy shard
        run: |
          FAIL_FLAG="--no-external-strategy-fail-on-unsupported"
          if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
            FAIL_FLAG="--external-strategy-fail-on-unsupported"
          fi
          python scripts/run_global_technical_buy_indicator_external_pack_shard.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --prebuilt-pack-dir external-pack-data \
            --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}" \
            --external-strategy-shard-id "${{ matrix.shard }}" \
            --external-strategy-limit "${{ matrix.candidate_limit }}" \
            --external-strategy-format jsonl \
            "$FAIL_FLAG" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --output-dir "outputs/shard-${{ matrix.shard_padded }}"
          rm -rf "outputs/shard-${{ matrix.shard_padded }}/_external_pack_data"
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-shard-${{ matrix.shard_padded }}
          path: outputs/shard-${{ matrix.shard_padded }}
          if-no-files-found: error
          retention-days: 7

  run_shard_extra:
    needs: [plan, build_external_pack]
    if: ${{ inputs.test_mode != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.plan.outputs.matrix_extra) }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download reusable external pack data
        uses: actions/download-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
      - name: Run external strategy shard
        run: |
          FAIL_FLAG="--no-external-strategy-fail-on-unsupported"
          if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
            FAIL_FLAG="--external-strategy-fail-on-unsupported"
          fi
          python scripts/run_global_technical_buy_indicator_external_pack_shard.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --prebuilt-pack-dir external-pack-data \
            --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}" \
            --external-strategy-shard-id "${{ matrix.shard }}" \
            --external-strategy-limit "${{ matrix.candidate_limit }}" \
            --external-strategy-format jsonl \
            "$FAIL_FLAG" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --output-dir "outputs/shard-${{ matrix.shard_padded }}"
          rm -rf "outputs/shard-${{ matrix.shard_padded }}/_external_pack_data"
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-shard-${{ matrix.shard_padded }}
          path: outputs/shard-${{ matrix.shard_padded }}
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [plan, run_shard, run_shard_extra]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gtbi-external-pack-shard-*
          path: downloaded-shards
      - name: Merge shard results
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-shards \
            --output-dir final-results \
            --total-strategies-requested "${{ needs.plan.outputs.total_strategies_requested }}" \
            --total-shards-requested "${{ needs.plan.outputs.total_shards_requested }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}"
      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          if-no-files-found: error
          retention-days: 14
