name: Global Technical Buy Indicator External Pack 7200 Jobs

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      external_strategy_pack_path:
        description: "Repo path containing the external strategy pack"
        required: true
        default: "scripts/strategy_packs/gtbi_long_hold_fundamental_timing_v1"
      candidate_count_per_job:
        description: "Strategies evaluated per logical job"
        required: true
        default: "10"
      candidate_timeout_seconds:
        description: "Maximum seconds allowed per individual strategy candidate"
        required: true
        default: "300"
      job_wall_clock_seconds:
        description: "Soft per-logical-job wall-clock budget inside the Python evaluator"
        required: true
        default: "300"
      optimized_evaluation_mode:
        description: "Evaluation engine mode"
        required: true
        default: "optimized_evaluation_v5_event_first"
      enable_feature_cache:
        description: "Enable per-job FeatureStore cache"
        required: true
        default: "true"
      enable_dedupe:
        description: "Enable canonical-rule dedupe inside each job"
        required: true
        default: "true"
      enable_safe_prefilter:
        description: "Enable mathematically safe raw-signal prefilter"
        required: true
        default: "true"
      enable_early_stopping:
        description: "Enable safe early stopping checks"
        required: true
        default: "true"
      enable_cost_scheduling:
        description: "Enable cost diagnostics and scheduling manifest"
        required: true
        default: "true"
      test_max_signal_groups:
        description: "Maximum signal groups in test_mode for signal-first evaluation"
        required: true
        default: "1000"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from all packs"
        required: true
        default: "2021-01-01"
      fail_on_unsupported:
        description: "Fail job when an external rule cannot be mapped"
        required: true
        default: "false"
      recovery_job_indices:
        description: "Optional comma-separated absolute logical job indices to run"
        required: false
        default: ""
      job_start_index:
        description: "First logical job index for sliced full runs"
        required: true
        default: "0"
      job_count:
        description: "Number of logical jobs to run; 0 means all remaining jobs"
        required: true
        default: "0"
      logical_jobs_per_block:
        description: "Logical jobs executed inside each GitHub matrix job"
        required: true
        default: "30"
      test_mode:
        description: "Run only test_max_jobs logical jobs"
        required: true
        default: "false"
      test_max_jobs:
        description: "Maximum logical jobs in test_mode"
        required: true
        default: "20"

permissions:
  contents: read
  actions: write

jobs:
  orchestrate_longhold_72k:
    if: ${{ inputs.optimized_evaluation_mode == 'orchestrate_longhold_72k' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GitHub-only long-hold orchestrator
        run: |
          python scripts/orchestrate_gtbi_longhold_72k.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --workflow "global-technical-buy-indicator-external-pack-360jobs.yml" \
            --loop-minutes 300 \
            --sleep-seconds 300 \
            --run-list-limit 1000 \
            --inspect-workers 32 \
            --max-parallel-logical-jobs 360 \
            --max-new-waves-per-pass 2 \
            --recovery-timeout-seconds 1800 \
            --recovery-wall-clock-seconds 2100 \
            --validated-sha "1b866eef09b44ea21ff67038901aa620330ecd0f,9458f22ee8c49eb18693bc62dbc4e0093bd2b477,cf78ebf6e975ae41eced6b0964a7336abd12cda5,000e7b35b020615baa0cc724fac67e3436174adf,aa59907d1bd7fe80846b9b3f31d99259e2fa1568,619dc3c3fe96499e1040bab225efaf2035bc953e,40d7e6e68af25619a889fd587a5b9a1407bd93eb,99908c9793223a8e18d4ea1fbbad4e2e5fd227ca,${{ github.sha }}" \
            --self-dispatch
      - name: Upload recovery manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-longhold-orchestrator-recovery-manifests
          path: recovery-manifests
          if-no-files-found: ignore
          retention-days: 30

  build_external_pack:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      GTBI_BUILD_PACK_VERBOSE: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Try reusable external pack data from previous GitHub run
        id: reuse_pack
        run: |
          set -euo pipefail
          echo "reused=false" >> "$GITHUB_OUTPUT"
          mkdir -p external-pack-data
          run_ids="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "global-technical-buy-indicator-external-pack-360jobs.yml" \
            --branch "${{ github.ref_name }}" \
            --limit 100 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status=="completed" and .conclusion=="success") | .databaseId')"
          for run_id in $run_ids; do
            if [ "$run_id" = "${{ github.run_id }}" ]; then
              continue
            fi
            artifact_name="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[]? | select(.name=="gtbi-external-pack-data" and .expired==false) | .name' | head -n 1)"
            if [ "$artifact_name" = "gtbi-external-pack-data" ]; then
              echo "Reusing gtbi-external-pack-data from run $run_id"
              rm -rf external-pack-data
              mkdir -p external-pack-data
              for attempt in 1 2 3 4; do
                if gh run download "$run_id" \
                  --repo "${{ github.repository }}" \
                  --name "gtbi-external-pack-data" \
                  --dir external-pack-data; then
                  echo "reused=true" >> "$GITHUB_OUTPUT"
                  echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                sleep $((attempt * 20))
              done
            fi
          done
      - name: Download data lake artifact
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.data_run_id }}
          name: ${{ inputs.data_artifact_name }}
          path: ${{ env.QF_DATA_DIR }}/prices/free_us_daily
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize data lake layout and ensure SPY benchmark exists
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import pandas as pd

          root = Path("${{ env.QF_DATA_DIR }}/prices/free_us_daily")
          normalized = root / "normalized"
          if not normalized.exists():
              nested = [path.parent for path in root.rglob("normalized/*.parquet")]
              if nested:
                  actual_root = nested[0].parent
                  for child in actual_root.iterdir():
                      target = root / child.name
                      if child.resolve() == target.resolve():
                          continue
                      if target.exists():
                          continue
                      shutil.move(str(child), str(target))
          candidates = [
              root / "normalized" / "SPY.parquet",
              root / "raw" / "yfinance" / "SPY.parquet",
              *root.rglob("SPY.parquet"),
          ]
          out_dir = root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / "SPY.parquet"
          if out_path.exists():
              raise SystemExit(0)
          for src in candidates:
              if src.exists():
                  shutil.copy2(src, out_path)
                  raise SystemExit(0)
          import json
          from urllib.request import Request, urlopen
          locked = pd.Timestamp("${{ inputs.locked_start }}")
          period1 = int(pd.Timestamp("1990-01-01", tz="UTC").timestamp())
          period2 = int(locked.tz_localize("UTC").timestamp()) if locked.tzinfo is None else int(locked.timestamp())
          url = (
              "https://query1.finance.yahoo.com/v8/finance/chart/SPY"
              f"?period1={period1}&period2={period2}&interval=1d&events=div%2Csplits"
          )
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          result = (payload.get("chart", {}).get("result") or [None])[0]
          if not result:
              raise FileNotFoundError("SPY benchmark unavailable from Yahoo chart API")
          timestamps = result.get("timestamp") or []
          quote = (result.get("indicators", {}).get("quote") or [{}])[0]
          adj = (result.get("indicators", {}).get("adjclose") or [{}])[0].get("adjclose")
          spy = pd.DataFrame(
              {
                  "date": pd.to_datetime(timestamps, unit="s", utc=True).tz_convert(None).normalize(),
                  "open": quote.get("open", []),
                  "high": quote.get("high", []),
                  "low": quote.get("low", []),
                  "close": quote.get("close", []),
                  "adj_close": adj if adj is not None else quote.get("close", []),
                  "volume": quote.get("volume", []),
              }
          )
          spy["date"] = pd.to_datetime(spy["date"], errors="coerce")
          spy = spy.dropna(subset=["date"])
          spy = spy[spy["date"] < pd.Timestamp("${{ inputs.locked_start }}")]
          spy["symbol"] = "SPY"
          keep = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          missing = [column for column in keep if column not in spy.columns]
          if missing or spy.empty:
              found = "\n".join(str(path) for path in list(root.rglob("*.parquet"))[:20])
              raise FileNotFoundError(f"SPY benchmark unavailable; missing={missing}. First parquet files:\n{found}")
          spy[keep].to_parquet(out_path, index=False)
          PY
      - name: Build reusable external pack data
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        run: |
          python scripts/build_global_technical_buy_indicator_pack.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir external-pack-data-root \
            --stage-count 1 \
            --group-count 1 \
            --locked-start "${{ inputs.locked_start }}" \
            --min-market-cap "${{ inputs.min_market_cap }}"
          cp -R external-pack-data-root/stage-000 external-pack-data
      - name: Upload reusable pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
          retention-days: 14

  plan_blocks:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_jobs: ${{ steps.plan.outputs.total_jobs }}
      total_strategies: ${{ steps.plan.outputs.total_strategies }}
      candidate_limit: ${{ steps.plan.outputs.candidate_limit }}
      block_count: ${{ steps.plan.outputs.block_count }}
    steps:
      - name: Build block matrix
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          import os

          original_shards = 360
          original_strategies_per_shard = 200
          candidate_limit = max(int("${{ inputs.candidate_count_per_job }}"), 1)
          chunks_per_shard = math.ceil(original_strategies_per_shard / candidate_limit)
          max_logical_jobs = original_shards * chunks_per_shard

          raw_recovery = "${{ inputs.recovery_job_indices }}".strip()
          if raw_recovery:
              logical_jobs = []
              for item in raw_recovery.split(","):
                  item = item.strip()
                  if not item:
                      continue
                  job_index = int(item)
                  if job_index < 0 or job_index >= max_logical_jobs:
                      raise SystemExit(f"invalid recovery job index {job_index}; expected 0..{max_logical_jobs - 1}")
                  logical_jobs.append(job_index)
              logical_jobs = sorted(dict.fromkeys(logical_jobs))
          else:
              total = max_logical_jobs
              if "${{ inputs.test_mode }}" == "true":
                  total = min(max(int("${{ inputs.test_max_jobs }}"), 1), total)
                  logical_jobs = list(range(total))
              else:
                  start_index = max(int("${{ inputs.job_start_index }}"), 0)
                  requested_count = int("${{ inputs.job_count }}")
                  if start_index >= max_logical_jobs:
                      logical_jobs = []
                  else:
                      if requested_count <= 0:
                          end_index = max_logical_jobs
                      else:
                          end_index = min(start_index + requested_count, max_logical_jobs)
                      logical_jobs = list(range(start_index, end_index))

          logical_jobs_per_block = max(int("${{ inputs.logical_jobs_per_block }}"), 1)
          if "${{ inputs.test_mode }}" == "true":
              logical_jobs_per_block = 1
          rows = []
          total_strategies = 0
          for block_index, start in enumerate(range(0, len(logical_jobs), logical_jobs_per_block)):
              block_jobs = logical_jobs[start : start + logical_jobs_per_block]
              if not block_jobs:
                  continue
              for job_index in block_jobs:
                  chunk_index = job_index % chunks_per_shard
                  strategy_offset = chunk_index * candidate_limit
                  total_strategies += max(min(candidate_limit, original_strategies_per_shard - strategy_offset), 0)
              rows.append(
                  {
                      "block_index": block_index,
                      "block_padded": f"{block_index:03d}",
                      "job_indices_csv": ",".join(str(value) for value in block_jobs),
                      "logical_jobs": len(block_jobs),
                  }
              )

          if not rows:
              raise SystemExit("block matrix is empty")
          if len(rows) > 256:
              raise SystemExit(f"too many GitHub matrix blocks: {len(rows)} > 256")
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"total_jobs={len(logical_jobs)}")
          print(f"total_strategies={total_strategies}")
          print(f"candidate_limit={candidate_limit}")
          print(f"block_count={len(rows)}")
          PY

  run_block:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' }}
    needs:
      - build_external_pack
      - plan_blocks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 360
      matrix: ${{ fromJson(needs.plan_blocks.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download reusable pack data
        uses: actions/download-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
      - name: Run logical jobs in this block
        env:
          JOB_INDICES_CSV: ${{ matrix.job_indices_csv }}
          SCHEDULE_ACTIVE_JOBS: "360"
          CANDIDATE_LIMIT: ${{ needs.plan_blocks.outputs.candidate_limit }}
        run: |
          set -euo pipefail
          IFS=',' read -ra JOBS <<< "$JOB_INDICES_CSV"
          original_strategies_per_shard=200
          chunks_per_shard=$(( (original_strategies_per_shard + CANDIDATE_LIMIT - 1) / CANDIDATE_LIMIT ))
          schedule_active_jobs="$SCHEDULE_ACTIVE_JOBS"
          signal_group_limit=0
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            signal_group_limit="${{ inputs.test_max_signal_groups }}"
          fi
          PARTITION_ARGS=()
          if [ -n "${{ inputs.recovery_job_indices }}" ] && [ "${{ inputs.job_count }}" -gt 1 ]; then
            if [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first_symbol_bucket" ]; then
              PARTITION_ARGS=(
                --symbol-bucket-index "${{ inputs.job_start_index }}"
                --symbol-bucket-count "${{ inputs.job_count }}"
              )
            else
              PARTITION_ARGS=(
                --schedule-subgroup-index "${{ inputs.job_start_index }}"
                --schedule-subgroup-count "${{ inputs.job_count }}"
              )
            fi
          fi

          for job_index in "${JOBS[@]}"; do
            base_shard_id=$(( job_index / chunks_per_shard ))
            chunk_index=$(( job_index % chunks_per_shard ))
            strategy_offset=$(( chunk_index * CANDIDATE_LIMIT ))
            remaining=$(( original_strategies_per_shard - strategy_offset ))
            strategy_limit="$CANDIDATE_LIMIT"
            if [ "$remaining" -lt "$strategy_limit" ]; then
              strategy_limit="$remaining"
            fi
            if [ "$strategy_limit" -le 0 ]; then
              continue
            fi
            job_padded=$(printf "%04d" "$job_index")
            echo "::group::logical job $job_padded shard=$base_shard_id offset=$strategy_offset limit=$strategy_limit"

            FAIL_ARGS=()
            OPT_ARGS=()
            if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
              FAIL_ARGS=(--external-strategy-fail-on-unsupported)
            fi
            if [ "${{ inputs.enable_feature_cache }}" = "true" ]; then OPT_ARGS+=(--enable-feature-cache); else OPT_ARGS+=(--no-enable-feature-cache); fi
            if [ "${{ inputs.enable_dedupe }}" = "true" ]; then OPT_ARGS+=(--enable-dedupe); else OPT_ARGS+=(--no-enable-dedupe); fi
            if [ "${{ inputs.enable_safe_prefilter }}" = "true" ]; then OPT_ARGS+=(--enable-safe-prefilter); else OPT_ARGS+=(--no-enable-safe-prefilter); fi
            if [ "${{ inputs.enable_early_stopping }}" = "true" ]; then OPT_ARGS+=(--enable-early-stopping); else OPT_ARGS+=(--no-enable-early-stopping); fi
            if [ "${{ inputs.enable_cost_scheduling }}" = "true" ]; then OPT_ARGS+=(--enable-cost-scheduling); else OPT_ARGS+=(--no-enable-cost-scheduling); fi

            RUN_ARGS=(
              --data-lake-root "$QF_DATA_DIR/prices/free_us_daily"
              --prebuilt-pack-dir external-pack-data
              --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}"
              --external-strategy-shard-id "$base_shard_id"
              --external-strategy-offset "$strategy_offset"
              --external-strategy-limit "$strategy_limit"
              --candidate-timeout-seconds "${{ inputs.candidate_timeout_seconds }}"
              --job-wall-clock-seconds "${{ inputs.job_wall_clock_seconds }}"
              --schedule-active-jobs "$schedule_active_jobs"
              "${PARTITION_ARGS[@]}"
              --test-max-signal-groups "$signal_group_limit"
              --optimized-evaluation-mode "${{ inputs.optimized_evaluation_mode }}"
              "${OPT_ARGS[@]}"
              --external-strategy-format jsonl
              "${FAIL_ARGS[@]}"
              --min-market-cap "${{ inputs.min_market_cap }}"
              --locked-start "${{ inputs.locked_start }}"
              --train-end "${{ inputs.train_end }}"
              --validation-start "${{ inputs.validation_start }}"
              --validation-end "${{ inputs.validation_end }}"
            )

            if [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v3_signal_first" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v4_zero_timeout" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first_symbol_bucket" ]; then
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --signal-first-phase signals --output-dir "signals/job-$job_padded"
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --signal-first-phase exits --signal-events-dir "signals/job-$job_padded" --output-dir "outputs/job-$job_padded"
            else
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --output-dir "outputs/job-$job_padded"
            fi
            rm -rf "outputs/job-$job_padded/_external_pack_data"
            echo "::endgroup::"
          done
      - name: Upload block artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-block-${{ matrix.block_padded }}
          path: outputs
          retention-days: 14

  merge_final:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' && always() }}
    needs:
      - plan_blocks
      - run_block
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download block artifacts
        run: |
          set -euo pipefail
          mkdir -p downloaded-blocks
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --pattern "gtbi-external-pack-block-*" \
              --dir downloaded-blocks; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1
      - name: Merge outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-blocks \
            --output-dir final-results \
            --total-strategies-requested "${{ needs.plan_blocks.outputs.total_strategies }}" \
            --total-shards-requested "360" \
            --total-jobs-requested "${{ needs.plan_blocks.outputs.total_jobs }}" \
            --candidate-count-per-job "${{ inputs.candidate_count_per_job }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          retention-days: 30

  merge_cross_run:
    if: ${{ inputs.optimized_evaluation_mode == 'merge_cross_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download source final artifacts
        env:
          SOURCE_RUN_IDS: ${{ inputs.recovery_job_indices }}
          SOURCE_ARTIFACT_NAME: global-technical-buy-indicator-external-pack-72000-results
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_RUN_IDS// }" ]; then
            echo "recovery_job_indices must contain source run ids when optimized_evaluation_mode=merge_cross_run" >&2
            exit 2
          fi
          mkdir -p downloaded-cross-run
          IFS=',' read -ra RUN_IDS <<< "$SOURCE_RUN_IDS"
          for raw_run_id in "${RUN_IDS[@]}"; do
            run_id="$(echo "$raw_run_id" | xargs)"
            if [ -z "$run_id" ]; then
              continue
            fi
            echo "::group::download $run_id"
            for attempt in 1 2 3 4 5; do
              if gh run download "$run_id" \
                --repo "${{ github.repository }}" \
                --name "$SOURCE_ARTIFACT_NAME" \
                --dir "downloaded-cross-run/run-$run_id"; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep $((attempt * 30))
            done
            echo "::endgroup::"
          done
      - name: Merge source run outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-cross-run \
            --output-dir final-results \
            --total-strategies-requested "72000" \
            --total-shards-requested "360" \
            --total-jobs-requested "7200" \
            --candidate-count-per-job "${{ inputs.candidate_count_per_job }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --strict-final-eval-mode
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          retention-days: 30
