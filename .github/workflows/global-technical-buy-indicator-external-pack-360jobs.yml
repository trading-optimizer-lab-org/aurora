name: Global Technical Buy Indicator External Pack and Fast Strict V6
run-name: >-
  GTBI V6=${{ inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' }} mode=${{ inputs.optimized_evaluation_mode }} timeout=${{ inputs.candidate_timeout_seconds }} partition=${{ inputs.job_start_index }}/${{ inputs.job_count }} recovery=${{ inputs.recovery_job_indices != '' }}

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Source run id: immutable GTBI pack for V6, data lake for legacy modes"
        required: true
        default: "29148013009"
      data_artifact_name:
        description: "Source artifact: immutable GTBI pack for V6, data lake for legacy modes"
        required: true
        default: "gtbi-external-pack-data"
      external_strategy_pack_path:
        description: "Repo path containing the external strategy pack"
        required: true
        default: "scripts/strategy_packs/gtbi_long_hold_fundamental_timing_v1"
      candidate_count_per_job:
        description: "Strategies evaluated per logical job"
        required: true
        default: "10"
      candidate_timeout_seconds:
        description: "Maximum seconds allowed per individual strategy candidate"
        required: true
        default: "300"
      job_wall_clock_seconds:
        description: "Soft per-logical-job wall-clock budget inside the Python evaluator"
        required: true
        default: "300"
      optimized_evaluation_mode:
        description: "Evaluation engine mode"
        required: true
        default: "optimized_evaluation_v6_fast_strict"
      enable_feature_cache:
        description: "Enable per-job FeatureStore cache"
        required: true
        default: "true"
      enable_dedupe:
        description: "Enable canonical-rule dedupe inside each job"
        required: true
        default: "true"
      enable_safe_prefilter:
        description: "Enable mathematically safe raw-signal prefilter"
        required: true
        default: "true"
      enable_early_stopping:
        description: "Enable safe early stopping checks"
        required: true
        default: "true"
      enable_cost_scheduling:
        description: "Enable cost diagnostics and scheduling manifest"
        required: true
        default: "true"
      test_max_signal_groups:
        description: "Maximum signal groups in test_mode for signal-first evaluation"
        required: true
        default: "1000"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from all packs"
        required: true
        default: "2021-01-01"
      fail_on_unsupported:
        description: "Fail job when an external rule cannot be mapped"
        required: true
        default: "false"
      recovery_job_indices:
        description: "Optional comma-separated absolute logical job indices to run"
        required: false
        default: ""
      job_start_index:
        description: "First logical job index for sliced full runs"
        required: true
        default: "0"
      job_count:
        description: "Number of logical jobs to run; 0 means all remaining jobs"
        required: true
        default: "0"
      logical_jobs_per_block:
        description: "Logical jobs executed inside each GitHub matrix job"
        required: true
        default: "30"
      test_mode:
        description: "Run only test_max_jobs logical jobs"
        required: true
        default: "false"
      test_max_jobs:
        description: "Maximum logical jobs in test_mode"
        required: true
        default: "20"

permissions:
  contents: read
  actions: write

jobs:
  clean_portfolio_v7:
    if: ${{ inputs.optimized_evaluation_mode == 'clean_portfolio_v7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      GTBI_SYMBOL_WORKERS: "4"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned evaluator dependencies
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Download immutable GTBI data pack
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.data_run_id }}
          name: ${{ inputs.data_artifact_name }}
          path: data-pack
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate immutable data pack
        id: data
        shell: bash
        run: |
          set -euo pipefail
          prices_path="$(find data-pack -type f -name prices.parquet -print -quit)"
          benchmark_path="$(find data-pack -type f -name benchmark.parquet -print -quit)"
          test -n "$prices_path"
          test -n "$benchmark_path"
          data_root="$(dirname "$prices_path")"
          test "$data_root" = "$(dirname "$benchmark_path")"
          echo "root=$data_root" >> "$GITHUB_OUTPUT"
      - name: Run clean portfolio sizing V7
        shell: bash
        run: |
          set -euo pipefail
          max_symbols=0
          position_sizes="0.001,0.0025,0.005,0.0075,0.01,0.0125,0.0135,0.015,0.02,0.025,0.03,0.04,0.05"
          max_positions="10,20,30,50"
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            max_symbols=250
            position_sizes="0.005,0.0135,0.025"
            max_positions="10,20"
          fi
          python -m scripts.run_gtbi_clean_portfolio \
            --data-pack-root "${{ steps.data.outputs.root }}" \
            --strategy-pack-root "${{ inputs.external_strategy_pack_path }}" \
            --strategy-id "lhv1_2f6eb0c50f_fam_00_v1004" \
            --output-dir results \
            --source-data-run-id "${{ inputs.data_run_id }}" \
            --source-artifact-name "${{ inputs.data_artifact_name }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --position-sizes "$position_sizes" \
            --max-positions-grid "$max_positions" \
            --risk-limit-pct 25 \
            --safety-target-pct 20 \
            --transaction-cost-bps-per-side 10 \
            --slippage-bps-per-side 5 \
            --max-adjusted-gap-ratio 3 \
            --min-segment-rows 260 \
            --max-symbols "$max_symbols"
      - name: Validate clean portfolio artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("results")
          required = {
              "_SUCCESS",
              "summary.json",
              "provenance.json",
              "data_quality_report.csv",
              "price_anomalies.csv",
              "position_sizing_sweep.csv",
              "portfolio_daily_equity.csv",
              "portfolio_annual_returns.csv",
              "portfolio_trade_ledger.csv",
              "skipped_entries.csv",
              "strategy_rules.json",
          }
          missing = sorted(name for name in required if not (root / name).is_file())
          if missing:
              raise SystemExit(f"missing result files: {missing}")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          if not summary.get("artifact_valid") or not summary.get("strict_risk_pass"):
              raise SystemExit("clean portfolio artifact did not pass strict validation")
          if summary.get("locked_opened") is not False or summary.get("locked_start") != "2021-01-01":
              raise SystemExit("locked boundary changed or opened")
          annual = pd.read_csv(root / "portfolio_annual_returns.csv")
          if not annual.empty and int(annual["year"].max()) > 2020:
              raise SystemExit("annual output contains locked years")
          PY
      - name: Upload clean portfolio results
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-clean-portfolio-v7-results
          path: results
          retention-days: 30
          if-no-files-found: error

  orchestrate_longhold_72k:
    if: ${{ inputs.optimized_evaluation_mode == 'orchestrate_longhold_72k' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GitHub-only long-hold orchestrator
        run: |
          python scripts/orchestrate_gtbi_longhold_72k.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --workflow "global-technical-buy-indicator-external-pack-360jobs.yml" \
            --loop-minutes 300 \
            --sleep-seconds 60 \
            --run-list-limit 5000 \
            --min-run-created-at "2026-07-06T07:00:00Z" \
            --inspect-workers 32 \
            --max-parallel-logical-jobs 360 \
            --max-new-waves-per-pass 2 \
            --recovery-timeout-seconds 1800 \
            --recovery-wall-clock-seconds 2100 \
            --self-dispatch
      - name: Upload recovery manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-longhold-orchestrator-recovery-manifests
          path: recovery-manifests
          if-no-files-found: ignore
          retention-days: 30

  build_external_pack:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_fast_strict' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_merge_existing' && inputs.optimized_evaluation_mode != 'clean_portfolio_v7' }}
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      GTBI_BUILD_PACK_VERBOSE: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Try reusable external pack data from previous GitHub run
        id: reuse_pack
        run: |
          set -euo pipefail
          echo "reused=false" >> "$GITHUB_OUTPUT"
          mkdir -p external-pack-data
          run_ids="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "global-technical-buy-indicator-external-pack-360jobs.yml" \
            --branch "${{ github.ref_name }}" \
            --limit 100 \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.status=="completed" and .conclusion=="success") | .databaseId')"
          for run_id in $run_ids; do
            if [ "$run_id" = "${{ github.run_id }}" ]; then
              continue
            fi
            artifact_name="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[]? | select(.name=="gtbi-external-pack-data" and .expired==false) | .name' | head -n 1)"
            if [ "$artifact_name" = "gtbi-external-pack-data" ]; then
              echo "Reusing gtbi-external-pack-data from run $run_id"
              rm -rf external-pack-data
              mkdir -p external-pack-data
              for attempt in 1 2 3 4; do
                if gh run download "$run_id" \
                  --repo "${{ github.repository }}" \
                  --name "gtbi-external-pack-data" \
                  --dir external-pack-data; then
                  echo "reused=true" >> "$GITHUB_OUTPUT"
                  echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                sleep $((attempt * 20))
              done
            fi
          done
      - name: Download data lake artifact
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.data_run_id }}
          name: ${{ inputs.data_artifact_name }}
          path: ${{ env.QF_DATA_DIR }}/prices/free_us_daily
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize data lake layout and ensure SPY benchmark exists
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import pandas as pd

          root = Path("${{ env.QF_DATA_DIR }}/prices/free_us_daily")
          normalized = root / "normalized"
          if not normalized.exists():
              nested = [path.parent for path in root.rglob("normalized/*.parquet")]
              if nested:
                  actual_root = nested[0].parent
                  for child in actual_root.iterdir():
                      target = root / child.name
                      if child.resolve() == target.resolve():
                          continue
                      if target.exists():
                          continue
                      shutil.move(str(child), str(target))
          candidates = [
              root / "normalized" / "SPY.parquet",
              root / "raw" / "yfinance" / "SPY.parquet",
              *root.rglob("SPY.parquet"),
          ]
          out_dir = root / "benchmarks"
          out_dir.mkdir(parents=True, exist_ok=True)
          out_path = out_dir / "SPY.parquet"
          if out_path.exists():
              raise SystemExit(0)
          for src in candidates:
              if src.exists():
                  shutil.copy2(src, out_path)
                  raise SystemExit(0)
          import json
          from urllib.request import Request, urlopen
          locked = pd.Timestamp("${{ inputs.locked_start }}")
          period1 = int(pd.Timestamp("1990-01-01", tz="UTC").timestamp())
          period2 = int(locked.tz_localize("UTC").timestamp()) if locked.tzinfo is None else int(locked.timestamp())
          url = (
              "https://query1.finance.yahoo.com/v8/finance/chart/SPY"
              f"?period1={period1}&period2={period2}&interval=1d&events=div%2Csplits"
          )
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))
          result = (payload.get("chart", {}).get("result") or [None])[0]
          if not result:
              raise FileNotFoundError("SPY benchmark unavailable from Yahoo chart API")
          timestamps = result.get("timestamp") or []
          quote = (result.get("indicators", {}).get("quote") or [{}])[0]
          adj = (result.get("indicators", {}).get("adjclose") or [{}])[0].get("adjclose")
          spy = pd.DataFrame(
              {
                  "date": pd.to_datetime(timestamps, unit="s", utc=True).tz_convert(None).normalize(),
                  "open": quote.get("open", []),
                  "high": quote.get("high", []),
                  "low": quote.get("low", []),
                  "close": quote.get("close", []),
                  "adj_close": adj if adj is not None else quote.get("close", []),
                  "volume": quote.get("volume", []),
              }
          )
          spy["date"] = pd.to_datetime(spy["date"], errors="coerce")
          spy = spy.dropna(subset=["date"])
          spy = spy[spy["date"] < pd.Timestamp("${{ inputs.locked_start }}")]
          spy["symbol"] = "SPY"
          keep = ["date", "open", "high", "low", "close", "adj_close", "volume", "symbol"]
          missing = [column for column in keep if column not in spy.columns]
          if missing or spy.empty:
              found = "\n".join(str(path) for path in list(root.rglob("*.parquet"))[:20])
              raise FileNotFoundError(f"SPY benchmark unavailable; missing={missing}. First parquet files:\n{found}")
          spy[keep].to_parquet(out_path, index=False)
          PY
      - name: Build reusable external pack data
        if: ${{ steps.reuse_pack.outputs.reused != 'true' }}
        run: |
          python scripts/build_global_technical_buy_indicator_pack.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --output-dir external-pack-data-root \
            --stage-count 1 \
            --group-count 1 \
            --locked-start "${{ inputs.locked_start }}" \
            --min-market-cap "${{ inputs.min_market_cap }}"
          cp -R external-pack-data-root/stage-000 external-pack-data
      - name: Upload reusable pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
          retention-days: 14

  plan_blocks:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_fast_strict' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_merge_existing' && inputs.optimized_evaluation_mode != 'clean_portfolio_v7' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_jobs: ${{ steps.plan.outputs.total_jobs }}
      total_strategies: ${{ steps.plan.outputs.total_strategies }}
      candidate_limit: ${{ steps.plan.outputs.candidate_limit }}
      block_count: ${{ steps.plan.outputs.block_count }}
    steps:
      - name: Build block matrix
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import math
          import os

          original_shards = 360
          original_strategies_per_shard = 200
          candidate_limit = max(int("${{ inputs.candidate_count_per_job }}"), 1)
          chunks_per_shard = math.ceil(original_strategies_per_shard / candidate_limit)
          max_logical_jobs = original_shards * chunks_per_shard

          raw_recovery = "${{ inputs.recovery_job_indices }}".strip()
          if raw_recovery:
              logical_jobs = []
              for item in raw_recovery.split(","):
                  item = item.strip()
                  if not item:
                      continue
                  job_index = int(item)
                  if job_index < 0 or job_index >= max_logical_jobs:
                      raise SystemExit(f"invalid recovery job index {job_index}; expected 0..{max_logical_jobs - 1}")
                  logical_jobs.append(job_index)
              logical_jobs = sorted(dict.fromkeys(logical_jobs))
          else:
              total = max_logical_jobs
              if "${{ inputs.test_mode }}" == "true":
                  total = min(max(int("${{ inputs.test_max_jobs }}"), 1), total)
                  logical_jobs = list(range(total))
              else:
                  start_index = max(int("${{ inputs.job_start_index }}"), 0)
                  requested_count = int("${{ inputs.job_count }}")
                  if start_index >= max_logical_jobs:
                      logical_jobs = []
                  else:
                      if requested_count <= 0:
                          end_index = max_logical_jobs
                      else:
                          end_index = min(start_index + requested_count, max_logical_jobs)
                      logical_jobs = list(range(start_index, end_index))

          logical_jobs_per_block = max(int("${{ inputs.logical_jobs_per_block }}"), 1)
          if "${{ inputs.test_mode }}" == "true":
              logical_jobs_per_block = 1
          rows = []
          total_strategies = 0
          for block_index, start in enumerate(range(0, len(logical_jobs), logical_jobs_per_block)):
              block_jobs = logical_jobs[start : start + logical_jobs_per_block]
              if not block_jobs:
                  continue
              for job_index in block_jobs:
                  chunk_index = job_index % chunks_per_shard
                  strategy_offset = chunk_index * candidate_limit
                  total_strategies += max(min(candidate_limit, original_strategies_per_shard - strategy_offset), 0)
              rows.append(
                  {
                      "block_index": block_index,
                      "block_padded": f"{block_index:03d}",
                      "job_indices_csv": ",".join(str(value) for value in block_jobs),
                      "logical_jobs": len(block_jobs),
                  }
              )

          if not rows:
              raise SystemExit("block matrix is empty")
          if len(rows) > 256:
              raise SystemExit(f"too many GitHub matrix blocks: {len(rows)} > 256")
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          print(f"total_jobs={len(logical_jobs)}")
          print(f"total_strategies={total_strategies}")
          print(f"candidate_limit={candidate_limit}")
          print(f"block_count={len(rows)}")
          PY

  run_block:
    name: run_block (${{ matrix.block_index }}, ${{ matrix.block_padded }}, ${{ matrix.job_indices_csv }}, ${{ matrix.logical_jobs }})
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_fast_strict' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_merge_existing' && inputs.optimized_evaluation_mode != 'clean_portfolio_v7' }}
    needs:
      - build_external_pack
      - plan_blocks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 360
      matrix: ${{ fromJson(needs.plan_blocks.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: "1"
      QF_DATA_DIR: /tmp/aurora-data
      AURORA_ALLOW_LOCAL_RUNS_EXPLICIT: USER_REQUESTED_LOCAL_RUN_THIS_TURN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download reusable pack data
        uses: actions/download-artifact@v4
        with:
          name: gtbi-external-pack-data
          path: external-pack-data
      - name: Run logical jobs in this block
        env:
          JOB_INDICES_CSV: ${{ matrix.job_indices_csv }}
          SCHEDULE_ACTIVE_JOBS: "360"
          CANDIDATE_LIMIT: ${{ needs.plan_blocks.outputs.candidate_limit }}
        run: |
          set -euo pipefail
          IFS=',' read -ra JOBS <<< "$JOB_INDICES_CSV"
          original_strategies_per_shard=200
          chunks_per_shard=$(( (original_strategies_per_shard + CANDIDATE_LIMIT - 1) / CANDIDATE_LIMIT ))
          schedule_active_jobs="$SCHEDULE_ACTIVE_JOBS"
          signal_group_limit=0
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            signal_group_limit="${{ inputs.test_max_signal_groups }}"
          fi
          PARTITION_ARGS=()
          if [ -n "${{ inputs.recovery_job_indices }}" ] && [ "${{ inputs.job_count }}" -gt 1 ]; then
            if [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first_symbol_bucket" ]; then
              PARTITION_ARGS=(
                --symbol-bucket-index "${{ inputs.job_start_index }}"
                --symbol-bucket-count "${{ inputs.job_count }}"
              )
            else
              PARTITION_ARGS=(
                --schedule-subgroup-index "${{ inputs.job_start_index }}"
                --schedule-subgroup-count "${{ inputs.job_count }}"
              )
            fi
          fi

          for job_index in "${JOBS[@]}"; do
            base_shard_id=$(( job_index / chunks_per_shard ))
            chunk_index=$(( job_index % chunks_per_shard ))
            strategy_offset=$(( chunk_index * CANDIDATE_LIMIT ))
            remaining=$(( original_strategies_per_shard - strategy_offset ))
            strategy_limit="$CANDIDATE_LIMIT"
            if [ "$remaining" -lt "$strategy_limit" ]; then
              strategy_limit="$remaining"
            fi
            if [ "$strategy_limit" -le 0 ]; then
              continue
            fi
            job_padded=$(printf "%04d" "$job_index")
            echo "::group::logical job $job_padded shard=$base_shard_id offset=$strategy_offset limit=$strategy_limit"

            FAIL_ARGS=()
            OPT_ARGS=()
            if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
              FAIL_ARGS=(--external-strategy-fail-on-unsupported)
            fi
            if [ "${{ inputs.enable_feature_cache }}" = "true" ]; then OPT_ARGS+=(--enable-feature-cache); else OPT_ARGS+=(--no-enable-feature-cache); fi
            if [ "${{ inputs.enable_dedupe }}" = "true" ]; then OPT_ARGS+=(--enable-dedupe); else OPT_ARGS+=(--no-enable-dedupe); fi
            if [ "${{ inputs.enable_safe_prefilter }}" = "true" ]; then OPT_ARGS+=(--enable-safe-prefilter); else OPT_ARGS+=(--no-enable-safe-prefilter); fi
            if [ "${{ inputs.enable_early_stopping }}" = "true" ]; then OPT_ARGS+=(--enable-early-stopping); else OPT_ARGS+=(--no-enable-early-stopping); fi
            if [ "${{ inputs.enable_cost_scheduling }}" = "true" ]; then OPT_ARGS+=(--enable-cost-scheduling); else OPT_ARGS+=(--no-enable-cost-scheduling); fi

            RUN_ARGS=(
              --data-lake-root "$QF_DATA_DIR/prices/free_us_daily"
              --prebuilt-pack-dir external-pack-data
              --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}"
              --external-strategy-shard-id "$base_shard_id"
              --external-strategy-offset "$strategy_offset"
              --external-strategy-limit "$strategy_limit"
              --candidate-timeout-seconds "${{ inputs.candidate_timeout_seconds }}"
              --job-wall-clock-seconds "${{ inputs.job_wall_clock_seconds }}"
              --schedule-active-jobs "$schedule_active_jobs"
              "${PARTITION_ARGS[@]}"
              --test-max-signal-groups "$signal_group_limit"
              --optimized-evaluation-mode "${{ inputs.optimized_evaluation_mode }}"
              "${OPT_ARGS[@]}"
              --external-strategy-format jsonl
              "${FAIL_ARGS[@]}"
              --min-market-cap "${{ inputs.min_market_cap }}"
              --locked-start "${{ inputs.locked_start }}"
              --train-end "${{ inputs.train_end }}"
              --validation-start "${{ inputs.validation_start }}"
              --validation-end "${{ inputs.validation_end }}"
            )

            if [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v3_signal_first" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v4_zero_timeout" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first" ] || [ "${{ inputs.optimized_evaluation_mode }}" = "optimized_evaluation_v5_event_first_symbol_bucket" ]; then
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --signal-first-phase signals --output-dir "signals/job-$job_padded"
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --signal-first-phase exits --signal-events-dir "signals/job-$job_padded" --output-dir "outputs/job-$job_padded"
            else
              python scripts/run_global_technical_buy_indicator_external_pack_shard.py "${RUN_ARGS[@]}" --output-dir "outputs/job-$job_padded"
            fi
            rm -rf "outputs/job-$job_padded/_external_pack_data"
            echo "::endgroup::"
          done

          if [ -n "${{ inputs.recovery_job_indices }}" ]; then
            python - <<'PY'
          import csv
          import sys
          from pathlib import Path

          timeout_rows = 0
          for path in Path("outputs").rglob("timeout_strategies*.csv"):
              with path.open(newline="", encoding="utf-8") as handle:
                  timeout_rows += sum(1 for _ in csv.DictReader(handle))
          if timeout_rows:
              print(f"recovery block still contains {timeout_rows} timeout rows", file=sys.stderr)
              raise SystemExit(42)
          PY
          fi
      - name: Upload block artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-block-${{ matrix.block_padded }}
          path: outputs
          retention-days: 14

  merge_final:
    if: ${{ inputs.optimized_evaluation_mode != 'merge_cross_run' && inputs.optimized_evaluation_mode != 'orchestrate_longhold_72k' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_fast_strict' && inputs.optimized_evaluation_mode != 'optimized_evaluation_v6_merge_existing' && inputs.optimized_evaluation_mode != 'clean_portfolio_v7' && always() }}
    needs:
      - plan_blocks
      - run_block
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download block artifacts
        run: |
          set -euo pipefail
          mkdir -p downloaded-blocks
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --pattern "gtbi-external-pack-block-*" \
              --dir downloaded-blocks; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1
      - name: Merge outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-blocks \
            --output-dir final-results \
            --total-strategies-requested "${{ needs.plan_blocks.outputs.total_strategies }}" \
            --total-shards-requested "360" \
            --total-jobs-requested "${{ needs.plan_blocks.outputs.total_jobs }}" \
            --candidate-count-per-job "${{ inputs.candidate_count_per_job }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}"
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          retention-days: 30

  v6_build_data:
    if: ${{ inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      data_identity: ${{ steps.seal.outputs.data_identity }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/..
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout data sealing code
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /__init__.py
            /requirements/gtbi-fast-strict.lock
            /core/**
            /scripts/*.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned runtime
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Verify named source artifact is live
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ inputs.data_run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired == false) and (.name == "${{ inputs.data_artifact_name }}")) | [.name, .size_in_bytes] | @tsv' \
            > source-artifact.tsv
          test "$(wc -l < source-artifact.tsv)" -eq 1
          test "$(cut -f2 source-artifact.tsv)" -gt 0
      - name: Download immutable data pack by run and name
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.data_run_id }}
          name: ${{ inputs.data_artifact_name }}
          path: v6-data/data-pack
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Seal immutable data pack
        id: seal
        run: |
          set -euo pipefail
          python scripts/run_gtbi_fast_strict_worker.py manifest \
            --data-pack-root v6-data/data-pack \
            --output v6-data/data_manifest.json \
            --source-data-run-id "${{ inputs.data_run_id }}" \
            --source-artifact-name "${{ inputs.data_artifact_name }}" \
            --universe-identity "long-cash-next-session-open-min-market-cap-${{ inputs.min_market_cap }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --min-market-cap "${{ inputs.min_market_cap }}"
          data_identity="$(jq -er '.data_pack_identity' v6-data/data_manifest.json)"
          test "$(jq -r '.train_end' v6-data/data_manifest.json)" = "2010-12-31"
          test "$(jq -r '.validation_start' v6-data/data_manifest.json)" = "2011-01-01"
          test "$(jq -r '.validation_end' v6-data/data_manifest.json)" = "2020-12-31"
          test "$(jq -r '.locked_start' v6-data/data_manifest.json)" = "2021-01-01"
          echo "artifact_name=gtbi-v6-data-manifest-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "data_identity=$data_identity" >> "$GITHUB_OUTPUT"
      - name: Upload sealed data manifest only
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-v6-data-manifest-${{ github.run_id }}
          path: v6-data/data_manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  v6_plan:
    if: ${{ inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' }}
    needs: [v6_build_data]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
      matrix_a: ${{ steps.outputs.outputs.matrix_a }}
      matrix_b: ${{ steps.outputs.outputs.matrix_b }}
      block_matrix: ${{ steps.outputs.outputs.block_matrix }}
      selected_worker_ids: ${{ steps.outputs.outputs.selected_worker_ids }}
      count_a: ${{ steps.outputs.outputs.count_a }}
      count_b: ${{ steps.outputs.outputs.count_b }}
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/..
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout planner and exact strategy pack
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /__init__.py
            /requirements/gtbi-fast-strict.lock
            /core/**
            /scripts/*.py
            /scripts/strategy_packs/gtbi_long_hold_fundamental_timing_v1/**
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned runtime
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Build and seal global plan once
        run: |
          set -euo pipefail
          lock_identity="$(sha256sum requirements/gtbi-fast-strict.lock | cut -d' ' -f1)"
          python scripts/gtbi_fast_strict.py \
            "${{ inputs.external_strategy_pack_path }}" \
            v6-plan \
            --workers 360 \
            --expected-strategy-count 72000 \
            --data-run-identity "${{ needs.v6_build_data.outputs.data_identity }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --execution-mode optimized_evaluation_v5_event_first \
            --universe-identity "long-cash-next-session-open-min-market-cap-${{ inputs.min_market_cap }}" \
            --dependency-lock-identity "$lock_identity" \
            --strategy-format auto
          python -c "from pathlib import Path; from scripts.gtbi_fast_strict import verify_campaign_artifacts; verify_campaign_artifacts(Path('v6-plan'))"
      - name: Publish matrices
        id: outputs
        env:
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_MAX_JOBS: ${{ inputs.test_max_jobs }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix_a = json.loads(Path("v6-plan/matrix_a.json").read_text(encoding="utf-8"))["include"]
          matrix_b = json.loads(Path("v6-plan/matrix_b.json").read_text(encoding="utf-8"))["include"]
          all_workers = sorted(matrix_a + matrix_b, key=lambda row: int(row["worker_id"]))
          if os.environ["TEST_MODE"].lower() == "true":
              limit = int(os.environ["TEST_MAX_JOBS"])
              if not 1 <= limit <= len(all_workers):
                  raise SystemExit(f"test_max_jobs must be in 1..{len(all_workers)}")
              selected = all_workers[:limit]
          else:
              selected = all_workers
          selected_a = [row for row in selected if int(row["worker_id"]) < 180]
          selected_b = [row for row in selected if int(row["worker_id"]) >= 180]
          outputs = {
              "artifact_name": f"gtbi-v6-plan-{os.environ['GITHUB_RUN_ID']}",
              "matrix_a": json.dumps({"include": selected_a}, separators=(",", ":")),
              "matrix_b": json.dumps({"include": selected_b}, separators=(",", ":")),
              "block_matrix": json.dumps(
                  json.loads(Path("v6-plan/block_matrix.json").read_text(encoding="utf-8")),
                  separators=(",", ":"),
              ),
              "selected_worker_ids": ",".join(str(row["worker_id"]) for row in selected),
              "count_a": str(len(selected_a)),
              "count_b": str(len(selected_b)),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write(f"{key}={value}\n")
          PY
      - name: Upload sealed global plan
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-v6-plan-${{ github.run_id }}
          path: v6-plan
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  v6_worker_a:
    if: ${{ inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' && needs.v6_plan.outputs.count_a != '0' }}
    needs: [v6_build_data, v6_plan]
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.v6_plan.outputs.matrix_a) }}
    uses: ./.github/workflows/gtbi-fast-strict-v6-worker.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      data_artifact_run_id: ${{ inputs.data_run_id }}
      data_artifact_name: ${{ inputs.data_artifact_name }}
      data_manifest_artifact_name: ${{ needs.v6_build_data.outputs.artifact_name }}
      plan_artifact_name: ${{ needs.v6_plan.outputs.artifact_name }}
      worker_id: ${{ matrix.worker_id }}
      attempt: 0

  v6_worker_b:
    if: ${{ inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' && needs.v6_plan.outputs.count_b != '0' }}
    needs: [v6_build_data, v6_plan]
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.v6_plan.outputs.matrix_b) }}
    uses: ./.github/workflows/gtbi-fast-strict-v6-worker.yml
    with:
      artifact_run_id: ${{ github.run_id }}
      data_artifact_run_id: ${{ inputs.data_run_id }}
      data_artifact_name: ${{ inputs.data_artifact_name }}
      data_manifest_artifact_name: ${{ needs.v6_build_data.outputs.artifact_name }}
      plan_artifact_name: ${{ needs.v6_plan.outputs.artifact_name }}
      worker_id: ${{ matrix.worker_id }}
      attempt: 0

  v6_smoke_validate:
    if: ${{ always() && inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' && inputs.test_mode == 'true' && needs.v6_plan.result == 'success' }}
    needs: [v6_plan, v6_worker_a, v6_worker_b]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/..
      EXPECTED_WORKER_IDS: ${{ needs.v6_plan.outputs.selected_worker_ids }}
    steps:
      - name: Checkout strict inventory and block merger
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /__init__.py
            /requirements/gtbi-fast-strict.lock
            /core/**
            /scripts/*.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned runtime
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Download sealed plan
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          name: gtbi-v6-plan-${{ github.run_id }}
          path: v6-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: List smoke worker artifacts
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired == false) and (.name | startswith("gtbi-v6-worker-"))) | .name' \
            > worker-artifacts.txt
      - name: Download smoke worker artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          pattern: gtbi-v6-worker-*
          path: worker-artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate exact smoke inventory
        run: |
          set -euo pipefail
          test -n "$EXPECTED_WORKER_IDS"
          shopt -s nullglob
          artifact_roots=(worker-artifacts/gtbi-v6-worker-*)
          listed_count="$(sort -u worker-artifacts.txt | sed '/^$/d' | wc -l)"
          test "${#artifact_roots[@]}" -eq "$listed_count"
          python scripts/gtbi_fast_strict_inventory.py \
            --campaign-manifest v6-plan/campaign_manifest.json \
            --input-root worker-artifacts \
            --expected-worker-ids "$EXPECTED_WORKER_IDS" \
            --output-dir smoke-inventory
          expected_count="$(awk -F, '{print NF}' <<< "$EXPECTED_WORKER_IDS")"
          jq -e --argjson expected "$expected_count" \
            '.complete == true and .missing_worker_count == 0 and .valid_worker_count == $expected and .expected_worker_count == $expected' \
            smoke-inventory/inventory_summary.json
      - name: Exercise strict block merge on real smoke outputs
        run: |
          set -euo pipefail
          python scripts/merge_gtbi_fast_strict_block.py \
            --input-root worker-artifacts \
            --output-dir smoke-block \
            --block-id 0 \
            --worker-ids "$EXPECTED_WORKER_IDS"
          mkdir -p smoke-output
          cp -R smoke-inventory smoke-output/inventory
          cp -R smoke-block smoke-output/block
          python - <<'PY'
          import json
          from pathlib import Path

          inventory = json.loads(Path("smoke-inventory/inventory_summary.json").read_text(encoding="utf-8"))
          block = json.loads(Path("smoke-block/summary_job_block_00.json").read_text(encoding="utf-8"))
          summary = {
              "optimized_evaluation_mode": "optimized_evaluation_v6_fast_strict",
              "smoke_complete": True,
              "campaign_fingerprint": inventory["campaign_fingerprint"],
              "selected_worker_ids": inventory["expected_worker_ids"],
              "total_jobs_requested": inventory["expected_worker_count"],
              "total_jobs_completed": inventory["valid_worker_count"],
              "total_strategies_loaded": block["total_strategies_loaded"],
              "total_strategies_evaluated": block["total_strategies_evaluated"],
              "total_strategies_early_rejected": block["total_strategies_early_rejected"],
              "total_strategies_timed_out": 0,
              "total_strategies_runtime_error": 0,
              "total_strategies_unsupported": 0,
              "total_strategies_slow_deferred": 0,
          }
          Path("smoke-output/smoke_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload strict V6 smoke result
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-v6-fast-strict-smoke-results
          path: smoke-output
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  v6_retry_plan_1:
    if: ${{ always() && inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_fast_strict' && inputs.test_mode != 'true' && needs.v6_plan.result == 'success' }}
    needs: [v6_plan, v6_worker_a, v6_worker_b]
    runs-on: ubuntu-24.04
    outputs:
      matrix_a: ${{ steps.outputs.outputs.matrix_a }}
      matrix_b: ${{ steps.outputs.outputs.matrix_b }}
      count_a: ${{ steps.outputs.outputs.count_a }}
      count_b: ${{ steps.outputs.outputs.count_b }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/..
    steps:
      - name: Checkout inventory code
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/gtbi_fast_strict_inventory.py
            /scripts/download_gtbi_v6_worker_artifacts.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sealed plan
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          name: gtbi-v6-plan-${{ github.run_id }}
          path: v6-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: List worker artifacts with pagination and name filter
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired == false) and (.name | startswith("gtbi-v6-worker-"))) | [.id, .name] | @tsv' \
            > worker-artifacts.tsv
          cut -f2 worker-artifacts.tsv > worker-artifacts.txt
      - name: Download all listed worker archives directly by artifact id
        run: |
          python scripts/download_gtbi_v6_worker_artifacts.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --inventory-file worker-artifacts.tsv \
            --output-dir worker-artifacts \
            --max-workers 4 \
            --retries 5
      - name: Generate first missing-worker matrices from validated inventory
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifact_roots=(worker-artifacts/gtbi-v6-worker-*)
          listed_count="$(sort -u worker-artifacts.txt | sed '/^$/d' | wc -l)"
          test "${#artifact_roots[@]}" -eq "$listed_count"
          for artifact_root in "${artifact_roots[@]}"; do
            grep -Fxq "$(basename "$artifact_root")" worker-artifacts.txt
          done
          python scripts/gtbi_fast_strict_inventory.py \
            --campaign-manifest v6-plan/campaign_manifest.json \
            --input-root worker-artifacts \
            --output-dir retry-inventory-1
      - name: Publish retry matrices
        id: outputs
        run: |
          echo "matrix_a=$(jq -c . retry-inventory-1/matrix_a.json)" >> "$GITHUB_OUTPUT"
          echo "matrix_b=$(jq -c . retry-inventory-1/matrix_b.json)" >> "$GITHUB_OUTPUT"
          echo "count_a=$(jq '.include | length' retry-inventory-1/matrix_a.json)" >> "$GITHUB_OUTPUT"
          echo "count_b=$(jq '.include | length' retry-inventory-1/matrix_b.json)" >> "$GITHUB_OUTPUT"
      - name: Upload first inventory
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-v6-inventory-round-1-${{ github.run_id }}
          path: retry-inventory-1
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  v6_retry_1_a:
    if: ${{ needs.v6_retry_plan_1.outputs.count_a != '0' }}
    needs: [v6_build_data, v6_plan, v6_retry_plan_1]
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.v6_retry_plan_1.outputs.matrix_a) }}
    uses: ./.github/workflows/gtbi-fast-strict-v6-worker.yml
    with:
      artifact_run_id: ${{ github.run_id }}
