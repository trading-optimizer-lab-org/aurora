          sparse-checkout: |
            /__init__.py
            /requirements/gtbi-fast-strict.lock
            /core/**
            /scripts/*.py
            /scripts/strategy_packs/gtbi_long_hold_fundamental_timing_v1/**
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/gtbi-fast-strict.lock
      - name: Install pinned runtime
        run: python -m pip install -r requirements/gtbi-fast-strict.lock
      - name: Download recovery sealed plan
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.run_id }}
          name: gtbi-v6-recovery-plan-${{ github.run_id }}
          path: v6-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download exactly twenty recovered block artifacts
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired == false) and (.name | startswith("gtbi-v6-recovery-block-"))) | .name' \
            > block-artifacts.txt
          for block_id in $(seq 0 19); do
            artifact_name="gtbi-v6-recovery-block-$block_id-run-${{ github.run_id }}"
            grep -Fxq "$artifact_name" block-artifacts.txt
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "$artifact_name" \
              --dir "block-inputs/$artifact_name"
          done
      - name: Run strict recovered final merge
        run: |
          python scripts/merge_gtbi_fast_strict_final.py \
            --plan-root v6-plan \
            --blocks-root block-inputs \
            --original-pack "${{ inputs.external_strategy_pack_path }}" \
            --output-dir final-results \
            --expected-alias-count 72000 \
            --expected-block-count 20 \
            --expected-worker-count 360
      - name: Validate recovered final artifact before upload
        run: |
          python scripts/validate_gtbi_fast_strict_artifact.py \
            final-results \
            --expected-strategy-count 72000 \
            --output-json final-results/strict_validation.json
      - name: Upload exact recovered final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-long-hold-fast-strict-v6-results
          path: final-results
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

  v6_recover_cleanup:
    if: ${{ success() && inputs.optimized_evaluation_mode == 'optimized_evaluation_v6_merge_existing' }}
    needs: [v6_recover_final_merge]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete recovery-run intermediate artifacts only
        continue-on-error: true
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(
              (.expired == false) and
              (.name != "global-technical-buy-indicator-long-hold-fast-strict-v6-results") and
              (.name | startswith("gtbi-v6-recovery-"))
            ) | .id' \
            > recovery-artifact-ids.txt
          while read -r artifact_id; do
            test -n "$artifact_id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done < recovery-artifact-ids.txt

  merge_cross_run:
    if: ${{ inputs.optimized_evaluation_mode == 'merge_cross_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download source final artifacts
        env:
          SOURCE_RUN_IDS: ${{ inputs.recovery_job_indices }}
          SOURCE_ARTIFACT_NAME: global-technical-buy-indicator-external-pack-72000-results
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_RUN_IDS// }" ]; then
            echo "recovery_job_indices must contain source run ids when optimized_evaluation_mode=merge_cross_run" >&2
            exit 2
          fi
          mkdir -p downloaded-cross-run
          IFS=',' read -ra RUN_IDS <<< "$SOURCE_RUN_IDS"
          for raw_run_id in "${RUN_IDS[@]}"; do
            run_id="$(echo "$raw_run_id" | xargs)"
            if [ -z "$run_id" ]; then
              continue
            fi
            echo "::group::download $run_id"
            for attempt in 1 2 3 4 5; do
              if gh run download "$run_id" \
                --repo "${{ github.repository }}" \
                --name "$SOURCE_ARTIFACT_NAME" \
                --dir "downloaded-cross-run/run-$run_id"; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                exit 1
              fi
              sleep $((attempt * 30))
            done
            echo "::endgroup::"
          done
      - name: Merge source run outputs
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-cross-run \
            --output-dir final-results \
            --total-strategies-requested "72000" \
            --total-shards-requested "360" \
            --total-jobs-requested "7200" \
            --candidate-count-per-job "${{ inputs.candidate_count_per_job }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --strict-final-eval-mode
      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          retention-days: 30
