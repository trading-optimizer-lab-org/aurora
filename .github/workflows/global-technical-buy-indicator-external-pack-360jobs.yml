name: Global Technical Buy Indicator External Pack 360 Jobs

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "Run id containing free-global-yahoo-daily-data-lake"
        required: true
        default: "27936694743"
      data_artifact_name:
        description: "Source data lake artifact"
        required: true
        default: "free-global-yahoo-daily-data-lake"
      external_strategy_pack_path:
        description: "Repo path containing the external strategy pack"
        required: true
        default: "scripts/strategy_packs/gtbi_research_broad_72000"
      candidate_count_per_shard:
        description: "Strategies evaluated per shard"
        required: true
        default: "200"
      candidate_count_per_job:
        description: "Strategies evaluated per job; preferred alias for candidate_count_per_shard"
        required: false
        default: ""
      optimized_evaluation_mode:
        description: "Evaluation mode label recorded in summaries"
        required: false
        default: "standard"
      candidate_timeout_seconds:
        description: "Per-candidate timeout seconds recorded in summaries"
        required: false
        default: "300"
      job_wall_clock_seconds:
        description: "Per-job wall clock budget seconds recorded in summaries"
        required: false
        default: "0"
      min_market_cap:
        description: "Minimum market cap in USD"
        required: true
        default: "2000000000"
      train_end:
        description: "Train end date"
        required: true
        default: "2010-12-31"
      validation_start:
        description: "Validation start date"
        required: true
        default: "2011-01-01"
      validation_end:
        description: "Validation end date"
        required: true
        default: "2020-12-31"
      locked_start:
        description: "Locked/OOS start date, excluded from all packs"
        required: true
        default: "2021-01-01"
      fail_on_unsupported:
        description: "Fail shard when an external rule cannot be mapped"
        required: true
        default: "false"
      test_mode:
        description: "Run at most test_max_shards and 5 strategies per shard"
        required: true
        default: "false"
      test_max_shards:
        description: "Maximum shards in test_mode, capped at 10"
        required: true
        default: "10"
      test_max_jobs:
        description: "Maximum jobs in test_mode; preferred alias for test_max_shards"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix_a: ${{ steps.plan.outputs.matrix_a }}
      matrix_b: ${{ steps.plan.outputs.matrix_b }}
      total_strategies_requested: ${{ steps.plan.outputs.total_strategies_requested }}
      total_shards_requested: ${{ steps.plan.outputs.total_shards_requested }}
      candidate_limit: ${{ steps.plan.outputs.candidate_limit }}
    steps:
      - id: plan
        name: Build 360-shard matrix
        run: |
          python - <<'PY'
          import json
          import os

          test_mode = "${{ inputs.test_mode }}".strip().lower() == "true"
          candidate_count_per_job = "${{ inputs.candidate_count_per_job }}".strip()
          requested_limit = max(int(candidate_count_per_job or "${{ inputs.candidate_count_per_shard }}"), 1)
          if test_mode:
              test_max_jobs = "${{ inputs.test_max_jobs }}".strip()
              shard_count = min(max(int(test_max_jobs or "${{ inputs.test_max_shards }}"), 1), 360)
              candidate_limit = requested_limit
          else:
              shard_count = 360
              candidate_limit = requested_limit
          rows = [
              {"shard": shard, "shard_padded": f"{shard:03d}", "candidate_limit": candidate_limit}
              for shard in range(shard_count)
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"matrix_a={json.dumps({'include': rows[:180]}, separators=(',', ':'))}\n")
              handle.write(f"matrix_b={json.dumps({'include': rows[180:]}, separators=(',', ':'))}\n")
              handle.write(f"total_strategies_requested={shard_count * candidate_limit}\n")
              handle.write(f"total_shards_requested={shard_count}\n")
              handle.write(f"candidate_limit={candidate_limit}\n")
          PY

  run_shard_a:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.plan.outputs.matrix_a) }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download clean global data lake once for this shard
        run: |
          mkdir -p "$QF_DATA_DIR/prices/free_us_daily"
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ inputs.data_run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${{ inputs.data_artifact_name }}" \
              --dir "$QF_DATA_DIR/prices/free_us_daily"; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Run external strategy shard
        run: |
          FAIL_FLAG="--no-external-strategy-fail-on-unsupported"
          if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
            FAIL_FLAG="--external-strategy-fail-on-unsupported"
          fi
          python scripts/run_global_technical_buy_indicator_external_pack_shard.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}" \
            --external-strategy-shard-id "${{ matrix.shard }}" \
            --external-strategy-limit "${{ matrix.candidate_limit }}" \
            --external-strategy-format jsonl \
            "$FAIL_FLAG" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --optimized-evaluation-mode "${{ inputs.optimized_evaluation_mode }}" \
            --candidate-timeout-seconds "${{ inputs.candidate_timeout_seconds }}" \
            --job-wall-clock-seconds "${{ inputs.job_wall_clock_seconds }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --output-dir "outputs/shard-${{ matrix.shard_padded }}"
          rm -rf "outputs/shard-${{ matrix.shard_padded }}/_external_pack_data"
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-shard-${{ matrix.shard_padded }}
          path: outputs/shard-${{ matrix.shard_padded }}
          if-no-files-found: error
          retention-days: 7

  run_shard_b:
    needs: [plan]
    if: ${{ fromJSON(needs.plan.outputs.total_shards_requested) > 180 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 180
      matrix: ${{ fromJson(needs.plan.outputs.matrix_b) }}
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      QF_DATA_DIR: ${{ github.workspace }}/qf-data
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download clean global data lake once for this shard
        run: |
          mkdir -p "$QF_DATA_DIR/prices/free_us_daily"
          for attempt in 1 2 3 4 5; do
            if gh run download "${{ inputs.data_run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${{ inputs.data_artifact_name }}" \
              --dir "$QF_DATA_DIR/prices/free_us_daily"; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Run external strategy shard
        run: |
          FAIL_FLAG="--no-external-strategy-fail-on-unsupported"
          if [ "${{ inputs.fail_on_unsupported }}" = "true" ]; then
            FAIL_FLAG="--external-strategy-fail-on-unsupported"
          fi
          python scripts/run_global_technical_buy_indicator_external_pack_shard.py \
            --data-lake-root "$QF_DATA_DIR/prices/free_us_daily" \
            --external-strategy-pack-path "${{ inputs.external_strategy_pack_path }}" \
            --external-strategy-shard-id "${{ matrix.shard }}" \
            --external-strategy-limit "${{ matrix.candidate_limit }}" \
            --external-strategy-format jsonl \
            "$FAIL_FLAG" \
            --min-market-cap "${{ inputs.min_market_cap }}" \
            --optimized-evaluation-mode "${{ inputs.optimized_evaluation_mode }}" \
            --candidate-timeout-seconds "${{ inputs.candidate_timeout_seconds }}" \
            --job-wall-clock-seconds "${{ inputs.job_wall_clock_seconds }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}" \
            --output-dir "outputs/shard-${{ matrix.shard_padded }}"
          rm -rf "outputs/shard-${{ matrix.shard_padded }}/_external_pack_data"
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtbi-external-pack-shard-${{ matrix.shard_padded }}
          path: outputs/shard-${{ matrix.shard_padded }}
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [plan, run_shard_a, run_shard_b]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aurora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data-cloud,ml]"
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gtbi-external-pack-shard-*
          path: downloaded-shards
      - name: Merge shard results
        run: |
          python scripts/merge_global_technical_buy_indicator_external_pack.py \
            --shards-root downloaded-shards \
            --output-dir final-results \
            --total-strategies-requested "${{ needs.plan.outputs.total_strategies_requested }}" \
            --total-shards-requested "${{ needs.plan.outputs.total_shards_requested }}" \
            --candidate-count-per-job "${{ needs.plan.outputs.candidate_limit }}" \
            --optimized-evaluation-mode "${{ inputs.optimized_evaluation_mode }}" \
            --candidate-timeout-seconds "${{ inputs.candidate_timeout_seconds }}" \
            --locked-start "${{ inputs.locked_start }}" \
            --train-end "${{ inputs.train_end }}" \
            --validation-start "${{ inputs.validation_start }}" \
            --validation-end "${{ inputs.validation_end }}"
      - name: Upload final results
        uses: actions/upload-artifact@v4
        with:
          name: global-technical-buy-indicator-external-pack-72000-results
          path: final-results
          if-no-files-found: error
          retention-days: 14
