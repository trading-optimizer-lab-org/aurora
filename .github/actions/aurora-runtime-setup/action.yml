name: Aurora runtime setup
description: Restore exactly one sealed offline Aurora runtime on a standard runner

inputs:
  python-version:
    description: Exact Python version bound by the runtime identity
    required: true
  runtime-mode:
    description: verified_relocatable_archive or offline_wheelhouse
    required: true
  runtime-object-path:
    description: Downloaded one-day transport object selected by the sealed plan
    required: true
  runtime-manifest-path:
    description: Closed manifest for the selected runtime object
    required: true
  dependency-lock-path:
    description: Repository-relative complete hashed dependency lock
    required: true
  expected-runtime-identity-sha256:
    description: Runtime identity sealed before fan-out
    required: true
  expected-source-sha:
    description: Protected AURORA source commit verified separately
    required: true
  expected-numeric-profile-sha256:
    description: Frozen numeric-runtime profile
    required: true

outputs:
  runtime-python:
    description: Python executable inside the verified offline runtime
    value: ${{ steps.activate.outputs.runtime_python }}
  runtime-identity-sha256:
    description: Verified exact runtime-store identity
    value: ${{ steps.verify.outputs.runtime_identity_sha256 }}
  environment-sha256:
    description: Canonical runtime receipt hash
    value: ${{ steps.receipt.outputs.environment_sha256 }}
  setup-seconds:
    description: Offline restore and verification wall time
    value: ${{ steps.receipt.outputs.setup_seconds }}

runs:
  using: composite
  steps:
    - name: Use the sealed Python interpreter family
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
        cache: ""

    - name: Verify selected runtime object and closed manifest
      id: verify
      shell: bash
      env:
        RUNTIME_MODE: ${{ inputs.runtime-mode }}
        RUNTIME_OBJECT_PATH: ${{ inputs.runtime-object-path }}
        RUNTIME_MANIFEST_PATH: ${{ inputs.runtime-manifest-path }}
        DEPENDENCY_LOCK_PATH: ${{ inputs.dependency-lock-path }}
        EXPECTED_RUNTIME_IDENTITY_SHA256: ${{ inputs.expected-runtime-identity-sha256 }}
        EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        EXPECTED_NUMERIC_PROFILE_SHA256: ${{ inputs.expected-numeric-profile-sha256 }}
      run: |
        set -euo pipefail
        started_at="$(date +%s%N)"
        case "$RUNTIME_MODE" in
          verified_relocatable_archive|offline_wheelhouse) ;;
          *) echo "::error::RUNTIME_MODE_INVALID"; exit 2 ;;
        esac
        python - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path

        manifest_path = Path(os.environ["RUNTIME_MANIFEST_PATH"]).resolve(strict=True)
        object_path = Path(os.environ["RUNTIME_OBJECT_PATH"]).resolve(strict=True)
        dependency_lock = Path(os.environ["DEPENDENCY_LOCK_PATH"]).resolve(strict=True)
        payload = json.loads(manifest_path.read_text(encoding="utf-8"))
        required = {
            "schema_version",
            "runtime_mode",
            "runtime_identity_sha256",
            "object_sha256",
            "dependency_lock_sha256",
            "numeric_profile_sha256",
            "source_sha_verified_separately",
            "file_list",
        }
        if set(payload) != required or payload["schema_version"] != "1":
            raise SystemExit("RUNTIME_MANIFEST_SCHEMA_INVALID")
        if payload["runtime_mode"] != os.environ["RUNTIME_MODE"]:
            raise SystemExit("RUNTIME_MODE_PLAN_MISMATCH")
        if payload["runtime_identity_sha256"] != os.environ["EXPECTED_RUNTIME_IDENTITY_SHA256"]:
            raise SystemExit("RUNTIME_IDENTITY_MISMATCH")
        if payload["numeric_profile_sha256"] != os.environ["EXPECTED_NUMERIC_PROFILE_SHA256"]:
            raise SystemExit("RUNTIME_NUMERIC_PROFILE_MISMATCH")
        if payload["source_sha_verified_separately"] != os.environ["EXPECTED_SOURCE_SHA"]:
            raise SystemExit("RUNTIME_SOURCE_BINDING_MISMATCH")
        if hashlib.sha256(dependency_lock.read_bytes()).hexdigest() != payload[
            "dependency_lock_sha256"
        ]:
            raise SystemExit("RUNTIME_DEPENDENCY_LOCK_HASH_INVALID")
        files = payload["file_list"]
        if not isinstance(files, list) or not files:
            raise SystemExit("RUNTIME_FILE_LIST_INVALID")
        observed = []
        root = object_path if object_path.is_dir() else object_path.parent
        for item in files:
            if set(item) != {"path", "sha256", "size_bytes"}:
                raise SystemExit("RUNTIME_FILE_ENTRY_INVALID")
            relative = Path(item["path"])
            if relative.is_absolute() or ".." in relative.parts:
                raise SystemExit("RUNTIME_FILE_PATH_INVALID")
            target = root / relative
            if not target.is_file():
                raise SystemExit("RUNTIME_FILE_MISSING")
            digest = hashlib.sha256(target.read_bytes()).hexdigest()
            if digest != item["sha256"] or target.stat().st_size != item["size_bytes"]:
                raise SystemExit("RUNTIME_FILE_HASH_INVALID")
            observed.append((relative.as_posix(), digest, item["size_bytes"]))
        canonical = json.dumps(
            observed, sort_keys=True, separators=(",", ":"), allow_nan=False
        ).encode()
        if hashlib.sha256(canonical).hexdigest() != payload["object_sha256"]:
            raise SystemExit("RUNTIME_OBJECT_HASH_INVALID")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            output.write(
                f"runtime_identity_sha256={payload['runtime_identity_sha256']}\n"
            )
        PY
        echo "started_nanoseconds=$started_at" >> "$GITHUB_OUTPUT"

    - name: Activate exactly one offline runtime mode
      id: activate
      shell: bash
      env:
        RUNTIME_MODE: ${{ inputs.runtime-mode }}
        RUNTIME_OBJECT_PATH: ${{ inputs.runtime-object-path }}
        DEPENDENCY_LOCK_PATH: ${{ inputs.dependency-lock-path }}
      run: |
        set -euo pipefail
        runtime="$RUNNER_TEMP/aurora-runtime"
        rm -rf -- "$runtime"
        if [ "$RUNTIME_MODE" = "verified_relocatable_archive" ]; then
          mkdir -p "$runtime"
          tar --extract --file "$RUNTIME_OBJECT_PATH/runtime.tar.zst" --directory "$runtime"
          runtime_python="$runtime/bin/python"
          test -x "$runtime_python"
        else
          wheelhouse="$(realpath "$RUNTIME_OBJECT_PATH/wheelhouse")"
          dependency_lock="$(realpath "$DEPENDENCY_LOCK_PATH")"
          test -f "$wheelhouse/wheelhouse_manifest.json"
          python -m venv "$runtime"
          runtime_python="$runtime/bin/python"
          "$runtime_python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --no-compile \
            --find-links "$wheelhouse" \
            --require-hashes \
            --requirement "$dependency_lock"
        fi
        "$runtime_python" -I -c "import hashlib,json,sys; print(json.dumps({'python':sys.version_info[:3],'ok':True},sort_keys=True))"
        echo "$runtime/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$runtime" >> "$GITHUB_ENV"
        echo "runtime_python=$runtime_python" >> "$GITHUB_OUTPUT"

    - name: Emit secret-free runtime receipt
      id: receipt
      shell: bash
      env:
        RUNTIME_PYTHON: ${{ steps.activate.outputs.runtime_python }}
        RUNTIME_MODE: ${{ inputs.runtime-mode }}
        RUNTIME_IDENTITY_SHA256: ${{ steps.verify.outputs.runtime_identity_sha256 }}
        STARTED_NANOSECONDS: ${{ steps.verify.outputs.started_nanoseconds }}
      run: |
        set -euo pipefail
        finished_at="$(date +%s%N)"
        "$RUNTIME_PYTHON" - <<'PY'
        import hashlib
        import json
        import os
        import platform
        from pathlib import Path

        payload = {
            "schema_version": "1",
            "runtime_mode": os.environ["RUNTIME_MODE"],
            "runtime_identity_sha256": os.environ["RUNTIME_IDENTITY_SHA256"],
            "python_version": platform.python_version(),
            "platform": platform.platform(),
            "network_dependency_install": False,
        }
        canonical = json.dumps(
            payload, sort_keys=True, separators=(",", ":"), allow_nan=False
        ).encode()
        payload["environment_sha256"] = hashlib.sha256(canonical).hexdigest()
        Path("runtime_receipt.json").write_text(
            json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n",
            encoding="utf-8",
        )
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            output.write(f"environment_sha256={payload['environment_sha256']}\n")
        PY
        python -c "print('setup_seconds={:.9f}'.format(($finished_at - $STARTED_NANOSECONDS) / 1000000000))" >> "$GITHUB_OUTPUT"
