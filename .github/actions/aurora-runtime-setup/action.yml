name: Aurora runtime setup
description: Install one verified offline Aurora runtime on a standard runner

inputs:
  python-version:
    description: Exact Python version used by the run contract
    required: true
  wheelhouse-path:
    description: Downloaded immutable wheelhouse directory
    required: true
  dependency-lock-path:
    description: Repository-relative complete hashed dependency lock
    required: true

outputs:
  cpu-count:
    description: Logical CPUs visible to the standard runner
    value: ${{ steps.runner.outputs.cpu_count }}
  memory-mb:
    description: Memory visible to the standard runner
    value: ${{ steps.runner.outputs.memory_mb }}
  free-disk-mb:
    description: Free workspace disk before installation
    value: ${{ steps.runner.outputs.free_disk_mb }}
  image-os:
    description: GitHub runner image operating system
    value: ${{ steps.runner.outputs.image_os }}
  image-version:
    description: GitHub runner image version
    value: ${{ steps.runner.outputs.image_version }}
  wheelhouse-sha256:
    description: Canonical identity of the installed wheelhouse
    value: ${{ steps.manifest.outputs.wheelhouse_sha256 }}
  environment-sha256:
    description: Canonical SHA-256 of environment_manifest.json
    value: ${{ steps.manifest.outputs.environment_sha256 }}
  setup-seconds:
    description: Total offline runtime setup wall seconds
    value: ${{ steps.manifest.outputs.setup_seconds }}

runs:
  using: composite
  steps:
    - name: Inspect standard runner
      id: runner
      shell: bash
      run: |
        set -euo pipefail
        cpu_count="$(getconf _NPROCESSORS_ONLN)"
        memory_mb="$(awk '/MemTotal/ {print int($2 / 1024)}' /proc/meminfo)"
        free_disk_mb="$(df -Pm "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')"
        {
          echo "cpu_count=$cpu_count"
          echo "memory_mb=$memory_mb"
          echo "free_disk_mb=$free_disk_mb"
          echo "image_os=${ImageOS:-unknown}"
          echo "image_version=${ImageVersion:-unknown}"
        } >> "$GITHUB_OUTPUT"
        {
          echo "OMP_NUM_THREADS=$cpu_count"
          echo "OPENBLAS_NUM_THREADS=$cpu_count"
          echo "MKL_NUM_THREADS=$cpu_count"
          echo "NUMEXPR_NUM_THREADS=$cpu_count"
          echo "VECLIB_MAXIMUM_THREADS=$cpu_count"
          echo "BLIS_NUM_THREADS=$cpu_count"
          echo "AURORA_RUNNER_CPU_COUNT=$cpu_count"
        } >> "$GITHUB_ENV"

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
        cache: ""

    - name: Install exact offline runtime
      id: install
      shell: bash
      env:
        WHEELHOUSE_PATH: ${{ inputs.wheelhouse-path }}
        DEPENDENCY_LOCK_PATH: ${{ inputs.dependency-lock-path }}
      run: |
        set -euo pipefail
        started_at="$(date +%s%N)"
        wheelhouse="$(realpath "$WHEELHOUSE_PATH")"
        dependency_lock="$(realpath "$DEPENDENCY_LOCK_PATH")"
        test -f "$wheelhouse/wheelhouse_manifest.json"
        test -f "$wheelhouse/dependency_lock_manifest.json"
        runtime="$RUNNER_TEMP/aurora-runtime"
        rm -rf "$runtime"
        python -m venv "$runtime"
        runtime_python="$runtime/bin/python"
        "$runtime_python" -m pip install \
          --disable-pip-version-check \
          --no-index \
          --find-links "$wheelhouse" \
          --require-hashes \
          --requirement "$dependency_lock"
        mapfile -t aurora_wheels < <(
          find "$wheelhouse" -maxdepth 1 -type f -name 'aurora-*.whl' |
            sort
        )
        if [[ "${#aurora_wheels[@]}" -ne 1 ]]; then
          echo "::error::wheelhouse must contain exactly one Aurora wheel"
          exit 3
        fi
        "$runtime_python" -m pip install \
          --disable-pip-version-check \
          --no-index \
          --no-deps \
          "${aurora_wheels[0]}"
        "$runtime_python" \
          scripts/build_github_performance_wheelhouse.py verify \
          --requirements-lock "$dependency_lock" \
          --wheelhouse "$wheelhouse"
        finished_at="$(date +%s%N)"
        {
          echo "runtime=$runtime"
          echo "runtime_python=$runtime_python"
          echo "wheelhouse=$wheelhouse"
          echo "dependency_lock=$dependency_lock"
          echo "setup_nanoseconds=$((finished_at - started_at))"
        } >> "$GITHUB_OUTPUT"
        echo "$runtime/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$runtime" >> "$GITHUB_ENV"

    - name: Write environment manifest
      id: manifest
      shell: bash
      env:
        AURORA_RUNTIME_PYTHON: ${{ steps.install.outputs.runtime_python }}
        AURORA_SETUP_NANOSECONDS: ${{ steps.install.outputs.setup_nanoseconds }}
        AURORA_WHEELHOUSE: ${{ steps.install.outputs.wheelhouse }}
        AURORA_IMAGE_OS: ${{ steps.runner.outputs.image_os }}
        AURORA_IMAGE_VERSION: ${{ steps.runner.outputs.image_version }}
      run: |
        set -euo pipefail
        "$AURORA_RUNTIME_PYTHON" - <<'PY'
        import hashlib
        import importlib.metadata
        import json
        import os
        import platform
        from pathlib import Path

        wheelhouse = Path(os.environ["AURORA_WHEELHOUSE"])
        wheelhouse_manifest = json.loads(
            (wheelhouse / "wheelhouse_manifest.json").read_text(encoding="utf-8")
        )
        lock_manifest = json.loads(
            (wheelhouse / "dependency_lock_manifest.json").read_text(
                encoding="utf-8"
            )
        )
        packages = sorted(
            {
                (
                    distribution.metadata.get("Name", "unknown"),
                    distribution.version,
                )
                for distribution in importlib.metadata.distributions()
            }
        )
        thread_names = (
            "OMP_NUM_THREADS",
            "OPENBLAS_NUM_THREADS",
            "MKL_NUM_THREADS",
            "NUMEXPR_NUM_THREADS",
            "VECLIB_MAXIMUM_THREADS",
            "BLIS_NUM_THREADS",
        )
        identity = {
            "schema_version": "2",
            "runner": {
                "os": platform.system(),
                "architecture": platform.machine(),
                "cpu_count": int(os.environ["AURORA_RUNNER_CPU_COUNT"]),
            },
            "python": {
                "version": platform.python_version(),
                "implementation": platform.python_implementation(),
            },
            "dependency_lock_sha256": lock_manifest["lock_sha256"],
            "installed_wheelhouse_sha256": wheelhouse_manifest[
                "wheelhouse_sha256"
            ],
            "installed_packages": [
                {"name": name, "version": version}
                for name, version in packages
            ],
            "thread_limits": {
                name: int(os.environ[name]) for name in thread_names
            },
        }
        encoded = json.dumps(
            identity,
            sort_keys=True,
            separators=(",", ":"),
            allow_nan=False,
        ).encode()
        digest = hashlib.sha256(encoded).hexdigest()
        setup_seconds = (
            int(os.environ["AURORA_SETUP_NANOSECONDS"]) / 1_000_000_000.0
        )
        payload = {
            "schema_version": "2",
            "identity": identity,
            "observations": {
                "image_os": os.environ["AURORA_IMAGE_OS"],
                "image_version": os.environ["AURORA_IMAGE_VERSION"],
                "setup_seconds": setup_seconds,
            },
            "environment_sha256": digest,
        }
        with open("environment_manifest.json", "w", encoding="utf-8") as out:
            json.dump(payload, out, indent=2, sort_keys=True)
            out.write("\n")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"environment_sha256={digest}\n")
            out.write(
                "wheelhouse_sha256="
                f"{wheelhouse_manifest['wheelhouse_sha256']}\n"
            )
            out.write(f"setup_seconds={setup_seconds:.9f}\n")
        PY
