name: Download stock protocol shards individually
description: Download every shard artifact by name with retries and a completeness check
inputs:
  name_prefix:
    description: Artifact name prefix before the numeric shard id
    required: true
  output_root:
    description: Root directory for downloaded artifact groups
    required: true
  shard_count:
    description: Expected number of numeric shard artifacts
    required: false
    default: "360"
  run_id:
    description: Workflow run id that owns the shard artifacts; empty means current run
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download every shard by name with retries
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        output_root="${{ inputs.output_root }}"
        prefix="${{ inputs.name_prefix }}"
        shard_count="${{ inputs.shard_count }}"
        run_id="${{ inputs.run_id }}"
        if [ -z "$run_id" ]; then
          run_id="$GITHUB_RUN_ID"
        fi
        mkdir -p "$output_root"

        for shard in $(seq 0 $((shard_count - 1))); do
          artifact="${prefix}${shard}"
          downloaded=false
          for attempt in 1 2 3; do
            temp_dir="${output_root}/.download-${shard}"
            rm -rf "$temp_dir"
            mkdir -p "$temp_dir"
            if gh run download "$run_id" --repo "$REPOSITORY" --name "$artifact" --dir "$temp_dir"; then
              cp -a "$temp_dir"/. "$output_root"/
              rm -rf "$temp_dir"
              downloaded=true
              break
            fi
            rm -rf "$temp_dir"
            sleep $((attempt * 2))
          done
          if [ "$downloaded" != true ]; then
            echo "Unable to download $artifact after 3 attempts" >&2
            exit 1
          fi
        done

        found=$(find "$output_root" -type f -name stage_results.jsonl | wc -l)
        if [ "$found" -ne "$shard_count" ]; then
          echo "Expected $shard_count stage_results.jsonl files, found $found" >&2
          exit 1
        fi
