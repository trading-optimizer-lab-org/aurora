name: Catalog live controls audit
description: Run the fixed read-only catalog controls audit inside an authorized environment job.

inputs:
  purpose:
    required: true
  caller_workflow:
    required: true
  caller_job:
    required: true
  protected_commit_sha:
    required: true
  audit_context_sha256:
    required: true
  auditor_app_id:
    required: true
  auditor_private_key:
    required: true
  enterprise_billing_token:
    required: true
  package_inventory_token:
    required: true

outputs:
  receipt_artifact_name:
    value: ${{ steps.receipt_artifact.outputs.name }}
  receipt_sha256:
    value: ${{ steps.controls.outputs.receipt_sha256 }}
  receipt_status:
    value: ${{ steps.controls.outputs.receipt_status }}

runs:
  using: composite
  steps:
    - name: Use Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.11"
        cache: ""

    - name: Install the locked read-only audit runtime
      shell: bash
      run: >-
        python -m pip install
        --only-binary=:all:
        --no-deps
        --require-hashes
        -r requirements/catalog-controller-linux-py311.lock

    - name: Mint, audit, emit the secret-free receipt, and discard credentials
      id: controls
      shell: bash
      env:
        AURORA_CATALOG_AUDITOR_APP_ID: ${{ inputs.auditor_app_id }}
        AURORA_CATALOG_AUDITOR_PRIVATE_KEY: ${{ inputs.auditor_private_key }}
        AURORA_CATALOG_ENTERPRISE_BILLING_TOKEN: ${{ inputs.enterprise_billing_token }}
        AURORA_CATALOG_PACKAGE_INVENTORY_TOKEN: ${{ inputs.package_inventory_token }}
        PYTHONPATH: ${{ github.workspace }}/..
      run: >-
        python scripts/audit_catalog_github_controls.py
        --repository trading-optimizer-lab-org/aurora
        --desired config/catalog_github_controls_v1.json
        --auditor config/catalog_github_auditor_v1.json
        --workflow-auditor
        --purpose "${{ inputs.purpose }}"
        --caller-workflow "${{ inputs.caller_workflow }}"
        --caller-job "${{ inputs.caller_job }}"
        --protected-commit-sha "${{ inputs.protected_commit_sha }}"
        --audit-context-sha256 "${{ inputs.audit_context_sha256 }}"
        --output catalog_github_controls_receipt_v1.json
        --github-output "$GITHUB_OUTPUT"

    - name: Freeze the bounded receipt artifact name
      id: receipt_artifact
      shell: bash
      run: >-
        echo "name=catalog-live-controls-${{ inputs.purpose }}-${{ inputs.audit_context_sha256 }}"
        >> "$GITHUB_OUTPUT"

    - name: Publish the secret-free controls receipt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.receipt_artifact.outputs.name }}
        path: catalog_github_controls_receipt_v1.json
        if-no-files-found: error
        retention-days: 90
