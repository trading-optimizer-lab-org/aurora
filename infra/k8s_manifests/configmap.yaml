# QuantForge ConfigMap skeleton.
# Documentation only; merged with secrets at deploy time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantforge-config
  labels:
    app: quantforge
data:
  QUANTFORGE_ENV: "prod"
  TZ: "UTC"
  PYTHONUNBUFFERED: "1"
  DASHBOARD_PORT: "8501"
  ALERTS_INTERVAL_SEC: "30"
  REDIS_URL: "redis://quantforge-redis:6379/0"
  POSTGRES_DSN: "postgresql://qf:qf@quantforge-journal-db:5432/qf_journal"
  PROMETHEUS_PORT: "9100"
  LOG_LEVEL: "INFO"
