# Aurora dashboard Service skeleton.
# Documentation only; expose via Ingress / LoadBalancer in production.
apiVersion: v1
kind: Service
metadata:
  name: aurora-dashboard
  labels:
    app: aurora
    component: dashboard
spec:
  type: ClusterIP
  selector:
    app: aurora
    component: dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
