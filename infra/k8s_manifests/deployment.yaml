# Aurora dashboard Deployment skeleton.
# Documentation only; values must be overridden by Helm / kustomize.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-dashboard
  labels:
    app: aurora
    component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aurora
      component: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aurora
        component: dashboard
    spec:
      containers:
        - name: dashboard
          image: aurora/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: aurora-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
