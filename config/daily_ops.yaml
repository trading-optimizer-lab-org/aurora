# Default config for the daily operational report (P2.B).
#
# Loaded by quantforge.reporting.daily_ops.builder.DailyOpsConfig.from_yaml.
# Override per call via the CLI flags (--output-dir, --format, ...).

output_dir: reports/daily
output_format:
  - md
  - json
include_regime: true
include_attribution: true
include_alerts: true
include_no_trade_reasoning: true
benchmark_symbol: SPY
slack_webhook: ""   # optional; the report writer never POSTs without explicit URL
email_to: ""        # optional
