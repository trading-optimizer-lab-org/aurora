name = "aurora-runs-dashboard"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"

[vars]
REPO_OWNER = "trading-optimizer-lab-org"
REPO_NAME = "aurora"
ARCHIVE_QUOTA_BYTES = "7516192768"
APP_VERSION = "0.1.0"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aurora-runs-dashboard"
database_id = "6b5585e5-f1af-42dc-bb20-1b2415aa9bd1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "aurora-dashboard-archive"
