[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "1.4.0"
description = "Quant research engine: backtest + GA + validation gates + paper/live"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QuantForge Project"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "pyyaml>=6",
    "numba>=0.58",
    "pydantic>=2",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "statsmodels>=0.14", "hmmlearn>=0.3"]
dl = ["torch>=2.0"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.2"]
ga = ["deap>=1.4", "scikit-optimize>=0.9", "joblib>=1.3"]
live = [
    "alpaca-py>=0.20",
    "ib_insync>=0.9",
    "lumibot>=3",
    "coinbase-advanced-py>=1.0",
    "krakenex>=2.1",
]
crypto = ["ccxt>=4"]
monitoring = ["streamlit>=1.30"]
llm = ["anthropic>=0.25"]
portfolio = ["cvxpy>=1.4"]
report = ["weasyprint"]
dev = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "ruff>=0.5", "mypy>=1.7"]
docs = [
    "sphinx>=7",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=3.0",
]
mutate = ["mutmut>=3"]
all = ["quantforge[ml,dl,rl,ga,live,crypto,monitoring,llm,portfolio,report]"]

[project.scripts]
forge = "quantforge.cli.forge:main"

# Layout: pyproject.toml lives INSIDE the quantforge package dir.
# Map `quantforge.*` packages to the local subdirectories so the wheel
# installs as `quantforge/`, `quantforge/core/`, etc.
[tool.setuptools]
packages = [
    "quantforge",
    "quantforge.agent_gateway",
    "quantforge.agents",
    "quantforge.agents.auditor",
    "quantforge.altdata",
    "quantforge.analytics",
    "quantforge.cli",
    "quantforge.compliance",
    "quantforge.core",
    "quantforge.core.data_providers",
    "quantforge.dataeng",
    "quantforge.deployment",
    "quantforge.execution",
    "quantforge.experimental",
    "quantforge.exports",
    "quantforge.exports.lean",
    "quantforge.ga",
    "quantforge.infra",
    "quantforge.marketdata",
    "quantforge.markets",
    "quantforge.ml",
    "quantforge.monitoring",
    "quantforge.regime",
    "quantforge.registry",
    "quantforge.reporting",
    "quantforge.reporting.daily_ops",
    "quantforge.research",
    "quantforge.research.auto_loop",
    "quantforge.research.factory",
    "quantforge.risk",
    "quantforge.signals",
    "quantforge.strategies",
    "quantforge.strategies.library",
    "quantforge.triage",
    "quantforge.validation",
]

[tool.setuptools.package-dir]
"quantforge" = "."
"quantforge.agent_gateway" = "agent_gateway"
"quantforge.agents" = "agents"
"quantforge.agents.auditor" = "agents/auditor"
"quantforge.altdata" = "altdata"
"quantforge.analytics" = "analytics"
"quantforge.cli" = "cli"
"quantforge.compliance" = "compliance"
"quantforge.core" = "core"
"quantforge.core.data_providers" = "core/data_providers"
"quantforge.dataeng" = "dataeng"
"quantforge.deployment" = "deployment"
"quantforge.execution" = "execution"
"quantforge.experimental" = "experimental"
"quantforge.exports" = "exports"
"quantforge.exports.lean" = "exports/lean"
"quantforge.ga" = "ga"
"quantforge.infra" = "infra"
"quantforge.marketdata" = "marketdata"
"quantforge.markets" = "markets"
"quantforge.ml" = "ml"
"quantforge.monitoring" = "monitoring"
"quantforge.regime" = "regime"
"quantforge.registry" = "registry"
"quantforge.reporting" = "reporting"
"quantforge.reporting.daily_ops" = "reporting/daily_ops"
"quantforge.research" = "research"
"quantforge.research.auto_loop" = "research/auto_loop"
"quantforge.research.factory" = "research/factory"
"quantforge.risk" = "risk"
"quantforge.signals" = "signals"
"quantforge.strategies" = "strategies"
"quantforge.strategies.library" = "strategies/library"
"quantforge.triage" = "triage"
"quantforge.validation" = "validation"

[tool.setuptools.package-data]
"quantforge" = ["py.typed", "config/*.yaml", "config/*.yml"]
"quantforge.exports.lean" = ["templates/*.template"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "E501",
    # N999: the repo top-level dir is "QuantForge" (capitalized); rename
    # is out of scope. The package itself is "quantforge" via package-dir
    # remapping in [tool.setuptools.package-dir].
    "N999",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = false  # gradual typing — relax for now

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: real network / broker tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

# --------------------------------------------------------------------------
# mutmut (R12 -- mutation testing)
# --------------------------------------------------------------------------
#
# Narrow target list: mutating ``examples/`` or ``experimental/`` produces
# noise without signal. The runner uses the property-based tests plus the
# matching unit tests for each target module.
[tool.mutmut]
paths_to_mutate = [
    "core/engine.py",
    "core/engine_multi.py",
    "core/costs.py",
    "core/metrics.py",
    "core/data_tiers.py",
    "core/data_layer.py",
    "core/protocol_policy.py",
    "validation/walk_forward.py",
    "validation/monte_carlo.py",
    "validation/spp.py",
    "validation/deflated_sharpe.py",
    "validation/lookahead_check.py",
    "validation/pipeline.py",
    "ga/fitness.py",
]
runner = "python -m pytest -x -q tests/test_property.py tests/test_property_v2.py tests/test_costs.py tests/test_metrics.py tests/test_data_tiers.py tests/test_protocol_policy.py tests/test_monte_carlo.py tests/test_spp.py tests/test_deflated_sharpe.py tests/test_pipeline.py tests/test_jit_parity.py tests/test_lookahead_scanner.py tests/test_oos_isolation.py tests/test_ga.py tests/test_integration.py"
backup = false
disable_mutation_types = "string,fstring"
