[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora"
version = "1.5.0"
description = "Quant research engine: backtest + GA + validation gates + paper/live"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aurora Project"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "pyarrow>=14",
    "duckdb>=1.1,<2",
    "pyyaml>=6",
    "numba>=0.58",
    "pydantic>=2",
    "platformdirs>=4.0",
    "networkx>=3.0",
    "jsonschema>=4.23",
    "cryptography>=42",
    "requests>=2.32",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "statsmodels>=0.14", "hmmlearn>=0.3", "lightgbm>=4.0", "xgboost>=2.0"]
dl = ["torch>=2.0"]
kronos = ["torch>=2.0", "einops==0.8.1", "huggingface_hub>=0.33", "safetensors>=0.6", "tqdm>=4.67"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.2"]
ga = ["deap>=1.4", "scikit-optimize>=0.9", "joblib>=1.3"]
live = [
    "alpaca-py>=0.20",
    "ib_insync>=0.9",
    "lumibot>=3",
    "coinbase-advanced-py>=1.0",
    "krakenex>=2.1",
]
crypto = ["ccxt>=4"]
monitoring = ["streamlit>=1.30"]
llm = ["anthropic>=0.25"]
portfolio = ["cvxpy>=1.4"]
report = ["weasyprint"]
docs = [
    "sphinx>=7,<9",
    "sphinx-autodoc-typehints>=2",
    "sphinxcontrib-mermaid>=1",
    "myst-parser>=3",
    "furo>=2024.8",
]
dev = ["pytest>=7", "pytest-cov>=4", "hypothesis>=6", "ruff>=0.5", "mypy>=1.7", "statsmodels>=0.14"]
all = ["aurora[ml,dl,kronos,rl,ga,live,crypto,monitoring,llm,portfolio,report]"]

[project.scripts]
# `aurora` is the canonical entry point; `forge` is kept as a deprecated
# alias for one shim cycle (removed in 1.6).
aurora = "aurora.cli.forge:main"
forge = "aurora.cli.forge:main"

# Layout: pyproject.toml lives INSIDE the on-disk package dir. The package is
# imported as `aurora.*`.
[tool.setuptools]
packages = [
    "aurora",
    "aurora.agent_gateway",
    "aurora.agents",
    "aurora.agents.auditor",
    "aurora.altdata",
    "aurora.analytics",
    "aurora.analytics.metrics_full",
    "aurora.cli",
    "aurora.compliance",
    "aurora.core",
    "aurora.core.data_providers",
    "aurora.core.data_providers.first_dataset",
    "aurora.data_contracts",
    "aurora.dataeng",
    "aurora.deployment",
    "aurora.deployment.preflight",
    "aurora.execution",
    "aurora.experimental",
    "aurora.exports",
    "aurora.exports.lean",
    "aurora.ga",
    "aurora.governance",
    "aurora.infra",
    "aurora.infra.github_performance",
    "aurora.infra.github_performance.workloads",
    "aurora.infra.gtbi_v7_readiness",
    "aurora.infra.sp500_autonomous_discovery",
    "aurora.infra.sp500_long_short_daily",
    "aurora.infra.sp500_search_method_benchmark",
    "aurora.marketdata",
    "aurora.markets",
    "aurora.ml",
    "aurora.monitoring",
    "aurora.portfolio",
    "aurora.regime",
    "aurora.registry",
    "aurora.reporting",
    "aurora.reporting.daily_ops",
    "aurora.reporting.tearsheet",
    "aurora.research",
    "aurora.research.openap_93",
    "aurora.research.agent_loop",
    "aurora.research.factory",
    "aurora.research.factory.factory",
    "aurora.research.literature",
    "aurora.risk",
    "aurora.signals",
    "aurora.strategies",
    "aurora.strategies.library",
    "aurora.triage",
    "aurora.validation",
]

[tool.setuptools.package-dir]
"aurora" = "."
"aurora.agent_gateway" = "agent_gateway"
"aurora.agents" = "agents"
"aurora.agents.auditor" = "agents/auditor"
"aurora.altdata" = "altdata"
"aurora.analytics" = "analytics"
"aurora.analytics.metrics_full" = "analytics/metrics_full"
"aurora.cli" = "cli"
"aurora.compliance" = "compliance"
"aurora.core" = "core"
"aurora.core.data_providers" = "core/data_providers"
"aurora.core.data_providers.first_dataset" = "core/data_providers/first_dataset"
"aurora.data_contracts" = "data_contracts"
"aurora.dataeng" = "dataeng"
"aurora.deployment" = "deployment"
"aurora.deployment.preflight" = "deployment/preflight"
"aurora.execution" = "execution"
"aurora.experimental" = "experimental"
"aurora.exports" = "exports"
"aurora.exports.lean" = "exports/lean"
"aurora.ga" = "ga"
"aurora.governance" = "governance"
"aurora.infra" = "infra"
"aurora.infra.github_performance" = "infra/github_performance"
"aurora.infra.github_performance.workloads" = "infra/github_performance/workloads"
"aurora.infra.gtbi_v7_readiness" = "infra/gtbi_v7_readiness"
"aurora.infra.sp500_autonomous_discovery" = "infra/sp500_autonomous_discovery"
"aurora.infra.sp500_long_short_daily" = "infra/sp500_long_short_daily"
"aurora.infra.sp500_search_method_benchmark" = "infra/sp500_search_method_benchmark"
"aurora.marketdata" = "marketdata"
"aurora.markets" = "markets"
"aurora.ml" = "ml"
"aurora.monitoring" = "monitoring"
"aurora.portfolio" = "portfolio"
"aurora.regime" = "regime"
"aurora.registry" = "registry"
"aurora.reporting" = "reporting"
"aurora.reporting.daily_ops" = "reporting/daily_ops"
"aurora.reporting.tearsheet" = "reporting/tearsheet"
"aurora.research" = "research"
"aurora.research.openap_93" = "research/openap_93"
"aurora.research.agent_loop" = "research/agent_loop"
"aurora.research.factory" = "research/factory"
"aurora.research.factory.factory" = "research/factory/factory"
"aurora.research.literature" = "research/literature"
"aurora.risk" = "risk"
"aurora.signals" = "signals"
"aurora.strategies" = "strategies"
"aurora.strategies.library" = "strategies/library"
"aurora.triage" = "triage"
"aurora.validation" = "validation"

[tool.setuptools.package-data]
"aurora" = [
    "py.typed",
    "config/*.json",
    "config/*.yaml",
    "config/*.yml",
    "config/templates/*.yaml",
    "config/schemas/*.json",
    "config/gtbi/contracts/*.json",
    "config/gtbi/schemas/v7/operational/*.json",
    "config/gtbi/schemas/v7/results/*.json",
]
"aurora.exports.lean" = ["templates/*.template"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".claude",
    ".hypothesis",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "docs/_build",
    "docs/api/generated",
    "aurora.egg-info",
]

[tool.ruff.lint]
# Keep the default lint gate focused on high-signal correctness checks.
# Full style/modernization cleanup is intentionally not a release blocker for
# this legacy-sized codebase; run broader Ruff selections explicitly when
# doing a dedicated formatting pass.
select = ["F821", "F541", "B008", "B023", "B904"]
ignore = [
    "E501",
    # N999: the package itself is "aurora" via the
    # [tool.setuptools.package-dir] remapping.
    "N999",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = false  # gradual typing — relax for now
explicit_package_bases = true
# `docs/` is excluded because `docs/conf.py` imports sphinx, which uses
# Python 3.12+ `type` statements that mypy at python_version=3.10 cannot
# parse. `build/` is the wheel-build artefact tree.
exclude = '(?x)(docs/|build/|\.claude/|\.venv/|\.eggs/)'

[[tool.mypy.overrides]]
module = ["sphinx", "sphinx.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: real network / broker tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
